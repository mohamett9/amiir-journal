    // Image resizing for fast cloud sync
    function resizeImage(dataUrl, maxWidth = 900) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    // High-Resolution Pro Trade Receipt Generator (Canvas)
    function downloadTradeReceipt(tr) {
      const canvas = document.createElement("canvas");
      canvas.width = 840;
      canvas.height = 480;
      const ctx = canvas.getContext("2d");

      const outcome = (tr.outcome || "win").toLowerCase();
      const isWin = outcome === "win";
      const isLoss = outcome === "loss";
      const isBE = outcome === "be";

      const themeColor = isWin ? "#10B981" : isBE ? "#F59E0B" : "#F43F5E";
      const themeBg = isWin ? "rgba(16, 185, 129, 0.15)" : isBE ? "rgba(245, 158, 11, 0.15)" : "rgba(244, 63, 94, 0.15)";
      const statusText = isWin ? "PROFITABLE EXECUTION" : isBE ? "BREAKEVEN EXECUTION" : "LOSS RECORDED";

      // Background Gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 840, 480);
      bgGrad.addColorStop(0, "#080E1C");
      bgGrad.addColorStop(0.6, "#040711");
      bgGrad.addColorStop(1, "#020409");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 840, 480);

      // Outer Border with corner brackets
      ctx.strokeStyle = "rgba(56, 189, 248, 0.2)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(20, 20, 800, 440);

      // Accent Corner Highlights
      ctx.strokeStyle = "#38BDF8";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(20, 45); ctx.lineTo(20, 20); ctx.lineTo(45, 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(795, 20); ctx.lineTo(820, 20); ctx.lineTo(820, 45); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(20, 435); ctx.lineTo(20, 460); ctx.lineTo(45, 460); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(795, 460); ctx.lineTo(820, 460); ctx.lineTo(820, 435); ctx.stroke();

      // Top Header Branding
      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold 20px 'JetBrains Mono', monospace";
      ctx.fillText("AMIIR JOURNAL", 48, 62);

      ctx.fillStyle = "#64748B";
      ctx.font = "bold 10px 'JetBrains Mono', monospace";
      ctx.fillText("PRO LEDGER · VERIFIED TRADE EXECUTION", 225, 60);

      // Outcome Pill Badge
      ctx.fillStyle = themeBg;
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(580, 40, 215, 34, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = themeColor;
      ctx.font = "bold 11px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText(statusText, 687, 62);
      ctx.textAlign = "left";

      // Subtle Divider
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.beginPath();
      ctx.moveTo(48, 92);
      ctx.lineTo(795, 92);
      ctx.stroke();

      // Big Bold Symbol & Direction
      ctx.font = "800 42px 'Plus Jakarta Sans', sans-serif";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(`${tr.symbol} · ${tr.direction.toUpperCase()}`, 48, 150);

      // P&L Big Number
      const pnlStr = tr.pnlDollar
        ? (tr.pnlDollar >= 0 ? `+$${Number(tr.pnlDollar).toLocaleString()}` : `-$${Math.abs(Number(tr.pnlDollar)).toLocaleString()}`)
        : `${tr.rMultiple >= 0 ? "+" : ""}${tr.rMultiple}%`;

      ctx.font = "bold 44px 'JetBrains Mono', monospace";
      ctx.fillStyle = themeColor;
      ctx.fillText(pnlStr, 48, 208);

      if (tr.pnlDollar && tr.rMultiple !== undefined) {
        ctx.font = "bold 14px 'JetBrains Mono', monospace";
        ctx.fillStyle = "#94A3B8";
        ctx.fillText(`Net Return: ${tr.rMultiple >= 0 ? "+" : ""}${tr.rMultiple}R`, 48, 234);
      }

      // 4 Metric Capsules
      const drawCapsule = (label, val, x, y, w) => {
        ctx.fillStyle = "#0B1428";
        ctx.strokeStyle = "rgba(56, 189, 248, 0.16)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(x, y, w, 50, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#64748B";
        ctx.font = "bold 9px 'JetBrains Mono', monospace";
        ctx.fillText(label.toUpperCase(), x + 14, y + 20);

        ctx.fillStyle = "#F1F5F9";
        ctx.font = "bold 13px 'JetBrains Mono', monospace";
        ctx.fillText(val, x + 14, y + 39);
      };

      const capY = 252;
      drawCapsule("Date", tr.date || "Today", 48, capY, 130);
      drawCapsule("Session & Purge", `${tr.session.toUpperCase()} · ${tr.purgeTime || "Entry"}`, 188, capY, 175);
      drawCapsule("Risk / Reward", `1:${tr.rrRatio || "3"} (${tr.risk || 1}% Risk)`, 373, capY, 160);
      drawCapsule("Trading Account", tr.accountName || "Primary Account", 543, capY, 160);

      // Notes & Confluence Quote Container
      ctx.fillStyle = "#070E1E";
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(48, 320, 600, 78, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold 10px 'JetBrains Mono', monospace";
      ctx.fillText("EXECUTION LOG & THESIS", 64, 342);

      ctx.fillStyle = "#CBD5E1";
      ctx.font = "italic 13px 'Plus Jakarta Sans', sans-serif";
      const noteContent = tr.notes 
        ? (tr.notes.length > 82 ? tr.notes.substring(0, 80) + "..." : tr.notes)
        : (tr.checklist && tr.checklist.length > 0 ? `Confluences: ${tr.checklist.join(" · ")}` : "ICT Institutional Model · Disciplined Risk");
      ctx.fillText(`"${noteContent}"`, 64, 372);

      // Verification Graphic Block (Cyber QR simulation)
      const qrX = 665, qrY = 320, qrW = 135, qrH = 78;
      ctx.fillStyle = "#070E1E";
      ctx.strokeStyle = "rgba(56, 189, 248, 0.28)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect(qrX, qrY, qrW, qrH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#38BDF8";
      ctx.font = "bold 9px 'JetBrains Mono', monospace";
      ctx.fillText("CRYPTOGRAPHIC", qrX + 16, qrY + 28);
      ctx.fillText("VERIFIED LEDGER", qrX + 16, qrY + 44);

      ctx.fillStyle = themeColor;
      ctx.font = "bold 11px 'JetBrains Mono', monospace";
      ctx.fillText("VALIDATED ✓", qrX + 16, qrY + 63);

      ctx.font = "11px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#475569";
      ctx.fillText("amiir-journal.vercel.app · Powered by @amiir_pr", 48, 442);

      const link = document.createElement("a");
      link.download = `${tr.symbol || "trade"}-${tr.date || "log"}-receipt.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

                      {chatImages.map((img, idx) => (
                        <div key={idx} className="relative w-20 h-14 rounded-xl overflow-hidden border border-slate-700 flex-shrink-0">
                          <img src={img} alt="preview" className="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => removeChatImage(idx)}
                            className="absolute top-1 right-1 bg-black/80 hover:bg-rose-600 text-white p-0.5 rounded-full"
                          >
                            <X size={10} />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  <form onSubmit={sendChatMessage} className="p-3.5 border-t border-slate-800 bg-[#060B18] flex items-center gap-2.5">
                    <input
                      type="file"
                      multiple
                      accept="image/*"
                      id="communityFileInput"
                      onChange={handleCommunityFiles}
                      className="hidden"
                    />

                    <label
                      htmlFor="communityFileInput"
                      title="Attach Charts or Screenshots"
                      className="p-2.5 bg-[#050914] border border-slate-700 hover:border-sky-400 text-slate-300 hover:text-sky-300 rounded-xl cursor-pointer flex items-center gap-1.5 text-xs font-mono transition-colors"
                    >
                      <ImageIcon size={15} className="text-sky-400" />
                      <span className="hidden sm:inline font-bold">Chart</span>
                    </label>

                    <input
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder={chatUploading ? "Uploading chart image..." : t.chatPlaceholder}
                      className="flex-1 bg-[#050914] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-sky-400 font-mono"
                    />

                    <button 
                      type="submit" 
                      disabled={chatUploading}
                      className="p-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 rounded-xl cursor-pointer transition-all active:scale-95 shadow-md shadow-sky-500/20 font-bold"
                    >
                      <Send size={15} />
                    </button>
                  </form>
                </div>
              )}

            </main>
          </div>

          {/* COMPACT FLOATING (+) BUTTON FOR MOBILE */}
          <button
            type="button"
            onClick={() => {
              setShowForm(!showForm);
              if (showForm) { setEditingId(null); setForm(EMPTY_FORM); }
              else { window.scrollTo({ top: 0, behavior: 'smooth' }); }
            }}
            className="fixed bottom-6 right-5 sm:hidden z-40 w-12 h-12 rounded-full bg-sky-500 text-slate-950 flex items-center justify-center shadow-xl shadow-sky-500/40 border border-sky-400 active:scale-90 transition-all cursor-pointer"
            title="Toggle Trade Form"
          >
            {showForm ? <X size={20} className="stroke-[2.5]" /> : <Plus size={22} className="stroke-[2.5]" />}
          </button>

          {/* FOOTER */}
          <footer className="py-6 border-t border-slate-800/80 text-center text-xs text-slate-500 font-mono">
            Amiir Journal · {t.devBy} <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className="text-sky-400 hover:text-sky-300 font-semibold underline underline-offset-2">@amiir_pr</a>
          </footer>

          {/* LIGHTBOX MODAL WITH ZOOM */}
          {lightbox && (
            <div
              onClick={() => { setLightbox(null); setZoomScale(1); }}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 zoom-container select-none"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className="absolute top-4 right-4 flex items-center gap-2 bg-[#080E1E] border border-slate-700 px-3 py-1.5 rounded-2xl z-50 text-white font-mono text-xs shadow-2xl"
              >
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.max(0.5, z - 0.25))}
                  className="p-1 hover:text-sky-400 cursor-pointer"
                  title="Zoom Out"
                >
                  <ZoomOut size={16} />
                </button>
                <span className="text-[11px] min-w-[36px] text-center font-bold">{Math.round(zoomScale * 100)}%</span>
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.min(3.5, z + 0.25))}
                  className="p-1 hover:text-sky-400 cursor-pointer"
                  title="Zoom In"
                >
                  <ZoomIn size={16} />
                </button>
                <button
                  type="button"
                  onClick={() => setZoomScale(1)}
                  className="p-1 hover:text-sky-400 ml-1 cursor-pointer"
                  title="Reset Zoom"
                >
                  <RotateCcw size={14} />
                </button>
                <button
                  type="button"
                  onClick={() => { setLightbox(null); setZoomScale(1); }}
                  className="p-1 hover:text-rose-400 ml-1 cursor-pointer"
                  title="Close"
                >
                  <X size={16} />
                </button>
              </div>

              <div 
                onClick={(e) => { e.stopPropagation(); setZoomScale((z) => z === 1 ? 2 : 1); }} 
                className="overflow-auto max-w-full max-h-[85vh] flex items-center justify-center cursor-zoom-in"
              >
                <img 
                  src={lightbox} 
                  alt="Full Chart" 
                  style={{ transform: `scale(${zoomScale})`, transition: 'transform 0.15s ease-out' }}
                  className="max-w-full max-h-[85vh] rounded-2xl shadow-2xl border border-slate-800 object-contain origin-center" 
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
