<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Amiir Journal - Pro Trading Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] } } } }
  </script>
  <script type="importmap">
    { "imports": { "react": "https://esm.sh/react@18.2.0", "react-dom/client": "https://esm.sh/react-dom@18.2.0/client", "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0" } }
  </script>
  <style>
    body { background-color: #040711; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: #0b1324; border: 1px solid #162238; transition: all 0.2s ease; }
    .glass-card:hover { border-color: rgba(56, 189, 248, 0.3); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
    .small-caps { font-variant: all-small-caps; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from "react";
    import ReactDOM from "react-dom/client";
    import { Plus, TrendingUp, TrendingDown, Trash2, Edit3, X, ChevronDown, ChevronUp, ChevronLeft, ChevronRight, Image as ImageIcon, LayoutGrid, ListChecks, LogOut, User, Globe, MessageSquare, BookOpen, Send, CheckSquare, Wallet, Clock, Award, Settings, ShieldCheck, Activity, Users, Radio, Pin, Sparkles } from "lucide-react";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ", authDomain: "amiir-journal.firebaseapp.com", projectId: "amiir-journal", storageBucket: "amiir-journal.firebasestorage.app", messagingSenderId: "533778928448", appId: "1:533778928448:web:138073019799354cb020a5", measurementId: "G-QYJ75J88K5" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const SESSIONS = [{ id: "asian", label: "Asian", flag: "🇯🇵", time: "8PM–9PM", liveHours: [20, 21] }, { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM", liveHours: [2, 3] }, { id: "newyork", label: "New York", flag: "🇺🇸", time: "8AM–9AM", liveHours: [8, 9] }];
    const PURGE_TIMES = { asian: ["8pm", "9pm"], london: ["2am", "3am"], newyork: ["8am", "9am"] };
    const DEFAULT_CHECKLIST = ["IRL TO ERL", "KL (Key Level)", "PURGING", "SMT", "M1 Exec"];

    function App() {
      const [user, setUser] = useState(null);
      const [trades, setTrades] = useState([]);
      const [accounts, setAccounts] = useState([]);
      const [tab, setTab] = useState("journal");
      const [isAdmin, setIsAdmin] = useState(false);
      const [presenceUsers, setPresenceUsers] = useState([]);

      useEffect(() => {
        onAuthStateChanged(auth, (u) => {
          setUser(u);
          if (u) {
            setIsAdmin(u.email?.toLowerCase().includes("amiir") || localStorage.getItem("amiir_creator_admin") === "true");
            // Presence
            setDoc(doc(db, "users_presence", u.uid), { uid: u.uid, name: u.displayName || "Trader", photo: u.photoURL || "", lastSeen: Date.now() }, { merge: true });
          }
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        onSnapshot(collection(db, "users", user.uid, "trades"), (snap) => {
            const list = []; snap.forEach(d => list.push(d.data()));
            setTrades(list.sort((a,b) => b.date.localeCompare(a.date)));
        });
        onSnapshot(collection(db, "users", user.uid, "accounts"), (snap) => {
            const list = []; snap.forEach(d => list.push({id: d.id, ...d.data()}));
            setAccounts(list);
        });
        if (isAdmin) onSnapshot(collection(db, "users_presence"), (snap) => {
            const list = []; snap.forEach(d => list.push(d.data()));
            setPresenceUsers(list);
        });
      }, [user, isAdmin]);

      const unlockAdminMode = () => {
        const pin = prompt("Enter PIN:");
        if (pin === "amiir2026") { localStorage.setItem("amiir_creator_admin", "true"); window.location.reload(); }
      };

      return (
        <div className="min-h-screen bg-[#040711] text-slate-200">
           <header className="border-b border-slate-800 bg-[#090e17] sticky top-0 z-30">
             <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <span className="font-bold text-sm font-mono">Amiir Journal</span>
                <button onClick={unlockAdminMode} className="text-sky-400 font-mono text-xs cursor-pointer">Admin</button>
             </div>
           </header>

           <main className="max-w-5xl mx-auto px-4 py-4">
             {/* Swipable Tabs */}
             <div className="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2">
               {[{id: "journal", label: "Journal"}, {id: "dashboard", label: "Dashboard"}, {id: "accounts", label: "Accounts"}, {id: "admin", label: "Admin", adminOnly: true}, {id: "updates", label: "Updates"}, {id: "community", label: "Community"}].map(item => {
                 if (item.adminOnly && !isAdmin) return null;
                 return (
                   <button key={item.id} onClick={() => setTab(item.id)} className={`px-4 py-2 rounded-lg text-xs font-bold font-mono whitespace-nowrap ${tab === item.id ? "bg-sky-500 text-black" : "bg-slate-900 text-slate-400"}`}>
                     {item.label}
                   </button>
                 )
               })}
             </div>

             {/* Dynamic Content Based on Tab */}
             {tab === "admin" && isAdmin && (
               <div className="glass-card p-4 rounded-xl">
                 <h2 className="text-white font-bold mb-4">Live Traders ({presenceUsers.length})</h2>
                 {presenceUsers.map(u => (
                   <div key={u.uid} className="flex justify-between items-center p-2 border-b border-slate-800 text-xs">
                     <span>{u.name}</span>
                     <span className="text-emerald-400">🟢 Online</span>
                   </div>
                 ))}
               </div>
             )}
             {/* Journal, Dashboard, etc. (Previous logic) */}
           </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
