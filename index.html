<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Amiir Journal — Elite Trading Ledger</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide & React Importmap -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      background-color: #030712;
      background-image: 
        radial-gradient(ellipse 90% 40% at 50% -10%, rgba(14, 165, 233, 0.12), transparent 70%),
        radial-gradient(ellipse 50% 30% at 100% 100%, rgba(3, 105, 161, 0.06), transparent 60%);
      background-attachment: fixed;
      color: #F1F5F9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="selection:bg-sky-500/30 selection:text-sky-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import ReactDOM from "react-dom/client";
    import { CheckCircle2, Globe, Sparkles, Instagram, Check } from "lucide-react";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ",
      authDomain: "amiir-journal.firebaseapp.com",
      projectId: "amiir-journal",
      storageBucket: "amiir-journal.firebasestorage.app",
      messagingSenderId: "533778928448",
      appId: "1:533778928448:web:138073019799354cb020a5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    function LoginPage({ onSignIn, onGuestSignIn, error, lang, onToggleLang }) {
      const [imgError, setImgError] = useState(false);

      return (
        <div className="min-h-screen w-full bg-[#030712] text-slate-200 flex items-center justify-center p-3 sm:p-6 lg:p-10 relative overflow-hidden">
          <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none" />
          <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none" />

          <div className="w-full max-w-6xl min-h-[600px] rounded-3xl border border-sky-500/20 bg-[#060C1B]/95 shadow-[0_20px_70px_-15px_rgba(0,0,0,0.8)] backdrop-blur-xl flex flex-col lg:flex-row overflow-hidden relative z-10">
            
            {/* LEFT PANEL */}
            <div className="w-full lg:w-1/2 p-6 sm:p-10 lg:p-12 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-sky-500/15 bg-gradient-to-br from-[#071328]/80 via-[#050C1B]/90 to-[#030712]">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-slate-950 font-black font-mono text-lg shadow-lg shadow-sky-500/25">
                    A
                  </div>
                  <div>
                    <h2 className="font-extrabold text-base tracking-tight text-white font-mono leading-none">Amiir Journal</h2>
                    <span className="text-[10px] font-mono text-sky-400 font-bold tracking-widest uppercase block mt-1">PRO TRADING</span>
                  </div>
                </div>
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900/80 border border-sky-500/20 text-[11px] font-mono text-slate-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                  <span>ICT Model</span>
                </div>
              </div>

              <div className="my-8 sm:my-10 space-y-6">
                <div className="flex items-center gap-4">
                  <div className="relative">
                    {!imgError ? (
                      <img src="amiir.jpg" alt="Amiir" onError={() => setImgError(true)} className="w-20 h-20 rounded-full object-cover border-2 border-sky-400 ring-4 ring-sky-500/20 shadow-[0_0_25px_rgba(56,189,248,0.35)]" />
                    ) : (
                      <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-sky-600 to-blue-500 border-2 border-sky-400 flex items-center justify-center font-mono font-black text-2xl text-white">AB</div>
                    )}
                    <div className="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-emerald-500 border-2 border-[#050C1B] flex items-center justify-center text-slate-950 font-bold shadow-md">
                      <Check size={13} className="stroke-[3]" />
                    </div>
                  </div>
                  <div>
                    <h3 className="text-2xl sm:text-3xl font-black text-white font-mono tracking-tight">Amiir</h3>
                    <div className="flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-sky-400 font-mono mt-0.5">
                      <span>Founder</span>
                      <span>•</span>
                      <span className="text-emerald-400">Verified</span>
                    </div>
                  </div>
                </div>

                <div className="relative bg-[#071328]/90 border border-sky-500/25 rounded-2xl p-5 sm:p-6 shadow-xl shadow-black/40">
                  <div className="text-sky-400 text-3xl sm:text-4xl font-serif font-black leading-none mb-1 select-none">“</div>
                  <p className="font-extrabold text-white text-base sm:text-lg uppercase tracking-wide font-mono leading-snug">
                    "WANKA WEYN NINKII HELI KAROOW WAXARKA HAW LEEXAN"
                  </p>
                  <div className="mt-4 pt-3 border-t border-sky-500/15 flex items-center justify-between text-xs font-mono">
                    <span className="text-slate-400">Philosophy</span>
                    <span className="text-sky-400 font-bold tracking-wider">DISCIPLINE</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center justify-between flex-wrap gap-3 pt-4 border-t border-slate-800/80 font-mono text-xs text-slate-300">
                <div className="flex items-center gap-3 sm:gap-4 flex-wrap">
                  <span className="flex items-center gap-1.5"><CheckCircle2 size={14} className="text-emerald-400" /> Purges</span>
                  <span className="flex items-center gap-1.5"><CheckCircle2 size={14} className="text-emerald-400" /> Verified P&L</span>
                  <span className="flex items-center gap-1.5"><CheckCircle2 size={14} className="text-emerald-400" /> Sync</span>
                </div>
                <span className="text-slate-500 text-[11px] font-semibold">v2.4</span>
              </div>
            </div>

            {/* RIGHT PANEL */}
            <div className="w-full lg:w-1/2 p-6 sm:p-10 lg:p-12 flex flex-col justify-between bg-[#040915]">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-mono text-slate-400 tracking-widest uppercase font-semibold">TERMINAL</span>
                <button type="button" onClick={onToggleLang} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900 hover:border-sky-500/40 text-xs font-mono font-bold text-slate-300">
                  <Globe size={13} className="text-sky-400" />
                  <span>{lang.toUpperCase()}</span>
                </button>
              </div>

              <div className="max-w-md w-full mx-auto my-8 text-center">
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-300 text-[11px] font-mono font-bold uppercase tracking-wider mb-4">
                  <Sparkles size={12} className="text-sky-400" />
                  <span>Auth</span>
                </div>

                <h1 className="text-4xl sm:text-5xl font-black text-white tracking-tight leading-tight">
                  {lang === "so" ? "Salaan Trader" : "Hi Trader"}
                </h1>
                <p className="mt-2 text-slate-400 text-sm sm:text-base font-medium">
                  {lang === "so" ? "Diiwaanka Amiir Journal" : "Welcome to Amiir Journal"}
                </p>

                <div className="mt-8 space-y-3">
                  <button type="button" onClick={onSignIn} className="w-full flex items-center justify-center gap-3 py-3.5 px-6 rounded-2xl font-bold text-sm bg-white hover:bg-slate-100 text-slate-950 transition-all shadow-lg active:scale-[0.99] cursor-pointer">
                    <svg className="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Continue with Google</span>
                  </button>

                  <button type="button" onClick={onGuestSignIn} className="w-full py-2.5 px-4 rounded-xl text-xs font-mono font-semibold text-slate-400 hover:text-sky-300 bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800 transition-all cursor-pointer">
                    Guest
                  </button>
                </div>

                {error && <div className="mt-4 text-xs text-rose-300 bg-rose-950/60 p-3 rounded-xl border border-rose-900/80 font-mono text-left">{error}</div>}
              </div>

              <div>
                <div className="text-[10px] font-mono text-sky-400 uppercase tracking-wider font-bold mb-3 flex items-center gap-1.5">
                  <span>✦</span>
                  <span>CHANNELS</span>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <a href="https://instagram.com/amiir_baari" target="_blank" rel="noreferrer" className="p-3 rounded-2xl bg-slate-900/70 hover:bg-slate-900 border border-slate-800 hover:border-sky-500/40 transition-all flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-[#030712] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-pink-400">
                      <Instagram size={17} />
                    </div>
                    <div>
                      <div className="text-[9px] text-slate-500 font-mono uppercase font-semibold">INSTAGRAM</div>
                      <div className="text-xs sm:text-sm font-bold text-white font-mono">amiir_baari</div>
                    </div>
                  </a>
                  <a href="https://x.com/AmiirBaari" target="_blank" rel="noreferrer" className="p-3 rounded-2xl bg-slate-900/70 hover:bg-slate-900 border border-slate-800 hover:border-sky-500/40 transition-all flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-[#030712] border border-slate-800 flex items-center justify-center text-slate-400 hover:text-sky-400">
                      <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </div>
                    <div>
                      <div className="text-[9px] text-slate-500 font-mono uppercase font-semibold">X / TWITTER</div>
                      <div className="text-xs sm:text-sm font-bold text-white font-mono">@AmiirBaari</div>
                    </div>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [lang, setLang] = useState("en");
      const [authError, setAuthError] = useState("");

      useEffect(() => {
        return onAuthStateChanged(auth, (u) => setUser(u));
      }, []);

      if (!user) {
        return (
          <LoginPage
            onSignIn={() => signInWithPopup(auth, provider).catch(err => setAuthError(err.message))}
            onGuestSignIn={() => setUser({ uid: "guest-trader", displayName: "Guest Trader", email: "guest@amiir.com" })}
            error={authError}
            lang={lang}
            onToggleLang={() => setLang(lang === "en" ? "so" : "en")}
          />
        );
      }

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center font-mono">
          <div className="p-8 rounded-2xl bg-[#060C1B] border border-sky-500/20 max-w-md w-full">
            <h2 className="text-xl font-bold text-white mb-2">Ku soo dhowow, {user.displayName}</h2>
            <p className="text-xs text-sky-400 mb-6">{user.email}</p>
            <button onClick={() => { signOut(auth); setUser(null); }} className="w-full py-2 px-4 rounded-xl bg-rose-500/20 border border-rose-500/30 text-rose-300 font-bold hover:bg-rose-500/30 transition-all cursor-pointer">
              Log Out
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
