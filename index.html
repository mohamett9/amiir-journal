<head>
  <meta charset="UTF-8" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",

  <style>
    body {
      background-color: #080c14;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.1);
    }
    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.25);

    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.8); }

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from "react";
    import ReactDOM from "react-dom/client";
    import {
      Plus, TrendingUp, TrendingDown, Trash2, X, ChevronDown, ChevronUp,
      ChevronLeft, ChevronRight, Image as ImageIcon, LayoutGrid, ListChecks,
      LogOut, User, Layers, Filter, CheckCircle2, AlertCircle, Sparkles,
      BarChart3, Clock, Wallet, ShieldAlert, Award
    } from "lucide-react";

    // Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ",
      authDomain: "amiir-journal.firebaseapp.com",
      projectId: "amiir-journal",
      storageBucket: "amiir-journal.firebasestorage.app",
      messagingSenderId: "533778928448",
      appId: "1:533778928448:web:138073019799354cb020a5",
      measurementId: "G-QYJ75J88K5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const SESSIONS = [
      { id: "asian", label: "Asian", flag: "🇯🇵", time: "8PM–9PM" },
      { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM" },
      { id: "newyork", label: "New York", flag: "🇺🇸", time: "8AM–9AM" },
    ];

    const PURGE_TIMES = {
      asian: ["8pm", "9pm"],
      london: ["2am", "3am"],
      newyork: ["8am", "9am"],
    };

    const ACCOUNT_TYPES = ["Funded", "Challenge", "Real", "Demo"];

    const EMPTY_FORM = {
      symbol: "",
      date: new Date().toISOString().slice(0, 10),
      accountType: "Funded",
      accountName: "FTMO 100K",
      session: "london",
      purgeTime: "2am",
      direction: "buy",
      outcome: "win",
      risk: "1",
      rrRatio: "2",
      notes: "",
      images: [],
    };

    const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December",
    ];

    // Image resize helper
    function resizeImage(dataUrl, maxWidth = 800) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [trades, setTrades] = useState([]);
      const [loading, setLoading] = useState(true);
      
      const [tab, setTab] = useState("journal"); // 'journal' | 'dashboard' | 'accounts'
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(EMPTY_FORM);
      const [expanded, setExpanded] = useState(null);
      const [error, setError] = useState("");
      const [lightbox, setLightbox] = useState(null);

      // Filters
      const [filterAccount, setFilterAccount] = useState("all");
      const [filterSession, setFilterSession] = useState("all");
      const [filterPurge, setFilterPurge] = useState("all");

      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [viewYear, setViewYear] = useState(new Date().getFullYear());

      // Auth Listener
      useEffect(() => {
        const unsub = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthLoading(false);
        });
        return () => unsub();
      }, []);

      // Realtime Database
      useEffect(() => {
        if (!user) {
          setTrades([]);
          setLoading(false);
          return;
        }
        setLoading(true);
        const colRef = collection(db, "users", user.uid, "trades");
        const unsub = onSnapshot(colRef, (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          setTrades(list);
          setLoading(false);
        }, (err) => {
          setError(err.message);
          setLoading(false);
        });
        return () => unsub();
      }, [user]);

      // Handle Multiple Images
      const handleMultipleImages = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        
        try {
          const promises = files.map((file) => {
            return new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = async () => {
                const resized = await resizeImage(reader.result);
                resolve(resized);
              };
              reader.readAsDataURL(file);
            });
          });

          const newImgs = await Promise.all(promises);
          setForm((prev) => ({
            ...prev,
            images: [...prev.images, ...newImgs]
          }));
        } catch (err) {
          setError("Sawirrada lama wada shubi karin, isku day mar kale.");
        }
      };

      const removeImageFromForm = (idx) => {
        setForm((prev) => ({
          ...prev,
          images: prev.images.filter((_, i) => i !== idx)
        }));
      };

      const addTrade = async () => {
        if (!form.symbol || !form.date) {
          setError("Geli symbol-ka (tusaale: NQ) iyo taariikhda.");
          return;
        }
        const risk = parseFloat(form.risk) || 0;
        const rr = parseFloat(form.rrRatio) || 0;
        const reward = +(risk * rr).toFixed(2);
        const rMultiple = form.outcome === "win" ? reward : form.outcome === "loss" ? -risk : 0;
        const id = Date.now().toString();

        const tradeData = {
          id,
          symbol: form.symbol.toUpperCase(),
          date: form.date,
          accountType: form.accountType || "Funded",
          accountName: form.accountName || "Primary MT5",
          session: form.session,
          purgeTime: form.purgeTime,
          direction: form.direction,
          outcome: form.outcome,
          risk,
          rrRatio: rr,
          reward,
          rMultiple,
          notes: form.notes || "",
          images: form.images || (form.image ? [form.image] : []),
          createdAt: new Date().toISOString()
        };

        try {
          await setDoc(doc(db, "users", user.uid, "trades", id), tradeData);
          setForm(EMPTY_FORM);
          setShowForm(false);
          setError("");
        } catch (err) {
          setError("Lama kaydin karin: " + err.message);
        }
      };

      const removeTrade = async (id) => {
        if (!confirm("Ma hubtaa inaad tirtirto trade-kan?")) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "trades", id));
        } catch (err) {
          setError(err.message);
        }
      };

      // Filtered Trades
      const filteredTrades = useMemo(() => {
        return trades.filter((t) => {
          if (filterAccount !== "all" && t.accountType !== filterAccount && t.accountName !== filterAccount) return false;
          if (filterSession !== "all" && t.session !== filterSession) return false;
          if (filterPurge !== "all" && t.purgeTime !== filterPurge) return false;
          return true;
        });
      }, [trades, filterAccount, filterSession, filterPurge]);

      // Comprehensive Stats
      const stats = useMemo(() => {
        const total = filteredTrades.length;
        const wins = filteredTrades.filter((t) => t.outcome === "win").length;
        const losses = filteredTrades.filter((t) => t.outcome === "loss").length;
        const netR = filteredTrades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;

        // Session Performance
        const sessionsStats = {};
        ["asian", "london", "newyork"].forEach((s) => {
          const list = trades.filter((t) => t.session === s);
          const w = list.filter((t) => t.outcome === "win").length;
          const r = list.reduce((sum, t) => sum + (t.rMultiple || 0), 0);
          sessionsStats[s] = { count: list.length, winRate: list.length ? Math.round((w / list.length) * 100) : 0, netR: r };
        });

        // Purge Performance
        const purgeStats = {};
        Object.values(PURGE_TIMES).flat().forEach((pt) => {
          const list = trades.filter((t) => t.purgeTime === pt);
          const w = list.filter((t) => t.outcome === "win").length;
          const r = list.reduce((sum, t) => sum + (t.rMultiple || 0), 0);
          purgeStats[pt] = { count: list.length, winRate: list.length ? Math.round((w / list.length) * 100) : 0, netR: r };
        });

        return { total, wins, losses, netR, winRate, sessionsStats, purgeStats };
      }, [filteredTrades, trades]);

      // Weekly Consistency Tracker
      const weeklyConsistency = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        const day = startOfWeek.getDay();
        const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);
        const mondayStr = startOfWeek.toISOString().slice(0, 10);

        const thisWeekTrades = trades.filter((t) => t.date >= mondayStr);
        const count = thisWeekTrades.length;
        const wins = thisWeekTrades.filter((t) => t.outcome === "win").length;
        const netR = thisWeekTrades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const winRate = count ? Math.round((wins / count) * 100) : 0;
        return { count, wins, netR, winRate };
      }, [trades]);

      // Calendar
      const dayMap = useMemo(() => {
        const map = {};
        filteredTrades.forEach((t) => {
          if (!map[t.date]) map[t.date] = { net: 0, count: 0 };
          map[t.date].net += t.rMultiple || 0;
          map[t.date].count += 1;
        });
        return map;
      }, [filteredTrades]);

      const calendarCells = useMemo(() => {
        const first = new Date(viewYear, viewMonth, 1);
        const offset = (first.getDay() + 6) % 7;
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < offset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          cells.push({ day: d, key, data: dayMap[key] });
        }
        return cells;
      }, [viewYear, viewMonth, dayMap]);

      const fmtR = (n) => (n > 0 ? "+" : "") + n.toFixed(2) + "%";

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#080c14]">
            <div className="w-8 h-8 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      // Minimalist Modern Login
      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4 bg-[#080c14] relative overflow-hidden">
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="glass-card max-w-sm w-full p-8 rounded-2xl shadow-2xl relative z-10 border border-slate-800 text-center">
              <div className="w-12 h-12 bg-sky-500/10 border border-sky-500/30 rounded-xl flex items-center justify-center mx-auto mb-4 text-sky-400 shadow-lg shadow-sky-500/20">
                <TrendingUp size={24} />
              </div>

              <h1 className="text-2xl font-bold tracking-tight text-white mb-1">Amiir Journal</h1>
              <p className="text-xs text-slate-400 mb-8">Professional Ledger & Execution Journal</p>

              {error && <div className="text-xs text-red-400 mb-4 bg-red-950/40 p-2 rounded border border-red-900/50">{error}</div>}

              <button
                onClick={() => signInWithPopup(auth, provider)}
                className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl font-semibold text-sm bg-white hover:bg-slate-100 text-slate-900 transition-all duration-200 shadow-md cursor-pointer hover:shadow-sky-500/10"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#080c14] text-slate-200 pb-20">
          {/* Top Bar */}
          <header className="border-b border-slate-800/80 bg-[#0c121e]/80 backdrop-blur-md sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-sky-500/10 border border-sky-400/30 flex items-center justify-center text-sky-400">
                  <TrendingUp size={18} />
                </div>
                <div>
                  <h1 className="font-bold text-sm tracking-tight text-white flex items-center gap-1.5">
                    Amiir Journal <span className="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20 font-mono">Pro</span>
                  </h1>
                </div>
              </div>

              {/* User Profile */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-900/80 px-2.5 py-1.5 rounded-full border border-slate-800">
                  {user.photoURL ? (
                    <img src={user.photoURL} alt="user" className="w-5 h-5 rounded-full" />
                  ) : (
                    <User size={14} className="text-slate-400" />
                  )}
                  <span className="text-xs text-slate-300 font-medium hidden sm:inline">{user.displayName?.split(" ")[0] || "Trader"}</span>
                  <button 
                    onClick={() => signOut(auth)} 
                    title="Ka bax" 
                    className="text-slate-400 hover:text-red-400 ml-1 cursor-pointer transition-colors"
                  >
                    <LogOut size={13} />
                  </button>
                </div>

                <button
                  onClick={() => setShowForm((s) => !s)}
                  className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-sky-500 hover:bg-sky-400 text-slate-950 transition-all duration-200 shadow-md shadow-sky-500/20 cursor-pointer"
                >
                  {showForm ? <X size={14} /> : <Plus size={14} />}
                  <span>{showForm ? "Jooji" : "New Trade"}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-6">
            
            {/* Navigation Tabs */}
            <div className="flex items-center justify-between gap-4 mb-6 flex-wrap">
              <div className="flex gap-1.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800/80">
                {[
                  { id: "journal", label: "Journal", icon: ListChecks },
                  { id: "dashboard", label: "Dashboard", icon: BarChart3 },
                  { id: "accounts", label: "Accounts & Sessions", icon: Wallet }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs font-medium transition-all duration-150 cursor-pointer ${
                      tab === item.id 
                        ? "bg-sky-500/15 text-sky-300 border border-sky-500/30 shadow-sm" 
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/40"
                    }`}
                  >
                    <item.icon size={14} />
                    {item.label}
                  </button>
                ))}
              </div>

              {/* Quick Filter Bar */}
              <div className="flex items-center gap-2 flex-wrap">
                <select
                  value={filterAccount}
                  onChange={(e) => setFilterAccount(e.target.value)}
                  className="bg-slate-900 text-xs px-2.5 py-1.5 rounded-lg border border-slate-800 text-slate-300 focus:outline-none focus:border-sky-500/50 cursor-pointer"
                >
                  <option value="all">Accounts: All</option>
                  {ACCOUNT_TYPES.map((a) => <option key={a} value={a}>{a}</option>)}
                </select>

                <select
                  value={filterSession}
                  onChange={(e) => setFilterSession(e.target.value)}
                  className="bg-slate-900 text-xs px-2.5 py-1.5 rounded-lg border border-slate-800 text-slate-300 focus:outline-none focus:border-sky-500/50 cursor-pointer"
                >
                  <option value="all">Sessions: All</option>
                  {SESSIONS.map((s) => <option key={s.id} value={s.id}>{s.flag} {s.label}</option>)}
                </select>

                <select
                  value={filterPurge}
                  onChange={(e) => setFilterPurge(e.target.value)}
                  className="bg-slate-900 text-xs px-2.5 py-1.5 rounded-lg border border-slate-800 text-slate-300 focus:outline-none focus:border-sky-500/50 cursor-pointer"
                >
                  <option value="all">Purge Time: All</option>
                  {Object.values(PURGE_TIMES).flat().map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>

            {/* Top Stats Banner */}
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6">
              <div className="glass-card p-4 rounded-xl border border-slate-800">
                <div className="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Trades</div>
                <div className="text-xl font-bold font-mono text-white">{stats.total}</div>
              </div>

              <div className="glass-card p-4 rounded-xl border border-slate-800">
                <div className="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Win Rate</div>
                <div className="text-xl font-bold font-mono text-sky-400">{stats.winRate}%</div>
              </div>

              <div className="glass-card p-4 rounded-xl border border-slate-800">
                <div className="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Win / Loss</div>
                <div className="text-xl font-bold font-mono">
                  <span className="text-emerald-400">{stats.wins}</span>
                  <span className="text-slate-600 mx-1">/</span>
                  <span className="text-rose-400">{stats.losses}</span>
                </div>
              </div>

              <div className="glass-card p-4 rounded-xl border border-slate-800">
                <div className="text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Net Gain (R)</div>
                <div className={`text-xl font-bold font-mono ${stats.netR >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                  {fmtR(stats.netR)}
                </div>
              </div>

              {/* Consistency Metric */}
              <div className="glass-card p-4 rounded-xl border border-sky-500/20 col-span-2 sm:col-span-1 bg-gradient-to-br from-slate-900 to-sky-950/30">
                <div className="text-[11px] text-sky-400 font-medium uppercase tracking-wider mb-1 flex items-center gap-1">
                  <Award size={12} /> This Week
                </div>
                <div className="text-base font-bold font-mono text-white flex items-center justify-between">
                  <span>{fmtR(weeklyConsistency.netR)}</span>
                  <span className="text-xs px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-sans font-medium">
                    {weeklyConsistency.winRate}% WR
                  </span>
                </div>
              </div>
            </div>

            {/* FORM MODAL / COLLAPSIBLE */}
            {showForm && (
              <div className="glass-card p-6 rounded-2xl mb-8 border border-sky-500/30 shadow-2xl relative">
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-sm text-white flex items-center gap-2">
                    <Plus size={16} className="text-sky-400" /> Diiwaangeli Ganacsi Cusub
                  </h3>
                  <button onClick={() => setShowForm(false)} className="text-slate-400 hover:text-white cursor-pointer"><X size={16} /></button>
                </div>

                {error && <div className="text-xs text-red-400 bg-red-950/40 p-2.5 rounded-lg mb-4 border border-red-900/50">{error}</div>}

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Symbol / Pair</label>
                    <input
                      value={form.symbol}
                      onChange={(e) => setForm({ ...form, symbol: e.target.value })}
                      placeholder="e.g. NQ, EURUSD, XAUUSD"
                      className="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400 font-mono"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Taariikhda</label>
                    <input
                      type="date"
                      value={form.date}
                      onChange={(e) => setForm({ ...form, date: e.target.value })}
                      className="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-400 font-mono"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Account Type & Name</label>
                    <div className="flex gap-2">
                      <select
                        value={form.accountType}
                        onChange={(e) => setForm({ ...form, accountType: e.target.value })}
                        className="bg-slate-900/80 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white focus:outline-none focus:border-sky-400 cursor-pointer"
                      >
                        {ACCOUNT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                      </select>
                      <input
                        value={form.accountName}
                        onChange={(e) => setForm({ ...form, accountName: e.target.value })}
                        placeholder="MT5 / FTMO Account"
                        className="flex-1 bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-sky-400"
                      />
                    </div>
                  </div>
                </div>

                {/* Session & Purge Time Selectors */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Trading Session</label>
                    <div className="grid grid-cols-3 gap-2">
                      {SESSIONS.map((s) => (
                        <button
                          key={s.id}
                          type="button"
                          onClick={() => setForm({ ...form, session: s.id, purgeTime: PURGE_TIMES[s.id][0] })}
                          className={`py-2 px-2 rounded-lg text-xs font-medium border flex flex-col items-center gap-0.5 transition-all cursor-pointer ${
                            form.session === s.id
                              ? "bg-sky-500/20 border-sky-400 text-sky-300 shadow-sm"
                              : "border-slate-800 bg-slate-900/60 text-slate-400 hover:border-slate-700"
                          }`}
                        >
                          <span>{s.flag} {s.label}</span>
                          <span className="text-[10px] text-slate-500 font-mono">{s.time}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Purging Time (Entry Execution)</label>
                    <div className="grid grid-cols-2 gap-2">
                      {PURGE_TIMES[form.session].map((pt) => (
                        <button
                          key={pt}
                          type="button"
                          onClick={() => setForm({ ...form, purgeTime: pt })}
                          className={`py-2.5 rounded-lg text-xs font-mono font-medium border transition-all cursor-pointer ${
                            form.purgeTime === pt
                              ? "bg-sky-500/20 border-sky-400 text-sky-300"
                              : "border-slate-800 bg-slate-900/60 text-slate-400 hover:border-slate-700"
                          }`}
                        >
                          {pt}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Direction, Outcome, Risk, R:R */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4">
                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Direction</label>
                    <div className="flex gap-1.5">
                      {["buy", "sell"].map((d) => (
                        <button
                          key={d}
                          type="button"
                          onClick={() => setForm({ ...form, direction: d })}
                          className={`flex-1 py-2 rounded-lg text-xs uppercase font-mono font-semibold border transition-all cursor-pointer ${
                            form.direction === d
                              ? "bg-sky-500/20 border-sky-400 text-sky-300"
                              : "border-slate-800 bg-slate-900/60 text-slate-400"
                          }`}
                        >
                          {d}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Outcome</label>
                    <div className="flex gap-1.5">
                      {[
                        { id: "win", label: "WIN", bg: "bg-emerald-500/20 border-emerald-400 text-emerald-300" },
                        { id: "loss", label: "LOSS", bg: "bg-rose-500/20 border-rose-400 text-rose-300" },
                        { id: "be", label: "BE", bg: "bg-slate-700 border-slate-500 text-slate-300" },
                      ].map((o) => (
                        <button
                          key={o.id}
                          type="button"
                          onClick={() => setForm({ ...form, outcome: o.id })}
                          className={`flex-1 py-2 rounded-lg text-xs uppercase font-mono font-semibold border transition-all cursor-pointer ${
                            form.outcome === o.id ? o.bg : "border-slate-800 bg-slate-900/60 text-slate-400"
                          }`}
                        >
                          {o.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Risk %</label>
                    <input
                      type="number"
                      step="0.1"
                      value={form.risk}
                      onChange={(e) => setForm({ ...form, risk: e.target.value })}
                      className="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono focus:border-sky-400"
                    />
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">R:R Ratio (1 : x)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={form.rrRatio}
                      onChange={(e) => setForm({ ...form, rrRatio: e.target.value })}
                      className="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono focus:border-sky-400"
                    />
                  </div>
                </div>

                {/* Multi-Image Upload */}
                <div className="mb-4">
                  <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">
                    Sawirrada Chart-ka (HTF & LTF Execution - Waad wada shubi kartaa kuwo badan)
                  </label>
                  <div className="border border-dashed border-slate-700 rounded-xl p-4 bg-slate-900/50 hover:border-sky-500/50 transition-colors">
                    <input
                      type="file"
                      multiple
                      accept="image/*"
                      onChange={handleMultipleImages}
                      className="block w-full text-xs text-slate-400 cursor-pointer file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-sky-500/20 file:text-sky-300 file:font-semibold hover:file:bg-sky-500/30"
                    />

                    {form.images?.length > 0 && (
                      <div className="flex gap-2 mt-3 flex-wrap">
                        {form.images.map((img, i) => (
                          <div key={i} className="relative group w-20 h-16 rounded-lg overflow-hidden border border-slate-700">
                            <img src={img} alt="chart" className="w-full h-full object-cover" />
                            <button
                              type="button"
                              onClick={() => removeImageFromForm(i)}
                              className="absolute top-1 right-1 bg-black/80 text-rose-400 p-0.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity"
                            >
                              <X size={12} />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* Notes */}
                <div className="mb-4">
                  <label className="text-[11px] uppercase tracking-wider text-slate-400 block mb-1.5">Falanqaynta & Fiiro Gaar ah</label>
                  <textarea
                    rows={2}
                    value={form.notes}
                    onChange={(e) => setForm({ ...form, notes: e.target.value })}
                    placeholder="Waa maxay sababta aad u gashay? HTF liquidity purge, FVG, MSS, iwm..."
                    className="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-sky-400 resize-none"
                  />
                </div>

                <button
                  type="button"
                  onClick={addTrade}
                  className="w-full py-2.5 rounded-xl font-semibold text-sm bg-sky-500 hover:bg-sky-400 text-slate-950 transition-all duration-200 shadow-lg shadow-sky-500/20 cursor-pointer"
                >
                  Kaydi Ganacsiga
                </button>
              </div>
            )}

            {/* TAB 1: JOURNAL (DIIWAANKA) */}
            {tab === "journal" && (
              <div>
                {loading ? (
                  <div className="py-20 text-center text-slate-500 font-mono text-sm">Soo raraya ganacsiyada...</div>
                ) : filteredTrades.length === 0 ? (
                  <div className="glass-card py-16 text-center rounded-2xl border border-slate-800/80">
                    <p className="text-sm text-slate-400">Weli wax trade ah lama helin shaandhadaada.</p>
                    <p className="text-xs text-slate-500 mt-1">Guji "New Trade" si aad u bilowdo.</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="text-xs text-slate-500 px-1 font-mono flex items-center justify-between">
                      <span>Tip: <strong>Labo jeer ku dhufo (Double Click)</strong> trade kasta si aad toos sawirkiisa u furto!</span>
                      <span>{filteredTrades.length} Trades</span>
                    </div>

                    {filteredTrades.map((t) => {
                      const isOpen = expanded === t.id;
                      const sessionInfo = SESSIONS.find((s) => s.id === t.session);
                      const imgs = t.images || (t.image ? [t.image] : []);

                      return (
                        <div
                          key={t.id}
                          onDoubleClick={() => {
                            if (imgs.length > 0) setLightbox(imgs[0]);
                          }}
                          className="glass-card rounded-xl border border-slate-800/90 overflow-hidden hover:border-sky-500/40 transition-all duration-150 select-none cursor-pointer"
                        >
                          {/* Row Summary */}
                          <div 
                            onClick={() => setExpanded(isOpen ? null : t.id)}
                            className="p-4 flex items-center justify-between flex-wrap gap-3"
                          >
                            <div className="flex items-center gap-3 flex-wrap">
                              {t.outcome === "win" ? (
                                <div className="w-7 h-7 rounded-lg bg-emerald-500/15 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                                  <TrendingUp size={16} />
                                </div>
                              ) : (
                                <div className="w-7 h-7 rounded-lg bg-rose-500/15 text-rose-400 flex items-center justify-center border border-rose-500/30">
                                  <TrendingDown size={16} />
                                </div>
                              )}

                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="font-bold text-sm font-mono text-white">{t.symbol}</span>
                                  <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                                    {t.direction}
                                  </span>
                                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20 font-mono">
                                    {t.accountName || t.accountType}
                                  </span>
                                </div>
                                <div className="text-[11px] text-slate-500 font-mono mt-0.5">
                                  {t.date} · {sessionInfo?.flag} {sessionInfo?.label} · {t.purgeTime}
                                </div>
                              </div>
                            </div>

                            <div className="flex items-center gap-4">
                              {imgs.length > 0 && (
                                <div className="flex items-center gap-1 text-slate-400 text-xs bg-slate-800/60 px-2 py-1 rounded-md border border-slate-700">
                                  <ImageIcon size={13} className="text-sky-400" />
                                  <span>{imgs.length}</span>
                                </div>
                              )}

                              <div className={`text-sm font-bold font-mono ${t.rMultiple >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                                {fmtR(t.rMultiple || 0)}
                              </div>

                              {isOpen ? <ChevronUp size={16} className="text-slate-500" /> : <ChevronDown size={16} className="text-slate-500" />}
                            </div>
                          </div>

                          {/* Expanded Details */}
                          {isOpen && (
                            <div className="px-4 pb-4 pt-2 border-t border-slate-800/80 bg-slate-950/40">
                              <div className="grid grid-cols-3 gap-3 mb-3 text-xs">
                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                  <div className="text-slate-500 text-[10px] uppercase">Risk</div>
                                  <div className="font-mono font-semibold text-white mt-0.5">{t.risk}%</div>
                                </div>
                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                  <div className="text-slate-500 text-[10px] uppercase">Reward</div>
                                  <div className="font-mono font-semibold text-white mt-0.5">{t.reward}%</div>
                                </div>
                                <div className="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                                  <div className="text-slate-500 text-[10px] uppercase">R:R</div>
                                  <div className="font-mono font-semibold text-white mt-0.5">1:{t.rrRatio}</div>
                                </div>
                              </div>

                              {/* Images Gallery */}
                              {imgs.length > 0 && (
                                <div className="mb-3">
                                  <div className="text-[11px] text-slate-400 mb-2 flex items-center gap-1.5">
                                    <ImageIcon size={13} /> Charts (Guji si aad u weynayso):
                                  </div>
                                  <div className="flex gap-2 flex-wrap">
                                    {imgs.map((src, idx) => (
                                      <img
                                        key={idx}
                                        src={src}
                                        alt="screenshot"
                                        onClick={() => setLightbox(src)}
                                        className="h-28 rounded-lg border border-slate-700 object-cover cursor-zoom-in hover:border-sky-400 transition-all"
                                      />
                                    ))}
                                  </div>
                                </div>
                              )}

                              {t.notes && (
                                <div className="text-xs text-slate-300 bg-slate-900/40 p-3 rounded-lg border border-slate-800/60 mb-3 leading-relaxed">
                                  {t.notes}
                                </div>
                              )}

                              <div className="flex justify-end">
                                <button
                                  type="button"
                                  onClick={() => removeTrade(t.id)}
                                  className="flex items-center gap-1.5 text-xs text-rose-400 hover:text-rose-300 transition-colors cursor-pointer"
                                >
                                  <Trash2 size={13} /> Tirtir Trade-kan
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: DASHBOARD & ANALYTICS */}
            {tab === "dashboard" && (
              <div className="space-y-6">
                {/* Purge Time Performance Matrix */}
                <div className="glass-card p-5 rounded-2xl border border-slate-800">
                  <h3 className="text-sm font-bold text-white mb-3 flex items-center gap-2">
                    <Clock size={16} className="text-sky-400" /> Purge Times Performance (Win Rate & Return)
                  </h3>
                  <div className="grid grid-cols-2 sm:grid-cols-6 gap-3">
                    {Object.entries(stats.purgeStats).map(([time, data]) => (
                      <div key={time} className="bg-slate-900/70 p-3 rounded-xl border border-slate-800 text-center">
                        <div className="text-xs font-mono font-semibold text-slate-300 uppercase">{time}</div>
                        <div className={`text-base font-bold font-mono mt-1 ${data.winRate >= 50 ? "text-emerald-400" : "text-rose-400"}`}>
                          {data.winRate}%
                        </div>
                        <div className="text-[10px] text-slate-500 font-mono mt-0.5">
                          {data.count} trades ({fmtR(data.netR)})
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Calendar View */}
                <div className="glass-card p-5 rounded-2xl border border-slate-800">
                  <div className="flex items-center justify-between mb-4">
                    <button onClick={() => setViewMonth((m) => (m === 0 ? 11 : m - 1))} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 cursor-pointer">
                      <ChevronLeft size={18} />
                    </button>
                    <div className="text-center font-bold text-sm text-white">
                      {MONTH_NAMES[viewMonth]} {viewYear}
                    </div>
                    <button onClick={() => setViewMonth((m) => (m === 11 ? 0 : m + 1))} className="p-1.5 rounded-lg text-slate-400 hover:bg-slate-800 cursor-pointer">
                      <ChevronRight size={18} />
                    </button>
                  </div>

                  <div className="grid grid-cols-7 gap-1.5 mb-1.5">
                    {WEEKDAYS.map((d) => (
                      <div key={d} className="text-[10px] font-mono text-slate-500 text-center uppercase py-1">{d}</div>
                    ))}
                  </div>

                  <div className="grid grid-cols-7 gap-1.5">
                    {calendarCells.map((cell, idx) => {
                      if (!cell) return <div key={idx} className="aspect-square"></div>;
                      const hasData = !!cell.data;
                      const net = cell.data?.net || 0;
                      return (
                        <div
                          key={idx}
                          className={`aspect-square rounded-xl p-1.5 flex flex-col justify-between border transition-all text-xs ${
                            !hasData
                              ? "bg-slate-900/40 border-slate-800/60"
                              : net > 0
                              ? "bg-emerald-950/40 border-emerald-500/40 text-emerald-300"
                              : net < 0
                              ? "bg-rose-950/40 border-rose-500/40 text-rose-300"
                              : "bg-slate-800 border-slate-700 text-slate-300"
                          }`}
                        >
                          <span className="text-[10px] font-mono text-slate-400">{cell.day}</span>
                          {hasData && (
                            <div className="text-right font-mono text-[10px] font-bold leading-tight">
                              {fmtR(net)}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: ACCOUNTS & SESSIONS */}
            {tab === "accounts" && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {/* Sessions Breakdown */}
                <div className="glass-card p-5 rounded-2xl border border-slate-800">
                  <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-2">
                    <Clock size={16} className="text-sky-400" /> Sessions Breakdown
                  </h3>
                  <div className="space-y-3">
                    {SESSIONS.map((s) => {
                      const st = stats.sessionsStats[s.id] || { count: 0, winRate: 0, netR: 0 };
                      return (
                        <div key={s.id} className="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                          <div className="flex items-center gap-2.5">
                            <span className="text-xl">{s.flag}</span>
                            <div>
                              <div className="text-sm font-semibold text-white">{s.label}</div>
                              <div className="text-[10px] text-slate-500 font-mono">{s.time}</div>
                            </div>
                          </div>
                          <div className="text-right font-mono">
                            <div className={`text-sm font-bold ${st.winRate >= 50 ? "text-emerald-400" : "text-rose-400"}`}>
                              {st.winRate}% WR
                            </div>
                            <div className="text-[11px] text-slate-400">{st.count} trades ({fmtR(st.netR)})</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Account Types Breakdown */}
                <div className="glass-card p-5 rounded-2xl border border-slate-800">
                  <h3 className="text-sm font-bold text-white mb-4 flex items-center gap-2">
                    <Wallet size={16} className="text-sky-400" /> Accounts Overview
                  </h3>
                  <div className="space-y-3">
                    {ACCOUNT_TYPES.map((type) => {
                      const accTrades = trades.filter((t) => t.accountType === type);
                      const wins = accTrades.filter((t) => t.outcome === "win").length;
                      const wr = accTrades.length ? Math.round((wins / accTrades.length) * 100) : 0;
                      const net = accTrades.reduce((a, b) => a + (b.rMultiple || 0), 0);

                      return (
                        <div key={type} className="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                          <div>
                            <div className="text-sm font-semibold text-white flex items-center gap-2">
                              {type}
                              <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">{accTrades.length} trades</span>
                            </div>
                            <div className="text-[11px] text-slate-500 font-mono mt-0.5">Win Rate: {wr}%</div>
                          </div>
                          <div className={`font-mono text-sm font-bold ${net >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                            {fmtR(net)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* LIGHTBOX FOR IMAGES */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
            >
              <img src={lightbox} alt="Full Chart" className="max-w-full max-h-[90vh] rounded-xl shadow-2xl border border-slate-800" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
