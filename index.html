    function resizeImage(dataUrl, maxWidth = 800) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    // FUTURISTIC CYBERPUNK CARD WITH A|A LOGO, NEON LINES & QR CODE (MATCHING USER REFERENCE)
    function downloadTradeReceipt(tr) {
      const canvas = document.createElement("canvas");
      canvas.width = 700;
      canvas.height = 400;
      const ctx = canvas.getContext("2d");

      // 1. Dark Cyber Background
      ctx.fillStyle = "#080d1a";
      ctx.fillRect(0, 0, 700, 400);

      // 2. Circuit Trace Lines (Neon Cyan & Magenta)
      const drawCircuit = (color, points, endRadius = 3.5) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i][0], points[i][1]);
        }
        ctx.stroke();
        const end = points[points.length - 1];
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(end[0], end[1], endRadius, 0, Math.PI * 2);
        ctx.fill();
      };

      // Top cyan & pink circuit lines
      drawCircuit("#00f0ff", [[280, 40], [380, 40], [430, 80], [600, 80]], 3.5);
      drawCircuit("#ec4899", [[350, 65], [420, 65], [450, 95], [580, 95]], 3);
      drawCircuit("#00f0ff", [[480, 115], [570, 115], [590, 135]], 3);

      // Bottom-left cyan & pink circuit lines
      drawCircuit("#00f0ff", [[50, 200], [130, 200], [170, 240], [210, 240], [250, 280]], 3.5);
      drawCircuit("#ec4899", [[50, 215], [120, 215], [155, 250], [195, 250], [225, 280], [225, 310]], 3);

      // 3. Top-Left Cyber Tech Brackets [ A | A ]
      ctx.strokeStyle = "#ec4899";
      ctx.lineWidth = 2;
      ctx.beginPath();
      // top-left corner
      ctx.moveTo(40, 55); ctx.lineTo(40, 40); ctx.lineTo(55, 40);
      // top-right corner
      ctx.moveTo(95, 40); ctx.lineTo(110, 40); ctx.lineTo(110, 55);
      // bottom-left corner
      ctx.moveTo(40, 90); ctx.lineTo(40, 105); ctx.lineTo(55, 105);
      // bottom-right corner
      ctx.moveTo(95, 105); ctx.lineTo(110, 105); ctx.lineTo(110, 90);
      ctx.stroke();

      // Letters inside: A | A
      ctx.font = "bold 26px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#ffffff";
      ctx.fillText("A", 49, 82);
      ctx.fillStyle = "#64748b";
      ctx.fillText("|", 72, 80);
      ctx.fillStyle = "#00f0ff";
      ctx.fillText("A", 87, 82);

      // 4. Center Main Info
      const isWin = tr.outcome === "win";
      const outcomeColor = isWin ? "#00f0ff" : "#ec4899";

      // Bold Title: Symbol & Direction
      ctx.font = "bold 32px 'Plus Jakarta Sans', sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.fillText(`${tr.symbol} · ${tr.direction.toUpperCase()}`, 350, 160);

      // Outcome & PnL / Return
      const pnlStr = tr.pnlDollar
        ? (tr.pnlDollar >= 0 ? `+$${tr.pnlDollar}` : `-$${Math.abs(tr.pnlDollar)}`)
        : `${tr.rMultiple >= 0 ? "+" : ""}${tr.rMultiple}%`;

      ctx.font = "bold 28px 'JetBrains Mono', monospace";
      ctx.fillStyle = outcomeColor;
      ctx.shadowColor = outcomeColor;
      ctx.shadowBlur = 10;
      ctx.fillText(`${pnlStr}  (${tr.outcome.toUpperCase()})`, 350, 205);
      ctx.shadowBlur = 0; // reset glow

      // Metadata line
      ctx.font = "12px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#94a3b8";
      ctx.fillText(`${tr.date}  ·  ${tr.session.toUpperCase()} (${tr.purgeTime || "Entry"})  ·  R:R 1:${tr.rrRatio}`, 350, 235);

      // Short Notes (if any)
      if (tr.notes) {
        ctx.font = "italic 12px 'Plus Jakarta Sans', sans-serif";
        ctx.fillStyle = "#cbd5e1";
        const shortNote = tr.notes.length > 55 ? tr.notes.substring(0, 52) + "..." : tr.notes;
        ctx.fillText(`"${shortNote}"`, 350, 262);
      }

      ctx.textAlign = "left"; // reset

      // 5. Bottom-Left Cyber Chip Icon (Pink)
      const chipX = 40, chipY = 270, chipW = 85, chipH = 85;
      ctx.strokeStyle = "#ec4899";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(chipX, chipY, chipW, chipH);
      ctx.strokeStyle = "rgba(236, 72, 153, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(chipX + 10, chipY + 10, chipW - 20, chipH - 20);
      ctx.beginPath();
      ctx.moveTo(chipX + 25, chipY + 25); ctx.lineTo(chipX + 60, chipY + 25);
      ctx.moveTo(chipX + 25, chipY + 42); ctx.lineTo(chipX + 50, chipY + 42);
      ctx.moveTo(chipX + 35, chipY + 60); ctx.lineTo(chipX + 60, chipY + 60);
      ctx.stroke();
      ctx.fillStyle = "#00f0ff";
      ctx.fillRect(chipX + 38, chipY + 38, 8, 8);

      // 6. Bottom-Right Neon Cyan QR Code (matching image)
      const qrX = 550, qrY = 245, qrSize = 110;
      ctx.strokeStyle = "#00f0ff";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#00f0ff";
      ctx.shadowBlur = 12;
      ctx.strokeRect(qrX, qrY, qrSize, qrSize);
      ctx.shadowBlur = 0;

      // 3 Corner QR Finder Patterns
      const drawFinder = (x, y) => {
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(x, y, 24, 24);
        ctx.fillStyle = "#080d1a";
        ctx.fillRect(x + 5, y + 5, 14, 14);
        ctx.fillStyle = "#00f0ff";
        ctx.fillRect(x + 8, y + 8, 8, 8);
      };
      drawFinder(qrX + 8, qrY + 8);
      drawFinder(qrX + qrSize - 32, qrY + 8);
      drawFinder(qrX + 8, qrY + qrSize - 32);

      // Matrix Cells
      ctx.fillStyle = "#00f0ff";
      const seedData = [
        [40, 10], [50, 10], [60, 10], [70, 15],
        [10, 40], [20, 40], [35, 45], [50, 40], [70, 40], [85, 45],
        [38, 55], [48, 52], [58, 55], [68, 58], [80, 55],
        [40, 70], [52, 70], [65, 75], [78, 70],
        [38, 85], [50, 85], [62, 88], [75, 85], [88, 85]
      ];
      seedData.forEach(([px, py]) => {
        ctx.fillRect(qrX + px, qrY + py, 6, 6);
      });

      // Bottom Watermark
      ctx.font = "10px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#64748b";
      ctx.fillText("amiir-journal.vercel.app · @amiir_pr", 255, 365);

      // Trigger Download
      const link = document.createElement("a");
      link.download = `${tr.symbol}-${tr.date}-card.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

      const filteredTrades = useMemo(() => {

      const stats = useMemo(() => {
        const total = filteredTrades.length;
        const wins = filteredTrades.filter((tr) => tr.outcome === "win").length;
        const losses = filteredTrades.filter((tr) => tr.outcome === "loss").length;
        const netR = filteredTrades.reduce((acc, tr) => acc + (tr.rMultiple || 0), 0);
        const totalDollar = filteredTrades.reduce((acc, tr) => acc + (tr.pnlDollar || 0), 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;

        const sessionsStats = {};
        ["asian", "london", "newyork"].forEach((s) => {
          const list = filteredTrades.filter((tr) => tr.session === s);
          const w = list.filter((tr) => tr.outcome === "win").length;
          const r = list.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0);
          const d = list.reduce((sum, tr) => sum + (tr.pnlDollar || 0), 0);
          
          const purges = {};
          (PURGE_TIMES[s] || []).forEach((pt) => {
            const ptList = list.filter((tr) => tr.purgeTime === pt);
            const ptw = ptList.filter((tr) => tr.outcome === "win").length;
            purges[pt] = {
              count: ptList.length,
              winRate: ptList.length ? Math.round((ptw / ptList.length) * 100) : 0,
              netR: ptList.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0),
              netDollar: ptList.reduce((sum, tr) => sum + (tr.pnlDollar || 0), 0)
            };
          });

          sessionsStats[s] = {
            count: list.length,
            winRate: list.length ? Math.round((w / list.length) * 100) : 0,
            netR: r,
            netDollar: d,
            purges
          };
        });

        return { total, wins, losses, netR, totalDollar, winRate, sessionsStats };
      }, [filteredTrades]);

      const weeklyConsistency = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        const day = startOfWeek.getDay();
        const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);
        const mondayStr = startOfWeek.toISOString().slice(0, 10);

        const thisWeekTrades = trades.filter((tr) => tr.date >= mondayStr);
        const count = thisWeekTrades.length;
        const wins = thisWeekTrades.filter((tr) => tr.outcome === "win").length;
        const netR = thisWeekTrades.reduce((acc, tr) => acc + (tr.rMultiple || 0), 0);
        const netDollar = thisWeekTrades.reduce((acc, tr) => acc + (tr.pnlDollar || 0), 0);
        const winRate = count ? Math.round((wins / count) * 100) : 0;
        return { count, wins, netR, netDollar, winRate };
      }, [trades]);

      const dayMap = useMemo(() => {
        const map = {};
        filteredTrades.forEach((tr) => {
          if (!map[tr.date]) map[tr.date] = { netR: 0, netDollar: 0, count: 0 };
          map[tr.date].netR += tr.rMultiple || 0;
          map[tr.date].netDollar += tr.pnlDollar || 0;
          map[tr.date].count += 1;
        });
        return map;
      }, [filteredTrades]);

      const calendarWeeks = useMemo(() => {
        const first = new Date(viewYear, viewMonth, 1);
        const offset = first.getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        
        const allCells = [];
        for (let i = 0; i < offset; i++) allCells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          allCells.push({ day: d, key, data: dayMap[key] });
        }
        while (allCells.length % 7 !== 0) {
          allCells.push(null);
        }

        const weeks = [];
        for (let i = 0; i < allCells.length; i += 7) {
          const weekSlice = allCells.slice(i, i + 7);
          let weekR = 0;
          let weekDollar = 0;
          let tradingDays = 0;
          weekSlice.forEach((c) => {
            if (c && c.data) {
              weekR += c.data.netR || 0;
              weekDollar += c.data.netDollar || 0;
              tradingDays += 1;
            }
          });
          weeks.push({
            days: weekSlice,
            summary: {
              weekNumber: Math.floor(i / 7) + 1,
              netR: weekR,
              netDollar: weekDollar,
              tradingDays
            }
          });
        }
        return weeks;
      }, [viewYear, viewMonth, dayMap]);

      const monthStats = useMemo(() => {
        let totalR = 0;
        let totalDollar = 0;
        let days = 0;
        calendarWeeks.forEach(w => {
          totalR += w.summary.netR;
          totalDollar += w.summary.netDollar;
          days += w.summary.tradingDays;
        });
        return { totalR, totalDollar, days };
      }, [calendarWeeks]);

      const fmtTradeZella = (netDollar, netR, mode) => {

        const sign = netDollar >= 0 ? "+" : "-";
        const abs = Math.abs(netDollar);
        if (abs >= 1000) {
          return sign + "$" + (abs / 1000).toFixed(1).replace(/\.0$/, "") + "K";
        }
        return sign + "$" + Math.round(abs).toLocaleString();
      };

      const fmtR = (n) => (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
      const fmtDollar = (n) => (n >= 0 ? "+$" : "-$") + Math.abs(Number(n)).toLocaleString();

      if (authLoading) {

                              </div>
                            </div>

                            {isAdmin && (
                              <button
                                onClick={() => handleDeleteUpdate(item.id)}
                                className="text-slate-500 hover:text-rose-400 p-1 cursor-pointer"
                                title="Delete"
                              >
                                <Trash2 size={13} />
                              </button>
                            )}
                          </div>

                          <div>
                            <h4 className="font-bold text-sm text-white mb-1.5 font-mono">{item.title}</h4>
                            <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap font-mono">
                              {item.text}
                            </p>
                          </div>

                          {item.image && (
                            <img
                              src={item.image}
                              alt="update feature"
                              onClick={() => { setLightbox(item.image); setZoomScale(1); }}
                              className="rounded-xl w-full max-h-72 object-cover border border-slate-700 cursor-zoom-in hover:border-sky-400"
                            />
                          )}

                          {/* COMMENTS */}
                          <div className="pt-3 border-t border-slate-800/80 space-y-2.5">
                            <div className="flex items-center justify-between text-[11px] font-mono text-slate-400">
                              <span className="flex items-center gap-1.5">
                                <MessageCircle size={13} className="text-sky-400" />
                                Comments ({item.comments ? item.comments.length : 0})
                              </span>
                            </div>

                            {item.comments && item.comments.length > 0 && (
                              <div className="space-y-2 pl-2 border-l-2 border-slate-800">
                                {item.comments.map((c) => (
                                  <div key={c.id} className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 text-xs">
                                    <div className="flex items-center justify-between gap-2 mb-1">
                                      <div className="flex items-center gap-1.5">
                                        {c.photo ? (
                                          <img src={c.photo} alt="" className="w-4 h-4 rounded-full object-cover" />
                                        ) : (
                                          <div className="w-4 h-4 rounded-full bg-slate-800 text-[9px] flex items-center justify-center font-bold text-sky-400">
                                            {c.author ? c.author[0] : "T"}
                                          </div>
                                        )}
                                        <span className="font-bold text-[10px] text-sky-300 font-mono">{c.author}</span>
                                      </div>
                                      <span className="text-[9px] text-slate-500 font-mono">
                                        {new Date(c.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                      </span>
                                    </div>
                                    <p className="text-slate-300 text-[11px] font-mono leading-relaxed pl-5">
                                      {c.text}
                                    </p>
                                  </div>
                                ))}
                              </div>
                            )}

                            <div className="flex items-center gap-2 pt-1">
                              <input
                                value={commentInputs[item.id] || ""}
                                onChange={(e) => setCommentInputs({ ...commentInputs, [item.id]: e.target.value })}
                                onKeyDown={(e) => { if (e.key === "Enter") handleAddComment(item.id); }}
                                placeholder="Add a comment..."
                                className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white font-mono focus:border-sky-400 focus:outline-none"
                              />
                              <button
                                type="button"
                                onClick={() => handleAddComment(item.id)}
                                className="p-2 bg-sky-500 hover:bg-sky-400 text-slate-950 rounded-xl cursor-pointer transition-all active:scale-95"
                              >
                                <Send size={12} />
                              </button>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}

              {/* ================= TAB 6: COMMUNITY CHAT ================= */}
              {tab === "community" && (
                <div className="glass-card rounded-2xl border border-slate-800 overflow-hidden flex flex-col h-[520px]">
                  <div className="p-3 border-b border-slate-800 bg-slate-950/40 flex items-center justify-between">
                    <span className="font-bold text-xs text-white font-mono">{t.community} Chat</span>
                    <span className="text-[10px] text-slate-500 font-mono">Live</span>
                  </div>

                  <div className="flex-1 p-3 overflow-y-auto space-y-2.5">
                    {chatMessages.map((m) => {
                      const isMe = m.uid === user.uid;
                      return (
                        <div key={m.id} className={`flex gap-2 ${isMe ? "justify-end" : "justify-start"}`}>
                          {!isMe && (
                            <img src={m.photo || "https://api.dicebear.com/7.x/bottts/svg"} className="w-6 h-6 rounded-full bg-slate-800 flex-shrink-0" />
                          )}
                          <div className={`max-w-xs p-2.5 rounded-xl text-xs relative group ${
                            isMe ? "bg-sky-500/20 text-slate-100 border border-sky-500/30" : "bg-slate-900 text-slate-200 border border-slate-800"
                          }`}>
                            <div className="flex items-center justify-between gap-3 mb-0.5">
                              <span className="font-bold text-[9px] text-sky-400 font-mono">{m.author}</span>
                              <button onClick={() => deleteChatMessage(m.id)} className="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                <Trash2 size={10} />
                              </button>
                            </div>
                            
                            {m.text && <p className="leading-relaxed whitespace-pre-wrap font-mono text-[11px]">{m.text}</p>}

                            {m.images && m.images.length > 0 && (
                              <div className="flex gap-1.5 flex-wrap mt-2">
                                {m.images.map((imgUrl, i) => (
                                  <img
                                    key={i}
                                    src={imgUrl}
                                    alt="chat attachment"
                                    onClick={() => { setLightbox(imgUrl); setZoomScale(1); }}
                                    className="h-20 w-auto rounded border border-slate-700 object-cover cursor-zoom-in hover:border-sky-400"
                                  />
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                    <div ref={chatScrollRef}></div>
                  </div>

                  {chatImages.length > 0 && (
                    <div className="p-2 border-t border-slate-800 bg-slate-950/80 flex gap-2 overflow-x-auto">
                      {chatImages.map((img, idx) => (
                        <div key={idx} className="relative w-12 h-10 rounded overflow-hidden border border-slate-700 flex-shrink-0">
                          <img src={img} alt="preview" className="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => removeChatImage(idx)}
                            className="absolute top-0 right-0 bg-black/80 text-rose-400 p-0.5 rounded-full"
                          >
                            <X size={9} />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}

                  <form onSubmit={sendChatMessage} className="p-2.5 border-t border-slate-800 bg-slate-950/60 flex items-center gap-2">
                    <input
                      type="file"
                      multiple
                      accept="image/*"
                      id="communityFileInput"
                      onChange={handleCommunityFiles}
                      className="hidden"
                    />

                    <label
                      htmlFor="communityFileInput"
                      title="Choose Files"
                      className="p-2 bg-slate-900 border border-slate-700 hover:border-sky-400 text-slate-300 hover:text-sky-300 rounded-xl cursor-pointer flex items-center gap-1 text-[11px] font-mono transition-colors"
                    >
                      <ImageIcon size={14} className="text-sky-400" />
                      <span className="hidden sm:inline">Files</span>
                    </label>

                    <input
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder={chatUploading ? "Uploading..." : t.chatPlaceholder}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-400 font-mono"
                    />

                    <button 
                      type="submit" 
                      disabled={chatUploading}
                      className="p-2 bg-sky-500 hover:bg-sky-400 text-slate-950 rounded-xl cursor-pointer transition-all active:scale-95"
                    >
                      <Send size={13} />
                    </button>
                  </form>
                </div>
              )}

            </main>
          </div>

          <footer className="mt-8 py-4 border-t border-slate-800/60 text-center text-[11px] text-slate-500 font-mono">
            Amiir Journal · {t.devBy} <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className="text-sky-400 hover:underline">@amiir_pr</a>
          </footer>

          {/* LIGHTBOX WITH PINCH, DOUBLE-TAP & BUTTON ZOOM */}
          {lightbox && (
            <div
              onClick={() => { setLightbox(null); setZoomScale(1); }}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 zoom-container select-none"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className="absolute top-4 right-4 flex items-center gap-2 bg-slate-900/90 border border-slate-700 px-3 py-1.5 rounded-xl z-50 text-white font-mono text-xs shadow-lg"
              >
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.max(0.5, z - 0.25))}
                  className="p-1 hover:text-sky-400 cursor-pointer"
                  title="Zoom Out"
                >
                  <ZoomOut size={16} />
                </button>
                <span className="text-[11px] min-w-[36px] text-center">{Math.round(zoomScale * 100)}%</span>
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.min(3.5, z + 0.25))}
                  className="p-1 hover:text-sky-400 cursor-pointer"
                  title="Zoom In"
                >
                  <ZoomIn size={16} />
                </button>
                <button
                  type="button"
                  onClick={() => setZoomScale(1)}
                  className="p-1 hover:text-sky-400 ml-1 cursor-pointer"
                  title="Reset"
                >
                  <RotateCcw size={14} />
                </button>
                <button
                  type="button"
                  onClick={() => { setLightbox(null); setZoomScale(1); }}
                  className="p-1 hover:text-rose-400 ml-1 cursor-pointer"
                  title="Close"
                >
                  <X size={16} />
                </button>
              </div>

              <div 
                onClick={(e) => { e.stopPropagation(); setZoomScale((z) => z === 1 ? 2 : 1); }} 
                className="overflow-auto max-w-full max-h-[85vh] flex items-center justify-center cursor-zoom-in"
              >
                <img 
                  src={lightbox} 
                  alt="Chart" 
                  style={{ transform: `scale(${zoomScale})`, transition: 'transform 0.15s ease-out' }}
                  className="max-w-full max-h-[85vh] rounded-xl shadow-2xl border border-slate-800 object-contain origin-center" 
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
