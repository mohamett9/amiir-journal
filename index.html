    function resizeImage(dataUrl, maxWidth = 800) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

          </div>

          {/* Minimal Footer with TikTok */}
          <footer className="mt-8 py-4 border-t border-slate-800/60 text-center text-[11px] text-slate-500 font-mono">
            Amiir Journal · {t.devBy} <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className="text-sky-400 hover:underline">@amiir_pr</a>
          </footer>

          {/* LIGHTBOX FOR IMAGES */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
            >
              <img src={lightbox} alt="Full Chart" className="max-w-full max-h-[90vh] rounded-xl shadow-2xl border border-slate-800" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
