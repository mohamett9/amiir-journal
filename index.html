<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Amiir Journal - Pro Trading Ledger</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #040711;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(13, 21, 39, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.1);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
    .small-caps { font-variant: all-small-caps; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from "react";
    import ReactDOM from "react-dom/client";
    import {
      Plus, TrendingUp, TrendingDown, Trash2, Edit3, X, ChevronDown, ChevronUp,
      ChevronLeft, ChevronRight, Image as ImageIcon, LayoutGrid, ListChecks,
      LogOut, User, Globe, MessageSquare, BookOpen, Send, CheckSquare, Wallet, Clock, Award, Settings, Star, Share2, Download, ZoomIn, ZoomOut, RotateCcw, Sparkles, MessageCircle, ShieldCheck, Activity, Users, Radio, Pin
    } from "lucide-react";

    // Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ",
      authDomain: "amiir-journal.firebaseapp.com",
      projectId: "amiir-journal",
      storageBucket: "amiir-journal.firebasestorage.app",
      messagingSenderId: "533778928448",
      appId: "1:533778928448:web:138073019799354cb020a5",
      measurementId: "G-QYJ75J88K5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const DICT = {
      en: { journal: "Journal", dashboard: "Dashboard", accounts: "Accounts", admin: "Admin", updates: "Updates", notes: "Notes", community: "Community", trades: "Trades", winRate: "Win Rate", netReturn: "Net Return", thisWeek: "This Week", seeMore: "sᴇᴇ ᴍᴏʀᴇ", showLess: "sʜᴏᴡ ʟᴇss" },
      so: { journal: "Diiwaanka", dashboard: "Dashboard", accounts: "Accounts", admin: "Admin", updates: "Updates", notes: "Casharrada", community: "Sheekada", trades: "Wadarta", winRate: "Guusha %", netReturn: "Net R", thisWeek: "Toddobaadkan", seeMore: "sᴇᴇ ᴍᴏʀᴇ", showLess: "sʜᴏᴡ ʟᴇss" }
    };

    const SESSIONS = [
      { id: "asian", label: "Asian", flag: "🇯🇵", time: "8PM–9PM", liveHours: [20, 21] },
      { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM", liveHours: [2, 3] },
      { id: "newyork", label: "New York", flag: "🇺🇸", time: "8AM–9AM", liveHours: [8, 9] },
    ];
    const PURGE_TIMES = { asian: ["8pm", "9pm"], london: ["2am", "3am"], newyork: ["8am", "9am"] };
    const ACCOUNT_TYPES = ["Funded", "Challenge", "Real", "Demo"];
    const EMPTY_FORM = { symbol: "", date: new Date().toISOString().slice(0, 10), accountName: "", session: "london", purgeTime: "2am", direction: "buy", outcome: "win", risk: "1", rrRatio: "3", pnlDollar: "", notes: "", images: [], checklist: [] };

    // Format for TradeZella Style
    const fmtTradeZella = (netDollar, netR, mode) => {
      if (mode === "%") return (netR >= 0 ? "+" : "") + Number(netR).toFixed(1) + "%";
      const sign = netDollar >= 0 ? "+" : "-";
      const abs = Math.abs(netDollar);
      if (abs >= 1000) return sign + "$" + (abs / 1000).toFixed(1).replace(/\.0$/, "") + "K";
      return sign + "$" + Math.round(abs).toLocaleString();
    };

    function App() {
      const [lang, setLang] = useState("en");
      const t = DICT[lang];
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [trades, setTrades] = useState([]);
      const [accounts, setAccounts] = useState([]);
      const [tab, setTab] = useState("journal");
      const [isAdmin, setIsAdmin] = useState(false);
      const [showForm, setShowForm] = useState(false);
      const [expandedTradeId, setExpandedTradeId] = useState(null);
      const [form, setForm] = useState(EMPTY_FORM);
      const [visibleCount, setVisibleCount] = useState(5);
      const [calMode, setCalMode] = useState("$");
      const [presenceUsers, setPresenceUsers] = useState([]);
      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [viewYear, setViewYear] = useState(new Date().getFullYear());

      useEffect(() => {
        onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthLoading(false);
          if (u) {
            const adminStatus = u.email?.toLowerCase().includes("amiir") || u.email?.toLowerCase().includes("admin") || localStorage.getItem("amiir_creator_admin") === "true";
            setIsAdmin(adminStatus);
            setDoc(doc(db, "users_presence", u.uid), { uid: u.uid, name: u.displayName || "Trader", photo: u.photoURL || "", lastSeen: Date.now() }, { merge: true });
          }
        });
      }, []);

      useEffect(() => {
        if (!user) return;
        onSnapshot(collection(db, "users", user.uid, "trades"), (snap) => {
          const list = []; snap.forEach(d => list.push(d.data()));
          setTrades(list.sort((a,b) => b.date.localeCompare(a.date)));
        });
        onSnapshot(collection(db, "users", user.uid, "accounts"), (snap) => {
          const list = []; snap.forEach(d => list.push({id: d.id, ...d.data()}));
          setAccounts(list);
        });
        if (isAdmin) {
          onSnapshot(collection(db, "users_presence"), (snap) => {
            const list = []; snap.forEach(d => list.push(d.data()));
            setPresenceUsers(list);
          });
        }
      }, [user, isAdmin]);

      const stats = useMemo(() => {
        const wins = trades.filter(t => t.outcome === "win").length;
        const netR = trades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const totalDollar = trades.reduce((acc, t) => acc + (t.pnlDollar || 0), 0);
        return { total: trades.length, wins, netR, totalDollar, winRate: trades.length ? Math.round((wins/trades.length)*100) : 0 };
      }, [trades]);

      const calendarWeeks = useMemo(() => {
        const first = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const dayMap = {};
        trades.forEach(t => { 
          if(!dayMap[t.date]) dayMap[t.date] = { netR: 0, netD: 0, count: 0 };
          dayMap[t.date].netR += t.rMultiple || 0;
          dayMap[t.date].netD += t.pnlDollar || 0;
          dayMap[t.date].count++;
        });
        const cells = [];
        for (let i = 0; i < first; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          cells.push({ day: d, data: dayMap[key] });
        }
        const weeks = [];
        for (let i = 0; i < cells.length; i += 7) {
            const slice = cells.slice(i, i + 7);
            while(slice.length < 7) slice.push(null);
            weeks.push(slice);
        }
        return weeks;
      }, [viewYear, viewMonth, trades]);

      const fmtR = (n) => (n > 0 ? "+" : "") + Number(n).toFixed(1) + "%";
      const fmtDollar = (n) => (n >= 0 ? "+$" : "-$") + Math.abs(Number(n)).toLocaleString();

      if (authLoading) return <div className="min-h-screen bg-[#040711] flex items-center justify-center text-sky-400 font-mono">LOADING...</div>;

      if (!user) return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[#040711]">
          <div className="glass-card p-10 rounded-3xl text-center max-w-sm w-full border border-slate-800">
            <h1 className="text-2xl font-bold text-white mb-6 font-mono">Amiir Journal</h1>
            <button onClick={() => signInWithPopup(auth, provider)} className="w-full py-4 bg-white text-black rounded-2xl font-bold active:scale-95 transition-all">Continue with Google</button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col">
          <header className="border-b border-slate-800/60 bg-[#090e17] sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
              <span className="font-bold text-sm font-mono text-white">AMIIR JOURNAL</span>
              <div className="flex items-center gap-4">
                <button onClick={() => setLang(lang === "en" ? "so" : "en")} className="text-[10px] font-mono text-sky-400 px-2 py-1 rounded bg-sky-500/5 uppercase">{lang}</button>
                <div className="flex items-center gap-2 bg-slate-900/80 px-2 py-1 rounded-full border border-slate-800">
                  <img src={user.photoURL} className="w-5 h-5 rounded-full" />
                  <span className="text-[11px] font-mono text-slate-300">{user.displayName?.split(" ")[0]}</span>
                  <button onClick={() => signOut(auth)} className="text-rose-500 ml-1"><LogOut size={14}/></button>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto w-full px-4 py-5">
            {/* Nav Tabs */}
            <div className="flex gap-1.5 bg-slate-900/50 p-1 rounded-xl border border-slate-800 mb-6 overflow-x-auto no-scrollbar">
              {[
                {id: "journal", label: t.journal, icon: ListChecks}, 
                {id: "dashboard", label: t.dashboard, icon: LayoutGrid}, 
                {id: "accounts", label: t.accounts, icon: Wallet},
                {id: "admin", label: t.admin, icon: ShieldCheck, adminOnly: true},
                {id: "updates", label: t.updates, icon: Sparkles},
                {id: "notes", label: t.notes, icon: BookOpen},
                {id: "community", label: t.community, icon: MessageSquare}
              ].map(item => {
                if (item.adminOnly && !isAdmin) return null;
                return (
                  <button key={item.id} onClick={() => setTab(item.id)} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold font-mono whitespace-nowrap transition-all ${tab === item.id ? "bg-sky-500 text-black shadow-lg shadow-sky-500/10" : "text-slate-500 hover:text-slate-200"}`}>
                    <item.icon size={14}/> {item.label}
                  </button>
                )
              })}
            </div>

            {tab === "journal" && (
              <div className="space-y-3 max-w-2xl mx-auto">
                {trades.slice(0, visibleCount).map(tr => (
                  <div key={tr.id} onClick={() => setExpandedTradeId(expandedTradeId === tr.id ? null : tr.id)} className="glass-card p-4 rounded-2xl cursor-pointer">
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-3">
                        <span className="font-bold font-mono text-sm">{tr.symbol} · <span className="text-[10px] opacity-60 uppercase">{tr.direction}</span></span>
                      </div>
                      <div className="flex items-center gap-2 font-mono">
                        <span className={`font-bold ${tr.rMultiple >= 0 ? "text-emerald-400" : "text-[#E598A0]"}`}>{fmtR(tr.rMultiple)}</span>
                        {tr.pnlDollar !== 0 && <span className="text-[10px] opacity-60">({fmtDollar(tr.pnlDollar)})</span>}
                      </div>
                    </div>
                    {expandedTradeId === tr.id && (
                      <div className="mt-4 pt-4 border-t border-slate-800 text-xs text-slate-400 space-y-2 font-mono">
                        <p>Account: {tr.accountName}</p>
                        <p>Date: {tr.date}</p>
                        <p>Notes: {tr.notes || "None."}</p>
                      </div>
                    )}
                  </div>
                ))}
                {trades.length > visibleCount && (
                  <button onClick={() => setVisibleCount(visibleCount + 5)} className="text-[10px] font-bold text-sky-400 uppercase tracking-widest mt-4 hover:underline font-mono">{t.seeMore}</button>
                )}
              </div>
            )}

            {tab === "dashboard" && (
              <div className="space-y-6">
                {/* 4 Stats Cards */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 font-mono">
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] text-slate-500 uppercase">{t.trades}</div>
                    <div className="text-xl font-bold text-white">{stats.total}</div>
                  </div>
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] text-slate-500 uppercase">{t.winRate}</div>
                    <div className="text-xl font-bold text-sky-400">{stats.winRate}%</div>
                  </div>
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] text-slate-500 uppercase">Return</div>
                    <div className={`text-xl font-bold ${stats.netR >= 0 ? "text-emerald-400" : "text-[#E598A0]"}`}>{fmtR(stats.netR)}</div>
                  </div>
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] text-slate-500 uppercase">PnL</div>
                    <div className={`text-xl font-bold ${stats.totalDollar >= 0 ? "text-emerald-400" : "text-[#E598A0]"}`}>{fmtDollar(stats.totalDollar)}</div>
                  </div>
                </div>

                {/* Pro Calendar */}
                <div className="glass-card p-4 rounded-2xl border border-slate-800">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                       <button onClick={() => setViewMonth(m => m === 0 ? 11 : m - 1)} className="p-1 hover:bg-slate-800 rounded"><ChevronLeft/></button>
                       <span className="font-bold font-mono text-sm">{MONTH_NAMES[viewMonth]} {viewYear}</span>
                       <button onClick={() => setViewMonth(m => m === 11 ? 0 : m + 1)} className="p-1 hover:bg-slate-800 rounded"><ChevronRight/></button>
                    </div>
                    <div className="flex bg-slate-900 rounded p-1">
                       <button onClick={() => setCalMode("$")} className={`px-3 py-1 rounded text-xs font-bold ${calMode === "$" ? "bg-sky-500 text-black" : "text-slate-500"}`}>$</button>
                       <button onClick={() => setCalMode("%")} className={`px-3 py-1 rounded text-xs font-bold ${calMode === "%" ? "bg-sky-500 text-black" : "text-slate-500"}`}>%</button>
                    </div>
                  </div>
                  <div className="grid grid-cols-8 gap-1.5">
                    {WEEKDAYS.map(d => <div key={d} className="text-[9px] font-bold text-slate-600 text-center uppercase">{d}</div>)}
                    <div className="text-[9px] font-bold text-sky-500 text-center uppercase">Wk</div>
                    {calendarWeeks.map((week, widx) => {
                      let wkD = 0, wkR = 0, wkActive = false;
                      return (
                        <React.Fragment key={widx}>
                          {week.map((cell, didx) => {
                            if (!cell) return <div key={didx} className="aspect-square rounded bg-[#0b1324]/30"></div>;
                            if(cell.data) { wkD += cell.data.netD; wkR += cell.data.netR; wkActive = true; }
                            const isWin = cell.data?.netR > 0;
                            const isLoss = cell.data?.netR < 0;
                            return (
                              <div key={didx} className={`aspect-square rounded-lg p-1 flex flex-col justify-between border transition-all ${!cell.data ? 'bg-slate-900/40 border-slate-800/40' : isWin ? 'bg-[#062019] border-emerald-500/50 text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.1)]' : isLoss ? 'bg-[#240a10] border-[#f43f5e]/40 text-[#e598a0]' : 'bg-slate-800 border-slate-700'}`}>
                                <span className="text-[8px] font-bold opacity-40">{cell.day}</span>
                                {cell.data && <div className="text-[9px] font-bold text-center truncate">{calMode === "$" ? fmtTradeZella(cell.data.netD, 0, "$") : fmtR(cell.data.netR)}</div>}
                              </div>
                            )
                          })}
                          <div className={`aspect-square rounded-lg p-1 flex flex-col justify-center items-center border ${wkActive ? (wkR >= 0 ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-rose-500/10 border-rose-500/20 text-[#e598a0]') : 'bg-slate-900/20 border-slate-800/20 text-slate-700'}`}>
                            <span className="text-[8px] font-bold">W{widx+1}</span>
                            <span className="text-[8px] font-bold">{wkActive ? (calMode === "$" ? fmtTradeZella(wkD, 0, "$") : fmtR(wkR)) : "-"}</span>
                          </div>
                        </React.Fragment>
                      )
                    })}
                  </div>
                </div>

                <div className="glass-card p-4 rounded-2xl border border-sky-500/20 bg-gradient-to-r from-slate-900/90 to-sky-950/40 shadow-xl">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2 text-xs font-mono font-bold text-sky-400 uppercase">
                        <Award size={15} /> {t.thisWeek}
                      </div>
                      <span className="text-[11px] px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 font-mono font-bold">
                        {weeklyStats.count} trades
                      </span>
                    </div>
                    <div className="flex items-center justify-between text-sm font-mono pt-2 border-t border-slate-800">
                      <span className="text-slate-400">Total Return:</span>
                      <div className="flex items-center gap-2.5 font-bold">
                        <span className={weeklyStats.netR >= 0 ? "text-emerald-400" : "text-[#e598a0]"}>{fmtR(weeklyStats.netR)}</span>
                        <span className="text-white opacity-80">{fmtDollar(weeklyStats.netD)}</span>
                      </div>
                    </div>
                </div>
              </div>
            )}

            {tab === "admin" && isAdmin && (
              <div className="glass-card p-5 rounded-2xl max-w-xl mx-auto border border-rose-500/30">
                <h2 className="text-white font-bold mb-4 flex items-center gap-2 uppercase tracking-tighter text-sm"><ShieldCheck size={16}/> Live Monitor ({presenceUsers.length})</h2>
                <div className="space-y-2">
                  {presenceUsers.map(u => {
                    const isOnline = (Date.now() - (u.lastSeen || 0)) < 90000;
                    return (
                      <div key={u.uid} className="flex justify-between items-center p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                        <div className="flex items-center gap-2">
                           <img src={u.photo || "profile.jpg"} className="w-6 h-6 rounded-full border border-slate-700" />
                           <span className="text-xs font-mono text-slate-200">{u.name}</span>
                        </div>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isOnline ? 'bg-emerald-500/20 text-emerald-400 animate-pulse' : 'bg-slate-800 text-slate-500'}`}>{isOnline ? "ONLINE" : "OFFLINE"}</span>
                      </div>
                    )
                  })}
                </div>
              </div>
            )}
          </main>
          
          <button onClick={() => setShowForm(!showForm)} className="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-sky-500 text-black flex items-center justify-center shadow-2xl z-50 active:scale-90 transition-all cursor-pointer">
            {showForm ? <X size={24}/> : <Plus size={24} className="stroke-[3]"/>}
          </button>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
