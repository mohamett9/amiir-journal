<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from "react";
    import ReactDOM from "react-dom/client";
    import {
      Plus, TrendingUp, TrendingDown, Trash2, X, ChevronDown, ChevronUp,
      ChevronLeft, ChevronRight, Image as ImageIcon, LayoutGrid, ListChecks,
      LogOut, User, Globe, Wallet, MessageSquare, Send, Link as LinkIcon,
      FileText, Video, ExternalLink, Award, Clock
    } from "lucide-react";

    // Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, addDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ",
      authDomain: "amiir-journal.firebaseapp.com",
      projectId: "amiir-journal",
      storageBucket: "amiir-journal.firebasestorage.app",
      messagingSenderId: "533778928448",
      appId: "1:533778928448:web:138073019799354cb020a5",
      measurementId: "G-QYJ75J88K5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const SESSIONS = [
      { id: "asian", label: "Asian", flag: "🇯🇵", time: "8PM–9PM" },
      { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM" },
      { id: "newyork", label: "New York", flag: "🇺🇸", time: "8AM–9AM" },
    ];

    const PURGE_TIMES = {
      asian: ["8pm", "9pm"],
      london: ["2am", "3am"],
      newyork: ["8am", "9am"],
    };

    const ACCOUNT_TYPES = ["Funded", "Challenge", "Real", "Demo"];

    const EMPTY_FORM = {
      symbol: "",
      date: new Date().toISOString().slice(0, 10),
      accountType: "Funded",
      accountName: "FTMO 100K",
      session: "london",
      purgeTime: "2am",
      direction: "buy",
      outcome: "win",
      risk: "1",
      rrRatio: "2",
      notes: "",
      images: [],
    };

    const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December",
    ];

    function resizeImage(dataUrl, maxWidth = 750) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [trades, setTrades] = useState([]);
      const [loading, setLoading] = useState(true);
      
      const [tab, setTab] = useState("journal"); // 'journal' | 'dashboard' | 'accounts' | 'community'
      const [lang, setLang] = useState("EN"); // 'EN' | 'SO'
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(EMPTY_FORM);
      const [expanded, setExpanded] = useState(null);
      const [error, setError] = useState("");
      const [lightbox, setLightbox] = useState(null);

      // Community States
      const [posts, setPosts] = useState([]);
      const [communityLoading, setCommunityLoading] = useState(false);
      const [postText, setPostText] = useState("");
      const [postMediaUrl, setPostMediaUrl] = useState("");
      const [postMediaType, setPostMediaType] = useState("link"); // 'link' | 'video' | 'pdf'
      const [postImage, setPostImage] = useState(null);
      const [isPosting, setIsPosting] = useState(false);

      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [viewYear, setViewYear] = useState(new Date().getFullYear());

      // Auth Listener
      useEffect(() => {
        const unsub = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthLoading(false);
        });
        return () => unsub();
      }, []);

      // Realtime Database for Trades
      useEffect(() => {
        if (!user) {
          setTrades([]);
          setLoading(false);
          return;
        }
        setLoading(true);
        const colRef = collection(db, "users", user.uid, "trades");
        const unsub = onSnapshot(colRef, (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          setTrades(list);
          setLoading(false);
        }, (err) => {
          setError(err.message);
          setLoading(false);
        });
        return () => unsub();
      }, [user]);

      // Realtime Community Posts
      useEffect(() => {
        if (!user) return;
        setCommunityLoading(true);
        const postsRef = collection(db, "community_posts");
        const unsubPosts = onSnapshot(postsRef, (snap) => {
          const pList = [];
          snap.forEach((d) => pList.push({ id: d.id, ...d.data() }));
          pList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setPosts(pList);
          setCommunityLoading(false);
        }, (err) => {
          console.error("Community error:", err);
          setCommunityLoading(false);
        });
        return () => unsubPosts();
      }, [user]);

      // Multiple Images Upload for Trade
      const handleMultipleImages = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        
        try {
          const promises = files.map((file) => {
            return new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = async () => {
                const resized = await resizeImage(reader.result);
                resolve(resized);
              };
              reader.readAsDataURL(file);
            });
          });

          const newImgs = await Promise.all(promises);
          setForm((prev) => ({
            ...prev,
            images: [...prev.images, ...newImgs]
          }));
        } catch (err) {
          setError("Sawirrada lama wada shubi karin, mar kale isku day.");
        }
      };

      const removeImageFromForm = (idx) => {
        setForm((prev) => ({
          ...prev,
          images: prev.images.filter((_, i) => i !== idx)
        }));
      };

      // Add Trade
      const addTrade = async () => {
        if (!form.symbol || !form.date) {
          setError(lang === "EN" ? "Please fill Symbol and Date." : "Fadlan buuxi Symbol-ka iyo Taariikhda.");
          return;
        }
        const risk = parseFloat(form.risk) || 0;
        const rr = parseFloat(form.rrRatio) || 0;
        const reward = +(risk * rr).toFixed(2);
        const rMultiple = form.outcome === "win" ? reward : form.outcome === "loss" ? -risk : 0;
        const id = Date.now().toString();

        const tradeData = {
          id,
          symbol: form.symbol.toUpperCase(),
          date: form.date,
          accountType: form.accountType || "Funded",
          accountName: form.accountName || "Primary MT5",
          session: form.session,
          purgeTime: form.purgeTime,
          direction: form.direction,
          outcome: form.outcome,
          risk,
          rrRatio: rr,
          reward,
          rMultiple,
          notes: form.notes || "",
          images: form.images || [],
          createdAt: Date.now()
        };

        try {
          await setDoc(doc(db, "users", user.uid, "trades", id), tradeData);
          setForm(EMPTY_FORM);
          setShowForm(false);
          setError("");
        } catch (err) {
          setError("Error: " + err.message);
        }
      };

      const removeTrade = async (id, e) => {
        e.stopPropagation();
        if (!confirm(lang === "EN" ? "Delete this trade?" : "Ma hubtaa inaad tirtirto trade-kan?")) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "trades", id));
          if (expanded === id) setExpanded(null);
        } catch (err) {
          setError(err.message);
        }
      };

      // Toggle Trade Details on Mobile/Desktop
      const toggleTrade = (id) => {
        setExpanded((prev) => (prev === id ? null : id));
      };

      // Community Post Submit
      const handleSendPost = async (e) => {
        e.preventDefault();
        if (!postText.trim() && !postImage && !postMediaUrl.trim()) return;
        setIsPosting(true);

        try {
          await addDoc(collection(db, "community_posts"), {
            text: postText.trim(),
            mediaUrl: postMediaUrl.trim() || null,
            mediaType: postMediaType,
            image: postImage || null,
            userId: user.uid,
            userName: user.displayName || "Trader",
            userPhoto: user.photoURL || null,
            createdAt: Date.now(),
          });

          setPostText("");
          setPostMediaUrl("");
          setPostImage(null);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setIsPosting(false);
        }
      };

      const handleDeletePost = async (postId) => {
        if (!confirm("Tirtir qoraalkan?")) return;
        try {
          await deleteDoc(doc(db, "community_posts", postId));
        } catch (err) {
          alert(err.message);
        }
      };

      // Calculations
      const stats = useMemo(() => {
        const total = trades.length;
        const wins = trades.filter((t) => t.outcome === "win").length;
        const losses = trades.filter((t) => t.outcome === "loss").length;
        const netR = trades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;
        return { total, wins, losses, netR, winRate };
      }, [trades]);

      const weeklyConsistency = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        const day = startOfWeek.getDay();
        const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);
        const mondayStr = startOfWeek.toISOString().slice(0, 10);

        const thisWeekTrades = trades.filter((t) => t.date >= mondayStr);
        const count = thisWeekTrades.length;
        const wins = thisWeekTrades.filter((t) => t.outcome === "win").length;
        const netR = thisWeekTrades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const winRate = count ? Math.round((wins / count) * 100) : 0;
        return { count, wins, netR, winRate };
      }, [trades]);

      const dayMap = useMemo(() => {
        const map = {};
        trades.forEach((t) => {
          if (!map[t.date]) map[t.date] = { net: 0, count: 0 };
          map[t.date].net += t.rMultiple || 0;
          map[t.date].count += 1;
        });
        return map;
      }, [trades]);

      const calendarCells = useMemo(() => {
        const first = new Date(viewYear, viewMonth, 1);
        const offset = (first.getDay() + 6) % 7;
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < offset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          cells.push({ day: d, key, data: dayMap[key] });
        }
        return cells;
      }, [viewYear, viewMonth, dayMap]);

      const fmtR = (n) => (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%";

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#070c18]">
            <div className="w-8 h-8 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      // Minimal Login Screen
      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4 bg-[#070c18] relative">
            <div className="custom-card max-w-sm w-full p-8 rounded-2xl shadow-2xl border border-slate-800 text-center">
              <img 
                src="./profile.jpg" 
                alt="Amiir" 
                onError={(e) => { e.target.src = "./profile.png"; }}
                className="w-20 h-20 rounded-full mx-auto mb-4 object-cover border-2 border-sky-400 shadow-lg shadow-sky-500/20"
              />
              <h1 className="text-2xl font-bold tracking-tight text-white mb-1">Amiir Journal</h1>
              <p className="text-xs text-slate-400 mb-6">Professional Trading Ledger & Community</p>

              <button
                onClick={() => signInWithPopup(auth, provider)}
                className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl font-semibold text-sm bg-white hover:bg-slate-100 text-slate-900 transition-all duration-200 shadow-md cursor-pointer active:scale-98"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#070c18] text-slate-200 pb-20">
          
          {/* Top Bar matching screenshot */}
          <header className="border-b border-[#162238] bg-[#091020] sticky top-0 z-30">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="font-bold text-base tracking-tight text-white">Amiir Journal</span>
              </div>

              <div className="flex items-center gap-2.5">
                {/* Language Switcher */}
                <button
                  onClick={() => setLang(lang === "EN" ? "SO" : "EN")}
                  className="flex items-center gap-1 bg-[#101b33] px-2.5 py-1.5 rounded-lg border border-[#1d2d4f] text-xs font-medium text-slate-300 hover:text-white cursor-pointer"
                >
                  <Globe size={13} className="text-sky-400" />
                  <span>{lang}</span>
                </button>

                {/* User Avatar Badge & Logout */}
                <div className="flex items-center gap-1.5 bg-[#101b33] px-2 py-1 rounded-lg border border-[#1d2d4f]">
                  {user.photoURL ? (
                    <img src={user.photoURL} alt="user" className="w-5 h-5 rounded-full object-cover" />
                  ) : (
                    <div className="w-5 h-5 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-[10px]">
                      {user.displayName ? user.displayName[0] : "M"}
                    </div>
                  )}
                  <button 
                    onClick={() => signOut(auth)} 
                    title="Logout" 
                    className="text-slate-400 hover:text-rose-400 p-0.5 cursor-pointer"
                  >
                    <LogOut size={13} />
                  </button>
                </div>

                {/* + New Trade Button matching screenshot */}
                <button
                  onClick={() => { setShowForm((s) => !s); if(!showForm) setTab("journal"); }}
                  className="flex items-center gap-1 px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#0ea5e9] hover:bg-sky-400 text-slate-950 transition-all cursor-pointer shadow-md shadow-sky-500/20 active:scale-95"
                >
                  {showForm ? <X size={14} /> : <Plus size={14} />}
                  <span>{showForm ? (lang === "EN" ? "Close" : "Jooji") : "+ New Trade"}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-4">
            
            {/* Tabs matching screenshot with Community added */}
            <div className="flex items-center gap-1.5 mb-5 bg-[#0b1324] p-1 rounded-xl border border-[#162238] overflow-x-auto">
              {[
                { id: "journal", label: lang === "EN" ? "Journal" : "Diiwaanka", icon: ListChecks },
                { id: "dashboard", label: "Dashboard", icon: LayoutGrid },
                { id: "accounts", label: lang === "EN" ? "Accounts" : "Akoonnada", icon: Wallet },
                { id: "community", label: "Community", icon: MessageSquare }
              ].map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer whitespace-nowrap ${
                    tab === t.id 
                      ? "bg-[#112344] text-sky-400 border border-sky-500/30" 
                      : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <t.icon size={14} />
                  {t.label}
                </button>
              ))}
            </div>

            {/* Dashboard Cards matching screenshot */}
            {tab !== "community" && (
              <div className="space-y-3 mb-6">
                <div className="grid grid-cols-2 gap-3">
                  <div className="custom-card p-4 rounded-xl">
                    <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">
                      {lang === "EN" ? "TRADES" : "WADARTA"}
                    </div>
                    <div className="text-xl font-bold font-mono text-white">{stats.total}</div>
                  </div>

                  <div className="custom-card p-4 rounded-xl">
                    <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">
                      {lang === "EN" ? "WIN RATE" : "GUUSHA %"}
                    </div>
                    <div className="text-xl font-bold font-mono text-[#0ea5e9]">{stats.winRate}%</div>
                  </div>

                  <div className="custom-card p-4 rounded-xl">
                    <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">
                      {lang === "EN" ? "WIN / LOSS" : "WIN / LOSS"}
                    </div>
                    <div className="text-xl font-bold font-mono">
                      <span className="text-emerald-400">{stats.wins}</span>
                      <span className="text-slate-600 mx-1">/</span>
                      <span className="text-rose-400">{stats.losses}</span>
                    </div>
                  </div>

                  <div className="custom-card p-4 rounded-xl">
                    <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">
                      {lang === "EN" ? "NET RETURN" : "FAA'IIDADA (R)"}
                    </div>
                    <div className="text-xl font-bold font-mono text-emerald-400">
                      {fmtR(stats.netR)}
                    </div>
                  </div>
                </div>

                {/* This Week consistency card matching screenshot */}
                <div className="custom-card p-3.5 rounded-xl flex items-center justify-between border border-sky-500/20 bg-gradient-to-r from-[#0d1527] to-[#10203d]">
                  <div className="flex items-center gap-2">
                    <Award size={15} className="text-sky-400" />
                    <span className="text-xs font-mono font-bold uppercase tracking-wider text-slate-300">
                      {lang === "EN" ? "THIS WEEK" : "TUSAALAHA TODOBADKAN"}
                    </span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-sm font-bold font-mono text-white">{fmtR(weeklyConsistency.netR)}</span>
                    <span className="text-xs px-2 py-0.5 rounded bg-[#102347] text-sky-300 font-mono border border-sky-500/20">
                      {weeklyConsistency.winRate}%
                    </span>
                  </div>
                </div>
              </div>
            )}

            {/* NEW TRADE FORM MODAL */}
            {showForm && (
              <div className="custom-card p-4 sm:p-5 rounded-2xl mb-6 border border-sky-500/30 shadow-2xl">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                  <h3 className="font-bold text-sm text-white flex items-center gap-2">
                    <Plus size={16} className="text-sky-400" /> 
                    {lang === "EN" ? "Add New Trade" : "Diiwaangeli Trade Cusub"}
                  </h3>
                  <button onClick={() => setShowForm(false)} className="text-slate-400 hover:text-white cursor-pointer"><X size={16} /></button>
                </div>

                {error && <div className="text-xs text-rose-400 bg-rose-950/40 p-2.5 rounded-lg mb-4 border border-rose-900/50">{error}</div>}

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                  <div>

                    {posts.map((p) => {
                      const isOwner = p.userId === user.uid;
                      const dateStr = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : "";

                      return (
                        <div key={p.id} className="custom-card rounded-xl p-4">
                          <div className="flex items-start justify-between mb-2">
                            <div className="flex items-center gap-2">
                              {p.userPhoto ? (
                                <img src={p.userPhoto} alt={p.userName} className="w-7 h-7 rounded-full object-cover border border-slate-700" />
                              ) : (
                                <div className="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold">
                                  {p.userName ? p.userName[0] : "U"}
                                </div>
                              )}
                              <div>
                                <div className="text-xs font-bold text-white leading-tight">{p.userName}</div>
                                <div className="text-[10px] text-slate-500 font-mono">{dateStr}</div>
                              </div>
                            </div>

                            {isOwner && (
                              <button
                                onClick={() => handleDeletePost(p.id)}
                                className="text-slate-500 hover:text-rose-400 p-1 cursor-pointer"
                                title="Tirtir qoraalkaaga"
                              >
                                <Trash2 size={13} />
                              </button>
                            )}
                          </div>

                          {p.text && (
                            <p className="text-xs leading-relaxed mb-3 text-slate-200 whitespace-pre-wrap">
                              {p.text}
                            </p>
                          )}

                          {p.image && (
                            <img
                              src={p.image}
                              alt="attachment"
                              onClick={() => setLightbox(p.image)}
                              className="rounded-lg w-full max-h-80 object-cover mb-3 border border-[#1c2c4c] cursor-zoom-in"
                            />
                          )}

                          {p.mediaUrl && (
                            <div className="mt-2">
                              {p.mediaType === "video" && (p.mediaUrl.includes("youtube.com") || p.mediaUrl.includes("youtu.be")) ? (
                                <div className="aspect-video w-full rounded-lg overflow-hidden border border-slate-800 mb-2">
                                  <iframe
                                    src={p.mediaUrl.replace("watch?v=", "embed/").replace("youtu.be/", "youtube.com/embed/")}
                                    title="Video"
                                    className="w-full h-full"
                                    allowFullScreen
                                  />
                                </div>
                              ) : (
                                <a
                                  href={p.mediaUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-mono bg-[#091122] border border-[#192744] text-sky-400 hover:text-sky-300"
                                >
                                  {p.mediaType === "pdf" ? <FileText size={13} /> : p.mediaType === "video" ? <Video size={13} /> : <ExternalLink size={13} />}
                                  <span className="truncate max-w-xs">{p.mediaUrl}</span>
                                </a>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

          </main>

          {/* LIGHTBOX FOR FULL VIEW SCREENSHOTS */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 flex items-center justify-center p-4 z-50 bg-black/90 backdrop-blur-sm cursor-zoom-out"
            >
              <img src={lightbox} alt="Full view" className="max-w-full max-h-[90vh] rounded-xl shadow-2xl" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
