      { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM" },

    // ================= LOGIN PAGE COMPONENT =================
    function LoginPage({ onSignIn, onGuestSignIn, onSignInWithGoogle, onDemoSignIn, error: externalError, lang, onToggleLang }) {
      const googleHandler = onSignInWithGoogle || onSignIn;
      const guestHandler = onDemoSignIn || onGuestSignIn;

      const [mode, setMode] = useState("signin");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);
      const [localError, setLocalError] = useState("");
      const [resetSuccess, setResetSuccess] = useState("");

      const t = {
        en: {
          brand: "Amiir Journal",
          tagline: "ICT Institutional Ledger",
          welcomeBack: "Welcome back",
          welcomeSub: "Sign in to access your trading journal",
          createAcc: "Create account",
          createSub: "Start tracking and journaling your trades",
          resetTitle: "Reset password",
          resetSub: "Enter your email to receive a password reset link",
          emailLabel: "Email address",
          emailPlaceholder: "name@example.com",
          passwordLabel: "Password",
          passwordPlaceholder: "Enter password",
          forgotPass: "Forgot password?",
          signInBtn: "Sign in",
          signUpBtn: "Create account",
          sendResetBtn: "Send reset link",
          backToSignIn: "Back to sign in",
          orContinue: "or continue with",
          googleBtn: "Google",
          guestBtn: "Explore as Guest (Fast Demo)",
          noAccount: "Don't have an account?",
          haveAccount: "Already have an account?",
          signUpLink: "Sign up",
          signInLink: "Sign in",
          resetSent: "Password reset link sent! Check your inbox.",
          invalidEmail: "Please enter a valid email address.",
          passLength: "Password should be at least 6 characters.",
        },
        so: {
          brand: "Amiir Journal",
          tagline: "Diiwaanka ICT ee Ganacsiga",
          welcomeBack: "Ku soo dhowow",
          welcomeSub: "Gali macluumaadkaaga si aad u gasho diiwaanka",
          createAcc: "Sameyso akoon",
          createSub: "Bilow diiwaangelinta iyo xisaabinta trades-kaaga",
          resetTitle: "Beddel furaha sirta",
          resetSub: "Gali email-kaaga si lagugu soo diro xiriiriyaha furaha",
          emailLabel: "Email-kaaga",
          emailPlaceholder: "magacaaga@email.com",
          passwordLabel: "Furaha sirta ah",
          passwordPlaceholder: "Gali furahaaga",
          forgotPass: "Ma ilowday furaha?",
          signInBtn: "Gal akoonka",
          signUpBtn: "Sameyso akoon",
          sendResetBtn: "Dir xiriiriyaha beddelka",
          backToSignIn: "Ku noqo galitaanka",
          orContinue: "ama ku gal",
          googleBtn: "Google",
          guestBtn: "Ku tijaabi Marti (Guest Demo)",
          noAccount: "Ma lihid akoon?",
          haveAccount: "Hore ma u lahayd akoon?",
          signUpLink: "Is diiwaangeli",
          signInLink: "Gal",
          resetSent: "Xiriiriyihii dib-u-dejinta waxaa loo diray email-kaaga!",
          invalidEmail: "Fadlan gali email sax ah.",
          passLength: "Furaha sirta ahi waa inuu ugu yaraan 6 xaraf ka koobnaadaa.",
        }
      }[lang || "en"];

      const handleEmailSubmit = async (e) => {
        e.preventDefault();
        setLocalError("");
        setResetSuccess("");

        const cleanEmail = email.trim();
        if (!cleanEmail || !cleanEmail.includes("@")) {
          setLocalError(t.invalidEmail);
          return;
        }

        if (mode === "reset") {
          setLoading(true);
          try {
            await sendPasswordResetEmail(auth, cleanEmail);
            setResetSuccess(t.resetSent);
          } catch (err) {
            setLocalError(err.message || "Failed to send reset link.");
          } finally {
            setLoading(false);
          }
          return;
        }

        if (!password || password.length < 6) {
          setLocalError(t.passLength);
          return;
        }

        setLoading(true);
        try {
          if (mode === "signin") {
            await signInWithEmailAndPassword(auth, cleanEmail, password);
          } else {
            await createUserWithEmailAndPassword(auth, cleanEmail, password);
          }
        } catch (err) {
          const code = err.code || "";
          if (code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password") {
            setLocalError(lang === "so" ? "Email-ka ama furaha sirta ah ma saxna." : "Invalid email or password.");
          } else if (code === "auth/email-already-in-use") {
            setLocalError(lang === "so" ? "Email-kan akoon hore ayaa loogu furtay. Fadlan gal." : "Email is already registered. Please sign in.");
          } else if (code === "auth/operation-not-allowed") {
            setLocalError(lang === "so" ? "Email/Password lama shidin Firebase. Fadlan Google ku gal ama Guest." : "Email/Password auth is disabled. Please continue with Google or Guest.");
          } else {
            setLocalError(err.message || "Authentication failed.");
          }
        } finally {
          setLoading(false);
        }
      };

                A

                <span className="text-[10px] text-slate-400 font-mono hidden sm:inline">
                  {t.tagline}
                </span>

            </div>

            <button
              type="button"
              onClick={onToggleLang}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/80 hover:bg-slate-800/80 hover:border-slate-700 text-xs font-mono font-medium text-slate-300 transition-colors cursor-pointer"
              title="Change language"
              aria-label={`Current language: ${(lang || "en").toUpperCase()}. Click to toggle.`}
            >
              <Globe size={13} className="text-sky-400" />
              <span>{(lang || "en").toUpperCase()}</span>
            </button>
          </header>

          {/* Central Auth Container */}
          <main className="w-full max-w-[420px] mx-auto my-auto py-6 z-10">
            <div className="rounded-2xl sm:rounded-3xl border border-white/[0.08] bg-[#060B18]/90 shadow-[0_20px_50px_-15px_rgba(0,0,0,0.7)] backdrop-blur-xl p-6 sm:p-8">
              
              {/* Form Header */}
              <div className="text-center mb-6">
                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-white">
                  {mode === "signin" && t.welcomeBack}
                  {mode === "signup" && t.createAcc}
                  {mode === "reset" && t.resetTitle}
                </h1>
                <p className="mt-1.5 text-xs sm:text-sm text-slate-400 font-normal leading-relaxed">
                  {mode === "signin" && t.welcomeSub}
                  {mode === "signup" && t.createSub}
                  {mode === "reset" && t.resetSub}
                </p>
              </div>

              {/* Feedback Messages */}
              {displayError && (
                <div 
                  role="alert"
                  className="mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/25 text-rose-300 text-xs flex items-start gap-2.5"

                  <AlertCircle size={16} className="text-rose-400 flex-shrink-0 mt-0.5" />
                  <span className="leading-snug">{displayError}</span>

              {resetSuccess && (
                <div 
                  role="status"
                  className="mb-5 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/25 text-emerald-300 text-xs flex items-start gap-2.5"
                >
                  <CheckCircle2 size={16} className="text-emerald-400 flex-shrink-0 mt-0.5" />
                  <span className="leading-snug">{resetSuccess}</span>
                </div>
              )}

              {/* Email / Password Form */}
              <form onSubmit={handleEmailSubmit} className="space-y-4">
                
                {/* Email Field */}
                <div>
                  <label htmlFor="auth-email-standalone" className="block text-xs font-medium text-slate-300 mb-1.5">
                    {t.emailLabel}
                  </label>
                  <div className="relative">
                    <Mail size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" />
                    <input
                      id="auth-email-standalone"
                      type="email"
                      required
                      autoComplete="email"
                      value={email}
                      onChange={(e) => { setEmail(e.target.value); setLocalError(""); }}
                      placeholder={t.emailPlaceholder}
                      className="w-full h-11 pl-10 pr-3.5 rounded-xl bg-slate-900/80 border border-slate-800 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/40 transition-all font-sans"
                    />
                  </div>
                </div>

                {/* Password Field (only in signin or signup mode) */}
                {mode !== "reset" && (
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label htmlFor="auth-password-standalone" className="block text-xs font-medium text-slate-300">
                        {t.passwordLabel}
                      </label>
                      {mode === "signin" && (
                        <button
                          type="button"
                          onClick={() => { setMode("reset"); setLocalError(""); }}
                          className="text-xs text-sky-400 hover:text-sky-300 transition-colors font-medium cursor-pointer"
                        >
                          {t.forgotPass}
                        </button>
                      )}
                    </div>
                    <div className="relative">
                      <Lock size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" />
                      <input
                        id="auth-password-standalone"
                        type={showPassword ? "text" : "password"}
                        required
                        autoComplete={mode === "signin" ? "current-password" : "new-password"}
                        value={password}
                        onChange={(e) => { setPassword(e.target.value); setLocalError(""); }}
                        placeholder={t.passwordPlaceholder}
                        className="w-full h-11 pl-10 pr-10 rounded-xl bg-slate-900/80 border border-slate-800 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/40 transition-all font-sans"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1 cursor-pointer transition-colors"
                        title={showPassword ? "Hide password" : "Show password"}
                        aria-label={showPassword ? "Hide password" : "Show password"}
                      >
                        {showPassword ? <EyeOff size={16} /> : <Eye size={16} />}
                      </button>
                    </div>
                  </div>
                )}

                {/* Primary Submit Button */}
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full h-11 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm transition-all duration-150 shadow-md shadow-sky-500/20 active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed mt-2"
                >

                    <>
                      <Loader2 size={16} className="animate-spin" />
                      <span>Processing...</span>
                    </>
                  ) : (
                    <>
                      <span>
                        {mode === "signin" && t.signInBtn}
                        {mode === "signup" && t.signUpBtn}
                        {mode === "reset" && t.sendResetBtn}
                      </span>
                      <ArrowRight size={15} />
                    </>
                  )}
                </button>
              </form>

              {/* Reset password mode: Back button */}
              {mode === "reset" ? (
                <div className="mt-5 text-center">
                  <button
                    type="button"
                    onClick={() => { setMode("signin"); setLocalError(""); setResetSuccess(""); }}
                    className="text-xs text-sky-400 hover:text-sky-300 font-medium transition-colors cursor-pointer"
                  >
                    ← {t.backToSignIn}
                  </button>
                </div>
              ) : (
                <>
                  {/* Subtle Divider */}
                  <div className="relative my-5 text-center">
                    <div className="absolute inset-0 flex items-center" aria-hidden="true">
                      <div className="w-full border-t border-slate-800/80" />
                    </div>
                    <span className="relative px-3 bg-[#060B18] text-[11px] text-slate-500 font-medium uppercase tracking-wider">
                      {t.orContinue}
                    </span>
                  </div>

                  {/* Secondary OAuth Buttons */}
                  <div className="space-y-2.5">
                    
                    {/* Google Sign In */}
                    {googleHandler && (
                      <button
                        type="button"
                        onClick={googleHandler}
                        className="w-full h-11 rounded-xl bg-slate-900/90 hover:bg-slate-800/90 border border-slate-800 hover:border-slate-700 text-slate-200 font-medium text-sm transition-all flex items-center justify-center gap-2.5 cursor-pointer active:scale-[0.99]"
                      >
                        <svg className="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                        </svg>
                        <span>{t.googleBtn}</span>
                      </button>
                    )}

                    {/* Guest / Demo Access */}
                    {guestHandler && (
                      <button
                        type="button"
                        onClick={guestHandler}
                        className="w-full h-10 rounded-xl bg-transparent hover:bg-slate-900/60 border border-dashed border-slate-800 hover:border-slate-700 text-slate-400 hover:text-slate-200 font-mono text-xs transition-all flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <Sparkles size={13} className="text-sky-400" />
                        <span>{t.guestBtn}</span>
                      </button>
                    )}
                  </div>

                  {/* Mode Toggle Footer (Sign in <-> Sign up) */}
                  <div className="mt-6 pt-4 border-t border-slate-800/80 text-center text-xs text-slate-400">
                    {mode === "signin" ? (
                      <span>
                        {t.noAccount}{" "}
                        <button
                          type="button"
                          onClick={() => { setMode("signup"); setLocalError(""); }}
                          className="text-sky-400 hover:text-sky-300 font-semibold cursor-pointer transition-colors ml-1"
                        >
                          {t.signUpLink}
                        </button>
                      </span>
                    ) : (
                      <span>
                        {t.haveAccount}{" "}
                        <button
                          type="button"
                          onClick={() => { setMode("signin"); setLocalError(""); }}
                          className="text-sky-400 hover:text-sky-300 font-semibold cursor-pointer transition-colors ml-1"
                        >
                          {t.signInLink}
                        </button>
                      </span>
                    )}
                  </div>
                </>
              )}

            </div>
          </main>

          {/* Subtle Footer with Verified Socials */}
          <footer className="w-full max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400 font-mono z-10 pt-2">
            <span>© {new Date().getFullYear()} Amiir Journal. All rights reserved.</span>
            
            <div className="flex items-center gap-4">
              <a
                href="https://instagram.com/amiir_baari"
                target="_blank"
                rel="noreferrer"
                className="flex items-center gap-1.5 hover:text-sky-400 transition-colors"
                title="Instagram: @amiir_baari"
              >
                <Instagram size={14} />
                <span>amiir_baari</span>
              </a>

              <span className="text-slate-800">•</span>

              <a
                href="https://x.com/AmiirBaari"
                target="_blank"
                rel="noreferrer"
                className="flex items-center gap-1.5 hover:text-sky-400 transition-colors"
                title="X / Twitter: @AmiirBaari"
              >
                <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24" aria-hidden="true">

      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [lang, setLang] = useState("en");
      const [tab, setTab] = useState("journal");
      const [authError, setAuthError] = useState("");

      // Data States
      const [trades, setTrades] = useState([]);
      const [accounts, setAccounts] = useState([{ id: "acc-1", name: "Main ICT Account", startingBalance: 10000, broker: "Apex" }]);
      const [notes, setNotes] = useState([]);
      const [chatMessages, setChatMessages] = useState([]);

      // UI States
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [form, setForm] = useState(EMPTY_FORM);
      const [searchQuery, setSearchQuery] = useState("");
      const [filterSession, setFilterSession] = useState("all");
      const [filterOutcome, setFilterOutcome] = useState("all");
      const [filterAccount, setFilterAccount] = useState("all");
      const [showFilters, setShowFilters] = useState(false);
      const [activeChatText, setActiveChatText] = useState("");

      // Calendar Navigation
      const [viewYear, setViewYear] = useState(new Date().getFullYear());
      const [viewMonth, setViewMonth] = useState(new Date().getMonth());

      // Lightbox
      const [lightbox, setLightbox] = useState(null);

      // Auth listener
      useEffect(() => {
        return onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthLoading(false);
        });
      }, []);

      // Realtime Firestore sync for trades & chat
      useEffect(() => {
        if (!user) return;
        
        // Trades listener
        const tradesCol = collection(db, "users", user.uid, "trades");
        const qTrades = query(tradesCol, orderBy("date", "desc"), limit(200));
        const unsubTrades = onSnapshot(qTrades, (snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setTrades(list);
        }, (err) => {
          console.warn("Firestore sync fallback to local", err);
          // Fallback to localStorage
          const local = localStorage.getItem("amiir_trades_" + user.uid);
          if (local) setTrades(JSON.parse(local));
        });

        // Chat listener
        const chatCol = collection(db, "community_messages");
        const qChat = query(chatCol, orderBy("createdAt", "desc"), limit(40));
        const unsubChat = onSnapshot(qChat, (snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setChatMessages(list.reverse());
        }, (err) => console.log("Chat error", err));

        return () => {
          unsubTrades();
          unsubChat();
        };
      }, [user]);

      // Save Trade
      const handleSaveTrade = async (e) => {
        e.preventDefault();
        if (!form.symbol || !form.date) return;

        const risk = parseFloat(form.risk) || 0;
        const rr = parseFloat(form.rrRatio) || 0;
        const rMultiple = form.outcome === "win" ? +(risk * rr).toFixed(2) : form.outcome === "loss" ? -risk : 0;
        const pnlDollar = form.pnlDollar !== "" ? parseFloat(form.pnlDollar) : (rMultiple * 100);

        const newTradeData = {
          ...form,
          rMultiple,
          pnlDollar,
          updatedAt: new Date().toISOString()
        };

        if (editingId) {
          try {
            await setDoc(doc(db, "users", user.uid, "trades", editingId), newTradeData, { merge: true });
          } catch {
            setTrades(prev => prev.map(t => t.id === editingId ? { ...t, ...newTradeData } : t));
          }
        } else {
          try {
            const docRef = await addDoc(collection(db, "users", user.uid, "trades"), {
              ...newTradeData,
              createdAt: new Date().toISOString()
            });
          } catch {
            const fakeId = "trade-" + Date.now();
            setTrades(prev => [{ id: fakeId, ...newTradeData }, ...prev]);
          }
        }

        setShowForm(false);
        setEditingId(null);
        setForm(EMPTY_FORM);
      };

      // Delete Trade
      const handleDeleteTrade = async (id) => {
        if (!confirm("Ma hubtaa inaad tirtirto trade-kan?")) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "trades", id));
        } catch {
          setTrades(prev => prev.filter(t => t.id !== id));
        }
      };

      // Image upload
      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setForm(prev => ({ ...prev, images: [...prev.images, reader.result] }));
        };
        reader.readAsDataURL(file);
      };

      // Send Chat Message
      const handleSendChat = async (e) => {
        e.preventDefault();
        if (!activeChatText.trim()) return;
        const msg = {
          text: activeChatText.trim(),
          userName: user.displayName || "Trader",
          userEmail: user.email,
          createdAt: new Date().toISOString()
        };
        try {
          await addDoc(collection(db, "community_messages"), msg);
        } catch {
          setChatMessages(prev => [...prev, { id: "m-" + Date.now(), ...msg }]);
        }
        setActiveChatText("");
      };

      // Filtered Trades
      const filteredTrades = useMemo(() => {
        return trades.filter(tr => {
          if (filterSession !== "all" && tr.session !== filterSession) return false;
          if (filterOutcome !== "all" && tr.outcome !== filterOutcome) return false;
          if (searchQuery && !tr.symbol.toLowerCase().includes(searchQuery.toLowerCase()) && !tr.notes?.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          return true;
        });
      }, [trades, filterSession, filterOutcome, searchQuery]);

      // Metrics
      const stats = useMemo(() => {
        const total = filteredTrades.length;
        const wins = filteredTrades.filter(t => t.outcome === "win").length;
        const losses = filteredTrades.filter(t => t.outcome === "loss").length;
        const bes = filteredTrades.filter(t => t.outcome === "be").length;
        const winRate = total ? Math.round((wins / total) * 100) : 0;
        const netR = filteredTrades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const netDollar = filteredTrades.reduce((acc, t) => acc + (t.pnlDollar || 0), 0);
        return { total, wins, losses, bes, winRate, netR: +netR.toFixed(1), netDollar: Math.round(netDollar) };
      }, [filteredTrades]);

      // Calendar Matrix
      const calendarData = useMemo(() => {
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
        const days = [];

        // Pre-fill empty
        for (let i = 0; i < firstDay; i++) days.push(null);

        // Days
        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const dayTrades = trades.filter(t => t.date === dateStr);
          const dayNetR = dayTrades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
          const dayNetDollar = dayTrades.reduce((acc, t) => acc + (t.pnlDollar || 0), 0);
          days.push({
            day: d,
            dateStr,
            tradesCount: dayTrades.length,
            netR: +dayNetR.toFixed(1),
            netDollar: Math.round(dayNetDollar)
          });
        }
        return days;
      }, [trades, viewYear, viewMonth]);

      if (authLoading) {
        return (
          <div className="min-h-screen bg-[#030712] flex items-center justify-center font-mono text-sky-400">
            <div className="animate-spin w-8 h-8 border-2 border-sky-400 border-t-transparent rounded-full mr-3" />
            <span>Loading Amiir Ledger...</span>
          </div>
        );
      }

      if (!user) {
        return (
          <LoginPage
            onSignIn={() => signInWithPopup(auth, provider).catch(err => setAuthError(err.message))}
            onGuestSignIn={() => setUser({ uid: "guest-trader", displayName: "Amiir Guest", email: "guest@amiir.com" })}
            error={authError}
            lang={lang}
            onToggleLang={() => setLang(lang === "en" ? "so" : "en")}
          />
        );
      }

      return (
        <div className="min-h-screen bg-[#030712] text-slate-200 selection:bg-sky-500/20 selection:text-sky-200 flex flex-col justify-between">
          
          {/* HEADER NAVIGATION */}
          <header className="border-b border-slate-800/80 bg-[#060B18]/90 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
              
              {/* Brand */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-slate-950 font-black font-mono shadow-md shadow-sky-500/20">
                  A
                </div>
                <div>
                  <h1 className="font-extrabold text-sm sm:text-base tracking-tight text-white font-mono leading-none">
                    Amiir Journal
                  </h1>
                  <span className="text-[10px] font-mono text-sky-400 uppercase tracking-wider block mt-1">
                    ICT PURGE LEDGER
                  </span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center gap-1 sm:gap-2 bg-slate-900/90 p-1 rounded-2xl border border-slate-800 text-xs font-mono">
                <button
                  onClick={() => setTab("journal")}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all ${tab === "journal" ? "bg-sky-500 text-slate-950 shadow-md" : "text-slate-400 hover:text-white"}`}
                >
                  Journal
                </button>
                <button
                  onClick={() => setTab("calendar")}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all ${tab === "calendar" ? "bg-sky-500 text-slate-950 shadow-md" : "text-slate-400 hover:text-white"}`}
                >
                  Calendar
                </button>
                <button
                  onClick={() => setTab("accounts")}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all ${tab === "accounts" ? "bg-sky-500 text-slate-950 shadow-md" : "text-slate-400 hover:text-white"}`}
                >
                  Accounts
                </button>
                <button
                  onClick={() => setTab("community")}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all ${tab === "community" ? "bg-sky-500 text-slate-950 shadow-md" : "text-slate-400 hover:text-white"}`}
                >
                  Community
                </button>
              </div>

              {/* User Profile & Actions */}
              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => { setShowForm(true); setEditingId(null); setForm(EMPTY_FORM); }}
                  className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-400 hover:bg-sky-300 text-slate-950 font-mono font-bold text-xs shadow-lg shadow-sky-500/20 transition-all cursor-pointer active:scale-95"
                >
                  <Plus size={14} className="stroke-[3]" />
                  <span>New Trade</span>
                </button>

                {/* Prominent, Mobile-Friendly Logout Button */}
                <button
                  onClick={() => { signOut(auth); setUser(null); }}
                  title="Log Out"
                  className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs font-mono font-medium transition-all cursor-pointer active:scale-95 flex-shrink-0"
                >
                  <LogOut size={13} className="text-rose-400" />
                  <span className="font-semibold">Log Out</span>
                </button>

                <div className="hidden md:flex items-center gap-2 pl-2 border-l border-slate-800">
                  <div className="text-right">
                    <div className="text-xs font-mono font-bold text-white leading-none">{user.displayName || "Trader"}</div>
                    <div className="text-[10px] font-mono text-emerald-400 mt-1">● Online</div>
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex-1">

            {/* TAB 1: JOURNAL */}
            {tab === "journal" && (
              <div className="space-y-6">
                
                {/* METRICS ROW */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 font-mono">
                  <div className="p-4 rounded-2xl bg-[#080E1E] border border-slate-800">
                    <div className="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Total Trades</div>
                    <div className="text-2xl sm:text-3xl font-black text-white mt-1">{stats.total}</div>
                    <div className="text-[10px] text-slate-400 mt-1">{stats.wins}W • {stats.losses}L • {stats.bes}BE</div>
                  </div>

                  <div className="p-4 rounded-2xl bg-[#080E1E] border border-slate-800">
                    <div className="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Win Rate</div>
                    <div className={`text-2xl sm:text-3xl font-black mt-1 ${stats.winRate >= 50 ? "text-emerald-400" : "text-amber-400"}`}>
                      {stats.winRate}%
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1">Accuracy</div>
                  </div>

                  <div className="p-4 rounded-2xl bg-[#080E1E] border border-slate-800">
                    <div className="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Net Return (R)</div>
                    <div className={`text-2xl sm:text-3xl font-black mt-1 ${stats.netR >= 0 ? "text-sky-400" : "text-rose-400"}`}>
                      {stats.netR > 0 ? `+${stats.netR}R` : `${stats.netR}R`}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1">R Multiple</div>
                  </div>

                  <div className="p-4 rounded-2xl bg-[#080E1E] border border-slate-800">
                    <div className="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Net Profit ($)</div>
                    <div className={`text-2xl sm:text-3xl font-black mt-1 ${stats.netDollar >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                      {stats.netDollar >= 0 ? `+$${stats.netDollar.toLocaleString()}` : `-$${Math.abs(stats.netDollar).toLocaleString()}`}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1">P&L Realized</div>
                  </div>
                </div>

                {/* FILTERS & ACTION BAR WITH TOGGLEABLE FILTER ICON */}
                <div className="bg-[#080E1E] p-3 rounded-2xl border border-slate-800 font-mono text-xs space-y-3">
                  <div className="flex items-center gap-2">
                    <div className="relative flex-1">
                      <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search symbol..."
                        className="w-full pl-9 pr-8 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 text-xs"
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white">
                          <X size={12} />
                        </button>
                      )}
                    </div>

                    {/* Filter Icon Button */}
                    <button
                      onClick={() => setShowFilters(prev => !prev)}
                      className={`px-3 py-1.5 rounded-xl border flex items-center gap-1.5 transition-all cursor-pointer flex-shrink-0 active:scale-95 ${
                        showFilters || (filterSession !== "all" || filterOutcome !== "all")
                          ? "bg-sky-500/20 border-sky-400 text-sky-300 font-bold"
                          : "bg-slate-900 border-slate-800 text-slate-400 hover:text-white"
                      }`}
                      title="Filter trades"
                    >
                      <SlidersHorizontal size={14} className={showFilters ? "text-sky-400" : "text-slate-400"} />
                      <span className="hidden xs:inline font-semibold">Filters</span>
                      {(filterSession !== "all" || filterOutcome !== "all") && (
                        <span className="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
                      )}
                    </button>

                    <button
                      onClick={() => { setShowForm(true); setEditingId(null); setForm(EMPTY_FORM); }}
                      className="sm:hidden flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-400 text-slate-950 font-bold text-xs"
                    >
                      <Plus size={14} />
                      <span>New</span>
                    </button>
                  </div>

                  {/* Filter options ONLY visible when filter button is open */}
                  {showFilters && (
                    <div className="pt-2.5 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2 flex-wrap">
                        <select
                          value={filterSession}
                          onChange={(e) => setFilterSession(e.target.value)}
                          className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 focus:outline-none focus:border-sky-500 text-xs cursor-pointer"
                        >
                          <option value="all">Sessions: All</option>
                          <option value="asian">🇯🇵 Asian</option>
                          <option value="london">🇬🇧 London</option>
                          <option value="newyork">🇺🇸 New York</option>
                        </select>

                        <select
                          value={filterOutcome}
                          onChange={(e) => setFilterOutcome(e.target.value)}
                          className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 focus:outline-none focus:border-sky-500 text-xs cursor-pointer"
                        >
                          <option value="all">Outcome: All</option>
                          <option value="win">Wins</option>
                          <option value="loss">Losses</option>
                          <option value="be">Break Even</option>
                        </select>
                      </div>

                      {(filterSession !== "all" || filterOutcome !== "all") && (
                        <button
                          onClick={() => { setFilterSession("all"); setFilterOutcome("all"); }}
                          className="text-slate-400 hover:text-rose-400 flex items-center gap-1 text-xs cursor-pointer"
                        >
                          <RotateCcw size={12} />
                          <span>Reset</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* TRADES LIST */}
                {filteredTrades.length === 0 ? (
                  <div className="text-center py-16 bg-[#080E1E] rounded-3xl border border-slate-800 font-mono">
                    <div className="w-12 h-12 rounded-2xl bg-sky-500/10 text-sky-400 mx-auto flex items-center justify-center mb-3">
                      <LayoutGrid size={24} />
                    </div>
                    <h3 className="text-base font-bold text-white">No trades found</h3>
                    <p className="text-xs text-slate-400 mt-1">Record your first ICT execution to build your edge.</p>
                    <button
                      onClick={() => { setShowForm(true); setForm(EMPTY_FORM); }}
                      className="mt-4 px-4 py-2 rounded-xl bg-sky-400 text-slate-950 font-bold text-xs inline-flex items-center gap-2"
                    >
                      <Plus size={14} /> Add First Trade
                    </button>
                  </div>
                ) : (
                  <div className="space-y-3 font-mono">
                    {filteredTrades.map((tr) => (
                      <div
                        key={tr.id}
                        className="p-4 rounded-2xl bg-[#080E1E] border border-slate-800 hover:border-sky-500/30 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm ${tr.outcome === "win" ? "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30" : tr.outcome === "loss" ? "bg-rose-500/15 text-rose-400 border border-rose-500/30" : "bg-slate-800 text-slate-400 border border-slate-700"}`}>
                            {tr.outcome === "win" ? <TrendingUp size={20} /> : tr.outcome === "loss" ? <TrendingDown size={20} /> : "BE"}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-extrabold text-base text-white">{tr.symbol}</span>
                              <span className="px-2 py-0.5 rounded-md bg-slate-900 border border-slate-800 text-[10px] text-sky-400 uppercase">{tr.session} {tr.purgeTime}</span>
                              <span className={`px-2 py-0.5 rounded-md text-[10px] uppercase font-bold ${tr.direction === "buy" ? "text-emerald-400 bg-emerald-950/40" : "text-rose-400 bg-rose-950/40"}`}>
                                {tr.direction}
                              </span>
                            </div>
                            <div className="text-xs text-slate-500 mt-1 flex items-center gap-2">
                              <span>{tr.date}</span>
                              <span>•</span>
                              <span>Risk: {tr.risk}%</span>
                              <span>•</span>
                              <span>RR: 1:{tr.rrRatio}</span>
                              {tr.notes && (
                                <>
                                  <span>•</span>
                                  <span className="text-slate-400 truncate max-w-xs">{tr.notes}</span>
                                </>
                              )}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center justify-between sm:justify-end gap-4 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800/80">
                          <div className="text-right">
                            <div className={`text-base font-black ${tr.rMultiple >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                              {tr.rMultiple >= 0 ? `+${tr.rMultiple}R` : `${tr.rMultiple}R`}
                            </div>
                            <div className="text-xs text-slate-500">
                              {tr.pnlDollar >= 0 ? `+$${tr.pnlDollar}` : `-$${Math.abs(tr.pnlDollar)}`}
                            </div>
                          </div>

                          {tr.images && tr.images.length > 0 && (
                            <button
                              onClick={() => setLightbox(tr.images[0])}
                              className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-sky-400 hover:text-sky-300"
                              title="View Chart"
                            >
                              <ImageIcon size={15} />
                            </button>
                          )}

                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => { setEditingId(tr.id); setForm(tr); setShowForm(true); }}
                              className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-sky-400"
                              title="Edit"
                            >
                              <Edit3 size={14} />
                            </button>
                            <button
                              onClick={() => handleDeleteTrade(tr.id)}
                              className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400"
                              title="Delete"
                            >
                              <Trash2 size={14} />
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: CALENDAR */}
            {tab === "calendar" && (
              <div className="space-y-6 font-mono">
                <div className="flex items-center justify-between bg-[#080E1E] p-4 rounded-2xl border border-slate-800">
                  <h2 className="text-lg font-bold text-white">
                    {MONTH_NAMES[viewMonth]} {viewYear}
                  </h2>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => {
                        if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
                        else setViewMonth(m => m - 1);
                      }}
                      className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white"
                    >
                      <ChevronLeft size={16} />
                    </button>
                    <button
                      onClick={() => { setViewMonth(new Date().getMonth()); setViewYear(new Date().getFullYear()); }}
                      className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-sky-400 font-bold"
                    >
                      Today
                    </button>
                    <button
                      onClick={() => {
                        if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
                        else setViewMonth(m => m + 1);
                      }}
                      className="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white"
                    >
                      <ChevronRight size={16} />
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-2">
                  {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(day => (
                    <div key={day} className="text-center text-xs text-slate-500 font-bold py-1 uppercase">{day}</div>
                  ))}

                  {calendarData.map((d, idx) => (
                    <div
                      key={idx}
                      className={`min-h-[90px] p-2 rounded-xl border flex flex-col justify-between transition-all ${
                        !d ? "bg-transparent border-transparent" :
                        d.tradesCount > 0 && d.netR > 0 ? "bg-emerald-950/20 border-emerald-500/40 hover:border-emerald-400" :
                        d.tradesCount > 0 && d.netR < 0 ? "bg-rose-950/20 border-rose-500/40 hover:border-rose-400" :
                        "bg-[#080E1E] border-slate-800/80 hover:border-slate-700"
                      }`}
                    >
                      {d && (
                        <>
                          <div className="flex items-center justify-between text-xs text-slate-400">
                            <span className="font-bold">{d.day}</span>
                            {d.tradesCount > 0 && (
                              <span className="text-[10px] px-1.5 py-0.2 rounded bg-slate-900/80 text-slate-400">
                                {d.tradesCount}T
                              </span>
                            )}
                          </div>
                          {d.tradesCount > 0 ? (
                            <div className="mt-2 text-right">
                              <div className={`text-xs sm:text-sm font-black ${d.netR > 0 ? "text-emerald-400" : d.netR < 0 ? "text-rose-400" : "text-slate-300"}`}>
                                {d.netR > 0 ? `+${d.netR}R` : `${d.netR}R`}
                              </div>
                              <div className="text-[10px] text-slate-500">
                                {d.netDollar >= 0 ? `+$${d.netDollar}` : `-$${Math.abs(d.netDollar)}`}
                              </div>
                            </div>
                          ) : (
                            <div className="text-[10px] text-slate-700 text-center my-auto">-</div>
                          )}
                        </>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: ACCOUNTS */}
            {tab === "accounts" && (
              <div className="space-y-6 font-mono">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold text-white">Trading Accounts</h2>
                  <button
                    onClick={() => {
                      const name = prompt("Gali magaca Akoonka (e.g., TopStep 50k, Apex, Funded):");
                      if (name) {
                        const bal = parseFloat(prompt("Gali starting balance ($):", "50000")) || 50000;
                        setAccounts(prev => [...prev, { id: "acc-" + Date.now(), name, startingBalance: bal, broker: "Prop Firm" }]);
                      }
                    }}
                    className="px-3 py-1.5 rounded-xl bg-sky-400 text-slate-950 font-bold text-xs flex items-center gap-1.5"
                  >
                    <Plus size={14} /> Add Account
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {accounts.map(acc => {
                    const accTrades = trades.filter(t => t.accountName === acc.name);
                    const pnl = accTrades.reduce((sum, t) => sum + (t.pnlDollar || 0), 0);
                    const live = acc.startingBalance + pnl;
                    return (
                      <div key={acc.id} className="p-5 rounded-2xl bg-[#080E1E] border border-slate-800 space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-white text-base">{acc.name}</span>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">{acc.broker}</span>
                        </div>
                        <div className="pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
                          <span className="text-slate-500">Starting:</span>
                          <span className="text-slate-300 font-bold">${acc.startingBalance.toLocaleString()}</span>
                        </div>
                        <div className="flex items-center justify-between text-xs">
                          <span className="text-slate-500">Net P&L:</span>
                          <span className={`font-bold ${pnl >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                            {pnl >= 0 ? `+$${pnl.toLocaleString()}` : `-$${Math.abs(pnl).toLocaleString()}`}
                          </span>
                        </div>
                        <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                          <span className="text-xs text-slate-400">Live Balance:</span>
                          <span className="text-base font-black text-white">${Math.round(live).toLocaleString()}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: COMMUNITY CHAT */}
            {tab === "community" && (
              <div className="max-w-3xl mx-auto h-[600px] flex flex-col rounded-3xl bg-[#080E1E] border border-slate-800 overflow-hidden font-mono">
                <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                    <span className="text-xs font-bold text-white">ICT Live Community Feed</span>
                  </div>
                  <span className="text-[10px] text-slate-500">Realtime Sync</span>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                  {chatMessages.length === 0 ? (
                    <div className="text-center text-xs text-slate-500 py-20">Be the first to post a trading idea or question!</div>
                  ) : (
                    chatMessages.map(m => (
                      <div key={m.id} className="p-3 rounded-2xl bg-slate-900/80 border border-slate-800/80 text-xs">
                        <div className="flex items-center justify-between text-[10px] text-slate-500 mb-1">
                          <span className="font-bold text-sky-400">{m.userName || "Trader"}</span>
                          <span>{m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ""}</span>
                        </div>
                        <p className="text-slate-200">{m.text}</p>
                      </div>
                    ))
                  )}
                </div>

                <form onSubmit={handleSendChat} className="p-3 border-t border-slate-800 bg-[#060C1B] flex items-center gap-2">
                  <input
                    type="text"
                    value={activeChatText}
                    onChange={(e) => setActiveChatText(e.target.value)}
                    placeholder="Share market idea or ask a question..."
                    className="flex-1 px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500"
                  />
                  <button type="submit" className="p-2 rounded-xl bg-sky-400 text-slate-950 font-bold hover:bg-sky-300">
                    <Send size={15} />
                  </button>
                </form>
              </div>
            )}

          </main>

          {/* NEW / EDIT TRADE MODAL */}
          {showForm && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto font-mono">
              <div className="w-full max-w-xl bg-[#080E1E] rounded-3xl border border-sky-500/25 p-5 sm:p-6 shadow-2xl relative my-auto max-h-[92vh] overflow-y-auto">
                <button
                  onClick={() => setShowForm(false)}
                  className="absolute right-4 top-4 p-1.5 rounded-full bg-slate-900 text-slate-400 hover:text-white"
                >
                  <X size={16} />
                </button>

                <h3 className="text-base font-bold text-white mb-4 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-sky-400" />
                  <span>{editingId ? "Update Trade Execution" : "Log New ICT Trade"}</span>
                </h3>

                <form onSubmit={handleSaveTrade} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Symbol</label>
                      <input
                        type="text"
                        required
                        value={form.symbol}
                        onChange={(e) => setForm({ ...form, symbol: e.target.value.toUpperCase() })}
                        placeholder="NQ, ES, EURUSD, XAUUSD"
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Date</label>
                      <input
                        type="date"
                        required
                        value={form.date}
                        onChange={(e) => setForm({ ...form, date: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Session</label>
                      <select
                        value={form.session}
                        onChange={(e) => setForm({ ...form, session: e.target.value, purgeTime: PURGE_TIMES[e.target.value]?.[0] || "" })}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      >
                        <option value="london">London (2AM - 3AM)</option>
                        <option value="newyork">New York (8AM - 9AM)</option>
                        <option value="asian">Asian (8PM - 9PM)</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Purge Time</label>
                      <select
                        value={form.purgeTime}
                        onChange={(e) => setForm({ ...form, purgeTime: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      >
                        {(PURGE_TIMES[form.session] || []).map(p => (
                          <option key={p} value={p}>{p}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Direction</label>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={() => setForm({ ...form, direction: "buy" })}
                          className={`py-2 rounded-xl font-bold ${form.direction === "buy" ? "bg-emerald-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"}`}
                        >
                          Buy / Long
                        </button>
                        <button
                          type="button"
                          onClick={() => setForm({ ...form, direction: "sell" })}
                          className={`py-2 rounded-xl font-bold ${form.direction === "sell" ? "bg-rose-500 text-white" : "bg-slate-900 text-slate-400 border border-slate-800"}`}
                        >
                          Sell / Short
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Outcome</label>
                      <div className="grid grid-cols-3 gap-1.5">
                        <button
                          type="button"
                          onClick={() => setForm({ ...form, outcome: "win" })}
                          className={`py-2 rounded-xl font-bold ${form.outcome === "win" ? "bg-emerald-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"}`}
                        >
                          Win
                        </button>
                        <button
                          type="button"
                          onClick={() => setForm({ ...form, outcome: "loss" })}
                          className={`py-2 rounded-xl font-bold ${form.outcome === "loss" ? "bg-rose-500 text-white" : "bg-slate-900 text-slate-400 border border-slate-800"}`}
                        >
                          Loss
                        </button>
                        <button
                          type="button"
                          onClick={() => setForm({ ...form, outcome: "be" })}
                          className={`py-2 rounded-xl font-bold ${form.outcome === "be" ? "bg-slate-700 text-white" : "bg-slate-900 text-slate-400 border border-slate-800"}`}
                        >
                          BE
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Risk %</label>
                      <input
                        type="number"
                        step="0.1"
                        value={form.risk}
                        onChange={(e) => setForm({ ...form, risk: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">R:R Ratio</label>
                      <input
                        type="number"
                        step="0.1"
                        value={form.rrRatio}
                        onChange={(e) => setForm({ ...form, rrRatio: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">P&L Amount ($)</label>
                      <input
                        type="number"
                        value={form.pnlDollar}
                        onChange={(e) => setForm({ ...form, pnlDollar: e.target.value })}
                        placeholder="+300 / -100"
                        className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  {/* Checklist items */}
                  <div>
                    <label className="text-slate-400 block mb-1">ICT Confluences</label>
                    <div className="flex flex-wrap gap-2">
                      {DEFAULT_CHECKLIST.map(item => {
                        const checked = form.checklist?.includes(item);
                        return (
                          <button
                            type="button"
                            key={item}
                            onClick={() => {
                              const cur = form.checklist || [];
                              setForm({
                                ...form,
                                checklist: checked ? cur.filter(i => i !== item) : [...cur, item]
                              });
                            }}
                            className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-colors ${checked ? "bg-sky-500/20 text-sky-300 border border-sky-500/40" : "bg-slate-900 text-slate-500 border border-slate-800"}`}
                          >
                            {checked ? "✓ " : "+ "}{item}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Image upload */}
                  <div>
                    <label className="text-slate-400 block mb-1">Chart Screenshot</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleImageUpload}
                      className="w-full text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Trade Notes / Thesis</label>
                    <textarea
                      rows={2}
                      value={form.notes}
                      onChange={(e) => setForm({ ...form, notes: e.target.value })}
                      placeholder="Why did you enter? Did you follow your model?"
                      className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowForm(false)}
                      className="px-4 py-2 rounded-xl bg-slate-900 text-slate-300 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-sky-400 text-slate-950 font-bold hover:bg-sky-300 shadow-lg shadow-sky-500/20"
                    >
                      {editingId ? "Save Changes" : "Record Trade"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* LIGHTBOX MODAL */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
            >
              <img src={lightbox} alt="Screenshot" className="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl border border-slate-700" />
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-800/60 bg-[#040813] py-4 px-4 text-center text-xs font-mono text-slate-500 space-y-2">
            <div>Amiir Journal • ICT Institutional Model • Discipline Over Emotion</div>
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={() => { signOut(auth); setUser(null); }}
                className="text-rose-400 hover:text-rose-300 flex items-center gap-1.5 px-3 py-1 rounded-xl bg-rose-500/10 border border-rose-500/20 text-[11px] cursor-pointer transition-colors"
              >
                <LogOut size={12} />
                <span>Log Out</span>
              </button>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AmiirTradingJournal />);
  </script>
</body>
</html>
