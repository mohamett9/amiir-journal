    function resizeImage(dataUrl, maxWidth = 800) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function App() {

      // Auth Listener & Log User Activity

      const handleMultipleImages = async (e) => {

            return new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = async () => {
                const resized = await resizeImage(reader.result);
                resolve(resized);
              };
              reader.readAsDataURL(file);
            });
          });
          const newImgs = await Promise.all(promises);
          setForm((prev) => ({
            ...prev,
            images: [...(prev.images || []), ...newImgs]
          }));
        } catch (err) {
          setError("Image upload failed.");
        }
      };

      // Calculate Dynamic Account Balances (Adjusts based on recorded trades)
      const accountsWithLiveBalance = useMemo(() => {
        return accounts.map((acc) => {
          const accTrades = trades.filter((tr) => tr.accountName === acc.name);
          const totalDollarPnL = accTrades.reduce((sum, tr) => sum + (tr.dollarAmount !== undefined ? tr.dollarAmount : (tr.rMultiple * 100)), 0);
          const currentBalance = (acc.startingBalance || 100000) + totalDollarPnL;
          const netR = accTrades.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0);
          return {
            ...acc,
            totalDollarPnL,
            currentBalance,
            netR,
            tradesCount: accTrades.length
          };
        });
      }, [accounts, trades]);

      // Overall Stats (Both R% and Dollars)
      const stats = useMemo(() => {
        const total = filteredTrades.length;
        const wins = filteredTrades.filter((tr) => tr.outcome === "win").length;
        const losses = filteredTrades.filter((tr) => tr.outcome === "loss").length;
        const netR = filteredTrades.reduce((acc, tr) => acc + (tr.rMultiple || 0), 0);
        const netDollars = filteredTrades.reduce((acc, tr) => acc + (tr.dollarAmount !== undefined ? tr.dollarAmount : (tr.rMultiple * 100)), 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;

        const sessionsStats = {};
        ["asian", "london", "newyork"].forEach((s) => {
          const list = filteredTrades.filter((tr) => tr.session === s);
          const w = list.filter((tr) => tr.outcome === "win").length;
          const r = list.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0);
          const d = list.reduce((sum, tr) => sum + (tr.dollarAmount !== undefined ? tr.dollarAmount : (tr.rMultiple * 100)), 0);
          sessionsStats[s] = { count: list.length, winRate: list.length ? Math.round((w / list.length) * 100) : 0, netR: r, netDollars: d };

        const purgeStats = {};
        Object.values(PURGE_TIMES).flat().forEach((pt) => {
          const list = filteredTrades.filter((tr) => tr.purgeTime === pt);
          const w = list.filter((tr) => tr.outcome === "win").length;
          const r = list.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0);
          const d = list.reduce((sum, tr) => sum + (tr.dollarAmount !== undefined ? tr.dollarAmount : (tr.rMultiple * 100)), 0);
          purgeStats[pt] = { count: list.length, winRate: list.length ? Math.round((w / list.length) * 100) : 0, netR: r, netDollars: d };
        });

        return { total, wins, losses, netR, netDollars, winRate, sessionsStats, purgeStats };

      const weeklyConsistency = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        const day = startOfWeek.getDay();
        const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);
        const mondayStr = startOfWeek.toISOString().slice(0, 10);

        const thisWeekTrades = trades.filter((tr) => tr.date >= mondayStr);
        const count = thisWeekTrades.length;
        const wins = thisWeekTrades.filter((tr) => tr.outcome === "win").length;
        const netR = thisWeekTrades.reduce((acc, tr) => acc + (tr.rMultiple || 0), 0);
        const netDollars = thisWeekTrades.reduce((acc, tr) => acc + (tr.dollarAmount !== undefined ? tr.dollarAmount : (tr.rMultiple * 100)), 0);
        const winRate = count ? Math.round((wins / count) * 100) : 0;
        return { count, wins, netR, netDollars, winRate };
      }, [trades]);

        const map = {};

          map[tr.date].netR += tr.rMultiple || 0;
          map[tr.date].netDollars += (tr.dollarAmount !== undefined ? tr.dollarAmount : (tr.rMultiple * 100));

        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          cells.push({ day: d, key, data: dayMap[key] });
        }
        return cells;
      }, [viewYear, viewMonth, dayMap]);

      const fmtR = (n) => (n > 0 ? "+" : "") + n.toFixed(2) + "%";

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#06090e]">

      // ================= LOGIN PAGE =================
      if (!user) {
        return (
          <div className="min-h-screen flex flex-col justify-between items-center px-4 bg-[#06090e] relative py-12">
            <div className="absolute top-1/3 left-1/2 -translate-x-1/2 w-80 h-80 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="my-auto w-full max-w-sm glass-card p-8 rounded-3xl shadow-2xl relative z-10 border border-slate-800 text-center">
              {/* Photo */}
              <div className="relative w-24 h-24 mx-auto mb-6">
                <div className="absolute -inset-1 bg-sky-400/20 rounded-full blur-sm"></div>
                <img
                  src="profile.jpg"
                  alt="Amiir"

                    <span className="font-bold text-base font-mono text-white">{detailTrade.symbol}</span>
                    <span className={`text-[10px] uppercase font-mono px-2 py-0.5 rounded font-bold border ${
                      detailTrade.direction === "buy" ? "bg-sky-500/20 text-sky-300 border-sky-400/40" : "bg-rose-500/20 text-rose-300 border-rose-400/40"
                    }`}>
                      {detailTrade.direction}
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">
                      {detailTrade.accountName}
                    </span>
                  </div>
                  <button onClick={() => setDetailTrade(null)} className="text-slate-400 hover:text-white"><X size={16} /></button>
                </div>

                {/* Key Metrics Grid */}
                <div className="grid grid-cols-3 gap-2.5 mb-4 text-xs font-mono">
                  <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px] uppercase">Outcome</div>
                    <div className={`font-bold uppercase mt-0.5 ${detailTrade.outcome === "win" ? "text-emerald-400" : "text-rose-400"}`}>
                      {detailTrade.outcome} ({fmtR(detailTrade.rMultiple)})
                    </div>
                  </div>
                  <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px] uppercase">P&L ($)</div>
                    <div className={`font-bold mt-0.5 ${detailTrade.rMultiple >= 0 ? "text-emerald-400" : "text-rose-400"}`}>
                      {fmtMoney(detailTrade.dollarAmount !== undefined ? detailTrade.dollarAmount : (detailTrade.rMultiple * 100))}
                    </div>
                  </div>
                  <div className="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px] uppercase">Risk / R:R</div>
                    <div className="font-bold text-white mt-0.5">{detailTrade.risk}% (1:{detailTrade.rrRatio})</div>
                  </div>
                </div>

                <div className="text-xs text-slate-400 font-mono mb-4">
                  Execution: <strong>{detailTrade.session?.toUpperCase()}</strong> · Purge: <strong>{detailTrade.purgeTime}</strong> · Date: {detailTrade.date}
                </div>

                {/* Checklist Confluences */}
                {detailTrade.checklist?.length > 0 && (
                  <div className="mb-4">
                    <div className="text-[10px] text-slate-500 uppercase font-mono mb-1.5">Confluences Matched:</div>
                    <div className="flex flex-wrap gap-1.5">
                      {detailTrade.checklist.map((c) => (
                        <span key={c} className="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">
                          ✓ {c}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {/* Notes */}
                {detailTrade.notes && (
                  <div className="mb-4 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                    <div className="text-[10px] text-slate-500 uppercase font-mono mb-1">Notes:</div>
                    <p className="text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">{detailTrade.notes}</p>
                  </div>
                )}

                {/* Images */}
                {(detailTrade.images?.length > 0 || detailTrade.image) && (
                  <div>
                    <div className="text-[10px] text-slate-500 uppercase font-mono mb-2">Execution Screenshots (Click to zoom):</div>
                    <div className="flex gap-2 flex-wrap">
                      {(detailTrade.images || [detailTrade.image]).map((src, i) => (
                        <img
                          key={i}
                          src={src}
                          alt="chart"
                          onClick={() => setLightbox(src)}
                          className="h-24 rounded-lg border border-slate-700 object-cover cursor-zoom-in hover:border-sky-400 transition-all"
                        />
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Minimal Footer */}
          <footer className="mt-8 py-4 border-t border-slate-800/60 text-center text-[11px] text-slate-500 font-mono">
            Amiir Journal · Developed by <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className="text-sky-400 hover:underline">@amiir_pr</a>
          </footer>

          {/* LIGHTBOX FOR IMAGES */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
            >
              <img src={lightbox} alt="Full Chart" className="max-w-full max-h-[90vh] rounded-xl shadow-2xl border border-slate-800" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
