<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger - Trading Journal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
      }
    }
  </script>
</head>
<body class="bg-[#0B0F14] text-[#E7E2D6]">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from "react";
    import ReactDOM from "react-dom/client";
    import {
      Plus, TrendingUp, TrendingDown, Trash2, X, ChevronDown, ChevronUp,
      ChevronLeft, ChevronRight, Image as ImageIcon, LayoutGrid, ListChecks, LogOut, User
    } from "lucide-react";

    // Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ",
      authDomain: "amiir-journal.firebaseapp.com",
      projectId: "amiir-journal",
      storageBucket: "amiir-journal.firebasestorage.app",
      messagingSenderId: "533778928448",
      appId: "1:533778928448:web:138073019799354cb020a5",
      measurementId: "G-QYJ75J88K5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const C = {
      bg: "#0B0F14",
      surface: "#0E141A",
      surface2: "#131A22",
      border: "#22292F",
      borderHover: "#3D434B",
      text: "#E7E2D6",
      textDim: "#8A8F98",
      textFaint: "#565C64",
      textFaint2: "#3D434B",
      gold: "#E8B44C",
      goldHover: "#F0C366",
      green: "#4FAE83",
      greenBright: "#8FE3C0",
      greenBg: "#1E5A41",
      red: "#D65F5F",
      redBright: "#F2A6A6",
      redBg: "#5C2323",
      notesText: "#B8BCC4",
    };

    const EMPTY_FORM = {
      symbol: "",
      date: new Date().toISOString().slice(0, 10),
      session: "london",
      purgeTime: "2am",
      direction: "buy",
      outcome: "win",
      risk: "1",
      rrRatio: "2",
      notes: "",
      image: null,
    };

    const SESSIONS = [
      { id: "asian", label: "Asian", flag: "🇯🇵", time: "8PM–9PM" },
      { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM" },
      { id: "newyork", label: "New York", flag: "🇺🇸", time: "8AM–9AM" },
    ];

    const PURGE_TIMES = {
      asian: ["8pm", "9pm"],
      london: ["2am", "3am"],
      newyork: ["8am", "9am"],
    };

    const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December",
    ];

    function resizeImage(dataUrl, maxWidth = 480) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.7));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function Toggle({ active, onClick, children, activeBg, activeColor }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className="flex-1 text-xs uppercase py-2 rounded border transition-colors cursor-pointer"
          style={{
            fontFamily: "'IBM Plex Mono', monospace",
            backgroundColor: active ? activeBg : "transparent",
            color: active ? activeColor : C.textDim,
            borderColor: active ? activeBg : C.border,
          }}
        >
          {children}
        </button>
      );
    }

    function TradeJournal() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [trades, setTrades] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState("journal");
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(EMPTY_FORM);
      const [expanded, setExpanded] = useState(null);
      const [error, setError] = useState("");
      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [viewYear, setViewYear] = useState(new Date().getFullYear());
      const [lightbox, setLightbox] = useState(null);

      // Auth Listener
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // Realtime Database Sync
      useEffect(() => {
        if (!user) {
          setTrades([]);
          setLoading(false);
          return;
        }

        setLoading(true);
        const userTradesRef = collection(db, "users", user.uid, "trades");

        const unsubscribe = onSnapshot(userTradesRef, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => {
            list.push(doc.data());
          });

          // Sort by date descending
          list.sort((a, b) => {
            if (b.date === a.date) return (b.id || "").localeCompare(a.id || "");
            return (b.date || "").localeCompare(a.date || "");
          });

          setTrades(list);
          setLoading(false);
        }, (err) => {
          console.error("Database error:", err);
          setError("Khalad ayaa ku dhacay soo rarista xogta: " + err.message);
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user]);

      const handleGoogleLogin = async () => {
        setError("");
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          console.error(err);
          if (err.code === "auth/unauthorized-domain") {
            setError("Fadlan Firebase Console ku dar 'Authorized domains' sida laguugu sharxay.");
          } else {
            setError("Login-ku ma guulaysan: " + err.message);
          }
        }
      };

      const handleLogout = async () => {
        try {
          await signOut(auth);
        } catch (err) {
          console.error(err);
        }
      };

      const handleImage = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const resized = await resizeImage(reader.result);
            setForm((f) => ({ ...f, image: resized }));
          } catch (err) {
            setForm((f) => ({ ...f, image: reader.result }));
          }
        };
        reader.onerror = () => setError("Sawirka lama akhrin karin, isku day mid kale.");
        reader.readAsDataURL(file);
      };

      const addTrade = async () => {
        if (!form.symbol || !form.date) {
          setError("Buuxi symbol-ka iyo taariikhda.");
          return;
        }
        if (!user) {
          setError("Fadlan marka hore gal Gmail-kaaga.");
          return;
        }

        const risk = parseFloat(form.risk) || 0;
        const rrRatio = parseFloat(form.rrRatio) || 0;
        const reward = +(risk * rrRatio).toFixed(2);
        const rMultiple =
          form.outcome === "win" ? reward : form.outcome === "loss" ? -risk : 0;
        const tradeId = Date.now().toString();

        const trade = {
          id: tradeId,
          symbol: form.symbol.toUpperCase(),
          date: form.date,
          session: form.session,
          purgeTime: form.purgeTime,
          direction: form.direction,
          outcome: form.outcome,
          risk,
          rrRatio,
          reward,
          rMultiple,
          notes: form.notes || "",
          image: form.image || null,
          createdAt: new Date().toISOString()
        };

        try {
          await setDoc(doc(db, "users", user.uid, "trades", tradeId), trade);
          setForm(EMPTY_FORM);
          setShowForm(false);
          setError("");
        } catch (err) {
          setError("Xogta lama kaydin karin: " + err.message);
        }
      };

      const removeTrade = async (id) => {
        if (!user) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "trades", id));
        } catch (err) {
          setError("Lama tirtiri karin ganacsiga: " + err.message);
        }
      };

      const stats = useMemo(() => {
        const total = trades.length;
        const wins = trades.filter((t) => t.outcome === "win").length;
        const losses = trades.filter((t) => t.outcome === "loss").length;
        const netR = trades.reduce((s, t) => s + t.rMultiple, 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;
        return { total, wins, losses, netR, winRate };
      }, [trades]);

      const fmtR = (n) => (n > 0 ? "+" : "") + n.toFixed(2) + "%";

      const dayMap = useMemo(() => {
        const map = {};
        trades.forEach((t) => {
          const d = t.date;
          if (!map[d]) map[d] = { net: 0, count: 0 };
          map[d].net += t.rMultiple;
          map[d].count += 1;
        });
        return map;
      }, [trades]);

      const calendarCells = useMemo(() => {
        const firstOfMonth = new Date(viewYear, viewMonth, 1);
        const startOffset = (firstOfMonth.getDay() + 6) % 7;
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          cells.push({ day: d, key, data: dayMap[key] });
        }
        return cells;
      }, [viewYear, viewMonth, dayMap]);

      const monthNet = useMemo(() => {
        return Object.entries(dayMap)
          .filter(([k]) => k.startsWith(`${viewYear}-${String(viewMonth + 1).padStart(2, "0")}`))
          .reduce((s, [, v]) => s + v.net, 0);
      }, [dayMap, viewYear, viewMonth]);

      const changeMonth = (delta) => {
        let m = viewMonth + delta;
        let y = viewYear;
        if (m < 0) { m = 11; y -= 1; }
        if (m > 11) { m = 0; y += 1; }
        setViewMonth(m);
        setViewYear(y);
      };

      const monoStyle = { fontFamily: "'IBM Plex Mono', monospace" };
      const displayStyle = { fontFamily: "'Space Grotesk', sans-serif" };
      const inputStyle = {
        fontFamily: "'IBM Plex Mono', monospace",
        backgroundColor: C.surface2,
        border: `1px solid ${C.border}`,
        color: C.text,
      };
      const labelStyle = { fontSize: "10px", textTransform: "uppercase", letterSpacing: "0.05em", color: C.textFaint, display: "block", marginBottom: "4px" };

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: C.bg, color: C.gold }}>
            <span style={monoStyle}>Loading...</span>
          </div>
        );
      }

      // LOGIN SCREEN HADDII AAN LA GALIN GMAIL
      if (!user) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center px-4" style={{ backgroundColor: C.bg, color: C.text }}>
            <div className="max-w-md w-full rounded-lg p-8 text-center" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
              <h1 className="text-3xl font-bold mb-2 tracking-tight" style={{ ...displayStyle, color: C.gold }}>Ledger</h1>
              <p className="text-sm mb-6" style={{ color: C.textDim }}>Joornaalkaaga gaarka ah ee ganacsiga. Xogtaadu waligeed ma lumayso waxaadna ka heli kartaa qalab kasta.</p>
              
              {error && <div className="text-xs mb-4 p-2 rounded bg-red-950/40 text-red-400 border border-red-900/60" style={monoStyle}>{error}</div>}

              <button
                onClick={handleGoogleLogin}
                className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded font-medium text-sm transition-all hover:opacity-90 cursor-pointer shadow-lg"
                style={{ backgroundColor: "#FFFFFF", color: "#1f2937" }}
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Ku gal Gmail (Google)
              </button>
            </div>
          </div>
        );
      }

      // MAIN APP AFTER LOGIN
      return (
        <div className="min-h-screen w-full" style={{ backgroundColor: C.bg, color: C.text, fontFamily: "Inter, sans-serif" }}>
          <div className="max-w-3xl mx-auto px-5 py-8">
            
            {/* Header with User Info */}
            <div className="flex items-start justify-between mb-6">
              <div>
                <h1 className="text-2xl font-semibold tracking-tight" style={{ ...displayStyle, color: C.gold }}>
                  Ledger
                </h1>
                <div className="flex items-center gap-2 mt-1">
                  {user.photoURL ? (
                    <img src={user.photoURL} alt="user" className="w-5 h-5 rounded-full border border-neutral-700" />
                  ) : (
                    <User size={14} style={{ color: C.textDim }} />
                  )}
                  <span className="text-xs" style={{ color: C.textDim }}>{user.displayName || user.email}</span>
                  <button 
                    onClick={handleLogout} 
                    title="Ka bax" 
                    className="flex items-center gap-1 text-[11px] text-red-400 hover:text-red-300 ml-2 cursor-pointer transition-colors"
                  >
                    <LogOut size={12} /> Ka bax
                  </button>
                </div>
              </div>

              <button
                onClick={() => { setShowForm((s) => !s); setTab("journal"); }}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded text-sm font-medium transition-colors cursor-pointer"
                style={{ ...monoStyle, backgroundColor: C.gold, color: C.bg }}
              >
                {showForm ? <X size={15} /> : <Plus size={15} />}
                {showForm ? "Jooji" : "Ganacsi cusub"}
              </button>
            </div>

            {/* Tabs */}
            <div className="flex gap-1 mb-6 rounded p-1 w-fit" style={{ border: `1px solid ${C.border}` }}>
              <button
                onClick={() => setTab("journal")}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm transition-colors cursor-pointer"
                style={{ backgroundColor: tab === "journal" ? C.gold : "transparent", color: tab === "journal" ? C.bg : C.textDim }}
              >
                <ListChecks size={14} /> Diiwaanka
              </button>
              <button
                onClick={() => setTab("dashboard")}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm transition-colors cursor-pointer"
                style={{ backgroundColor: tab === "dashboard" ? C.gold : "transparent", color: tab === "dashboard" ? C.bg : C.textDim }}
              >
                <LayoutGrid size={14} /> Dashboard
              </button>
            </div>

            {/* Stats row */}
            <div className="grid grid-cols-4 gap-px rounded mb-8 overflow-hidden" style={{ backgroundColor: C.border, border: `1px solid ${C.border}` }}>
              <div className="px-3 py-3" style={{ backgroundColor: C.surface }}>
                <div style={labelStyle}>Wadarta</div>
                <div className="text-lg" style={monoStyle}>{stats.total}</div>
              </div>
              <div className="px-3 py-3" style={{ backgroundColor: C.surface }}>
                <div style={labelStyle}>Guusha %</div>
                <div className="text-lg" style={monoStyle}>{stats.winRate}%</div>
              </div>
              <div className="px-3 py-3" style={{ backgroundColor: C.surface }}>
                <div style={labelStyle}>Win/Loss</div>
                <div className="text-lg" style={monoStyle}>
                  <span style={{ color: C.green }}>{stats.wins}</span>
                  <span style={{ color: C.textFaint }}>/</span>
                  <span style={{ color: C.red }}>{stats.losses}</span>
                </div>
              </div>
              <div className="px-3 py-3" style={{ backgroundColor: C.surface }}>
                <div style={labelStyle}>Net R</div>
                <div className="text-lg" style={{ ...monoStyle, color: stats.netR >= 0 ? C.green : C.red }}>
                  {fmtR(stats.netR)}
                </div>
              </div>
            </div>

            {/* Form */}
            {showForm && (
              <div className="rounded p-4 mb-8" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
                {error && <div className="text-xs mb-3" style={{ ...monoStyle, color: C.red }}>{error}</div>}
                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div>
                    <label style={labelStyle}>Symbol</label>
                    <input
                      value={form.symbol}
                      onChange={(e) => setForm({ ...form, symbol: e.target.value })}
                      placeholder="NQ"
                      className="w-full rounded px-2.5 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>Taariikhda</label>
                    <input
                      type="date"
                      value={form.date}
                      onChange={(e) => setForm({ ...form, date: e.target.value })}
                      className="w-full rounded px-2.5 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>

                  <div className="col-span-2">
                    <label style={labelStyle}>Session</label>
                    <div className="flex gap-1.5">
                      {SESSIONS.map((s) => (
                        <button
                          key={s.id}
                          type="button"
                          onClick={() => setForm({ ...form, session: s.id, purgeTime: PURGE_TIMES[s.id][0] })}
                          className="flex-1 text-xs py-2 rounded border transition-colors flex flex-col items-center justify-center gap-0.5 cursor-pointer"
                          style={{
                            ...monoStyle,
                            backgroundColor: form.session === s.id ? C.gold : "transparent",
                            color: form.session === s.id ? C.bg : C.textDim,
                            borderColor: form.session === s.id ? C.gold : C.border,
                          }}
                        >
                          <span className="flex items-center gap-1.5">{s.flag} {s.label}</span>
                          <span style={{ fontSize: "9px", color: form.session === s.id ? "rgba(11,15,20,0.7)" : C.textFaint }}>
                            {s.time}
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="col-span-2">
                    <label style={labelStyle}>Purging Time</label>
                    <div className="flex gap-1.5">
                      {PURGE_TIMES[form.session].map((pt) => (
                        <Toggle
                          key={pt}
                          active={form.purgeTime === pt}
                          onClick={() => setForm({ ...form, purgeTime: pt })}
                          activeBg={C.gold}
                          activeColor={C.bg}
                        >
                          {pt}
                        </Toggle>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label style={labelStyle}>Direction</label>
                    <div className="flex gap-1.5">
                      {["buy", "sell"].map((d) => (
                        <Toggle
                          key={d}
                          active={form.direction === d}
                          onClick={() => setForm({ ...form, direction: d })}
                          activeBg={C.gold}
                          activeColor={C.bg}
                        >
                          {d}
                        </Toggle>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={labelStyle}>Outcome</label>
                    <div className="flex gap-1.5">
                      {["win", "loss", "be"].map((o) => (
                        <Toggle
                          key={o}
                          active={form.outcome === o}
                          onClick={() => setForm({ ...form, outcome: o })}
                          activeBg={o === "win" ? C.green : o === "loss" ? C.red : C.textFaint}
                          activeColor={C.bg}
                        >
                          {o}
                        </Toggle>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label style={labelStyle}>Risk %</label>
                    <input
                      type="number"
                      step="0.1"
                      value={form.risk}
                      onChange={(e) => setForm({ ...form, risk: e.target.value })}
                      className="w-full rounded px-2.5 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>R:R Ratio (1 : x)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={form.rrRatio}
                      onChange={(e) => setForm({ ...form, rrRatio: e.target.value })}
                      className="w-full rounded px-2.5 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>
                  <div className="col-span-2">
                    <label style={labelStyle}>Reward % (automatic)</label>
                    <div className="w-full rounded px-2.5 py-2 text-sm" style={{ ...monoStyle, backgroundColor: C.bg, border: `1px solid ${C.border}`, color: C.textDim }}>
                      {((parseFloat(form.risk) || 0) * (parseFloat(form.rrRatio) || 0)).toFixed(2)}%
                    </div>
                  </div>
                </div>

                <div className="mb-3">
                  <label style={labelStyle}>Sawir (chart screenshot)</label>
                  <div className="rounded px-3 py-3" style={{ border: `1px dashed ${C.border}` }}>
                    <div className="flex items-center gap-2 text-xs mb-2" style={{ color: C.textDim }}>
                      <ImageIcon size={15} />
                      {form.image ? "Sawir la doortay — dooro mid kale si aad u bedesho" : "Dooro sawirka chart-ka"}
                    </div>
                    <input type="file" accept="image/*" onChange={handleImage} className="block w-full text-xs cursor-pointer" style={{ color: C.textDim }} />
                  </div>
                  {form.image && (
                    <img src={form.image} alt="preview" className="mt-2 rounded max-h-40" style={{ border: `1px solid ${C.border}` }} />
                  )}
                </div>

                <div className="mb-3">
                  <label style={labelStyle}>Fiiro gaar ah</label>
                  <textarea
                    value={form.notes}
                    onChange={(e) => setForm({ ...form, notes: e.target.value })}
                    placeholder="Setup-ka, dareenka, waxa aad barateen..."
                    rows={2}
                    className="w-full rounded px-2.5 py-2 text-sm focus:outline-none resize-none"
                    style={{ backgroundColor: C.surface2, border: `1px solid ${C.border}`, color: C.text }}
                  />
                </div>
                <button
                  type="button"
                  onClick={addTrade}
                  className="px-4 py-2 rounded text-sm font-medium transition-colors cursor-pointer"
                  style={{ ...monoStyle, backgroundColor: C.gold, color: C.bg }}
                >
                  Kaydi Ganacsiga
                </button>
              </div>
            )}

            {loading ? (
              <div className="text-sm text-center py-10" style={{ color: C.textFaint }}>Soo raraya xogtaada...</div>
            ) : tab === "journal" ? (
              trades.length === 0 ? (
                <div className="rounded py-12 text-center" style={{ border: `1px dashed ${C.border}` }}>
                  <p className="text-sm" style={{ color: C.textFaint }}>Weli ma jiro ganacsi la diiwaan geliyay.</p>
                  <p className="text-xs mt-1" style={{ color: C.textFaint2 }}>Riix "Ganacsi cusub" si aad u bilowdo.</p>
                </div>
              ) : (
                <div className="rounded overflow-hidden" style={{ border: `1px solid ${C.border}` }}>
                  {trades.map((t, idx) => {
                    const isOpen = expanded === t.id;
                    const sessionInfo = SESSIONS.find((s) => s.id === t.session);
                    return (
                      <div key={t.id} style={{ backgroundColor: C.surface, borderTop: idx === 0 ? "none" : `1px solid ${C.border}` }}>
                        <button
                          type="button"
                          onClick={() => setExpanded(isOpen ? null : t.id)}
                          className="w-full flex items-center justify-between px-4 py-3 text-left transition-colors cursor-pointer"
                        >
                          <div className="flex items-center gap-2 flex-wrap">
                            {t.outcome === "win" ? (
                              <TrendingUp size={15} style={{ color: C.green }} />
                            ) : t.outcome === "loss" ? (
                              <TrendingDown size={15} style={{ color: C.red }} />
                            ) : (
                              <span style={{ width: 15, height: 2, backgroundColor: C.textFaint, display: "inline-block" }} />
                            )}
                            <span className="text-sm font-medium" style={monoStyle}>{t.symbol}</span>
                            {sessionInfo && (
                              <span className="text-[10px] uppercase tracking-wider rounded px-1.5 py-0.5" style={{ color: C.textFaint, border: `1px solid ${C.border}` }}>
                                {sessionInfo.flag} {sessionInfo.label}{t.purgeTime ? ` · ${t.purgeTime}` : ""}
                              </span>
                            )}
                            <span className="text-[10px] uppercase tracking-wider rounded px-1.5 py-0.5" style={{ color: C.textFaint, border: `1px solid ${C.border}` }}>
                              {t.direction}
                            </span>
                            <span
                              className="text-[10px] uppercase tracking-wider rounded px-1.5 py-0.5"
                              style={{
                                color: t.outcome === "win" ? C.green : t.outcome === "loss" ? C.red : C.textDim,
                                border: `1px solid ${t.outcome === "win" ? C.green : t.outcome === "loss" ? C.red : C.border}`,
                              }}
                            >
                              {t.outcome}
                            </span>
                            <span className="text-xs" style={{ ...monoStyle, color: C.textFaint }}>{t.date}</span>
                          </div>
                          <div className="flex items-center gap-3">
                            <span className="text-sm" style={{ ...monoStyle, color: t.rMultiple >= 0 ? C.green : C.red }}>
                              {fmtR(t.rMultiple)}
                            </span>
                            {isOpen ? <ChevronUp size={15} style={{ color: C.textFaint }} /> : <ChevronDown size={15} style={{ color: C.textFaint }} />}
                          </div>
                        </button>
                        {isOpen && (
                          <div className="px-4 pb-4 pt-1">
                            <div className="grid grid-cols-3 gap-3 mb-3 text-xs">
                              <div>
                                <div style={{ color: C.textFaint, marginBottom: 2 }}>Risk</div>
                                <div style={monoStyle}>{t.risk}%</div>
                              </div>
                              <div>
                                <div style={{ color: C.textFaint, marginBottom: 2 }}>Reward</div>
                                <div style={monoStyle}>{t.reward}%</div>
                              </div>
                              <div>
                                <div style={{ color: C.textFaint, marginBottom: 2 }}>R:R</div>
                                <div style={monoStyle}>1:{t.rrRatio}</div>
                              </div>
                            </div>
                            {t.image && (
                              <img
                                src={t.image}
                                alt={t.symbol}
                                onClick={() => setLightbox(t.image)}
                                className="rounded max-h-56 mb-3 cursor-zoom-in"
                                style={{ border: `1px solid ${C.border}` }}
                              />
                            )}
                            {t.notes && <p className="text-sm mb-3 leading-relaxed" style={{ color: C.notesText }}>{t.notes}</p>}
                            <button
                              type="button"
                              onClick={() => removeTrade(t.id)}
                              className="flex items-center gap-1 text-xs transition-colors cursor-pointer"
                              style={{ color: C.red }}
                            >
                              <Trash2 size={12} /> Tirtir
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )
            ) : (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <button type="button" onClick={() => changeMonth(-1)} className="p-1.5 rounded cursor-pointer" style={{ color: C.textDim }}>
                    <ChevronLeft size={18} />
                  </button>
                  <div className="text-center">
                    <div className="text-sm font-medium" style={displayStyle}>{MONTH_NAMES[viewMonth]} {viewYear}</div>
                    <div className="text-xs mt-0.5" style={{ ...monoStyle, color: monthNet >= 0 ? C.green : C.red }}>
                      {fmtR(monthNet)}
                    </div>
                  </div>
                  <button type="button" onClick={() => changeMonth(1)} className="p-1.5 rounded cursor-pointer" style={{ color: C.textDim }}>
                    <ChevronRight size={18} />
                  </button>
                </div>

                <div className="grid grid-cols-7 gap-1 mb-1">
                  {WEEKDAYS.map((d) => (
                    <div key={d} className="text-[10px] uppercase tracking-wider text-center py-1" style={{ color: C.textFaint }}>
                      {d}
                    </div>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {calendarCells.map((cell, i) => {
                    if (!cell) return <div key={i} className="aspect-square" />;
                    const data = cell.data;
                    const cellStyle = !data
                      ? { backgroundColor: C.surface, border: `1px solid ${C.border}` }
                      : data.net > 0
                      ? { backgroundColor: C.greenBg, border: `1px solid ${C.green}` }
                      : data.net < 0
                      ? { backgroundColor: C.redBg, border: `1px solid ${C.red}` }
                      : { backgroundColor: "#1E2229", border: `1px solid ${C.textFaint}` };
                    return (
                      <div key={i} className="aspect-square rounded px-1.5 py-1 flex flex-col justify-between" style={cellStyle}>
                        <span className="text-[10px]" style={{ ...monoStyle, color: C.textDim }}>{cell.day}</span>
                        {data && (
                          <div className="text-right">
                            <div className="text-[10px] leading-tight font-medium" style={{ ...monoStyle, color: data.net >= 0 ? C.greenBright : C.redBright }}>
                              {fmtR(data.net)}
                            </div>
                            <div className="text-[9px]" style={{ color: "rgba(255,255,255,0.55)" }}>{data.count} trade{data.count > 1 ? "s" : ""}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 flex items-center justify-center p-6 z-50 cursor-zoom-out"
              style={{ backgroundColor: "rgba(0,0,0,0.85)" }}
            >
              <img src={lightbox} alt="chart" className="max-w-full max-h-full rounded" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<TradeJournal />);
  </script>
</body>
</html>
