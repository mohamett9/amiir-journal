/* ── derived metrics for the Overview module ───────────────────────────── */
function admMetrics(rows, days) {
  const now = Date.now();
  const span = days * ADM_DAY;
  const from = now - span;
  const prevFrom = from - span;
  const live = rows.filter((u) => u.status !== "deleted");

  const paid = live.filter((u) => u.isPaid);
  const trial = live.filter((u) => u.status === "trial" || u.subStatus === "trialing");
  const suspended = live.filter((u) => u.status === "suspended");
  const activeRange = live.filter((u) => u.lastSeen >= from);
  const activePrev = live.filter((u) => u.lastSeen >= prevFrom && u.lastSeen < from);
  const active7 = live.filter((u) => u.lastSeen >= now - ADM_ACTIVE_WINDOW);
  const online = live.filter((u) => u.online);
  const newUsers = live.filter((u) => u.createdAt >= from);
  const newPrev = live.filter((u) => u.createdAt >= prevFrom && u.createdAt < from);

  let revenue = 0, revenuePrev = 0, failed = 0;
  live.forEach((u) => (u.payments || []).forEach((p) => {
    const at = Number(p.at) || 0, amt = Number(p.amount) || 0;
    if (p.status === "failed") { if (at >= from) failed += amt; return; }
    if (at >= from) revenue += amt;
    else if (at >= prevFrom) revenuePrev += amt;
  }));

  const mrr = paid.filter((u) => u.subStatus === "active").reduce((s, u) => s + (Number(u.priceMonthly) || 0), 0);
  const mrrNew = paid.filter((u) => u.subStatus === "active" && u.startedAt >= from).reduce((s, u) => s + (Number(u.priceMonthly) || 0), 0);

  return {
    total: live.length,
    paid: paid.length, trial: trial.length, suspended: suspended.length,
    activeRange: activeRange.length, activePrev: activePrev.length,
    active7: active7.length, online: online.length, onlineList: online,
    newUsers: newUsers.length, newPrev: newPrev.length,
    revenue, revenuePrev, failed, mrr, mrrNew,
    arpu: paid.length ? mrr / paid.length : 0,
    conversion: live.length ? (paid.length / live.length) * 100 : 0,
    planCounts: ADMIN_PLAN_ORDER.map((id) => ({ id, label: ADMIN_PLANS[id].label, bar: ADMIN_PLANS[id].bar, price: ADMIN_PLANS[id].price, count: live.filter((u) => u.plan === id).length })),
    pastDue: live.filter((u) => u.pastDue || (u.isPaid && u.renewsAt && u.renewsAt < now)),
    trialEnding: trial.filter((u) => u.trialEndsAt && u.trialEndsAt - now < 3 * ADM_DAY),
    churnRisk: paid.filter((u) => u.lastSeen && now - u.lastSeen > 14 * ADM_DAY),
    dormant: live.filter((u) => u.lastSeen && now - u.lastSeen > 30 * ADM_DAY),
    days
  };
}

function admBuckets(rows, days) {
  const now = Date.now();
  const spans = [];
  if (days <= 1) {
    for (let i = 5; i >= 0; i--) {
      const end = now - i * 4 * 3600000;
      const start = end - 4 * 3600000;
      spans.push({ label: String(new Date(start).getHours()).padStart(2, "0"), start, end });
    }
  } else {
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(now - i * ADM_DAY);
      d.setHours(0, 0, 0, 0);
      spans.push({ label: String(d.getDate()), start: d.getTime(), end: d.getTime() + ADM_DAY });
    }
  }
  return spans.map((b) => ({ label: b.label, count: rows.filter((u) => u.createdAt >= b.start && u.createdAt < b.end).length }));
}

/* Overlays render into <body> so the sticky header's stacking context
   (main is `relative z-10`) can never clip or mis-anchor a fixed layer. */
function AdmPortal({ children }) {
  if (typeof document === "undefined") return null;
  return createPortal(children, document.body);
}

/* Floating row menu — fixed positioning so the table never clips it. */
function AdmRowMenu({ anchor, items, onClose }) {
  useEffect(() => {
    const close = () => onClose();
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    const id = setTimeout(() => document.addEventListener("mousedown", close), 0);
    window.addEventListener("scroll", close, true);
    window.addEventListener("resize", close);
    document.addEventListener("keydown", esc);
    return () => {
      clearTimeout(id);
      document.removeEventListener("mousedown", close);
      window.removeEventListener("scroll", close, true);
      window.removeEventListener("resize", close);
      document.removeEventListener("keydown", esc);
    };
  }, [onClose]);

  const W = 206;
  const H = items.length * 34 + 12;
  const left = Math.max(8, Math.min(anchor.right - W, window.innerWidth - W - 8));
  const top = anchor.bottom + H > window.innerHeight - 8 ? Math.max(8, anchor.top - H - 6) : anchor.bottom + 6;

  return (
    <AdmPortal>
    <div role="menu" style={{ top: top, left: left, width: W }} onMouseDown={(e) => e.stopPropagation()}
      className={tx("adm-pop fixed z-[95] rounded-xl bg-[#080E1E] border border-slate-700 shadow-2xl shadow-black/50 p-1.5")}>
      {items.map((it, i) => it.divider ? <div key={i} className={tx("my-1 h-px bg-slate-800")} /> : (
        <button key={i} type="button" role="menuitem" disabled={it.disabled}
          onClick={() => { onClose(); it.onClick && it.onClick(); }}
          className={tx("w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-[11px] font-semibold text-left transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed " + (it.danger ? "text-rose-300 hover:bg-rose-500/10" : "text-slate-300 hover:bg-slate-800 hover:text-white"))}>
          {it.icon && <it.icon size={13} className={tx(it.danger ? "text-rose-400" : "text-slate-400")} />}
          {it.label}
        </button>
      ))}
    </div>
    </AdmPortal>
  );
}

function AdmToast({ toast }) {
  if (!toast) return null;
  const tone = toast.tone === "error" ? { c: "text-rose-300", b: "border-rose-500/40", I: XCircle }
    : toast.tone === "warn" ? { c: "text-amber-300", b: "border-amber-500/40", I: AlertTriangle }

          </AdmSection>
        </div>
      </div>

      {/* Needs attention */}
      <AdmSection icon={AlertTriangle} title="Needs attention" sub="Signals worth acting on today"
        right={<span className={tx("text-[10px] font-bold px-2 py-0.5 rounded-md border " + (alerts.length ? ADM_TONE.amber.badge : ADM_TONE.emerald.badge))}>{alerts.length ? alerts.length + " open" : "All clear"}</span>}>
        {alerts.length === 0 ? (
          <AdmEmpty icon={CheckCircle2} title="Nothing needs you right now" sub="No failed payments, expiring trials or churn signals in this window." />
        ) : (
          <div className={tx("divide-y divide-slate-800/50")}>
            {alerts.map((a) => {
              const tone = ADM_TONE[a.tone] || ADM_TONE.slate;
              return (
                <div key={a.id} className={tx("flex items-start gap-3 px-4 sm:px-5 py-3.5 hover:bg-slate-900/30 transition-colors")}>
                  <span className={tx("w-8 h-8 rounded-xl border flex items-center justify-center shrink-0 " + tone.wrap)}>
                    <a.icon size={14} className={tx(tone.icon)} />
                  </span>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className={tx("text-[12px] font-bold text-white")}>{a.title}</span>
                      {a.count != null && <span className={tx("text-[10px] font-bold px-1.5 py-px rounded border tnum " + tone.badge)}>{a.count}</span>}
                    </div>
                    <div className={tx("text-[11px] text-slate-500 mt-0.5 leading-relaxed")}>{a.detail}</div>
                  </div>
                  <button type="button" onClick={() => (a.to ? onJump(a.to) : onJump("users", a.jump))}
                    className={tx("shrink-0 px-2.5 py-1.5 rounded-lg border border-slate-800 text-[10px] font-bold text-slate-300 hover:border-sky-500/40 hover:text-sky-300 transition-colors cursor-pointer")}>
                    Review
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </AdmSection>
    </div>
  );
}

/* ══════════════ USERS MODULE ══════════════ */

const ADM_STATUS_FILTERS = [
  { id: "all", label: "All statuses" }, { id: "active", label: "Active" }, { id: "trial", label: "Trial" },
  { id: "inactive", label: "Inactive" }, { id: "suspended", label: "Suspended" }, { id: "deleted", label: "Deleted" }
];
const ADM_PLAN_FILTERS = [{ id: "all", label: "All plans" }, { id: "paid", label: "Paid only" }, { id: "past_due", label: "Past due" }]
  .concat(ADMIN_PLAN_ORDER.map((id) => ({ id: id, label: ADMIN_PLANS[id].label })));
const ADM_ACTIVITY_FILTERS = [
  { id: "all", label: "Any activity" }, { id: "online", label: "Online now" }, { id: "today", label: "Active today" },
  { id: "7d", label: "Active 7 days" }, { id: "inactive14", label: "Inactive 14d+" }, { id: "inactive30", label: "Inactive 30d+" }
];
const ADM_PAGE_SIZE = 10;

function AdminUsers({ rows, preset, onConsumePreset, onAction, actionTick }) {
  const [q, setQ] = useState("");
  const [status, setStatus] = useState("all");
  const [plan, setPlan] = useState("all");
  const [activity, setActivity] = useState("all");
  const [sort, setSort] = useState({ key: "lastSeen", dir: "desc" });
  const [page, setPage] = useState(0);
  const [menu, setMenu] = useState(null);
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    if (!preset) return;
    setQ(preset.q || ""); setStatus(preset.status || "all"); setPlan(preset.plan || "all"); setActivity(preset.activity || "all");
    setPage(0);
    onConsumePreset();
  }, [preset, onConsumePreset]);

  useEffect(() => { setPage(0); }, [q, status, plan, activity]);
  useEffect(() => { setSelected(null); setMenu(null); }, [actionTick]);

  const clearFilters = () => { setQ(""); setStatus("all"); setPlan("all"); setActivity("all"); };

  const summary = useMemo(() => {
    const now = Date.now();
    const live = rows.filter((u) => u.status !== "deleted");
    return {
      total: live.length,
      active: live.filter((u) => u.lastSeen >= now - ADM_ACTIVE_WINDOW && u.status !== "suspended").length,
      paid: live.filter((u) => u.isPaid).length,
      trial: live.filter((u) => u.status === "trial" || u.subStatus === "trialing").length
    };
  }, [rows]);

  const filtered = useMemo(() => {
    const now = Date.now();
    const needle = q.trim().toLowerCase();
    const out = rows.filter((u) => {
      if (status === "all") { if (u.status === "deleted") return false; }
      else if (u.status !== status) return false;

      if (plan === "paid") { if (!u.isPaid) return false; }
      else if (plan === "past_due") { if (!u.pastDue) return false; }
      else if (plan !== "all" && u.plan !== plan) return false;

      if (activity === "online" && !u.online) return false;
      if (activity === "today" && u.lastSeen < now - ADM_DAY) return false;
      if (activity === "7d" && u.lastSeen < now - 7 * ADM_DAY) return false;
      if (activity === "inactive14" && !(u.lastSeen && now - u.lastSeen > 14 * ADM_DAY)) return false;
      if (activity === "inactive30" && !(u.lastSeen && now - u.lastSeen > 30 * ADM_DAY)) return false;

      if (needle && (u.name + " " + u.email + " " + u.uid).toLowerCase().indexOf(needle) === -1) return false;
      return true;
    });

    const dir = sort.dir === "asc" ? 1 : -1;
    return out.sort((a, b) => {
      if (sort.key === "name") return dir * String(a.name || "").localeCompare(String(b.name || ""));
      if (sort.key === "plan") return dir * (ADMIN_PLAN_ORDER.indexOf(a.plan) - ADMIN_PLAN_ORDER.indexOf(b.plan));
      if (sort.key === "createdAt") return dir * ((a.createdAt || 0) - (b.createdAt || 0));
      return dir * ((a.lastSeen || 0) - (b.lastSeen || 0));
    });
  }, [rows, q, status, plan, activity, sort]);

  const pages = Math.max(1, Math.ceil(filtered.length / ADM_PAGE_SIZE));
  const safePage = Math.min(page, pages - 1);
  const pageRows = filtered.slice(safePage * ADM_PAGE_SIZE, safePage * ADM_PAGE_SIZE + ADM_PAGE_SIZE);
  const hasFilters = !!q || status !== "all" || plan !== "all" || activity !== "all";

  const openMenu = (e, user) => {
    e.stopPropagation();
    const r = e.currentTarget.getBoundingClientRect();
    setMenu({ user: user, rect: { top: r.top, bottom: r.bottom, right: r.right, left: r.left } });
  };

  const menuItems = (u) => {
    const items = [
      { label: "View details", icon: Eye, onClick: () => setSelected(u) },
      { label: "Copy email", icon: Mail, disabled: !u.email, onClick: () => admCopy(u.email, () => onAction({ tone: "ok", msg: "Email copied" })) },
      { label: "Copy user ID", icon: Copy, onClick: () => admCopy(u.uid, () => onAction({ tone: "ok", msg: "User ID copied" })) },
      { divider: true }
    ];
    if (u.status === "suspended") items.push({ label: "Unsuspend user", icon: UserCheck, onClick: () => onAction({ do: "unsuspend", user: u }) });
    else items.push({ label: "Suspend user", icon: Ban, disabled: u.status === "deleted", onClick: () => onAction({ do: "suspend", user: u }) });
    items.push({ label: "Delete user", icon: Trash2, danger: true, disabled: u.status === "deleted", onClick: () => onAction({ do: "delete", user: u }) });
    return items;
  };

  const Th = ({ id, label, right }) => {
    const on = sort.key === id;
    return (
      <th scope="col" className={"px-4 py-2.5 " + (right ? "text-right" : "")}>
        <button type="button" onClick={() => setSort((s) => ({ key: id, dir: s.key === id && s.dir === "desc" ? "asc" : "desc" }))}
          className={tx("group inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider transition-colors cursor-pointer " + (on ? "text-slate-200" : "text-slate-500 hover:text-slate-300"))}>
          {label}
          {on ? (sort.dir === "asc" ? <ChevronUp size={11} /> : <ChevronDown size={11} />) : <ChevronDown size={11} className="opacity-0 group-hover:opacity-40" />}
        </button>
      </th>
    );
  };

  return (
    <div className="space-y-4">
      {/* Summary cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <AdmKpi label="Total Users" icon={Users} accent="border-l-sky-400" value={admNum(summary.total)} foot={<span className={tx("text-[10px] text-slate-500")}>All registered accounts</span>} />
        <AdmKpi label="Active" icon={Activity} accent="border-l-emerald-400" value={admNum(summary.active)} foot={<span className={tx("text-[10px] text-slate-500")}>Seen in last 7 days</span>} />
        <AdmKpi label="Paid" icon={BadgeCheck} accent="border-l-cyan-400" value={admNum(summary.paid)} foot={<span className={tx("text-[10px] text-slate-500")}>{admPct(summary.total ? (summary.paid / summary.total) * 100 : 0)} of base</span>} />
        <AdmKpi label="Trial" icon={Hourglass} accent="border-l-amber-400" value={admNum(summary.trial)} foot={<span className={tx("text-[10px] text-slate-500")}>Converting soon</span>} />
      </div>

      {/* Search + compact filters */}
      <div className="terminal-card rounded-2xl p-3 flex flex-col sm:flex-row sm:items-center gap-2.5">
        <div className="relative flex-1 min-w-0">
          <Search size={13} className={tx("absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none")} />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search by name, email or user ID…" aria-label="Search users"
            className={tx("w-full pl-8 pr-8 py-2 rounded-xl bg-[#050914] border border-slate-800 text-[12px] text-slate-200 placeholder:text-slate-600 outline-none focus:border-sky-500/50 transition-colors")} />
          {q && (
            <button type="button" onClick={() => setQ("")} aria-label="Clear search"
              className={tx("absolute right-2.5 top-1/2 -translate-y-1/2 p-0.5 rounded text-slate-500 hover:text-slate-300 cursor-pointer")}><X size={13} /></button>
          )}
        </div>
        <div className="flex items-center gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 sm:mx-0 sm:px-0 sm:overflow-visible">
          <AdmSelect label="Status" icon={Filter} value={status} onChange={setStatus} options={ADM_STATUS_FILTERS} />
          <AdmSelect label="Plan" icon={Layers} value={plan} onChange={setPlan} options={ADM_PLAN_FILTERS} />
          <AdmSelect label="Activity" icon={Activity} value={activity} onChange={setActivity} options={ADM_ACTIVITY_FILTERS} />
          {hasFilters && (
            <button type="button" onClick={clearFilters}
              className={tx("shrink-0 px-2.5 py-1.5 rounded-xl border border-slate-800 text-[10px] font-bold text-slate-400 hover:text-rose-300 hover:border-rose-500/30 transition-colors cursor-pointer whitespace-nowrap")}>
              Clear
            </button>
          )}
        </div>
      </div>

      {/* Table (md+) / stacked cards (mobile) */}
      <div className="terminal-card rounded-2xl overflow-hidden">
        <div className={tx("flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-800/70 flex-wrap")}>
          <span className={tx("text-[11px] font-bold text-slate-300")}>
            {hasFilters ? admNum(filtered.length) + " of " + admNum(rows.length) + " users" : admNum(filtered.length) + " users"}
          </span>
          {pages > 1 && (
            <div className="flex items-center gap-1.5">
              <button type="button" disabled={safePage === 0} onClick={() => setPage(safePage - 1)} aria-label="Previous page"
                className={tx("p-1.5 rounded-lg border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer")}><ChevronLeft size={13} /></button>
              <span className={tx("text-[10px] font-bold text-slate-400 tnum px-1")}>{safePage + 1} / {pages}</span>
              <button type="button" disabled={safePage >= pages - 1} onClick={() => setPage(safePage + 1)} aria-label="Next page"
                className={tx("p-1.5 rounded-lg border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors cursor-pointer")}><ChevronRight size={13} /></button>
            </div>
          )}
        </div>

        {pageRows.length === 0 ? (
          <AdmEmpty icon={Users}
            title={hasFilters ? "No users match these filters" : "No users yet"}
            sub={hasFilters ? "Try a different search term, or reset the filters to see the full list." : "Registered traders appear here as soon as they sign in — presence, plan and usage sync automatically."}
            action={hasFilters ? <button type="button" onClick={clearFilters} className={tx("px-4 py-2 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 transition-colors cursor-pointer")}>Reset filters</button> : null} />
        ) : (
          <>
            {/* ── desktop table ── */}
            <div className="hidden md:block overflow-x-auto">
              <table className="w-full min-w-[720px] border-collapse text-left">
                <thead>
                  <tr className={tx("border-b border-slate-800/70 bg-slate-900/40")}>
                    <Th id="name" label="User" />
                    <Th id="plan" label="Plan" />
                    <th scope="col" className={tx("px-4 py-2.5 text-[10px] font-bold uppercase tracking-wider text-slate-500")}>Status</th>
                    <Th id="lastSeen" label="Last active" />
                    <Th id="createdAt" label="Joined" />
                    <th scope="col" className={tx("px-4 py-2.5 text-[10px] font-bold uppercase tracking-wider text-slate-500 text-right")}>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {pageRows.map((u) => (
                    <tr key={u.uid} tabIndex={0} onClick={() => setSelected(u)}
                      onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSelected(u); } }}
                      className={tx("border-b border-slate-800/50 last:border-0 hover:bg-sky-500/5 transition-colors cursor-pointer")}>
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <AdmAvatar user={u} size={34} />
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5 min-w-0">
                              <span className={tx("text-[12px] font-bold text-white truncate max-w-[170px]")}>{u.name}</span>
                              {u.sample && <span className={tx("text-[8px] font-extrabold px-1 py-px rounded bg-violet-500/15 text-violet-300 border border-violet-500/25 shrink-0")}>SAMPLE</span>}
                            </div>
                            <div className={tx("text-[10.5px] text-slate-500 truncate max-w-[200px]")}>{u.email || u.uid}</div>
                          </div>
                        </div>
                      </td>
                      <td className="px-4 py-3">
                        <div className="flex flex-col items-start gap-1">
                          <AdmPlanPill plan={u.plan} />
                          {u.priceMonthly > 0 && <span className={tx("text-[10px] text-slate-500 tnum")}>${u.priceMonthly}/mo</span>}
                        </div>
                      </td>
                      <td className="px-4 py-3"><AdmStatusPill status={u.status} /></td>
                      <td className="px-4 py-3">
                        <div className={tx("text-[11.5px] font-semibold text-slate-300 whitespace-nowrap")}>
                          {u.online ? <span className={tx("text-emerald-400")}>Online now</span> : admAgo(u.lastSeen)}
                        </div>
                        <div className={tx("text-[10px] text-slate-500 whitespace-nowrap")}>{u.device || "—"}</div>
                      </td>
                      <td className="px-4 py-3">
                        <div className={tx("text-[11.5px] font-semibold text-slate-300 whitespace-nowrap")}>{admDate(u.createdAt)}</div>
                        <div className={tx("text-[10px] text-slate-500 whitespace-nowrap")}>{u.createdAt ? admAgo(u.createdAt).replace(" ago", " old") : "—"}</div>
                      </td>
                      <td className="px-4 py-3 text-right">
                        <button type="button" onClick={(e) => openMenu(e, u)} aria-haspopup="menu" aria-label={"Actions for " + u.name}
                          className={tx("inline-flex p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer")}>
                          <MoreVertical size={15} />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* ── mobile cards ── */}
            <div className={tx("md:hidden divide-y divide-slate-800/50")}>
              {pageRows.map((u) => (
                <div key={u.uid} onClick={() => setSelected(u)} className={tx("p-3.5 active:bg-sky-500/5 transition-colors cursor-pointer")}>
                  <div className="flex items-start gap-3">
                    <AdmAvatar user={u} size={38} />
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className={tx("text-[12.5px] font-bold text-white truncate max-w-[150px]")}>{u.name}</span>
                        {u.sample && <span className={tx("text-[8px] font-extrabold px-1 py-px rounded bg-violet-500/15 text-violet-300 border border-violet-500/25")}>SAMPLE</span>}
                      </div>
                      <div className={tx("text-[10.5px] text-slate-500 truncate")}>{u.email || u.uid}</div>
                      <div className="flex items-center gap-1.5 mt-1.5 flex-wrap">
                        <AdmStatusPill status={u.status} />
                        <AdmPlanPill plan={u.plan} />
                        {u.priceMonthly > 0 && <span className={tx("text-[10px] text-slate-500 tnum")}>${u.priceMonthly}/mo</span>}
                      </div>
                    </div>
                    <button type="button" onClick={(e) => openMenu(e, u)} aria-haspopup="menu" aria-label={"Actions for " + u.name}
                      className={tx("-mr-1 p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer shrink-0")}>
                      <MoreVertical size={16} />
                    </button>
                  </div>
                  <div className={tx("grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-800/50")}>
                    <div>
                      <div className={tx("text-[9px] uppercase tracking-wider text-slate-500 font-bold")}>Last active</div>
                      <div className={tx("text-[11px] font-semibold text-slate-300 mt-0.5")}>
                        {u.online ? <span className={tx("text-emerald-400")}>Online now</span> : admAgo(u.lastSeen)}
                      </div>
                    </div>
                    <div>
                      <div className={tx("text-[9px] uppercase tracking-wider text-slate-500 font-bold")}>Joined</div>
                      <div className={tx("text-[11px] font-semibold text-slate-300 mt-0.5")}>{admDate(u.createdAt)}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>

      {menu && <AdmRowMenu anchor={menu.rect} items={menuItems(menu.user)} onClose={() => setMenu(null)} />}
      {selected && <AdminUserDrawer user={rows.find((r) => r.uid === selected.uid) || selected} onClose={() => setSelected(null)} onAction={onAction} />}
    </div>
  );
}

/* ── User details drawer ───────────────────────────────────────────────── */
function AdmField({ label, value, mono, copy }) {
  return (
    <div className={tx("bg-slate-900/50 border border-slate-800/70 rounded-xl px-3 py-2.5 min-w-0")}>
      <div className={tx("text-[9px] uppercase tracking-wider text-slate-500 font-bold")}>{label}</div>
      <div className="flex items-center gap-1 mt-0.5 min-w-0">
        <span className={tx("text-[12px] font-bold text-slate-100 truncate " + (mono ? "tnum" : ""))}>{value || "—"}</span>
        {copy ? <AdmCopyBtn value={copy} label={label} /> : null}
      </div>
    </div>
  );
}

function AdmStat({ label, value, icon: Icon }) {
  return (
    <div className={tx("bg-slate-900/50 border border-slate-800/70 rounded-xl px-2 py-2.5 text-center")}>
      {Icon && <Icon size={13} className={tx("text-slate-500 mx-auto")} />}
      <div className={tx("text-base font-black text-white mt-1 tnum")}>{value}</div>
      <div className={tx("text-[9px] uppercase tracking-wider text-slate-500 font-bold mt-0.5 truncate")}>{label}</div>
    </div>
  );
}

function AdminUserDrawer({ user, onClose, onAction }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = prev; };
  }, [onClose]);

  const u = user;
  const usage = u.usage || {};
  const mod = u.moderation || {};
  const trialLeft = u.trialEndsAt ? admInDays(u.trialEndsAt) : null;
  const subLabel = u.subStatus === "past_due" ? "Past due" : u.subStatus === "trialing" ? "Trialing"
    : u.subStatus === "canceled" ? "Canceled" : u.subStatus === "none" ? "No subscription" : "Active";

  const timeline = [];
  if (u.createdAt) timeline.push({ at: u.createdAt, icon: UserPlus, tone: "sky", title: "Account created", detail: u.provider ? "Signed up via " + (u.provider === "google.com" ? "Google" : u.provider === "password" ? "email & password" : u.provider) : "" });
  if (u.startedAt) timeline.push({ at: u.startedAt, icon: BadgeCheck, tone: "emerald", title: (ADMIN_PLANS[u.plan] || ADMIN_PLANS.free).label + " plan started", detail: u.priceMonthly ? admMoney(u.priceMonthly) + " / month" : "" });
  (u.payments || []).slice(-4).forEach((p, i) => timeline.push({
    at: Number(p.at) || 0, icon: p.status === "failed" ? XCircle : Receipt,
    tone: p.status === "failed" ? "rose" : "emerald",
    title: p.status === "failed" ? "Payment failed" : "Payment received",
    detail: admMoney(p.amount) + (p.id ? " · " + p.id : ""), key: "pay" + i
  }));
  if (u.trialEndsAt) timeline.push({ at: u.trialEndsAt, icon: Hourglass, tone: "amber", title: trialLeft != null && trialLeft >= 0 ? "Trial ends" : "Trial ended", detail: trialLeft != null && trialLeft >= 0 ? "In " + trialLeft + " day" + (trialLeft === 1 ? "" : "s") : "" });
  (mod.events || []).forEach((ev, i) => timeline.push({
    at: Number(ev.at) || 0,
    icon: ev.type === "suspended" ? Ban : ev.type === "deleted" ? Trash2 : UserCheck,
    tone: ev.type === "suspended" ? "amber" : ev.type === "deleted" ? "rose" : "emerald",
    title: ev.type === "suspended" ? "Account suspended" : ev.type === "deleted" ? "Account deleted" : "Account reinstated",
    detail: [ev.note, ev.by ? "by " + ev.by : ""].filter(Boolean).join(" · "), key: "mod" + i
  }));
  if (usage.lastTradeDate) {
    const t = new Date(usage.lastTradeDate + "T12:00:00").getTime();
    if (!isNaN(t)) timeline.push({ at: t, icon: ListChecks, tone: "cyan", title: "Last trade logged", detail: "" });
  }
  if (u.lastSeen) timeline.push({ at: u.lastSeen, icon: Activity, tone: "slate", title: u.online ? "Online now" : "Last seen", detail: [u.device, u.platform].filter(Boolean).join(" · ") });
  timeline.sort((a, b) => b.at - a.at);

  return (
    <AdmPortal>
    <div className="fixed inset-0 z-[90]" role="dialog" aria-modal="true" aria-label={"Details for " + u.name}>
      <div className="adm-fade absolute inset-0 bg-black/65 backdrop-blur-[2px]" onClick={onClose} />

/* ── destructive confirmation dialog ───────────────────────────────────── */
function AdminConfirmDialog({ action, onClose, onConfirm }) {
  const [text, setText] = useState("");
  const [reason, setReason] = useState("");
  const [busy, setBusy] = useState(false);

  const u = action.user;
  const isDelete = action.do === "delete";
  const isSuspend = action.do === "suspend";
  const target = u.email || u.uid;
  const ready = !isDelete || text.trim().toLowerCase() === String(target).toLowerCase();

  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape" && !busy) onClose(); };
    document.addEventListener("keydown", esc);
    return () => document.removeEventListener("keydown", esc);
  }, [onClose, busy]);

  const run = async () => {
    if (!ready || busy) return;
    setBusy(true);
    try { await onConfirm(reason); } catch (e) { setBusy(false); }
  };

  const tone = isDelete ? ADM_TONE.rose : isSuspend ? ADM_TONE.amber : ADM_TONE.emerald;
  const Icon = isDelete ? AlertTriangle : isSuspend ? Ban : UserCheck;
  const cta = isDelete ? "bg-rose-500 hover:bg-rose-400 text-white" : isSuspend ? "bg-amber-500 hover:bg-amber-400 text-slate-950" : "bg-emerald-500 hover:bg-emerald-400 text-slate-950";

  return (
    <AdmPortal>
    <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center sm:p-4" role="dialog" aria-modal="true" aria-label="Confirm admin action">
      <div className="adm-fade absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={() => !busy && onClose()} />
      <div className={tx("adm-pop relative w-full sm:max-w-[440px] bg-[#080E1E] border border-slate-800 rounded-t-2xl sm:rounded-2xl shadow-2xl shadow-black/60 overflow-hidden")}>

        <div className={tx("px-5 py-4 border-b border-slate-800/70 flex items-start gap-3")}>
          <span className={tx("w-9 h-9 rounded-xl flex items-center justify-center border shrink-0 " + tone.wrap)}>
            <Icon size={16} className={tx(tone.icon)} />
          </span>
          <div className="min-w-0">
            <div className={tx("text-[14px] font-black text-white tracking-tight")}>
              {isDelete ? "Delete this user?" : isSuspend ? "Suspend this user?" : "Reinstate this user?"}
            </div>
            <div className={tx("text-[11px] text-slate-500 mt-0.5 truncate")}>{u.name} · {u.email || u.uid}</div>
          </div>
        </div>

        <div className="px-5 py-4 space-y-3">
          {isDelete ? (
            <>
              <div className={tx("rounded-xl px-3.5 py-3 space-y-1.5 border " + ADM_TONE.rose.wrap)}>
                {[
                  "The account is marked deleted and loses access on next launch.",
                  "Their presence record is removed, so they disappear from this panel.",
                  "Private journal data in their own collection is not touched by this action.",
                  "The Firebase Auth login must be removed separately from the console."
                ].map((line, i) => (
                  <div key={i} className={tx("flex items-start gap-2 text-[11px] text-rose-200 leading-relaxed")}>
                    <span className="mt-1 w-1 h-1 rounded-full bg-rose-400 shrink-0" />{line}
                  </div>
                ))}
              </div>
              <label className="block">
                <span className={tx("text-[10px] uppercase tracking-wider text-slate-500 font-bold")}>
                  Type <span className={tx("text-slate-300 normal-case")}>{target}</span> to confirm
                </span>
                <input value={text} onChange={(e) => setText(e.target.value)} autoFocus spellCheck={false} autoComplete="off" placeholder={target}
                  className={tx("mt-1.5 w-full px-3 py-2 rounded-xl bg-[#050914] border border-slate-800 text-[12px] text-slate-200 placeholder:text-slate-600 outline-none focus:border-rose-500/50 transition-colors")} />
              </label>
            </>
          ) : isSuspend ? (
            <>
              <p className={tx("text-[11.5px] text-slate-400 leading-relaxed")}>
                The account stays intact but is flagged as suspended for review. You can reinstate it at any time — the action is written to their activity timeline.
              </p>
              <label className="block">
                <span className={tx("text-[10px] uppercase tracking-wider text-slate-500 font-bold")}>Reason (optional)</span>
                <input value={reason} onChange={(e) => setReason(e.target.value)} autoFocus placeholder="e.g. Payment dispute under review"
                  className={tx("mt-1.5 w-full px-3 py-2 rounded-xl bg-[#050914] border border-slate-800 text-[12px] text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-500/50 transition-colors")} />
              </label>
            </>
          ) : (
            <p className={tx("text-[11.5px] text-slate-400 leading-relaxed")}>
              Full access is restored immediately and the reinstatement is recorded in their activity timeline.
            </p>
          )}
        </div>

        <div className={tx("px-5 py-3.5 border-t border-slate-800/70 flex items-center gap-2 bg-[#050914]")}>
          <button type="button" onClick={onClose} disabled={busy}
            className={tx("flex-1 py-2.5 rounded-xl text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer disabled:opacity-50")}>
            Cancel
          </button>
          <button type="button" onClick={run} disabled={!ready || busy}
            className={"flex-1 py-2.5 rounded-xl text-[11px] font-bold transition-colors cursor-pointer flex items-center justify-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed " + cta}>
            {busy ? <Loader2 size={13} className="animate-spin" /> : <Icon size={13} />}
            {isDelete ? "Delete permanently" : isSuspend ? "Suspend user" : "Unsuspend user"}
          </button>
        </div>
      </div>
    </div>
    </AdmPortal>
  );
}

function Admin() {
  const { isAdmin, adminUsers, adminSampleMode, setAdminSampleMode, adminSuspendUser, adminUnsuspendUser, adminDeleteUser } = useApp();
  const [section, setSection] = useState("overview");
  const [range, setRange] = useState("7d");
  const [preset, setPreset] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);
  const [actionTick, setActionTick] = useState(0);

  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 2800); return () => clearTimeout(id); }, [toast]);

  const rows = adminSampleMode ? ADMIN_SAMPLE_USERS : adminUsers;
  const liveCount = rows.filter((u) => u.status !== "deleted").length;

  const handleAction = (a) => {
    if (!a) return;
    if (a.msg) { setToast({ tone: a.tone || "ok", msg: a.msg }); return; }
    if (a.user && a.user.sample) { setToast({ tone: "warn", msg: "Sample users are read-only" }); return; }
    setConfirm(a);
  };

  const runConfirm = async (reason) => {
    const a = confirm;
    if (!a) return;
    try {
      if (a.do === "suspend") { await adminSuspendUser(a.user.uid, reason); setToast({ tone: "ok", msg: a.user.name + " suspended" }); }
      else if (a.do === "unsuspend") { await adminUnsuspendUser(a.user.uid); setToast({ tone: "ok", msg: a.user.name + " reinstated" }); }
      else if (a.do === "delete") { await adminDeleteUser(a.user.uid); setToast({ tone: "ok", msg: a.user.name + " deleted" }); }
      setConfirm(null);
      setActionTick((n) => n + 1);
    } catch (e) {
      setConfirm(null);
      setToast({ tone: "error", msg: "Action failed — check Firestore rules" });
    }
  };

  const jump = (to, filters) => {
    setSection(to);
    if (filters) setPreset(filters);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  if (!isAdmin) {
    return (
      <div className="terminal-card rounded-2xl">
        <AdmEmpty icon={Lock} title="Admin access required"
          sub="This area is restricted to the creator account. If you own this workspace, sign in with your creator email or unlock creator mode with your PIN." />
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {/* suite header */}
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="min-w-0">

    /* ══════════════════════════════════════════════════════════════════════
       6i. COMPONENT — Notes (TAB 6)
       ══════════════════════════════════════════════════════════════════════ */

function Notes() {
  const { t, notes, setShowNoteForm, noteForm, setNoteForm, showNoteForm, saveNote, moveToTrash } = useApp();
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h3 className={tx("text-sm font-bold text-white font-mono")}>{t.notes}</h3>
          <p className={tx("text-xs text-slate-500 font-mono")}>Institutional playbooks & psychology</p>
        </div>
        <button
          type="button"
          onClick={() => setShowNoteForm(true)}
          className={tx("flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-sky-500 text-slate-950 hover:bg-sky-400 cursor-pointer font-mono shadow-md shadow-sky-500/20")}
        >
          <Plus size={14} /> {t.addNote}
        </button>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        {notes.length === 0 ? (
          <div className={tx("col-span-full py-16 text-center text-slate-500 terminal-card rounded-3xl text-xs font-mono")}>
            {t.noNotes}
          </div>
        ) : (
          notes.map((n) => (
            <div key={n.id} className="terminal-card p-5 rounded-2xl relative group">
              <div className="flex items-center justify-between mb-2.5">
                <span className={tx("text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20 font-bold")}>
                  {n.tag}
                </span>
                <button type="button" onClick={() => moveToTrash("note", n, n.id)} className={tx("text-slate-500 hover:text-rose-400 p-1")} title="Move note to Trash">
                  <Trash2 size={14} />
                </button>
              </div>
              <h4 className={tx("text-sm font-bold text-white mb-2 font-mono")}>{n.title}</h4>
              <p className={tx("text-xs text-slate-300 leading-relaxed whitespace-pre-wrap font-mono")}>{n.content}</p>
            </div>
          ))
        )}
      </div>

      {showNoteForm && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="terminal-card p-6 rounded-3xl max-w-sm w-full border border-sky-500/40 shadow-2xl">
            <h4 className={tx("text-sm font-bold text-white mb-4 font-mono")}>{t.addNote}</h4>
            <div className="space-y-3 mb-4">
              <input
                placeholder="Title (e.g. London Judas Setup)"
                value={noteForm.title}
                onChange={(e) => setNoteForm({ ...noteForm, title: e.target.value })}
                className={tx("w-full bg-[#050914] border border-slate-700 rounded-xl p-2.5 text-xs text-white font-mono focus:border-sky-400")}
              />
              <input
                placeholder="Tag (e.g. ICT, Psychology)"
                value={noteForm.tag}
                onChange={(e) => setNoteForm({ ...noteForm, tag: e.target.value })}
                className={tx("w-full bg-[#050914] border border-slate-700 rounded-xl p-2.5 text-xs text-white font-mono focus:border-sky-400")}
              />
              <textarea
                rows={4}
                placeholder="Write setup thesis or observations..."
                value={noteForm.content}
                onChange={(e) => setNoteForm({ ...noteForm, content: e.target.value })}
                className={tx("w-full bg-[#050914] border border-slate-700 rounded-xl p-2.5 text-xs text-white resize-none font-mono focus:border-sky-400")}
              />
            </div>
            <div className="flex gap-2 font-mono">
              <button type="button" onClick={() => setShowNoteForm(false)} className={tx("flex-1 py-2 rounded-xl bg-slate-800 text-xs text-slate-300 font-bold")}>{t.cancel}</button>
              <button type="button" onClick={saveNote} className={tx("flex-1 py-2 rounded-xl bg-sky-500 text-xs font-bold text-slate-950 hover:bg-sky-400")}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    /* ══════════════════════════════════════════════════════════════════════
       6j. COMPONENT — Community (TAB 7 · live chat)
       ══════════════════════════════════════════════════════════════════════ */

function Community() {
  const { t, chatMessages, user, deleteChatMessage, chatImages, removeChatImage, chatInput, setChatInput, chatUploading, sendChatMessage, handleCommunityFiles, setLightbox, setZoomScale, chatScrollRef, onlineCount } = useApp();
  return (
    <div className={tx("terminal-card rounded-3xl overflow-hidden flex flex-col h-[600px] lg:h-[680px] shadow-2xl border border-slate-800")}>
      <div className={tx("p-4 border-b border-slate-800 bg-[#060B18] flex items-center justify-between")}>
        <div className="flex items-center gap-2.5">
          <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span className={tx("font-bold text-xs sm:text-sm text-white font-mono")}>{t.community} Live Trading Floor</span>
        </div>
        <span className={tx("text-xs text-slate-400 font-mono font-semibold")}>{onlineCount} Traders Online</span>
      </div>

      <div className="flex-1 p-5 overflow-y-auto space-y-3.5">
        {chatMessages.map((m) => {
          const isMe = m.uid === user.uid;
          return (
            <div key={m.id} className={`flex gap-3 ${isMe ? "justify-end" : "justify-start"}`}>
              {!isMe && (
                <img src={m.photo || "https://api.dicebear.com/7.x/bottts/svg"} className={tx("w-8 h-8 rounded-full bg-slate-800 flex-shrink-0 object-cover border border-slate-700")} />
              )}
              <div className={tx(`max-w-lg p-3.5 rounded-2xl text-xs relative group ${
                isMe 
                  ? "bg-sky-500/20 text-slate-100 border border-sky-500/35 rounded-tr-none shadow-sm" 
                  : "bg-[#050914] text-slate-200 border border-slate-800 rounded-tl-none"
              }`)}>
                <div className="flex items-center justify-between gap-3 mb-1">
                  <span className={tx("font-bold text-[10px] text-sky-400 font-mono")}>{m.author}</span>
                  {isMe && (
                    <button type="button" onClick={() => deleteChatMessage(m.id)} className={tx("text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity")}>
                      <Trash2 size={12} />
                    </button>
                  )}
                </div>

                {m.text && <p className="leading-relaxed whitespace-pre-wrap font-mono text-xs">{m.text}</p>}

                {m.images && m.images.length > 0 && (
                  <div className="flex gap-2.5 flex-wrap mt-2.5">
                    {m.images.map((imgUrl, i) => (
                      <img
                        key={i}
                        src={imgUrl}
                        alt="chat attachment"
                        onClick={() => { setLightbox(imgUrl); setZoomScale(1); }}
                        className={tx("h-28 w-auto rounded-xl border border-slate-700 object-cover cursor-zoom-in hover:border-sky-400 transition-all")}
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        })}
        <div ref={chatScrollRef}></div>
      </div>

      {chatImages.length > 0 && (
        <div className={tx("p-3 border-t border-slate-800 bg-[#050914] flex gap-3 overflow-x-auto")}>
          {chatImages.map((img, idx) => (
            <div key={idx} className={tx("relative w-20 h-14 rounded-xl overflow-hidden border border-slate-700 flex-shrink-0")}>
              <img src={img} alt="preview" className="w-full h-full object-cover" />
              <button
                type="button"
                onClick={() => removeChatImage(idx)}
                className={tx("absolute top-1 right-1 bg-black/80 hover:bg-rose-600 text-white p-0.5 rounded-full")}
              >
                <X size={10} />
              </button>
            </div>
          ))}
        </div>
      )}

      <form onSubmit={sendChatMessage} className={tx("p-3.5 border-t border-slate-800 bg-[#060B18] flex items-center gap-2.5")}>
        <input
          type="file"
          multiple
          accept="image/*"
          id="communityFileInput"
          onChange={handleCommunityFiles}
          className="hidden"
        />

        <label
          htmlFor="communityFileInput"
          title="Attach Charts or Screenshots"
          className={tx("p-2.5 bg-[#050914] border border-slate-700 hover:border-sky-400 text-slate-300 hover:text-sky-300 rounded-xl cursor-pointer flex items-center gap-1.5 text-xs font-mono transition-colors")}
        >
          <ImageIcon size={15} className={tx("text-sky-400")} />
          <span className="hidden sm:inline font-bold">Chart</span>
        </label>

        <input
          value={chatInput}
          onChange={(e) => setChatInput(e.target.value)}
          placeholder={chatUploading ? "Uploading chart image..." : t.chatPlaceholder}
          className={tx("flex-1 bg-[#050914] border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-sky-400 font-mono")}
        />

        <button 
          type="submit" 
          disabled={chatUploading}
          className={tx("p-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 rounded-xl cursor-pointer transition-all active:scale-95 shadow-md shadow-sky-500/20 font-bold")}
        >
          <Send size={15} />
        </button>
      </form>
    </div>
  );
}

function AmCrownMark({ size = 38, cyan = "#0FB9D4", light = "#FFFFFF", className = "", title = "Amiir Journal" }) {
  const rid = React.useId();
  const clipId = "amCrown" + String(rid).replace(/[^a-zA-Z0-9]/g, "");
  const { w, h, split } = AM_CROWN_VB;
  const width = Math.round((size * w) / h);
  return (
    <svg
      width={width}
      height={size}
      viewBox={"0 0 " + w + " " + h}
      className={className}
      role="img"
      aria-label={title}
      focusable="false"
      style={{ display: "block" }}
    >
      <title>{title}</title>
      <defs>
        <clipPath id={clipId}>
          <path d={AM_CROWN_D1} />
          <path d={AM_CROWN_D2} />
        </clipPath>
      </defs>
      <g clipPath={"url(#" + clipId + ")"}>
        <rect width={split} height={h} fill={cyan} />
        <rect x={split} width={w - split} height={h} fill={light} />
      </g>
    </svg>
  );
}

function LoginPage() {
  const { lang, setLang, t, theme, setTheme } = useApp();

  // Email & Password auth state (UI-only; global auth state lives in context)
  const [authMode, setAuthMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [authError, setAuthError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [guestBusy, setGuestBusy] = useState(false);
  const [rememberMe, setRememberMe] = useState(true); // default ON = Firebase default persistence
  const [showPassword, setShowPassword] = useState(false);
  const [resetBusy, setResetBusy] = useState(false);
  const [authInfo, setAuthInfo] = useState("");

  // Map Firebase error codes to clean, localized messages
  const translateAuthError = (code, fallback) => {
    const key =
      code === "auth/invalid-email" ? "authEmailInvalid"
      : code === "auth/user-not-found" ? "authUserNotFound"
      : code === "auth/wrong-password" ? "authWrongPassword"
      : code === "auth/invalid-credential" ? "authWrongPassword"
      : code === "auth/invalid-login-credentials" ? "authWrongPassword"
      : code === "auth/email-already-in-use" ? "authEmailInUse"
      : code === "auth/weak-password" ? "authWeakPassword"
      : code === "auth/missing-password" ? "authPasswordRequired"
      : code === "auth/too-many-requests" ? "authTooManyRequests"
      : code === "auth/network-request-failed" ? "authNetwork"
      : null;
    if (key && t[key]) return t[key];
    return t.authGeneric || fallback || "Authentication failed. Please try again.";
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (submitting) return;
    setAuthError("");
    setAuthInfo("");

    const em = email.trim();
    const pw = password;

    if (!em) { setAuthError(t.authEmailRequired); return; }
    if (!pw) { setAuthError(t.authPasswordRequired); return; }
    if (authMode === "signup" && !name.trim()) { setAuthError(t.authNameRequired); return; }

    setSubmitting(true);
    try {
      // Remember me: unchecked = this-browser-session-only sign-in (default keeps Firebase local persistence)
      try { await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence); } catch (e0) {}
      if (authMode === "signup") {
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        await updateProfile(cred.user, { displayName: name.trim() });
        // onAuthStateChanged fires at account creation (before the profile is
        // written), so reload once so the app renders the fresh display name.
        window.location.reload();
      } else {
        await signInWithEmailAndPassword(auth, em, pw);
      }
    } catch (err) {
      setAuthError(translateAuthError(err?.code, err?.message));
    } finally {
      setSubmitting(false);
    }
  };

  const handleGuest = async () => {
    if (guestBusy || submitting) return;
    setAuthError("");
    setGuestBusy(true);
    try {
      await signInAnonymously(auth);
    } catch (err) {
      const code = err?.code || "";
      if (code === "auth/operation-not-allowed" || code === "auth/admin-restricted-operation") {
        setAuthError(t.guestDisabled);
      } else if (code === "auth/network-request-failed") {
        setAuthError(t.authNetwork || "Network error. Please check your connection.");
      } else {
        setAuthError(t.authGeneric || "Guest sign-in failed. Please try again.");
      }
    } finally {
      setGuestBusy(false);
    }
  };

  // Send a Firebase password-reset email for the address in the email field
  const handleForgot = async () => {
    if (resetBusy || submitting) return;
    setAuthError("");
    setAuthInfo("");
    const em = email.trim();
    if (!em) { setAuthError(t.resetEmailRequired || t.authEmailRequired); return; }
    setResetBusy(true);
    try {
      await sendPasswordResetEmail(auth, em);
      setAuthInfo(t.resetSent || "Password reset email sent — check your inbox.");
    } catch (err) {
      setAuthError(translateAuthError(err && err.code, err && err.message));
    } finally {
      setResetBusy(false);
    }
  };

            <span className="aj-brand-sub">Trading Journal &amp; Analytics</span>
          </div>
        </div>

                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>

                <span>amiir_baari</span>

                </svg>
                <span>AmiirBaari</span>
              </a>
              <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className="aj-soc" aria-label="TikTok — amiir_pr">

                  <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.24 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>

    /* ══════════════════════════════════════════════════════════════════════
       6l. COMPONENT — AppShell (nav, profile menu, tab bar, FAB, footer, lightbox)
       ══════════════════════════════════════════════════════════════════════ */

function AppShell() {
  const { lang, setLang, t, isAdmin, user, tab, setTab, setTradeTypeFilter, setBacktestListOpen, activeAvatar, profileName, shortProfileName, showProfileMenu, setShowProfileMenu, updateAvatar, showForm, setShowForm, setEditingId, setForm, unlockAdminMode, lightbox, setLightbox, zoomScale, setZoomScale } = useApp();
  return (
    <div className={tx("min-h-screen bg-transparent text-slate-200 flex flex-col justify-between relative selection:bg-sky-500/20 selection:text-sky-200")}>
              <div>
                {/* FULL-WIDTH TOP NAVIGATION BAR */}
                <header className={tx("border-b border-slate-800/80 bg-[#060B18]/90 backdrop-blur-md sticky top-0 z-40")}>
                  <div className="w-full max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 py-2.5 sm:py-3 flex items-center justify-between gap-3">

                    {/* Profile Menu */}
                    <div className="relative flex-shrink-0">
                      <button type="button" onClick={() => setShowProfileMenu((open) => !open)} title="Profile settings" className="flex items-center gap-2.5 cursor-pointer">
                        <span className={tx("w-8 h-8 rounded-full overflow-hidden flex items-center justify-center border border-slate-700 hover:border-sky-400 transition-colors bg-slate-900")}>
                          {activeAvatar ? <img src={activeAvatar} alt="user" className="w-full h-full object-cover" /> : <User size={15} className={tx("text-slate-400")} />}
                        </span>
                        <span className={tx("hidden min-[420px]:inline max-w-[86px] sm:max-w-[130px] truncate text-left text-xs font-mono font-bold text-slate-200 hover:text-white")}>{shortProfileName}</span>
                      </button>
                      {showProfileMenu && (
                        <div className={tx("absolute left-0 top-[calc(100%+10px)] z-50 w-52 rounded-2xl bg-[#080E1E] border border-slate-700 shadow-2xl shadow-black/50 overflow-hidden p-2 font-mono")}>
                          <div className={tx("px-3 py-2 border-b border-slate-800 mb-1")}>
                            <div className="flex items-center gap-1.5"><span className={tx("text-[10px] font-bold text-slate-200 truncate min-w-0 flex-1")}>{profileName}</span>{user?.isAnonymous ? <span className={tx("flex-shrink-0 text-[9px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30 font-bold")}>Guest</span> : null}</div>
                            <div className={tx("text-[9px] text-slate-500 truncate")}>{user.email || "Profile settings"}</div>
                          </div>
                          <label className={tx("flex items-center gap-2 px-3 py-2 rounded-xl text-[10px] text-slate-300 hover:bg-slate-800 hover:text-sky-300 cursor-pointer transition-colors")}>
                            <ImageIcon size={13} className={tx("text-sky-400")} /> Change profile picture
                            <input type="file" accept="image/*" onChange={updateAvatar} className="hidden" />
                          </label>
                          <button type="button" onClick={() => { setTab("trash"); setShowProfileMenu(false); }} className={tx("w-full flex items-center gap-2 px-3 py-2 rounded-xl text-[10px] text-slate-300 hover:bg-slate-800 hover:text-amber-300 text-left transition-colors")}>
                            <Trash2 size={13} className={tx("text-amber-400")} /> Recovery / Trash
                          </button>
                          <button type="button" onClick={() => signOut(auth)} className={tx("w-full flex items-center gap-2 px-3 py-2 rounded-xl text-[10px] text-slate-300 hover:bg-rose-500/10 hover:text-rose-300 text-left transition-colors")}>
                            <LogOut size={13} className={tx("text-rose-400")} /> Logout
                          </button>
                        </div>
                      )}
                    </div>

                    {/* Brand lockup — mobile/tablet only; the sidebar owns branding on desktop */}
                    <button
                      type="button"
                      onClick={() => setTab("journal")}
                      title="Amiir Journal — home"
                      aria-label="Amiir Journal — go to journal"
                      className="flex items-center gap-2 flex-shrink-0 cursor-pointer group"
                    >
                      <span className={tx("flex items-center justify-center w-8 h-8 rounded-xl bg-[#050B16] border border-sky-500/30 shadow-md shadow-sky-500/20 group-hover:border-sky-400/60 transition-colors")}>
                        <AmCrownMark size={19} title="Amiir Journal" />
                      </span>
                      <span className="flex flex-col leading-tight text-left min-w-0">
                        <span className={tx("text-[13.5px] font-extrabold tracking-tight text-slate-100 group-hover:text-white transition-colors truncate max-w-[130px] sm:max-w-none")}>Amiir Journal</span>
                      </span>
                    </button>

                    {/* Right Header Actions */}
                    <div className="flex items-center gap-2 sm:gap-3 flex-shrink-0">

                      {/* Language Toggle */}
                      <button
                        type="button"
                        onClick={() => setLang(lang === "en" ? "so" : "en")}
                        className={tx("flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-sky-500/40 text-[11px] font-mono text-slate-300 transition-all cursor-pointer")}
                        title="Change language"
                      >
                        <Globe size={13} className={tx("text-sky-400")} />
                        <span className="font-bold">{lang.toUpperCase()}</span>
                      </button>

                      {/* Theme Toggle */}
                      <ThemeToggle />

                      {/* + New Trade Button */}
                      <button
                        type="button"
                        onClick={() => {
                          if (showForm) { setShowForm(false); setEditingId(null); setForm(EMPTY_FORM); }
                          else {
                            setShowForm(true);
                            if (tab === "backtest") setForm((current) => ({ ...current, tradeType: "backtest" }));
                          }
                        }}
                        className={tx("flex items-center justify-center gap-2 w-10 sm:w-auto px-0 sm:px-5 py-2.5 rounded-xl text-xs font-bold bg-sky-500 text-white cursor-pointer font-mono")}
                      >
                        {showForm ? <X size={15} className="stroke-[2.6]" /> : <Plus size={15} className="stroke-[2.6]" />}
                        <span className="hidden sm:inline small-caps tracking-wider">{showForm ? t.cancel : t.newTrade}</span>
                      </button>
                    </div>
                  </div>
                </header>

                {/* FULL-WIDTH RESPONSIVE MAIN CONTAINER */}
                <main className="w-full max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-9 xl:px-12 py-7 sm:py-9 pb-32 relative z-10">

                  {/* TOP TABS NAVIGATION BAR */}
                  <div className={tx("pm-tabrail flex items-center gap-1.5 bg-[#080E1E] p-2.5 rounded-2xl border border-slate-800/90 mb-8 overflow-x-auto no-scrollbar w-full")}>
                    {[
                      /* icon = what the section actually means; tone = 3D plate hue */
                      { id: "journal", label: t.journal, icon: NotebookPen, visible: true },
                      { id: "dashboard", label: t.dashboard, icon: LayoutGrid, visible: true },
                      { id: "accounts", label: t.accounts, icon: Wallet, visible: true },
                      { id: "backtest", label: "Backtest", icon: FlaskConical, visible: true },
                      { id: "admin", label: t.admin, icon: ShieldCheck, visible: isAdmin, isAdminTab: true, tone: "rose" },
                      { id: "updates", label: t.updates, icon: Sparkles, visible: true, isGold: true, tone: "amber" },
                      { id: "notes", label: t.notes, icon: BookOpen, visible: true },
                      { id: "mentor", label: "AI Mentor", icon: Bot, visible: true, isMentor: true, tone: "cyan" },
                      { id: "community", label: t.community, icon: Users, visible: true }
                    ].filter(tabItem => tabItem.visible).map((item) => (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => {
                          setTab(item.id);
                          if (item.id === "journal") setTradeTypeFilter("all");
                          if (item.id === "backtest") { setTradeTypeFilter("backtest"); setBacktestListOpen(false); }
                        }}
                        className={tx(`pm-tab ${tab === item.id ? "is-on" : ""} flex items-center gap-2 pl-2 pr-3.5 py-2 rounded-xl text-xs font-semibold cursor-pointer whitespace-nowrap flex-shrink-0 font-mono small-caps ${
                          tab === item.id 
                            ? item.isAdminTab
                              ? "bg-rose-500/20 text-rose-300 border border-rose-500/40"
                              : item.isGold
                              ? "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                              : item.isTrash
                              ? "bg-rose-500/20 text-rose-300 border border-rose-500/40"
                              : item.isMentor
                              ? "bg-cyan-500/20 text-cyan-300 border border-cyan-500/40"
                              : "bg-sky-500/20 text-sky-300 border border-sky-500/40" 
                            : "text-slate-400 hover:text-slate-200 hover:bg-slate-900/40 border border-transparent"
                        }`)}
                      >
                        <span className={`pm-i3d${item.tone ? " pm-i3d-" + item.tone : ""}`} aria-hidden="true">
                          <item.icon size={13} strokeWidth={2.2} />
                        </span>
                        <span>{item.label}</span>
                      </button>
                    ))}
                  </div>

              <div key={showForm ? "form" : tab} className="pm-view">
                {showForm && <TradeForm />}
                {(tab === "journal" || tab === "backtest") && <Journal />}
                {tab === "dashboard" && <Dashboard />}
                {tab === "accounts" && <Accounts />}
                {tab === "admin" && isAdmin && <Admin />}
                {tab === "updates" && <Updates />}
                {tab === "mentor" && <Mentor />}
                {tab === "trash" && <Trash />}
                {tab === "notes" && <Notes />}
                {tab === "community" && <Community />}
              </div>
            </main>
          </div>


          {/* COMPACT FLOATING (+) BUTTON FOR MOBILE */}
          <button
            type="button"
            onClick={() => {
              setShowForm(!showForm);
              if (showForm) { setEditingId(null); setForm(EMPTY_FORM); }
              else { window.scrollTo({ top: 0, behavior: 'smooth' }); }
            }}
            className={tx("fixed bottom-6 right-5 sm:hidden z-40 w-12 h-12 rounded-full bg-sky-500 text-slate-950 flex items-center justify-center shadow-xl shadow-sky-500/40 border border-sky-400 active:scale-90 transition-all cursor-pointer")}
            title="Toggle Trade Form"
          >
            {showForm ? <X size={20} className="stroke-[2.5]" /> : <Plus size={22} className="stroke-[2.5]" />}
          </button>

          {/* FOOTER */}
          <footer className={tx("py-6 border-t border-slate-800/80 text-center text-xs text-slate-500 font-mono")}>
            <span className="inline-flex items-center justify-center gap-2 flex-wrap">
              <AmCrownMark size={16} title="Amiir Journal" />
              <span>Amiir Journal · {t.devBy} <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className={tx("text-sky-400 hover:text-sky-300 font-semibold underline underline-offset-2")}>@amiir_pr</a></span>
            </span>
          </footer>

          {/* LIGHTBOX MODAL WITH ZOOM */}
          {lightbox && (
            <div
              onClick={() => { setLightbox(null); setZoomScale(1); }}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 zoom-container select-none"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className={tx("absolute top-4 right-4 flex items-center gap-2 bg-[#080E1E] border border-slate-700 px-3 py-1.5 rounded-2xl z-50 text-white font-mono text-xs shadow-2xl")}
              >
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.max(0.5, z - 0.25))}
                  className={tx("p-1 hover:text-sky-400 cursor-pointer")}
                  title="Zoom Out"
                >
                  <ZoomOut size={16} />
                </button>
                <span className="text-[11px] min-w-[36px] text-center font-bold">{Math.round(zoomScale * 100)}%</span>
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.min(3.5, z + 0.25))}
                  className={tx("p-1 hover:text-sky-400 cursor-pointer")}
                  title="Zoom In"
                >
                  <ZoomIn size={16} />
                </button>
                <button
                  type="button"
                  onClick={() => setZoomScale(1)}
                  className={tx("p-1 hover:text-sky-400 ml-1 cursor-pointer")}
                  title="Reset Zoom"
                >
                  <RotateCcw size={14} />
                </button>
                <button
                  type="button"
                  onClick={() => { setLightbox(null); setZoomScale(1); }}
                  className={tx("p-1 hover:text-rose-400 ml-1 cursor-pointer")}
                  title="Close"
                >
                  <X size={16} />
                </button>
              </div>

              <div 
                onClick={(e) => { e.stopPropagation(); setZoomScale((z) => z === 1 ? 2 : 1); }} 
                className="overflow-auto max-w-full max-h-[85vh] flex items-center justify-center cursor-zoom-in"
              >
                <img 
                  src={lightbox} 
                  alt="Full Chart" 
                  style={{ transform: `scale(${zoomScale})`, transition: 'transform 0.15s ease-out' }}
                  className={tx("max-w-full max-h-[85vh] rounded-2xl shadow-2xl border border-slate-800 object-contain origin-center")} 
                />
              </div>
            </div>
          )}
        </div>
  );
}

    /* ══════════════════════════════════════════════════════════════════════
       7. APP ROOT — auth gate (loading → login → shell)
       ══════════════════════════════════════════════════════════════════════ */

function App() {
  const { authLoading, user } = useApp();

  if (authLoading) {
    return (
      <div className={tx("min-h-screen flex flex-col items-center justify-center bg-[#030712] relative overflow-hidden")}>
        <div className="absolute inset-0 bg-radial-at-c from-sky-500/10 via-transparent to-transparent"></div>
        <div className="relative flex flex-col items-center gap-3">
          <div className="w-10 h-10 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
          <span className={tx("font-mono text-xs text-sky-400 font-semibold tracking-widest uppercase")}>Preparing your journal...</span>
        </div>
      </div>
    );
  }

  if (!user) {
    return <LoginPage />;
  }

  return <AppShell />;
}
