  <!-- Theme: Light / Dark (dark default) — resolved before first paint (no flash) -->
  <script>
    window.__amiirTheme = (function () {
      var KEY = "amiir_theme";
      var meta = null;
      function system() {
        try { return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
        catch (e) { return "dark"; }
      }
      function get() {
        try { var v = localStorage.getItem(KEY); if (v !== "light" && v !== "dark") { v = "dark"; try { localStorage.setItem(KEY, "dark"); } catch (e2) {} } return v; } catch (e) { return "dark"; }
      }
      function resolve(pref) {
        pref = pref || get();
        if (pref !== "light" && pref !== "dark") return "dark";
        return pref;
      }
      function apply() {
        var r = resolve();
        var el = document.documentElement;
        el.classList.toggle("light", r === "light");
        el.classList.toggle("dark", r !== "light");
        try { el.style.colorScheme = r; } catch (e) {}
        if (!meta) meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", r === "light" ? "#F1F5F9" : "#030712");
        try { window.dispatchEvent(new CustomEvent("amiir-theme", { detail: { pref: get(), resolved: r } })); } catch (e) {}
        return r;
      }
      function set(pref) {
        try { localStorage.setItem(KEY, pref); } catch (e) {}
        return apply();
      }
      apply();
      return { get: get, resolve: resolve, apply: apply, set: set, system: system };
    })();
  </script>

      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(14, 165, 233, 0.09);
      box-shadow: 0 0 20px -8px rgba(56, 189, 248, 0.45);
      transform: translateY(-1px);
    }
    .aj-oauth-btn:active { transform: scale(0.985); }
    .aj-oauth-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .aj-oauth-btn svg { flex: 0 0 auto; }
    .aj-oauth-btn .aj-g { width: 16px; height: 16px; }
    .aj-guest-hint { margin-top: 0.6rem; text-align: center; font-size: 10px; color: #566480; }

    /* Mode switch footer */
    .aj-switch {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; margin-top: 0.95rem; padding: 0.72rem 0.9rem;
      border-radius: 12px; cursor: pointer;
      font-size: 12px; font-weight: 500; color: #8296B6;
      background: rgba(14, 165, 233, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.14);
      transition: all .2s ease;
    }
    .aj-switch b { color: #7DD3FC; font-weight: 700; }
    .aj-switch svg:first-child { color: #38BDF8; flex: 0 0 auto; }
    .aj-switch-arrow { transition: transform .2s ease; color: #38BDF8; }
    .aj-switch:hover { border-color: rgba(56, 189, 248, 0.4); background: rgba(14, 165, 233, 0.1); }
    .aj-switch:hover .aj-switch-arrow { transform: translateX(3px); }

    /* Connect row */
    .aj-connect { width: 100%; max-width: 27rem; margin-top: 1.6rem; position: relative; z-index: 3; }
    .aj-connect-label {
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: #5B6B86;
    }
    .aj-connect-label svg { color: #38BDF8; }
    .aj-socials { display: flex; align-items: center; justify-content: center; gap: 0.55rem; margin-top: 0.8rem; flex-wrap: wrap; }
    .aj-soc {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.5rem 0.75rem; border-radius: 11px;
      font-size: 11px; font-weight: 600; color: #8DA0BC; text-decoration: none;
      background: rgba(13, 23, 46, 0.5); border: 1px solid rgba(51, 65, 85, 0.5);
      transition: all .2s ease;
    }
    .aj-soc svg { color: #38BDF8; transition: transform .2s ease; }
    .aj-soc:hover { color: #E2E8F0; border-color: rgba(56, 189, 248, 0.45); background: rgba(14, 165, 233, 0.08); transform: translateY(-1px); }
    .aj-soc:hover svg { transform: scale(1.12); }
    .aj-copy { margin-top: 1.15rem; text-align: center; font-size: 10.5px; color: #475573; }

    /* ── Small phones ───────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .aj-brand-name { font-size: 13.5px; }
      .aj-brand-sub { font-size: 8px; letter-spacing: 0.16em; }
      .aj-pill-btn { padding: 0.42rem 0.6rem; }
      .aj-oauth-btn { font-size: 11.5px; padding: 0.72rem 0.5rem; }
      .aj-card-title { font-size: 1.3rem; }
    }
    @media (max-width: 430px) {
      .aj-oauth { grid-template-columns: 1fr; }
      .aj-soc span { display: none; }
      .aj-soc { padding: 0.55rem 0.65rem; }
    }

    /* ── Tablet ─────────────────────────────────────────────────────── */
    @media (min-width: 640px) {
      .aj-nav { padding: 0.95rem 1.75rem; }
      .aj-hero { min-height: 17rem; }
      .aj-hero-title { font-size: clamp(2rem, 4.6vw, 2.9rem); }
      .aj-card { padding: 1.8rem 1.7rem 1.6rem; }
      .aj-secure-chip { display: inline-flex; }
    }

    /* ── Desktop split-screen ───────────────────────────────────────── */
    @media (min-width: 1024px) {
      .aj-nav { padding: 0.9rem 2.5rem; }
      .aj-links { display: flex; }
      .aj-main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }

      .aj-hero { min-height: 0; background-position: 60% 38%; }
      .aj-hero-veil {
        background:
          linear-gradient(90deg, rgba(3, 8, 22, 0.42) 0%, rgba(3, 8, 22, 0.18) 45%, rgba(4, 9, 24, 0.92) 100%),
          linear-gradient(180deg, rgba(3, 8, 22, 0.5) 0%, rgba(3, 8, 22, 0.16) 45%, rgba(3, 8, 22, 0.6) 100%);
      }
      .aj-hero-body {
        align-items: flex-start; text-align: left;
        justify-content: center;
        padding: 3.5rem 3.25rem 6.5rem;
        max-width: 42rem;
      }
      .aj-eyebrow { justify-content: flex-start; font-size: 10px; }
      .aj-hero-title { font-size: clamp(2.4rem, 3.3vw, 3.35rem); margin-top: 1rem; }
      .aj-hero-sub { font-size: 13.5px; max-width: 25rem; margin-top: 1rem; }

      .aj-feats {
        display: flex; flex-direction: column; gap: 1.05rem;
        margin-top: 2.1rem; padding: 0; list-style: none;
      }
      .aj-feats li { display: flex; align-items: center; gap: 0.85rem; }
      .aj-feat-ic {
        flex: 0 0 auto;
        display: inline-flex; align-items: center; justify-content: center;
        width: 38px; height: 38px; border-radius: 11px;
        color: #38BDF8;
        background: linear-gradient(160deg, rgba(14, 165, 233, 0.16), rgba(14, 165, 233, 0.05));
        border: 1px solid rgba(56, 189, 248, 0.24);
        box-shadow: 0 0 20px -8px rgba(56, 189, 248, 0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      }
      .aj-feats b { display: block; font-size: 13px; font-weight: 700; color: #F1F5F9; letter-spacing: -0.01em; }
      .aj-feats i { display: block; font-style: normal; font-size: 11.5px; color: #93A4C0; margin-top: 1px; }

      .aj-signature {
        display: block;
        position: absolute; left: 3.25rem; bottom: 3.4rem; z-index: 2;
        font-family: 'Caveat', cursive; font-weight: 600;
        font-size: 2rem; line-height: 1.15;
        color: #7DD3FC;
        text-shadow: 0 0 26px rgba(56, 189, 248, 0.55), 0 0 60px rgba(34, 211, 238, 0.25);
        transform: rotate(-4deg);
        pointer-events: none;
      }
      .aj-signature span { display: block; }
      .aj-hero-foot {
        display: flex; align-items: center; justify-content: space-between;
        position: absolute; z-index: 2;
        left: 3.25rem; right: 3.25rem; bottom: 1.5rem;
        padding-top: 0.9rem;
        border-top: 1px solid rgba(71, 85, 105, 0.35);
        font-size: 10.5px; color: #64748B;
      }

      .aj-auth { padding: 0 2.5rem; justify-content: center; border-left: 1px solid rgba(56, 189, 248, 0.07); }
      .aj-card { margin-top: 0; padding: 1.7rem 1.8rem 1.5rem; }
      .aj-connect { margin-top: 1.15rem; margin-bottom: 0; }
      .aj-copy { display: none; }
    }
    @media (min-width: 1280px) {
      .aj-main { grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); }
      .aj-card, .aj-connect { max-width: 28rem; }
    }


    /* ══════════════════════════════════════════════════════════════════════
       PREMIUM DESIGN SYSTEM v3 — luxury fintech SaaS layer (pm-*)
       Applies to BOTH themes. Light = icy-blue premium; dark = refined navy.
       Structure-preserving: restyles existing atoms, adds no new sections.
       ══════════════════════════════════════════════════════════════════════ */

    :root {
      /* ── Premium blue ramp ── */
      --pm-50:  #F2F8FF;
      --pm-100: #E3F0FE;
      --pm-200: #C7E1FD;
      --pm-300: #9BCBFB;
      --pm-400: #5FA9F5;
      --pm-500: #2E87EA;
      --pm-600: #1A6AD4;
      --pm-700: #1553AC;
      --pm-800: #133F80;
      --pm-900: #0F2C57;

      /* ── Financial states (muted, professional) ── */
      --pm-up:    #0E9F6E;
      --pm-up-sf: #E6F7F0;
      --pm-dn:    #E02D4B;
      --pm-dn-sf: #FDECEF;

      /* ── Motion ── */
      --pm-ease:  cubic-bezier(.16, 1, .3, 1);
      --pm-swift: cubic-bezier(.4, 0, .2, 1);
      --pm-t-fast: .16s;
      --pm-t-mid:  .26s;
      --pm-t-slow: .42s;

      /* ── Radii ── */
      --pm-r-sm: 10px;
      --pm-r-md: 14px;
      --pm-r-lg: 18px;
      --pm-r-xl: 24px;

      /* ── Elevation (dark default) ── */
      --pm-sh-1: 0 1px 2px rgba(0,0,0,.28), 0 2px 8px -2px rgba(0,0,0,.34);
      --pm-sh-2: 0 4px 18px -4px rgba(0,0,0,.48), 0 1px 3px rgba(0,0,0,.30);
      --pm-sh-3: 0 12px 36px -10px rgba(0,0,0,.58), 0 2px 8px rgba(0,0,0,.34);
      --pm-glow: 0 0 0 1px rgba(46,135,234,.22), 0 10px 34px -12px rgba(46,135,234,.42);

      /* ── Surfaces (dark default) ── */
      --pm-surface:    #0A1120;
      --pm-surface-2:  #0D1526;
      --pm-hairline:   rgba(148,178,255,.10);
      --pm-hairline-s: rgba(148,178,255,.17);
      --pm-ink:        #E8EEF8;
      --pm-ink-soft:   #9FB0CA;
    }

    /* ── Light mode: bright icy-blue premium system ── */
    html.light {
      --pm-sh-1: 0 1px 2px rgba(17,38,73,.05), 0 2px 8px -2px rgba(17,38,73,.06);
      --pm-sh-2: 0 2px 6px -1px rgba(17,38,73,.07), 0 10px 26px -10px rgba(17,38,73,.12);
      --pm-sh-3: 0 4px 10px -2px rgba(17,38,73,.08), 0 20px 46px -16px rgba(17,38,73,.16);
      --pm-glow: 0 0 0 1px rgba(46,135,234,.18), 0 14px 38px -14px rgba(46,135,234,.30);

      --pm-surface:    #FFFFFF;
      --pm-surface-2:  #F7FAFF;
      --pm-hairline:   #E4ECF7;
      --pm-hairline-s: #D3E1F3;
      --pm-ink:        #0F1E36;
      --pm-ink-soft:   #5A6B85;
    }

    /* ══════════ 1. AMBIENT BACKGROUND ══════════ */

    /* Light: soft icy-blue field with gentle drifting aurora */
    html.light body {
      background-color: #F7FBFF;
      background-image:
        /* white core light — the page reads as lit from within */
        radial-gradient(ellipse 96% 58% at 50% 26%,  rgba(255,255,255,.95), transparent 72%),
        /* soft sky bloom from the top */
        radial-gradient(ellipse 130% 50% at 50% -20%, rgba(120,183,248,.20), transparent 64%),
        /* gentle corner reflections */
        radial-gradient(ellipse 58% 40% at 102% 6%,  rgba(168,211,252,.20), transparent 62%),
        radial-gradient(ellipse 64% 44% at -6% 30%,  rgba(206,230,253,.26), transparent 64%),
        /* faint floor tint so the page doesn't end flat */
        radial-gradient(ellipse 92% 36% at 50% 106%, rgba(46,135,234,.07),  transparent 68%),
        linear-gradient(180deg, #FDFEFF 0%, #F5FAFF 40%, #EFF6FE 72%, #EAF3FD 100%);
      color: #0F1E36;
    }
    /* Very slow luminous drift — 40s, opacity-only, no layout cost */
    html.light body::before {
      content: "";
      position: fixed; inset: -20% -10% auto -10%; height: 78vh;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 52% 60% at 22% 30%, rgba(147,197,253,.16), transparent 66%),
        radial-gradient(ellipse 48% 56% at 78% 22%, rgba(186,222,253,.18), transparent 66%);
      animation: pm-lumen 40s ease-in-out infinite alternate;
    }
    @keyframes pm-lumen {
      from { opacity: .55; transform: translate3d(-1.2%, 0, 0) scale(1); }
      to   { opacity: .95; transform: translate3d(1.2%, 1.5%, 0) scale(1.05); }
    }

    /* Dark: deep navy with the same light architecture */
    body {
      background-color: #050A16;
      background-image:
        radial-gradient(ellipse 120% 52% at 50% -18%, rgba(46,135,234,.16), transparent 62%),
        radial-gradient(ellipse 62% 42% at 100% 8%,  rgba(26,106,212,.10), transparent 60%),
        radial-gradient(ellipse 70% 46% at -8% 32%,  rgba(21,83,172,.09),  transparent 62%),
        linear-gradient(180deg, #060C1A 0%, #050A16 55%, #04081340 100%);
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Living aurora veil — extremely subtle, fixed, non-interactive */
    body::before {
      content: "";
      position: fixed; inset: -25% -10% auto -10%;
      height: 78vh; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 46% 56% at 22% 28%, rgba(95,169,245,.15), transparent 68%),
        radial-gradient(ellipse 40% 50% at 78% 16%, rgba(155,203,251,.13), transparent 66%);
      filter: blur(48px);
      opacity: .85;
      animation: pm-drift 26s ease-in-out infinite alternate;
    }
    html.light body::before {
      background:
        radial-gradient(ellipse 46% 56% at 22% 28%, rgba(95,169,245,.30), transparent 68%),
        radial-gradient(ellipse 40% 50% at 78% 16%, rgba(126,186,248,.24), transparent 66%);
      opacity: .95;
    }
    @keyframes pm-drift {
      0%   { transform: translate3d(0,0,0) scale(1); }
      50%  { transform: translate3d(2.2%, 1.4%, 0) scale(1.05); }
      100% { transform: translate3d(-1.8%, 2.4%, 0) scale(1.02); }
    }

    /* ══════════ 2. TYPOGRAPHY ══════════ */

    h1, h2, h3, h4, h5 { letter-spacing: -0.022em; }
    .font-display { font-family: 'Sora', 'Inter', sans-serif; letter-spacing: -0.03em; }

    /* Financial numerals: tighter, more confident */
    .font-mono, .tnum, .calendar-number, .calendar-pnl {
      font-variant-numeric: tabular-nums lining-nums;
      letter-spacing: -0.016em;
    }

    /* Small-caps labels read as premium metadata, not shouting */
    .small-caps { letter-spacing: 0.055em; font-variant: all-small-caps; }

    html.light body { color: #0F1E36; }
    html.light .text-\[\#0F172A\] { color: #0F1E36; }

    /* ══════════ 3. PREMIUM CARDS ══════════ */

    .terminal-card {
      background: linear-gradient(168deg, rgba(16,26,46,.96) 0%, rgba(10,17,32,.98) 100%);
      border: 1px solid var(--pm-hairline);
      border-radius: var(--pm-r-lg);
      box-shadow: var(--pm-sh-2);
      transition:
        transform var(--pm-t-mid) var(--pm-ease),
        box-shadow var(--pm-t-mid) var(--pm-ease),
        border-color var(--pm-t-mid) var(--pm-ease),
        background-color var(--pm-t-mid) var(--pm-ease);
      position: relative;
    }
    /* Specular top edge — the "expensive" tell.
       Must sit BEHIND card content (z-index 0 vs. auto) or it veils the text. */
    .terminal-card > * { position: relative; z-index: 1; }
    .terminal-card::after {
      content: "";
      position: absolute; left: 0; right: 0; top: 0; height: 38%;
      border-radius: inherit;
      pointer-events: none; z-index: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 100%);
    }
    .terminal-card:hover {
      transform: translateY(-2px);
      border-color: var(--pm-hairline-s);
      box-shadow: var(--pm-sh-3), var(--pm-glow);
    }

    html.light .terminal-card:not(.tdi *) {
      background: linear-gradient(168deg, #FFFFFF 0%, #FBFDFF 100%);
      border: 1px solid var(--pm-hairline);
      border-radius: var(--pm-r-lg);
      box-shadow: var(--pm-sh-2);
    }
    html.light .terminal-card::after {
      background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 100%);
    }
    html.light .terminal-card:hover:not(.tdi *) {
      transform: translateY(-2px);
      border-color: rgba(95,169,245,.42);
      box-shadow: var(--pm-sh-3), var(--pm-glow);
    }

    .terminal-elevated {
      background: linear-gradient(168deg, rgba(20,32,56,.92) 0%, rgba(13,21,38,.96) 100%);
      border: 1px solid var(--pm-hairline-s);
      border-radius: var(--pm-r-md);
    }
    html.light .terminal-elevated:not(.tdi *) {
      background: linear-gradient(168deg, #F8FBFF 0%, #F2F7FE 100%);
      border: 1px solid var(--pm-hairline);
    }

    /* ══════════ 4. MOTION LIBRARY ══════════ */

    @keyframes pm-fade-up {
      from { opacity: 0; transform: translate3d(0, 12px, 0); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pm-scale-in {
      from { opacity: 0; transform: scale(.975) translate3d(0,6px,0); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pm-sheen {
      from { transform: translateX(-120%) skewX(-18deg); }
      to   { transform: translateX(240%) skewX(-18deg); }
    }
    @keyframes pm-shimmer {
      from { background-position: -420px 0; }
      to   { background-position: 420px 0; }
    }

    .pm-view    { animation: pm-fade-up var(--pm-t-slow) var(--pm-ease) both; }
    .pm-in      { animation: pm-fade-in var(--pm-t-mid) var(--pm-swift) both; }
    .pm-pop     { animation: pm-scale-in var(--pm-t-mid) var(--pm-ease) both; }

    /* Staggered reveal for grids/rows (cheap, index-free) */
    .pm-stagger > * { animation: pm-fade-up .5s var(--pm-ease) both; }
    .pm-stagger > *:nth-child(1) { animation-delay: .02s; }
    .pm-stagger > *:nth-child(2) { animation-delay: .06s; }
    .pm-stagger > *:nth-child(3) { animation-delay: .10s; }
    .pm-stagger > *:nth-child(4) { animation-delay: .14s; }
    .pm-stagger > *:nth-child(5) { animation-delay: .18s; }
    .pm-stagger > *:nth-child(6) { animation-delay: .22s; }
    .pm-stagger > *:nth-child(7) { animation-delay: .26s; }
    .pm-stagger > *:nth-child(8) { animation-delay: .30s; }
    .pm-stagger > *:nth-child(n+9) { animation-delay: .34s; }

    /* ══════════ 5. BUTTONS & INTERACTIVE ATOMS ══════════ */

    button, [role="button"], a { -webkit-tap-highlight-color: transparent; }

    button:not(.pm-raw) {
      transition:
        transform var(--pm-t-fast) var(--pm-swift),
        box-shadow var(--pm-t-mid) var(--pm-ease),
        background-color var(--pm-t-mid) var(--pm-ease),
        border-color var(--pm-t-mid) var(--pm-ease),
        color var(--pm-t-mid) var(--pm-ease),
        opacity var(--pm-t-fast) var(--pm-swift);
    }
    button:not(:disabled):not(.pm-raw):active { transform: translateY(.5px) scale(.985); }

    /* Primary sky/blue buttons → premium gradient + lift + sheen */
    button.bg-sky-500:not(.pm-raw),
    button.bg-sky-600:not(.pm-raw),
    button.bg-blue-600:not(.pm-raw) {
      position: relative; overflow: hidden;
      background-image: linear-gradient(135deg, #3D93EE 0%, #1A6AD4 54%, #1553AC 100%);
      border-color: rgba(95,169,245,.46);
      box-shadow:
        0 1px 0 rgba(255,255,255,.22) inset,
        0 6px 18px -6px rgba(26,106,212,.62),
        0 1px 2px rgba(10,22,44,.22);
      color: #FFFFFF;
      letter-spacing: .005em;
    }
    button.bg-sky-500:not(.pm-raw):hover,
    button.bg-sky-600:not(.pm-raw):hover,
    button.bg-blue-600:not(.pm-raw):hover {
      transform: translateY(-1.5px);
      box-shadow:
        0 1px 0 rgba(255,255,255,.26) inset,
        0 12px 28px -8px rgba(26,106,212,.72),
        0 2px 6px rgba(10,22,44,.24);
      background-image: linear-gradient(135deg, #4F9FF2 0%, #2277DE 54%, #1A5DBC 100%);
    }
    /* Light sweep on hover — subtle, one pass */
    button.bg-sky-500:not(.pm-raw)::before,
    button.bg-sky-600:not(.pm-raw)::before,
    button.bg-blue-600:not(.pm-raw)::before {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 0; width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
      transform: translateX(-120%) skewX(-18deg);
      pointer-events: none;
    }
    button.bg-sky-500:not(.pm-raw):hover::before,
    button.bg-sky-600:not(.pm-raw):hover::before,
    button.bg-blue-600:not(.pm-raw):hover::before {
      animation: pm-sheen .78s var(--pm-ease);
    }

    /* Secondary / ghost buttons */
    html.light button.bg-\[\#E8EDF4\]:not(.pm-raw),
    html.light button.bg-\[\#EDF1F7\]:not(.pm-raw) {
      background: rgba(255,255,255,.86);
      border-color: var(--pm-hairline);
      box-shadow: var(--pm-sh-1);
    }
    html.light button.bg-\[\#E8EDF4\]:not(.pm-raw):hover,
    html.light button.bg-\[\#EDF1F7\]:not(.pm-raw):hover {
      background: #FFFFFF;
      border-color: rgba(95,169,245,.40);
      box-shadow: var(--pm-sh-2);
    }

    /* ══════════ 6. ICONS — soft 3D fintech treatment ══════════ */

    /* Icon plates: any rounded square holding a single icon */
    .pm-ico {
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
      border-radius: 12px;
      background: linear-gradient(150deg, rgba(95,169,245,.20) 0%, rgba(26,106,212,.13) 100%);
      border: 1px solid rgba(95,169,245,.26);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -2px 6px -2px rgba(10,30,70,.30),
        0 4px 12px -4px rgba(26,106,212,.36);
      transition: transform var(--pm-t-mid) var(--pm-ease), box-shadow var(--pm-t-mid) var(--pm-ease);
    }
    html.light .pm-ico {
      background: linear-gradient(150deg, #FFFFFF 0%, #E8F2FE 100%);
      border-color: rgba(95,169,245,.34);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -2px 6px -2px rgba(46,135,234,.18),
        0 4px 12px -4px rgba(46,135,234,.26);
    }
    .pm-ico:hover { transform: translateY(-1px); }
    .terminal-card:hover .pm-ico { transform: translateY(-1.5px) scale(1.04); }

    /* Tone variants — soft 3D material per financial state */
    .pm-ico-sky {
      background: linear-gradient(150deg, rgba(95,169,245,.22) 0%, rgba(26,106,212,.14) 100%);
      border-color: rgba(95,169,245,.30);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.17), inset 0 -2px 6px -2px rgba(10,30,70,.30), 0 4px 12px -4px rgba(26,106,212,.38);
    }
    .pm-ico-emerald {
      background: linear-gradient(150deg, rgba(52,211,153,.20) 0%, rgba(14,159,110,.13) 100%);
      border-color: rgba(52,211,153,.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 6px -2px rgba(6,58,40,.30), 0 4px 12px -4px rgba(14,159,110,.34);
    }
    .pm-ico-rose {
      background: linear-gradient(150deg, rgba(251,113,133,.20) 0%, rgba(224,45,75,.13) 100%);
      border-color: rgba(251,113,133,.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 6px -2px rgba(70,8,22,.30), 0 4px 12px -4px rgba(224,45,75,.32);
    }
    .pm-ico-slate {
      background: linear-gradient(150deg, rgba(148,178,255,.13) 0%, rgba(100,130,190,.09) 100%);
      border-color: rgba(148,178,255,.20);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 6px -2px rgba(10,20,40,.28), 0 4px 12px -4px rgba(40,70,120,.26);
    }
    html.light .pm-ico-sky {
      background: linear-gradient(150deg, #FFFFFF 0%, #DFEEFE 100%);
      border-color: rgba(95,169,245,.40);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.98), inset 0 -2px 6px -2px rgba(46,135,234,.20), 0 4px 12px -4px rgba(46,135,234,.28);
    }
    html.light .pm-ico-emerald {
      background: linear-gradient(150deg, #FFFFFF 0%, #DCF5EA 100%);
      border-color: rgba(14,159,110,.32);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.98), inset 0 -2px 6px -2px rgba(14,159,110,.18), 0 4px 12px -4px rgba(14,159,110,.24);
    }
    html.light .pm-ico-rose {
      background: linear-gradient(150deg, #FFFFFF 0%, #FDE3E9 100%);
      border-color: rgba(224,45,75,.30);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.98), inset 0 -2px 6px -2px rgba(224,45,75,.16), 0 4px 12px -4px rgba(224,45,75,.22);
    }
    html.light .pm-ico-slate {
      background: linear-gradient(150deg, #FFFFFF 0%, #EAF1FA 100%);
      border-color: rgba(150,180,215,.42);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.98), inset 0 -2px 6px -2px rgba(60,95,150,.14), 0 4px 12px -4px rgba(60,95,150,.20);
    }
    .pm-ico svg { filter: drop-shadow(0 1px 1.5px rgba(10,30,70,.22)); }

    /* Give every lucide icon a whisper of depth + smooth colour transitions */
    svg.lucide, .terminal-card svg, header svg, main svg {
      transition: color var(--pm-t-mid) var(--pm-ease), transform var(--pm-t-mid) var(--pm-ease),
                  opacity var(--pm-t-mid) var(--pm-ease);
      vector-effect: non-scaling-stroke;
    }
    button:hover > svg:first-child:last-child { transform: scale(1.06); }

    /* ══════════ 7. INPUTS ══════════ */

    input:not([type="checkbox"]):not([type="radio"]), select, textarea {
      transition:
        border-color var(--pm-t-mid) var(--pm-ease),
        box-shadow var(--pm-t-mid) var(--pm-ease),
        background-color var(--pm-t-mid) var(--pm-ease);
    }
    input:not([type="checkbox"]):not([type="radio"]):focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(95,169,245,.62) !important;
      box-shadow: 0 0 0 3.5px rgba(95,169,245,.15);
    }
    html.light input:not([type="checkbox"]):not([type="radio"]):focus,
    html.light select:focus, html.light textarea:focus {
      box-shadow: 0 0 0 3.5px rgba(46,135,234,.13);
      background: #FFFFFF;
    }

    /* ══════════ 8. TABLES & ROWS ══════════ */

    tbody tr, .pm-row {
      transition: background-color var(--pm-t-fast) var(--pm-swift),
                  transform var(--pm-t-fast) var(--pm-swift),
                  box-shadow var(--pm-t-mid) var(--pm-ease);
    }
    html.light tbody tr:hover { background: rgba(232,242,254,.62); }
    tbody tr:hover { background: rgba(95,169,245,.055); }

    /* ══════════ 9. NAVIGATION ══════════ */

    header.sticky, header[class*="sticky"] {
      backdrop-filter: saturate(150%) blur(18px);
      -webkit-backdrop-filter: saturate(150%) blur(18px);
      transition: background-color var(--pm-t-slow) var(--pm-ease),
                  border-color var(--pm-t-slow) var(--pm-ease),
                  box-shadow var(--pm-t-slow) var(--pm-ease);
    }
    html.light header.sticky, html.light header[class*="sticky"] {
      background: rgba(255,255,255,.80) !important;
      border-bottom-color: rgba(190,214,242,.72) !important;
      box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 6px 22px -14px rgba(17,38,73,.24);
    }

    /* Top tab bar — glass rail */
    .pm-tabrail {
      background: linear-gradient(150deg, rgba(16,26,46,.86) 0%, rgba(10,17,32,.92) 100%) !important;
      border-color: var(--pm-hairline) !important;
      box-shadow: var(--pm-sh-1), inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: var(--pm-r-lg) !important;
    }
    html.light .pm-tabrail {
      background: linear-gradient(150deg, rgba(255,255,255,.94) 0%, rgba(246,251,255,.90) 100%) !important;
      border-color: rgba(214,230,248,.95) !important;
      box-shadow: var(--pm-sh-1), inset 0 1px 0 rgba(255,255,255,1);
    }
    .pm-tab {
      position: relative;
      transition: color var(--pm-t-mid) var(--pm-ease),
                  background-color var(--pm-t-mid) var(--pm-ease),
                  transform var(--pm-t-fast) var(--pm-swift),
                  box-shadow var(--pm-t-mid) var(--pm-ease);
    }
    .pm-tab:hover { transform: translateY(-1px); }
    .pm-tab.is-on { box-shadow: 0 4px 14px -6px rgba(26,106,212,.46); }
    html.light .pm-tab.is-on { box-shadow: 0 4px 14px -6px rgba(46,135,234,.34); }

    /* ══════════ 10. SCROLLBARS ══════════ */

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(120,150,195,.30);
      border-radius: 999px;
      border: 2.5px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(95,169,245,.58); background-clip: content-box; }
    html.light ::-webkit-scrollbar-track { background: transparent; }
    html.light ::-webkit-scrollbar-thumb {
      background: rgba(150,178,214,.44); background-clip: content-box;
    }
    html.light ::-webkit-scrollbar-thumb:hover { background: rgba(46,135,234,.52); background-clip: content-box; }

    /* ══════════ 11. CHART POLISH ══════════ */

    html.light { --bt-grid: #DDE9F7; --bt-zero: #B6CCE6; --bt-ring: #FFFFFF; }
    :root        { --bt-grid: #1B2740; --bt-zero: #3A4C6B; --bt-ring: #0A1120; }

    /* Chart strokes animate in */
    @keyframes pm-draw { from { stroke-dashoffset: var(--pm-len, 1200); } to { stroke-dashoffset: 0; } }
    .pm-chart-line { animation: pm-draw 1.1s var(--pm-ease) both; }
    .pm-chart-area { animation: pm-fade-in .8s var(--pm-ease) .18s both; }
    svg rect.pm-bar { transition: opacity var(--pm-t-mid) var(--pm-ease), filter var(--pm-t-mid) var(--pm-ease); }
    svg rect.pm-bar:hover { opacity: .85; filter: brightness(1.12); }

    /* ══════════ 11b. DARK-MODE SECONDARY TEXT (AA lift) ══════════ */
    /* slate-500 on the deep navy surfaces measured ~3.9:1; nudge to ~4.8:1.
       Light mode is unaffected (tx() maps these atoms before render). */
    html:not(.light) .text-slate-500 { color: #7C8CA6; }
    html:not(.light) .text-slate-600 { color: #74849E; }

    /* ══════════ 11c. TRADE ROWS & LIST MICRO-INTERACTIONS ══════════ */

    /* Trade rows lift subtly and reveal a premium blue edge on hover */
    .terminal-card.group { position: relative; }
    .terminal-card.group::before {
      content: "";
      position: absolute; left: 0; top: 12%; bottom: 12%; width: 2.5px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, transparent, var(--pm-400), transparent);
      opacity: 0; transform: scaleY(.5);
      transition: opacity var(--pm-t-mid) var(--pm-ease), transform var(--pm-t-mid) var(--pm-ease);
      pointer-events: none;
    }
    .terminal-card.group:hover::before { opacity: .9; transform: scaleY(1); }

    /* Dropdowns / popovers */
    .adm-pop, [role="menu"], [role="listbox"] {
      animation: pm-scale-in .2s var(--pm-ease) both;
    }

    /* Chips & badges settle smoothly on state change */
    span[class*="rounded-lg"], span[class*="rounded-md"], span[class*="rounded-full"] {
      transition: background-color var(--pm-t-mid) var(--pm-ease),
                  color var(--pm-t-mid) var(--pm-ease),
                  border-color var(--pm-t-mid) var(--pm-ease);
    }

    /* ══════════ 11d. 3D PREMIUM ICON SYSTEM (nav + section glyphs) ══════════ */

    /* Soft-extruded rounded plate. Same box for every icon => identical scale. */
    .pm-i3d {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; flex: 0 0 26px;
      border-radius: 9px;
      background: linear-gradient(160deg, #FFFFFF 0%, #EAF3FE 52%, #DCEAFC 100%);
      border: 1px solid rgba(147,197,253,.55);
      box-shadow:
        0 1px 0 rgba(255,255,255,.95) inset,
        0 -1px 2px rgba(26,106,212,.07) inset,
        0 2px 5px -1px rgba(21,83,172,.16),
        0 1px 2px rgba(21,83,172,.10);
      color: #1553AC;
      transition:
        transform var(--pm-t-fast) var(--pm-ease),
        box-shadow var(--pm-t-fast) var(--pm-ease),
        border-color var(--pm-t-fast) var(--pm-ease);
      will-change: transform;
    }
    /* glossy light reflection across the top third */
    .pm-i3d::before {
      content: "";
      position: absolute; left: 1px; right: 1px; top: 1px; height: 42%;
      border-radius: 8px 8px 11px 11px;
      background: linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.14) 100%);
      pointer-events: none;
    }
    .pm-i3d > svg { position: relative; z-index: 1; }

    /* Dark theme: same geometry, deep-glass finish */
    html:not(.light) .pm-i3d {
      background: linear-gradient(160deg, #1B2942 0%, #14203A 54%, #0F1A30 100%);
      border-color: rgba(95,169,245,.26);
      box-shadow:
        0 1px 0 rgba(148,197,253,.16) inset,
        0 -1px 2px rgba(0,0,0,.34) inset,
        0 2px 6px -1px rgba(0,0,0,.46);
      color: #8CC2FA;
    }
    html:not(.light) .pm-i3d::before {
      background: linear-gradient(180deg, rgba(160,205,255,.20) 0%, rgba(160,205,255,.02) 100%);
    }

    /* Hover: gentle lift + light bloom (no bounce) */
    .pm-tab:hover .pm-i3d,
    .pm-i3d-h:hover .pm-i3d {
      transform: translateY(-1.5px) scale(1.04);
      box-shadow:
        0 1px 0 rgba(255,255,255,.95) inset,
        0 4px 10px -2px rgba(21,83,172,.24),
        0 2px 4px rgba(21,83,172,.12);
      border-color: rgba(95,169,245,.75);
    }
    html:not(.light) .pm-tab:hover .pm-i3d,
    html:not(.light) .pm-i3d-h:hover .pm-i3d {
      box-shadow:
        0 1px 0 rgba(148,197,253,.22) inset,
        0 4px 12px -2px rgba(46,135,234,.34);
      border-color: rgba(95,169,245,.48);
    }

    /* Active tab: brand-blue extrusion */
    .pm-tab.is-on .pm-i3d {
      background: linear-gradient(160deg, #6FB2F7 0%, #2E87EA 52%, #1A6AD4 100%);
      border-color: rgba(26,106,212,.62);
      color: #FFFFFF;
      box-shadow:
        0 1px 0 rgba(255,255,255,.52) inset,
        0 -1px 3px rgba(9,44,96,.34) inset,
        0 3px 8px -2px rgba(26,106,212,.46);
    }
    .pm-tab.is-on .pm-i3d::before {
      background: linear-gradient(180deg, rgba(255,255,255,.52) 0%, rgba(255,255,255,.04) 100%);
    }

    /* Accent variants keep identical geometry, only hue shifts */
    .pm-i3d-amber { background: linear-gradient(160deg,#FFFDF5 0%,#FEF3C7 54%,#FDE9A8 100%); border-color: rgba(245,196,84,.58); color: #92670C; }
    .pm-i3d-rose  { background: linear-gradient(160deg,#FFF7F8 0%,#FFE4E8 54%,#FECDD5 100%); border-color: rgba(244,144,161,.58); color: #A81B36; }
    .pm-i3d-cyan  { background: linear-gradient(160deg,#F5FDFF 0%,#D7F3FA 54%,#BFE9F5 100%); border-color: rgba(103,199,224,.58); color: #0C6379; }
    .pm-i3d-emerald { background: linear-gradient(160deg,#F4FEFA 0%,#D5F5E7 54%,#BCEBD7 100%); border-color: rgba(94,203,158,.58); color: #08654A; }
    html:not(.light) .pm-i3d-amber { background: linear-gradient(160deg,#33291360 0%,#2A210F 54%,#221A0B 100%); border-color: rgba(245,196,84,.26); color: #F5C454; }
    html:not(.light) .pm-i3d-rose  { background: linear-gradient(160deg,#33161E60 0%,#2A1219 54%,#220E14 100%); border-color: rgba(244,144,161,.26); color: #F98CA2; }
    html:not(.light) .pm-i3d-cyan  { background: linear-gradient(160deg,#0D2B3460 0%,#0B242C 54%,#091D23 100%); border-color: rgba(103,199,224,.26); color: #67C7E0; }
    html:not(.light) .pm-i3d-emerald { background: linear-gradient(160deg,#0C2A2060 0%,#0A231B 54%,#081C16 100%); border-color: rgba(94,203,158,.26); color: #5ECB9E; }

    /* Compact rail on small screens — proportional, never oversized */
    @media (max-width: 640px) {
      .pm-i3d { width: 24px; height: 24px; flex-basis: 24px; border-radius: 8px; }
    }

    /* Touch comfort: selector rows + controls reach the 44px guideline. */
    @media (hover: none) and (pointer: coarse) {
      [role="option"] { min-height: 44px; }
      .pm-filter { height: 42px; padding: 0 15px; }
      .pm-chip { height: 34px; padding: 0 14px; }
    }

    /* ══════════ 11e. UNIFIED FILTER / CONTROL SYSTEM ══════════ */

    /* One control height + radius + type scale for every filter in the app. */
    .pm-filter {
      display: inline-flex; align-items: center; gap: 7px;
      height: 38px; padding: 0 13px;
      border-radius: 11px;
      font-size: 11.5px; font-weight: 700; line-height: 1;
      letter-spacing: .01em;
      white-space: nowrap; cursor: pointer;
      transition: background-color var(--pm-t-fast) var(--pm-swift),
                  border-color var(--pm-t-fast) var(--pm-swift),
                  color var(--pm-t-fast) var(--pm-swift),
                  box-shadow var(--pm-t-fast) var(--pm-swift),
                  transform var(--pm-t-fast) var(--pm-ease);
    }
    .pm-filter:hover { transform: translateY(-1px); }
    .pm-filter:active { transform: translateY(0); }
    /* icon inside a filter is always 14px and quieter than the label */
    .pm-filter > svg { width: 14px; height: 14px; opacity: .82; flex-shrink: 0; }
    .pm-filter.is-on > svg { opacity: 1; }
    /* active-state dot */
    .pm-filter-dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; opacity: .9; }

    /* Small pill variant (year chips, tag chips, size chips) */
    .pm-chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px;
      border-radius: 999px;
      font-size: 11px; font-weight: 700; line-height: 1;
      white-space: nowrap; cursor: pointer;
      transition: background-color var(--pm-t-fast) var(--pm-swift),
                  border-color var(--pm-t-fast) var(--pm-swift),
                  color var(--pm-t-fast) var(--pm-swift),
                  transform var(--pm-t-fast) var(--pm-ease);
    }
    .pm-chip:hover { transform: translateY(-1px); }
    .pm-chip > svg { width: 12px; height: 12px; flex-shrink: 0; }

    /* Dropdown surface used by every filter popover */
    .pm-pop-surface {
      border-radius: var(--pm-r-md);
      box-shadow: var(--pm-sh-3);
      animation: pm-pop-in .2s var(--pm-ease) both;
      transform-origin: top right;
    }
    @keyframes pm-pop-in {
      from { opacity: 0; transform: scale(.97) translate3d(0,-5px,0); }
      to   { opacity: 1; transform: none; }
    }

    /* ══════════ 11f. DISCLOSURE — smooth, jump-free expand ══════════ */

    /* Fixes the "text appears too large / jumps" bug on opening rows:
       animate opacity + a small translate ONLY. Never animate font-size or
       scale on text, and never let the panel animate its own height in a way
       that reflows children mid-flight. */
    .pm-reveal {
      animation: pm-reveal-in .26s var(--pm-ease) both;
      transform-origin: top center;
    }
    @keyframes pm-reveal-in {
      from { opacity: 0; transform: translate3d(0,-4px,0); }
      to   { opacity: 1; transform: none; }
    }
    /* children settle a beat after the container — no size interpolation */
    .pm-reveal > * { animation: pm-fade-in .3s var(--pm-swift) .04s both; }
    /* text inside a reveal must never be scaled by a parent transform */
    .pm-reveal, .pm-reveal * { text-rendering: optimizeLegibility; }

    /* ══════════ 11g. GLOBAL CONSISTENCY GUARDS ══════════ */

    /* One shadow language: no heavy black drop-shadows anywhere in light. */
    html.light .shadow-2xl:not(.tdi *),
    html.light .shadow-xl:not(.tdi *)  { box-shadow: var(--pm-sh-3) !important; }
    html.light .shadow-lg:not(.tdi *)  { box-shadow: var(--pm-sh-2) !important; }

    /* Inputs & selects share one resting/focus language app-wide. */
    input, select, textarea { transition: border-color var(--pm-t-fast) var(--pm-swift), box-shadow var(--pm-t-fast) var(--pm-swift), background-color var(--pm-t-fast) var(--pm-swift); }
    input:focus, select:focus, textarea:focus { outline: none; }
    html.light input:not(.tdi *):focus,
    html.light select:not(.tdi *):focus,
    html.light textarea:not(.tdi *):focus {
      border-color: var(--pm-400);
      box-shadow: 0 0 0 3px rgba(95,169,245,.16);
    }
    html:not(.light) input:focus, html:not(.light) select:focus, html:not(.light) textarea:focus {
      border-color: var(--pm-500);
      box-shadow: 0 0 0 3px rgba(46,135,234,.15);
    }

    /* Every interactive surface gives feedback, none of it jumpy. */
    button, [role="button"], a { -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active, [role="button"]:active { transform: translateY(.5px); }

    /* Performance: promote only what actually animates. */
    .pm-view, .pm-reveal, .pm-pop-surface { will-change: opacity, transform; }
    .pm-view, .pm-reveal { backface-visibility: hidden; }

    /* ══════════ 12. FOCUS ══════════ */

    html body :focus-visible, html.light body :focus-visible {
      outline: 2.5px solid var(--pm-400);
      outline-offset: 2.5px;
      border-radius: 4px;
    }

    /* ══════════ 13. RESPONSIVE COMFORT ══════════ */

    @media (max-width: 640px) {
      .terminal-card { border-radius: var(--pm-r-md); }
      /* Comfortable tap targets everywhere on phones */
      button:not(.pm-raw), [role="button"] { min-height: 38px; }
      .pm-tabrail { border-radius: var(--pm-r-md) !important; }
      body::before { height: 46vh; filter: blur(38px); }
    }
    @media (min-width: 641px) and (max-width: 1024px) {
      .terminal-card { border-radius: var(--pm-r-lg); }
    }

    /* ══════════ 14. REDUCED MOTION ══════════ */

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      .pm-view, .pm-in, .pm-pop, .pm-stagger > *,
      .pm-chart-line, .pm-chart-area { animation: none !important; }
      .terminal-card:hover, .pm-tab:hover, .pm-ico:hover,
      button:not(.pm-raw):hover { transform: none !important; }
      * { scroll-behavior: auto !important; }
    }


    /* ══════════════════════════════════════════════════════════════════════
       LOGIN — LIGHT PREMIUM OVERRIDE
       Converts the auth experience to the icy-blue system. The photographic
       hero panel stays image-led (with a lightened veil) as a premium accent;
       every surface, control and text token around it becomes light.
       Applies in BOTH themes' light view; dark theme keeps the navy original.
       ══════════════════════════════════════════════════════════════════════ */

    html.light .aj-root {
      background: transparent;
      color: #0F1E36;
    }

    /* ── Top navigation ── */
    html.light .aj-nav {
      background: rgba(255,255,255,.82);
      border-bottom: 1px solid rgba(190,214,242,.70);
      backdrop-filter: saturate(150%) blur(18px);
      -webkit-backdrop-filter: saturate(150%) blur(18px);
      box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 6px 22px -16px rgba(17,38,73,.26);
    }
    html.light .aj-brand-name { color: #0F1E36; }
    html.light .aj-brand-sub  { color: #1A6AD4; }
    html.light .aj-logo {
      background: linear-gradient(160deg, #0D1B33 0%, #071022 100%);
      border-color: rgba(46,135,234,.34);
      box-shadow: 0 8px 20px -8px rgba(26,106,212,.46), inset 0 1px 0 rgba(255,255,255,.12);
    }
    html.light .aj-link { color: #5A6B85; }
    html.light .aj-link:hover { color: #133F80; background: rgba(227,240,254,.85); }
    html.light .aj-link.is-active { color: #1553AC; }
    html.light .aj-link.is-active::after {
      background: linear-gradient(90deg, #2E87EA, #5FA9F5);
      box-shadow: 0 0 10px rgba(46,135,234,.42);
    }
    html.light .aj-secure-chip {
      color: #47597A;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(206,224,246,.95);
      box-shadow: var(--pm-sh-1);
    }
    html.light .aj-secure-chip svg { color: #2E87EA; }
    html.light .aj-pill-btn {
      color: #2E3F5C;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(206,224,246,.95);
      box-shadow: var(--pm-sh-1);
    }
    html.light .aj-pill-btn:hover {
      color: #133F80; background: #FFFFFF;
      border-color: rgba(95,169,245,.55);
      box-shadow: var(--pm-sh-2);
    }
    html.light .aj-pill-btn svg { color: #2E87EA; }
    html.light .aj-theme-switch {
      background: rgba(238,245,253,.95);
      border: 1px solid rgba(206,224,246,.95);
    }
    html.light .aj-theme-opt { color: #7C8CA6; }
    html.light .aj-theme-opt.is-on {
      background: #FFFFFF; color: #1A6AD4;
      box-shadow: 0 2px 8px -2px rgba(17,38,73,.16);
    }

    /* ── Hero panel: keep the photograph, lighten and cool the veil ── */
    html.light .aj-hero { background-color: #DCEAFB; }
    html.light .aj-hero-veil {
      background:
        linear-gradient(180deg, rgba(10,26,54,.30) 0%, rgba(10,26,54,.18) 42%, rgba(10,26,54,.52) 88%, rgba(10,26,54,.62) 100%);
    }
    html.light .aj-hero-glow {
      background:
        radial-gradient(ellipse 46% 40% at 22% 18%, rgba(147,197,253,.30), transparent 70%),
        radial-gradient(ellipse 32% 28% at 82% 78%, rgba(191,219,254,.22), transparent 70%);
    }
    /* Hero type stays light-on-image for contrast against the photo */
    html.light .aj-hero-title  { color: #FFFFFF; text-shadow: 0 2px 22px rgba(6,18,40,.42); }
    html.light .aj-hero-sub    { color: #E8F1FD; text-shadow: 0 1px 14px rgba(6,18,40,.46); }
    html.light .aj-eyebrow     { color: #BFDBFE; }
    html.light .aj-eyebrow em  { color: rgba(191,219,254,.55); }
    html.light .aj-line-grad {
      background: linear-gradient(92deg, #BFDCFF 4%, #EAF4FF 52%, #FFFFFF 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 18px rgba(6,18,40,.55));
    }
    html.light .aj-signature { color: #DBEAFE; }
    html.light .aj-hero-foot {
      color: #C7DDF7;
      border-top-color: rgba(219,234,254,.30);
    }
    html.light .aj-feat-ic {
      background: rgba(255,255,255,.14);
      border-color: rgba(191,219,254,.38);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.26);
    }
    html.light .aj-feat b { color: #FFFFFF; }
    html.light .aj-feat i { color: #C7DDF7; }

    /* ── Auth column ── */
    html.light .aj-auth {
      background:
        radial-gradient(ellipse 62% 34% at 88% -2%, rgba(147,197,253,.24), transparent 70%),
        transparent;
      border-left-color: rgba(206,224,246,.85) !important;
    }
    html.light .aj-auth-glow {
      background: radial-gradient(ellipse at center, rgba(147,197,253,.34), transparent 65%);
    }

    /* ── The sign-in card: bright glass ── */
    html.light .aj-card {
      background: linear-gradient(168deg, rgba(255,255,255,.97) 0%, rgba(249,252,255,.95) 100%);
      border: 1px solid rgba(214,230,248,.95);
      box-shadow:
        0 28px 64px -26px rgba(17,38,73,.24),
        0 10px 28px -16px rgba(46,135,234,.20),
        inset 0 1px 0 rgba(255,255,255,1);
    }
    html.light .aj-card-eyebrow { color: #1A6AD4; }
    html.light .aj-card-title   { color: #0F1E36; }
    html.light .aj-grad-text {
      background: linear-gradient(92deg, #1A6AD4, #2E87EA);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    html.light .aj-card-sub { color: #5A6B85; }
    html.light .aj-secure-badge {
      background: linear-gradient(150deg, #FFFFFF 0%, #E8F2FE 100%);
      border: 1px solid rgba(95,169,245,.34);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 4px 12px -5px rgba(46,135,234,.24);
    }
    html.light .aj-secure-badge svg { color: #1A6AD4; }
    html.light .aj-secure-badge b   { color: #133F80; }
    html.light .aj-secure-badge i   { color: #7C8CA6; }

    /* ── Tabs ── */
    html.light .aj-tabs {
      background: rgba(238,245,253,.92);
      border: 1px solid rgba(214,230,248,.95);
    }
    html.light .aj-tab { color: #5A6B85; }
    html.light .aj-tab:hover:not(.active) { color: #133F80; }
    html.light .aj-tab.active {
      background: linear-gradient(135deg, #3D93EE 0%, #1A6AD4 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 16px -6px rgba(26,106,212,.52), inset 0 1px 0 rgba(255,255,255,.24);
    }

    /* ── Fields ── */
    html.light .aj-field > label { color: #47597A; }
    html.light .aj-input-wrap input {
      background: #FFFFFF;
      border: 1px solid rgba(206,224,246,.98);
      color: #0F1E36;
      box-shadow: inset 0 1px 2px rgba(17,38,73,.04);
    }
    html.light .aj-input-wrap input::placeholder { color: #9AAAC2; }
    html.light .aj-input-wrap input:focus {
      border-color: rgba(95,169,245,.70);
      box-shadow: 0 0 0 3.5px rgba(46,135,234,.13);
      background: #FFFFFF;
    }
    html.light .aj-input-wrap .aj-ic { color: #8FA2BD; }
    html.light .aj-input-wrap input:focus ~ .aj-ic,
    html.light .aj-input-wrap:focus-within .aj-ic { color: #1A6AD4; }
    html.light .aj-eye { color: #8FA2BD; }
    html.light .aj-eye:hover { color: #1A6AD4; }

    html.light .aj-remember { color: #47597A; }
    html.light .aj-checkbox {
      background: #FFFFFF;
      border: 1.5px solid rgba(180,205,236,.98);
    }
    html.light .aj-remember input:checked + .aj-checkbox {
      background: linear-gradient(135deg, #3D93EE, #1A6AD4);
      border-color: #1A6AD4;
    }
    html.light .aj-forgot { color: #1A6AD4; }
    html.light .aj-forgot:hover { color: #133F80; }

    /* ── Messages ── */
    html.light .aj-msg-err {
      color: #B3253F; background: #FDECEF; border: 1px solid rgba(224,45,75,.28);
    }
    html.light .aj-msg-ok {
      color: #0B7D57; background: #E6F7F0; border: 1px solid rgba(14,159,110,.28);
    }

    /* ── Submit ── */
    html.light .aj-submit {
      background: linear-gradient(135deg, #3D93EE 0%, #1A6AD4 54%, #1553AC 100%);
      color: #FFFFFF;
      box-shadow:
        0 1px 0 rgba(255,255,255,.22) inset,
        0 12px 26px -10px rgba(26,106,212,.58);
    }
    html.light .aj-submit:hover:not(:disabled) {
      box-shadow:
        0 1px 0 rgba(255,255,255,.26) inset,
        0 18px 34px -12px rgba(26,106,212,.66);
    }

    /* ── Divider / OAuth ── */
    html.light .aj-divider span {
      background: linear-gradient(90deg, transparent, rgba(190,214,242,.95), transparent);
    }
    html.light .aj-divider b { color: #8194AE; }
    html.light .aj-oauth-btn {
      background: #FFFFFF;
      border: 1px solid rgba(214,230,248,.98);
      color: #2E3F5C;
      box-shadow: var(--pm-sh-1);
    }
    html.light .aj-oauth-btn:hover {
      border-color: rgba(95,169,245,.55);
      background: #FBFDFF;
      box-shadow: var(--pm-sh-2);
    }
    html.light .aj-oauth-note { color: #8194AE; }

    html.light .aj-switch-row {
      background: rgba(238,245,253,.85);
      border: 1px solid rgba(214,230,248,.95);
      color: #47597A;
    }
    html.light .aj-switch-row:hover {
      background: #FFFFFF;
      border-color: rgba(95,169,245,.50);
    }
    html.light .aj-switch-row b { color: #1A6AD4; }
    html.light .aj-switch-row svg { color: #1A6AD4; }

    /* ── Social / footer ── */
    html.light .aj-connect-label { color: #8194AE; }
    html.light .aj-soc {
      background: rgba(255,255,255,.95);
      border: 1px solid rgba(214,230,248,.98);
      color: #47597A;
      box-shadow: var(--pm-sh-1);
    }
    html.light .aj-soc:hover {
      color: #133F80;
      border-color: rgba(95,169,245,.52);
      box-shadow: var(--pm-sh-2);
    }
    html.light .aj-copy { color: #8194AE; }

    /* ── Motion: elegant entrance for the auth card ── */
    .aj-card { animation: pm-scale-in .5s var(--pm-ease) both; }
    .aj-hero-body > * { animation: pm-fade-up .62s var(--pm-ease) both; }
    .aj-hero-body > *:nth-child(1) { animation-delay: .04s; }
    .aj-hero-body > *:nth-child(2) { animation-delay: .10s; }
    .aj-hero-body > *:nth-child(3) { animation-delay: .16s; }
    .aj-hero-body > *:nth-child(4) { animation-delay: .22s; }
    @media (prefers-reduced-motion: reduce) {
      .aj-card, .aj-hero-body > * { animation: none !important; }
    }

</style>
</head>

// Image resizing for fast cloud sync
function resizeImage(dataUrl, maxWidth = 1600) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.92));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function tradeCardId(tr) {
      const d = String(tr.date || "").replace(/-/g, "").slice(2, 8) || "000000";

      let h = 5381;
      for (let i = 0; i < id.length; i++) h = ((h << 5) + h + id.charCodeAt(i)) >>> 0;
      return "AM-" + d + "-" + h.toString(36).toUpperCase().padStart(3, "0").slice(-3);
    }

    function downloadTradeCard(tr) {
      const canvas = document.createElement("canvas");
      drawTradeCard(canvas, tr);
      const a = document.createElement("a");
      a.download = `amiir-trade-${String(tr.symbol || "trade").replace(/[^A-Za-z0-9]+/g, "-")}-${tr.date || "log"}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    function TradeCardModal({ tr, onClose }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        let alive = true;
        const paint = () => { try { if (canvasRef.current && tr) { drawTradeCard(canvasRef.current, tr); window.__cardErr = ""; } } catch (e) { window.__cardErr = String((e && e.message) || e); } };
        paint();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (alive) paint(); });
        return () => { alive = false; };
      }, [tr]);
      useEffect(() => {
        const h = (e) => { if (e.key === "Escape" && onClose) onClose(); };
        window.addEventListener("keydown", h);
        document.body.style.overflow = "hidden";
        return () => { window.removeEventListener("keydown", h); document.body.style.overflow = ""; };
      }, [onClose]);
      if (!tr) return null;
      return (
        <div className="fixed inset-0 z-[110] flex items-center justify-center p-3 sm:p-6" role="dialog" aria-modal="true" aria-label="Trade card preview">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-sm" onClick={onClose} />
          <div className={tx("relative w-full max-w-4xl max-h-[92vh] overflow-y-auto bg-[#080F1D] border border-cyan-500/25 rounded-3xl shadow-2xl")}>
            <div className={tx("flex items-center justify-between px-4 sm:px-5 py-3 border-b border-slate-800/70 sticky top-0 bg-[#080F1D]/95 backdrop-blur z-10")}>
              <div className={tx("text-xs font-mono font-bold text-slate-300 tracking-wide")}>TRADE CARD · {(tr.symbol || "").toUpperCase()} · {tr.date || ""}</div>
              <button type="button" onClick={onClose} aria-label="Close preview" className={tx("p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/70 transition-colors cursor-pointer")}><X size={16} /></button>
            </div>
            <canvas ref={canvasRef} width="1600" height="900" className="w-full h-auto block" />
            <div className={tx("flex items-center justify-between gap-3 px-4 sm:px-5 py-3.5 border-t border-slate-800/70 flex-wrap")}>
              <div className={tx("text-[11px] font-mono text-slate-500")}>1600 × 900 · PNG · {tradeCardId(tr)}</div>
              <button type="button" onClick={() => downloadTradeCard(tr)} className={tx("flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors cursor-pointer")}><Download size={14} /> Download PNG</button>
            </div>
          </div>
        </div>
      );

  "text-rose-300/80": "text-[#C21F3E]",
  "text-rose-300/90": "text-[#C21F3E]",
  "text-rose-400": "text-[#C21F3E]",
  "text-rose-400/90": "text-[#C21F3E]",
  "text-pink-300": "text-[#DB2777]",
  "text-pink-400": "text-[#DB2777]",
  "text-sky-200": "text-[#1553AC]"
};

function __amiirSplitVariant(atom) {
  let cut = -1, depth = 0;
  for (let i = 0; i < atom.length; i++) {
    const c = atom[i];
    if (c === "[") depth++;
    else if (c === "]") depth--;
    else if (c === ":" && depth === 0) cut = i;
  }
  if (cut < 0) return ["", atom];
  return [atom.slice(0, cut + 1), atom.slice(cut + 1)];
}

function tx(cls) {
  if (__amiirResolved !== "light" || !cls) return cls || "";
  if (typeof cls !== "string") return cls;
  const parts = cls.split(/\s+/);
  let hit = false;
  for (let i = 0; i < parts.length; i++) {
    let a = parts[i];
    if (!a) continue;
    let bang = "";
    if (a[0] === "!") { bang = "!"; a = a.slice(1); }
    const sp = __amiirSplitVariant(a);
    const rep = THEME_BASE[sp[1]];
    if (rep !== undefined) { parts[i] = bang + sp[0] + rep; hit = true; }
  }
  return hit ? parts.join(" ") : cls;
}

const THEME_ORDER = ["light", "dark"];

// Header control: toggles Light ↔ Dark (fixed 34px box, icon swap only).

  const { theme, cycleTheme } = useApp();

}

/* ══════════════════════════════════════════════════════════════════════
   STREAK — consecutive days the user logged a trade (live or backtest)
   ══════════════════════════════════════════════════════════════════════ */
function calcStreak(lists) {
  const days = new Set();
  (lists || []).forEach((arr) => {
    (arr || []).forEach((t) => {
      const k = String((t && t.date) || "").slice(0, 10);
      if (/^\d{4}-\d{2}-\d{2}$/.test(k)) days.add(k);
    });
  });
  if (!days.size) return { count: 0, active: false };

  const keyOf = (d) => d.toISOString().slice(0, 10);
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);

  // A streak stays "alive" if today OR yesterday has activity.
  let cursor;
  if (days.has(keyOf(today))) cursor = today;
  else if (days.has(keyOf(yest))) cursor = yest;
  else return { count: 0, active: false };

  let n = 0;
  const walk = new Date(cursor);
  while (days.has(keyOf(walk))) {
    n += 1;
    walk.setDate(walk.getDate() - 1);
  }
  return { count: n, active: days.has(keyOf(today)) };
}

/* Small, elegant streak pill for the Backtest header. */
function StreakBadge({ lists }) {
  const { count, active } = React.useMemo(() => calcStreak(lists), [lists]);
  if (!count) return null;
  const title = active
    ? count + " day streak — logged today"
    : count + " day streak — log a trade today to keep it";
  return (
    <span
      title={title}
      className={tx(`inline-flex items-center gap-1.5 h-[30px] px-2.5 rounded-full border font-mono text-[11px] font-bold shrink-0 transition-colors ${
        active
          ? "bg-amber-400/12 border-amber-400/35 text-amber-300"
          : "bg-slate-900 border-slate-700/80 text-slate-400"
      }`)}
    >
      <Flame size={12} className={tx(active ? "text-amber-400" : "text-slate-500")} strokeWidth={2.4} />
      <span className="tnum">{count}</span>
      <span className={tx("hidden sm:inline font-semibold opacity-80")}>day{count === 1 ? "" : "s"}</span>
    </span>
  );
}

/* ══════════════════════════════════════════════════════════════════════
   PAIR LIBRARY — user-managed trading pairs (add / delete / search / recent)
   Persisted to localStorage so it survives reloads without a schema change.
   ══════════════════════════════════════════════════════════════════════ */

const PAIR_KEY = "amiir_pairs_v1";
const PAIR_RECENT_KEY = "amiir_pairs_recent_v1";

const PAIR_SEED = [
  { s: "EURUSD", g: "Forex" }, { s: "GBPUSD", g: "Forex" }, { s: "USDJPY", g: "Forex" },
  { s: "AUDUSD", g: "Forex" }, { s: "USDCAD", g: "Forex" }, { s: "USDCHF", g: "Forex" },
  { s: "NZDUSD", g: "Forex" }, { s: "EURJPY", g: "Forex" }, { s: "GBPJPY", g: "Forex" },
  { s: "EURGBP", g: "Forex" },
  { s: "XAUUSD", g: "Metals" }, { s: "XAGUSD", g: "Metals" },
  { s: "NAS100", g: "Indices" }, { s: "US30", g: "Indices" }, { s: "SPX500", g: "Indices" },
  { s: "GER40", g: "Indices" }, { s: "UK100", g: "Indices" }, { s: "JP225", g: "Indices" },
  { s: "USOIL", g: "Energy" }, { s: "UKOIL", g: "Energy" },
  { s: "BTCUSD", g: "Crypto" }, { s: "ETHUSD", g: "Crypto" }, { s: "SOLUSD", g: "Crypto" }
];

function pairLoad() {
  try {
    const raw = JSON.parse(localStorage.getItem(PAIR_KEY) || "null");
    if (Array.isArray(raw) && raw.length) return raw;
  } catch (e) {}
  return PAIR_SEED.slice();
}
function pairSave(list) {
  try { localStorage.setItem(PAIR_KEY, JSON.stringify(list)); } catch (e) {}
}
function pairRecentLoad() {
  try {
    const raw = JSON.parse(localStorage.getItem(PAIR_RECENT_KEY) || "[]");
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }
}
function pairRecentPush(sym) {
  const v = String(sym || "").toUpperCase().trim();
  if (!v) return;
  try {
    const a = pairRecentLoad().filter((x) => x !== v);
    a.unshift(v);
    localStorage.setItem(PAIR_RECENT_KEY, JSON.stringify(a.slice(0, 8)));
  } catch (e) {}
}
function pairGroupOf(sym, list) {
  const hit = (list || []).find((p) => p.s === sym);
  if (hit) return hit.g || "Custom";
  const S = String(sym || "").toUpperCase();
  if (/XAU|XAG|GOLD|SILVER/.test(S)) return "Metals";
  if (/BTC|ETH|SOL|XRP|DOGE|ADA/.test(S)) return "Crypto";
  if (/OIL|WTI|BRENT|GAS/.test(S)) return "Energy";
  if (/US30|NAS|SPX|GER|UK100|JP225|DOW|NDX/.test(S)) return "Indices";
  if (/^[A-Z]{6}$/.test(S)) return "Forex";
  return "Custom";
}

/* Searchable, keyboard-driven pair selector: Select → Search → Choose. */
function PairSelect({ value, onChange }) {
  const [open, setOpen] = React.useState(false);
  const [q, setQ] = React.useState("");
  const [pairs, setPairs] = React.useState(pairLoad);
  const [recent, setRecent] = React.useState(pairRecentLoad);
  const [active, setActive] = React.useState(0);
  const [manage, setManage] = React.useState(false);
  const boxRef = React.useRef(null);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) { setOpen(false); setManage(false); } };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  React.useEffect(() => {
    if (open && inputRef.current) inputRef.current.focus();
    if (!open) { setQ(""); setActive(0); }
  }, [open]);

  const norm = String(q || "").toUpperCase().trim();
  const matches = React.useMemo(() => {
    const all = pairs.slice().sort((a, b) => a.s.localeCompare(b.s));
    if (!norm) return all;
    const starts = all.filter((p) => p.s.startsWith(norm));
    const has = all.filter((p) => !p.s.startsWith(norm) && p.s.includes(norm));
    return starts.concat(has);
  }, [pairs, norm]);

  const recentPairs = React.useMemo(
    () => recent.filter((r) => pairs.some((p) => p.s === r)).slice(0, 6),
    [recent, pairs]
  );

  const exact = pairs.some((p) => p.s === norm);
  const canAdd = norm.length >= 2 && !exact;

  const commit = (sym) => {
    const v = String(sym || "").toUpperCase().trim();
    if (!v) return;
    onChange(v);
    pairRecentPush(v);
    setRecent(pairRecentLoad());
    setOpen(false);
    setManage(false);
  };

  const addPair = (sym) => {
    const v = String(sym || norm).toUpperCase().trim();
    if (!v || pairs.some((p) => p.s === v)) return;
    const next = pairs.concat([{ s: v, g: pairGroupOf(v, pairs) }]);
    setPairs(next); pairSave(next);
    commit(v);
  };

  const delPair = (sym) => {
    const next = pairs.filter((p) => p.s !== sym);
    setPairs(next); pairSave(next);
    const nr = pairRecentLoad().filter((x) => x !== sym);
    try { localStorage.setItem(PAIR_RECENT_KEY, JSON.stringify(nr)); } catch (e) {}
    setRecent(nr);
  };

  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActive((i) => Math.min(i + 1, matches.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (matches[active]) commit(matches[active].s);
      else if (canAdd) addPair(norm);
    } else if (e.key === "Escape") { e.preventDefault(); setOpen(false); }
  };

  return (
    <div className="relative" ref={boxRef}>
      {/* Trigger */}
      <button
        type="button"
        onClick={() => setOpen((v) => !v)}
        aria-haspopup="listbox"
        aria-expanded={open}
        className={tx(`w-full flex items-center gap-2 bg-[#050914] border rounded-xl px-3 py-2.5 text-xs cursor-pointer font-mono transition-colors ${open ? "border-sky-400" : "border-slate-700/80 hover:border-slate-600"}`)}
      >
        {value ? (
          <>
            <SymbolGlyph symbol={value} size={20} />
            <span className={tx("font-bold text-white tracking-tight")}>{value}</span>
            <span className={tx("text-[10px] text-slate-500 font-semibold")}>{pairGroupOf(value, pairs)}</span>
          </>
        ) : (
          <span className={tx("text-slate-500")}>Select pair…</span>
        )}
        <ChevronsUpDown size={13} className={tx("ml-auto text-slate-500 shrink-0")} />
      </button>

      {/* Panel */}
      {open && (
        <div className={tx("pm-pop-surface absolute left-0 right-0 top-[calc(100%+6px)] z-50 rounded-2xl border border-slate-700/70 bg-[#080E1E] overflow-hidden")}>
          {/* Search */}
          <div className={tx("relative border-b border-slate-800/80")}>
            <Search size={14} className={tx("absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none")} />
            <input
              ref={inputRef}
              value={q}
              onChange={(e) => { setQ(e.target.value); setActive(0); }}
              onKeyDown={onKey}
              placeholder="Search or type a new pair…"
              className={tx("w-full bg-transparent pl-10 pr-3 py-3 text-xs text-white uppercase font-mono font-bold focus:outline-none placeholder:text-slate-600 placeholder:normal-case placeholder:font-normal")}
            />
          </div>

          {/* Frequently used */}
          {!norm && recentPairs.length > 0 && (
            <div className={tx("px-3 pt-2.5 pb-2 border-b border-slate-800/60")}>
              <div className={tx("text-[9px] uppercase tracking-wider text-slate-500 font-mono font-bold mb-1.5")}>Frequently used</div>
              <div className="flex flex-wrap gap-1.5">
                {recentPairs.map((r) => (
                  <button key={r} type="button" onClick={() => commit(r)}
                    className={tx("pm-chip bg-sky-500/10 border border-sky-500/30 text-sky-300 hover:bg-sky-500/20 font-mono")}>
                    {r}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Results */}
          <div className="max-h-[236px] overflow-y-auto no-scrollbar py-1">
            {matches.length === 0 && !canAdd && (
              <div className={tx("px-3.5 py-5 text-center text-[11px] text-slate-500")}>No pairs match “{norm}”.</div>
            )}
            {matches.map((p, i) => (
              <div key={p.s}
                onMouseEnter={() => setActive(i)}
                className={tx(`group/pair flex items-center gap-2.5 px-3 py-2 cursor-pointer transition-colors ${i === active ? "bg-sky-500/10" : ""}`)}
                onClick={() => commit(p.s)}
                role="option"
                aria-selected={value === p.s}
              >
                <SymbolGlyph symbol={p.s} size={22} />
                <span className={tx("text-xs font-bold text-white font-mono tracking-tight")}>{p.s}</span>
                <span className={tx("text-[10px] text-slate-500 font-semibold")}>{p.g}</span>
                {value === p.s && <Check size={13} className={tx("ml-auto text-sky-400 shrink-0")} />}
                {manage && (
                  <button type="button" title={`Remove ${p.s}`}
                    onClick={(e) => { e.stopPropagation(); delPair(p.s); }}
                    className={tx("ml-auto p-1 rounded-lg text-slate-500 hover:text-rose-300 hover:bg-rose-500/10 transition-colors shrink-0")}>
                    <Trash2 size={12} />
                  </button>
                )}
              </div>
            ))}

            {canAdd && (
              <button type="button" onClick={() => addPair(norm)}
                className={tx("w-full flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-emerald-500/10 transition-colors cursor-pointer border-t border-slate-800/60 mt-1")}>
                <span className={tx("flex items-center justify-center w-[22px] h-[22px] rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 shrink-0")}>
                  <Plus size={12} strokeWidth={2.6} />
                </span>
                <span className={tx("text-xs font-bold text-emerald-300 font-mono")}>Add “{norm}”</span>
                <span className={tx("ml-auto text-[9px] text-slate-500 font-mono")}>ENTER</span>
              </button>
            )}
          </div>

          {/* Footer */}
          <div className={tx("flex items-center justify-between px-3 py-2 border-t border-slate-800/80 bg-[#050914]")}>
            <span className={tx("text-[9.5px] text-slate-500 font-mono")}>{pairs.length} pairs</span>
            <button type="button" onClick={() => setManage((v) => !v)}
              className={tx(`text-[9.5px] font-mono font-bold transition-colors cursor-pointer ${manage ? "text-sky-300" : "text-slate-500 hover:text-slate-300"}`)}>
              {manage ? "Done" : "Manage pairs"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════
   MULTI-LINK EDITOR — unlimited labelled links per trade
   ══════════════════════════════════════════════════════════════════════ */

const LINK_KINDS = [
  { id: "chart", label: "Chart" },
  { id: "mt5", label: "MT5" },
  { id: "screenshot", label: "Screenshot" },
  { id: "analysis", label: "Analysis" },
  { id: "news", label: "News" },
  { id: "strategy", label: "Strategy" },
  { id: "other", label: "Other" }
];

function linkHref(u) {
  const v = String(u || "").trim();
  if (!v) return "";
  return /^https?:\/\//i.test(v) ? v : "https://" + v;
}
function linkHost(u) {
  try { return new URL(linkHref(u)).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
}
/* Back-compat: old trades stored a single `chartUrl` string. */
function tradeLinks(tr) {
  const arr = Array.isArray(tr && tr.links) ? tr.links.filter((l) => l && l.url) : [];
  if (arr.length) return arr;
  const legacy = String((tr && tr.chartUrl) || "").trim();
  return legacy ? [{ kind: "chart", url: legacy }] : [];
}

function MultiLinkEditor({ links, onChange }) {
  const list = Array.isArray(links) ? links : [];
  const setAt = (i, patch) => onChange(list.map((l, j) => (j === i ? { ...l, ...patch } : l)));

    <div className="space-y-2">

              aria-label="Link type"

        );
      })}

      <button type="button" onClick={add}
        className={tx("flex items-center gap-1.5 px-3 py-2 rounded-xl text-[11px] font-bold font-mono border border-dashed border-slate-700 text-slate-400 hover:border-sky-500/50 hover:text-sky-300 transition-colors cursor-pointer")}>

}

/* ── Symbol glyphs — gold bullion for XAU/GOLD, tinted initials otherwise ── */
function SymbolGlyph({ symbol, size = 34 }) {
  const sym = String(symbol || "").toUpperCase();
  const isGold = /XAU|GOLD/.test(sym);
  const isIndex = /US30|NAS|SPX|DOW|GER|UK100|JP225|NDX/.test(sym);
  const isCrypto = /BTC|ETH|SOL|XRP|DOGE|ADA/.test(sym);
  const isOil = /OIL|WTI|BRENT|USOIL/.test(sym);

  if (isGold) {
    // Stacked gold bars
    return (
      <span
        className={tx("flex-shrink-0 flex items-center justify-center rounded-xl border border-amber-400/35 bg-amber-500/10")}
        style={{ width: size, height: size }}
        title={sym}
      >
        <svg width={Math.round(size * 0.62)} height={Math.round(size * 0.62)} viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="amGoldBar" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stopColor="#FDE68A" />
              <stop offset="0.5" stopColor="#F59E0B" />
              <stop offset="1" stopColor="#B45309" />
            </linearGradient>
          </defs>
          <g fill="url(#amGoldBar)" stroke="#78350F" strokeWidth="0.6" strokeLinejoin="round">
            <path d="M3.6 13.4h7.2l1.3 3.4H2.3z" />
            <path d="M13.2 13.4h7.2l1.3 3.4h-9.8z" />
            <path d="M8.4 8.2h7.2l1.3 3.4H7.1z" />
          </g>
        </svg>
      </span>
    );
  }

  const tone = isIndex
    ? { ring: "border-sky-400/35 bg-sky-500/10", text: "text-sky-300" }
    : isCrypto
    ? { ring: "border-violet-400/35 bg-violet-500/10", text: "text-violet-300" }
    : isOil
    ? { ring: "border-emerald-400/35 bg-emerald-500/10", text: "text-emerald-300" }
    : { ring: "border-slate-600/50 bg-slate-800/60", text: "text-slate-200" };

  return (
    <span
      className={tx("flex-shrink-0 flex items-center justify-center rounded-xl border font-extrabold " + tone.ring + " " + tone.text)}
      style={{ width: size, height: size, fontSize: Math.max(9, Math.round(size * 0.3)) }}
      title={sym}
    >
      {sym.replace(/[^A-Z0-9]/g, "").slice(0, 3) || "—"}
    </span>
  );
}

// ── Pure analytics helpers (shared by the live Dashboard + Backtest Dashboard) ──

function computeStats(list) {
  const total = list.length;
  const wins = list.filter((tr) => tr.outcome === "win").length;
  const losses = list.filter((tr) => tr.outcome === "loss").length;
  const bes = list.filter((tr) => tr.outcome === "be").length;
  const netR = list.reduce((acc, tr) => acc + (tr.rMultiple || 0), 0);
  const totalDollar = list.reduce((acc, tr) => acc + (tr.pnlDollar || 0), 0);
  const winRate = total ? Math.round((wins / total) * 100) : 0;

  const totalRR = list.reduce((acc, tr) => acc + (parseFloat(tr.rrRatio) || 0), 0);
  const avgRR = total ? (totalRR / total).toFixed(1) : "0.0";

  const currentHour = new Date().getUTCHours();

  const sessionsStats = {};
  SESSIONS.forEach((s) => {
    const sessionList = list.filter((tr) => tr.session === s.id);
    const w = sessionList.filter((tr) => tr.outcome === "win").length;
    const r = sessionList.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0);
    const d = sessionList.reduce((sum, tr) => sum + (tr.pnlDollar || 0), 0);

    const purges = {};
    (PURGE_TIMES[s.id] || []).forEach((pt) => {
      const ptList = sessionList.filter((tr) => tr.purgeTime === pt);
      const ptw = ptList.filter((tr) => tr.outcome === "win").length;
      purges[pt] = {
        count: ptList.length,
        winRate: ptList.length ? Math.round((ptw / ptList.length) * 100) : 0,
        netR: ptList.reduce((sum, tr) => sum + (tr.rMultiple || 0), 0),
        netDollar: ptList.reduce((sum, tr) => sum + (tr.pnlDollar || 0), 0)
      };
    });

    const isLive = s.liveHours && s.liveHours.includes(currentHour);

    sessionsStats[s.id] = {
      count: sessionList.length,
      winRate: sessionList.length ? Math.round((w / sessionList.length) * 100) : 0,
      netR: r,
      netDollar: d,
      isLive,
      purges
    };
  });

  return { total, wins, losses, bes, netR, totalDollar, winRate, avgRR, sessionsStats };
}

function computeDayMap(list) {
  const map = {};
  list.forEach((tr) => {
    if (!map[tr.date]) map[tr.date] = { netR: 0, netDollar: 0, count: 0, wins: 0, losses: 0 };
    map[tr.date].netR += tr.rMultiple || 0;
    map[tr.date].netDollar += tr.pnlDollar || 0;
    map[tr.date].count += 1;
    if (tr.outcome === "win") map[tr.date].wins += 1;
    if (tr.outcome === "loss") map[tr.date].losses += 1;
  });
  return map;
}

function computeCalendarWeeks(dayMap, viewYear, viewMonth) {
  const first = new Date(viewYear, viewMonth, 1);
  const offset = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const allCells = [];
  for (let i = 0; i < offset; i++) allCells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    allCells.push({ day: d, key, data: dayMap[key] });
  }
  while (allCells.length % 7 !== 0) {
    allCells.push(null);
  }

  const weeks = [];
  for (let i = 0; i < allCells.length; i += 7) {
    const weekSlice = allCells.slice(i, i + 7);
    let weekR = 0;
    let weekDollar = 0;
    let tradingDays = 0;
    let tradeCount = 0;
    weekSlice.forEach((c) => {
      if (c && c.data) {
        weekR += c.data.netR || 0;
        weekDollar += c.data.netDollar || 0;
        tradingDays += 1;
        tradeCount += c.data.count || 0;
      }
    });
    weeks.push({
      days: weekSlice,
      summary: {
        weekNumber: Math.floor(i / 7) + 1,
        netR: weekR,
        netDollar: weekDollar,
        tradingDays,
        tradeCount
      }
    });
  }
  return weeks;
}

function computeMonthStats(weeks) {
  let totalR = 0;
  let totalDollar = 0;
  let days = 0;
  weeks.forEach((w) => {
    totalR += w.summary.netR;
    totalDollar += w.summary.netDollar;
    days += w.summary.tradingDays;
  });
  return { totalR, totalDollar, days };
}

function computeWeeklyConsistency(list) {
  const now = new Date();
  const startOfWeek = new Date(now);
  const day = startOfWeek.getDay();
  const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
  startOfWeek.setDate(diff);
  const mondayStr = startOfWeek.toISOString().slice(0, 10);

  const thisWeekTrades = list.filter((tr) => tr.date >= mondayStr);
  const count = thisWeekTrades.length;
  const wins = thisWeekTrades.filter((tr) => tr.outcome === "win").length;
  const losses = thisWeekTrades.filter((tr) => tr.outcome === "loss").length;
  const bes = thisWeekTrades.filter((tr) => tr.outcome === "be").length;
  const netR = thisWeekTrades.reduce((acc, tr) => acc + (tr.rMultiple || 0), 0);
  const netDollar = thisWeekTrades.reduce((acc, tr) => acc + (tr.pnlDollar || 0), 0);
  const winRate = count ? Math.round((wins / count) * 100) : 0;
  return { count, wins, losses, bes, netR, netDollar, winRate };
}
