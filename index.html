  const [roomTab, setRoomTab] = useState("browse");
  const [filters, setFilters] = useState({ ...BT_EMPTY_FILTERS });
  const [query, setQuery] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [curveMode, setCurveMode] = useState("R");
  const [seshModal, setSeshModal] = useState(null); // null | { id?: string }
  const [tradeModal, setTradeModal] = useState(null); // trade object | null
  useEffect(() => {
    if (!deepTradeId) return;
    const hit = (backtestTrades || []).find((t) => String(t.id) === String(deepTradeId));
    if (hit) { setTradeModal(hit); setDeepTradeId(null); }
  }, [deepTradeId, backtestTrades]);
  const [researchSel, setResearchSel] = useState(null); // { type, value, label } | null
  const [seshShowAll, setSeshShowAll] = useState(false);
  const [showYearAdd, setShowYearAdd] = useState(false);
  const [customYear, setCustomYear] = useState("");
  const [yearErr, setYearErr] = useState("");

  const seshById = useMemo(() => {
    const m = {};
    (backtestSessions || []).forEach((s) => { m[s.id] = s; });
    return m;
  }, [backtestSessions]);

  const tradeNums = useMemo(() => btTradeNumbers(backtestTrades), [backtestTrades]);

  const setF = (k, v) => setFilters((f) => ({ ...f, [k]: v }));
  const activeFilterCount = useMemo(() => {
    let n = 0;
    if (filters.market) n++;
    if (filters.strategy) n++;
    if (filters.session !== "all") n++;
    if (filters.timeframe !== "all") n++;
    if (filters.result !== "all") n++;
    if (filters.tag.trim()) n++;
    if (filters.status !== "all") n++;
    if (filters.startDate) n++;
    if (filters.endDate) n++;
    if (query.trim()) n++;
    return n;
  }, [filters, query]);
  const clearFilters = () => { setFilters({ ...BT_EMPTY_FILTERS }); setQuery(""); };
  const [recent, setRecent] = useState(() => btReadRecent());
  useEffect(() => {
    const d = btNormDrill(drill);
    const hasLoc = d.year != null || d.quarter != null || d.month != null || d.week != null || d.day || d.sessionId;
    if (!hasLoc) return;
    setRecent((prev) => {
      const key = JSON.stringify(d);
      const entry = { drill: d, filters: { ...BT_EMPTY_FILTERS, ...filters }, query: query || "", ts: Date.now() };
      const next = [entry, ...prev.filter((e) => JSON.stringify(btNormDrill(e.drill)) !== key)].slice(0, BT_RECENT_MAX);
      btWriteRecent(next);
      return next;
    });
  }, [drill, filters, query]);
  const openRecent = (e) => {
    if (!e || !e.drill) return;
    setSeshShowAll(false);
    setRoomTab("browse");
    setFilters({ ...BT_EMPTY_FILTERS, ...(e.filters || {}) });
    setQuery(e.query || "");
    setDrill({ ...btNormDrill(e.drill) });
  };
  const clearRecent = () => { setRecent([]); btWriteRecent([]); };
  const [favs, setFavs] = useState(() => btReadFavs());
  const favKeys = useMemo(() => new Set(favs.map((f) => f.key)), [favs]);
  const isFav = (key) => favKeys.has(key);
  const writeFavs = (next) => { setFavs(next); btWriteFavs(next); btPushFavs(next, user); };
  const toggleFavPeriod = (d) => {
    const nd = btNormDrill(d || drill);
    const key = "p:" + JSON.stringify(nd);
    writeFavs(favKeys.has(key) ? favs.filter((f) => f.key !== key) : [...favs, { key, kind: "period", drill: nd, ts: Date.now() }]);
  };
  const toggleFavTrade = (tr) => {
    if (!tr || !tr.id) return;
    const key = "t:" + tr.id;
    writeFavs(favKeys.has(key) ? favs.filter((f) => f.key !== key) : [...favs, { key, kind: "trade", tradeId: tr.id, ts: Date.now() }]);
  };
  const periodFavKey = "p:" + JSON.stringify(btNormDrill(drill));
  const togglePeriodFav = () => toggleFavPeriod(drill);
  const openFav = (f) => {
    if (!f) return;
    if (f.kind === "trade") {
      const tr = (backtestTrades || []).find((t) => t.id === f.tradeId);
      if (tr) setTradeModal(tr);
      return;
    }
    setSeshShowAll(false);
    setRoomTab("browse");
    setDrill({ ...btNormDrill(f.drill) });
  };
  useEffect(() => {
    let unsub = null;
    try {
      if (typeof db === "undefined" || !db || !user || !user.uid || user.isAnonymous) return;
      unsub = onSnapshot(doc(db, "users", user.uid, "settings", "backtest"), (snap) => {
        const remote = snap.exists() ? snap.data().btFavs : null;
        if (!Array.isArray(remote)) return;
        setFavs((prev) => {
          const keys = new Set(prev.map((f) => f.key));
          const add = remote.filter((f) => f && f.key && !keys.has(f.key));
          if (!add.length) return prev;
          const merged = [...prev, ...add];
          btWriteFavs(merged);
          return merged;
        });
      }, () => {});
    } catch (e) {}
    return () => { try { unsub && unsub(); } catch (e) {} };
  }, [user]);

  // Layers: all trades → base (filters+search) → filtered (date scope + session scope)
  const base = useMemo(() => {
    return (backtestTrades || []).filter((tr) => {
      if (filters.market && tr.symbol !== filters.market) return false;
      if (filters.strategy && (tr.strategy || "") !== filters.strategy) return false;
      if (filters.session !== "all" && tr.session !== filters.session) return false;
      if (filters.timeframe !== "all" && (tr.timeframe || "") !== filters.timeframe) return false;
      if (filters.result !== "all" && tr.outcome !== filters.result) return false;
      if (filters.tag.trim()) {
        const tags = (tr.tags || []).join(" ").toLowerCase();
        if (!tags.includes(filters.tag.trim().toLowerCase())) return false;
      }
      if (filters.status !== "all") {
        const st = tr.sessionId && seshById[tr.sessionId] ? (seshById[tr.sessionId].status || "Draft") : "No session";
        if (st !== filters.status) return false;
      }
      if (filters.startDate && String(tr.date || "").slice(0, 10) < filters.startDate) return false;
      if (filters.endDate && String(tr.date || "").slice(0, 10) > filters.endDate) return false;
      if (!btMatchesQuery(tr, query, tradeNums[tr.id] || "")) return false;
      return true;
    });
  }, [backtestTrades, filters, query, seshById, tradeNums]);

  const dateOk = (key) => btPeriodMatch(key, drill);

  const seshOk = (tr) => {
    if (!drill.sessionId) return true;
    if (drill.sessionId === BT_UNGROUPED) return !(tr.sessionId && seshById[tr.sessionId]);
    return tr.sessionId === drill.sessionId;
  };

  const filtered = useMemo(() => base.filter((tr) => dateOk(String(tr.date || "").slice(0, 10)) && seshOk(tr)), [base, drill, seshById]);
  const tradeKeys = useMemo(() => new Set(base.map((t) => String(t.date || "").slice(0, 10))), [base]);
  const stats = useMemo(() => btStats(filtered), [filtered]);

  const years = useMemo(() => {
    const s = new Set();
    base.forEach((tr) => {
      const m = /^(\d{4})-\d{2}-\d{2}/.exec(tr.date || "");
      if (m) s.add(+m[1]);
    });
    return [...s].sort((a, b) => b - a);
  }, [base]);

  const yearCounts = useMemo(() => {
    const m = {};
    base.forEach((tr) => {
      const mm = /^(\d{4})-\d{2}-\d{2}/.exec(tr.date || "");
      if (mm) m[mm[1]] = (m[mm[1]] || 0) + 1;
    });
    return m;
  }, [base]);

  const yearChips = useMemo(() => {
    const st = new Set();
    (backtestTrades || []).forEach((t) => {
      const mm = /^(\d{4})-\d{2}-\d{2}/.exec(t.date || "");
      if (mm) st.add(+mm[1]);
    });
    return [...st].sort((a, b) => b - a);
  }, [backtestTrades]);

  const markets = useMemo(() => [...new Set((backtestTrades || []).map((t) => t.symbol).filter(Boolean))].sort(), [backtestTrades]);
  const strategies = useMemo(() => [...new Set((backtestTrades || []).map((t) => (t.strategy || "").trim()).filter(Boolean))].sort(), [backtestTrades]);
  const timeframes = useMemo(() => {
    const used = new Set((backtestTrades || []).map((t) => t.timeframe).filter(Boolean));
    return [...BT_TIMEFRAMES.filter((t) => used.has(t)), ...[...used].filter((t) => !BT_TIMEFRAMES.includes(t)).sort()];
  }, [backtestTrades]);

  // Month-view helpers (always computed, used only at month depth — hooks stay top-level)
  const calWeeks = useMemo(
    () => (drill.year != null && drill.month != null ? btMonthWeeks(drill.year, drill.month) : []),
    [drill.year, drill.month]
  );
  const dayMap = useMemo(() => {
    const map = {};
    base.forEach((tr) => {
      const k = String(tr.date || "").slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      if (!map[k]) map[k] = [];
      map[k].push(tr);
    });
    return map;
  }, [base]);

  // ── navigation ──
  const go = (patch) => { setSeshShowAll(false); setDrill((d) => ({ ...d, ...patch })); };
  const goYear = (y) => { setRoomTab("browse"); go({ year: y, quarter: null, month: null, week: null, day: null, sessionId: null }); };
  const goQuarter = (q) => go({ quarter: q, month: null, week: null, day: null, sessionId: null });
  const goMonth = (m) => go({ quarter: Math.floor(m / 3), month: m, week: null, day: null, sessionId: null });
  const goWeek = (w) => go({ week: w, day: null, sessionId: null });
  const weekOfDay = (key) => {
    const d = btParse(key);
    if (!d) return null;
    const rows = btMonthWeeks(d.getFullYear(), d.getMonth());
    const i = rows.findIndex((wk) => wk.days.some((x) => btKey(x) === key));
    return i < 0 ? null : i;
  };
  const goDay = (key) => {
    const d = btParse(key);
    if (!d) return go({ day: key, sessionId: null });
    go({ year: d.getFullYear(), quarter: Math.floor(d.getMonth() / 3), month: d.getMonth(), week: weekOfDay(key), day: key, sessionId: null });
  };
  const openSession = (id) => { setTradeModal(null); setRoomTab("browse"); setSeshShowAll(false); setDrill({ sessionId: id }); };
  const openSessionFromModal = (id) => { setTradeModal(null); setRoomTab("browse"); go({ sessionId: id }); };
  const resetRoom = () => { setDrill({}); clearFilters(); setRoomTab("browse"); };
  const logTrade = () => {
    setEditingId(null);
    setEditingCollection("trades");
    setForm({ ...EMPTY_FORM, tradeType: "backtest", date: drill.day || btTodayKey() });
    setShowForm(true);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const depth = drill.day ? 5 : drill.week != null ? 4 : drill.month != null ? 3 : drill.quarter != null ? 2 : drill.year != null ? 1 : 0;

  const crumbs = useMemo(() => {
    const c = [{ label: "Backtest", depth: -1, key: "all" }];
    if (drill.year != null) c.push({ label: String(drill.year), depth: 1, key: btScopeKey({ year: drill.year }) });
    if (drill.quarter != null) c.push({ label: "Q" + (drill.quarter + 1), depth: 2, key: btScopeKey({ year: drill.year, quarter: drill.quarter }) });
    if (drill.month != null) c.push({ label: MONTH_NAMES[drill.month], depth: 3, key: btScopeKey({ year: drill.year, quarter: drill.quarter, month: drill.month }) });
    if (drill.week != null) c.push({ label: "W" + (drill.week + 1), depth: 4, key: btScopeKey({ year: drill.year, month: drill.month, week: drill.week }) });
    if (drill.day) c.push({ label: btFmtDay(drill.day), depth: 5, key: btScopeKey({ year: drill.year, quarter: drill.quarter, month: drill.month, day: drill.day }) });
    if (drill.sessionId) {
      const s = drill.sessionId === BT_UNGROUPED ? null : seshById[drill.sessionId];
      c.push({ label: s ? s.name : "Ungrouped", depth: -2, key: "session:" + drill.sessionId });
    }
    return c;
  }, [drill, seshById]);

  const jumpTo = (targetDepth) => {
    if (targetDepth === -2) { setSeshShowAll(false); setDrill((d) => ({ ...d, sessionId: null })); return; }
    setSeshShowAll(false);
    if (targetDepth === -1) return setDrill({});
    setDrill((d) => ({
      year: targetDepth >= 1 ? d.year : null,
      quarter: targetDepth >= 2 ? d.quarter : null,
      month: targetDepth >= 3 ? d.month : null,
      week: targetDepth >= 4 ? d.week : null,
      day: targetDepth >= 5 ? d.day : null,
      sessionId: null
    }));
  };

  const contextLabel = useMemo(() => {
    if (depth === 0) return "All time";
    return crumbs.slice(1).map((c) => c.label).join("  ›  ");
  }, [crumbs, depth]);

  // ── shared render helpers (plain functions, no hooks) ──
  const toneOf = (v) => (v > 0 ? "up" : v < 0 ? "down" : null);

  const renderEquityCard = (list, title) => (
    <div className="terminal-card rounded-2xl p-4 sm:p-5">
      <div className="flex items-center justify-between gap-3 mb-2 flex-wrap">
        <div className={tx("text-[11px] font-bold uppercase tracking-wider text-slate-400")}>{title || "Growth curve"}</div>
        <div className={tx("flex items-center rounded-xl bg-[#050914] border border-slate-800 p-0.5")}>
          {(["R", "$"]).map((m) => (
            <button
              key={m} type="button" onClick={() => setCurveMode(m)}
              className={tx(`px-3 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer ${curveMode === m ? "bg-cyan-500 text-slate-950 shadow-sm" : "text-slate-400 hover:text-white"}`)}
            >{m}</button>
          ))}
        </div>
      </div>
      <BTEquityCurve trades={list} mode={curveMode} />
    </div>
  );





  // ── browse views ──
  const renderOverview = () => (
    <div className="space-y-5">
      <div className="grid grid-cols-1 xl:grid-cols-3 gap-3">
        <div className="xl:col-span-1">
          <BTKpi hero label="Net R · all time" value={btFmtR(stats.netR)} sub={`${stats.total} trades · ${stats.winRate}% win rate · ${btFmtMoney(stats.netDollar)}`} tone={toneOf(stats.netR)} />
        </div>
        <div className="xl:col-span-2"><BTHighlights list={filtered} seshById={seshById} /></div>
      </div>
      <BTKpiRow s={stats} />
      <div>
        <div className="mb-3"><BTSectionHead icon={<CalendarRange size={15} className={tx("text-cyan-400")} />} title="Years" sub={years.length ? "Pick a year to drill into quarters, months and days" : "Saved backtest trades will appear here by year"} right={(
          <div className="relative">
            <button type="button" onClick={() => setCalOpen((o) => !o)} title="Jump to date" aria-label="Jump to date" aria-expanded={calOpen} className={tx(`p-2 rounded-xl border transition-colors cursor-pointer ${calOpen ? "border-cyan-400/60 text-cyan-300 bg-cyan-500/10" : "border-slate-700/70 text-slate-400 hover:text-cyan-300 hover:border-cyan-400/40"}`)}><Calendar size={16} /></button>
            {calOpen && (
              <div className="absolute right-0 top-full mt-2 z-50">
                <BTDateJump tradeKeys={tradeKeys} onPick={(key) => { setCalOpen(false); goDay(key); }} />
              </div>
            )}
          </div>
        )} /></div>
        {calOpen && <div className="fixed inset-0 z-40" onClick={() => setCalOpen(false)} />}
        {years.length === 0 ? (
          <BTEmpty title="No backtest trades yet" sub="Log your first backtest trade and this room will build your year-by-year analytics automatically." action={<button type="button" onClick={logTrade} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors cursor-pointer">Log a backtest trade</button>} />
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
            {years.map((y) => (
              <BTPeriodCard
                key={y} title={String(y)} sub="January – December"
                status={btPeriodStatus(`${y}-01-01`, `${y}-12-31`)}
                list={base.filter((t) => String(t.date || "").slice(0, 4) === String(y))}
                onClick={() => goYear(y)}
              />
            ))}
          </div>
        )}
      </div>
      {recent.length > 0 && (
        <div className="terminal-card rounded-2xl p-4">
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-2">
              <Clock size={14} className={tx("text-cyan-400")} />
              <div className={tx("text-sm font-bold text-white font-display tracking-tight")}>Recent</div>
            </div>
            <button type="button" onClick={clearRecent} className="text-[10px] font-bold text-slate-500 hover:text-rose-300 transition-colors cursor-pointer">Clear</button>
          </div>
          <div role="group" aria-label="Recent history" className="flex flex-col gap-0.5">
            {recent.map((e, i) => {
              const rlabel = btRecentLabel(btNormDrill(e.drill), seshById);
              if (!rlabel) return null;
              return (
                <button key={i} type="button" onClick={() => openRecent(e)} title={`Open ${rlabel}`} className={tx("flex items-center justify-between gap-3 px-3 py-2 rounded-xl text-left hover:bg-slate-800/60 transition-colors cursor-pointer group")}>
                  <span className="text-xs font-bold text-slate-300 group-hover:text-cyan-200 truncate">{rlabel}</span>
                  <span className="text-[10px] text-slate-600 font-mono shrink-0">{btAgo(e.ts)}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
      {renderEquityCard(filtered)}
    </div>
  );

  const renderYear = () => {
    const y = drill.year;
    const inYear = (t) => String(t.date || "").slice(0, 4) === String(y);
    const inQuarter = (t, q) => {
      if (!inYear(t)) return false;
      const m = +String(t.date || "").slice(5, 7) - 1;
      if (isNaN(m) || m < 0 || m > 11) return false;
      return Math.floor(m / 3) === q;
    };
    const monthBars = Array.from({ length: 12 }, (_, m) => {
      const s = btPeriodStats(base, { year: y, quarter: Math.floor(m / 3), month: m });
      return { label: BT_MSHORT[m], v: Math.round(s.netR * 100) / 100 };
    });
    return (
      <div className="space-y-5">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-1">
            <button type="button" onClick={() => goYear(y - 1)} className={tx("p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 cursor-pointer transition-colors")} title="Previous year"><ChevronLeft size={18} /></button>
            <h2 className={tx("text-2xl sm:text-3xl font-extrabold text-white font-display tracking-tight px-1")}>{y}</h2>
            <BTFavStar active={isFav(periodFavKey)} onToggle={togglePeriodFav} label={String(y)} />
            <button type="button" onClick={() => goYear(y + 1)} className={tx("p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 cursor-pointer transition-colors")} title="Next year"><ChevronRight size={18} /></button>
          </div>
          <BTPeriodPill status={btPeriodStatus(`${y}-01-01`, `${y}-12-31`)} />
        </div>
        <div className="grid grid-cols-1 xl:grid-cols-12 gap-5"><div role="region" aria-label="Dashboard" className="min-w-0 space-y-5 xl:col-span-4">
        <BTKpiRow s={stats} cols="grid-cols-2" />
        <BTKpiRow2 s={stats} cols="grid-cols-2" />
        <div className="grid grid-cols-1 gap-5">
          <div>{renderEquityCard(filtered, `Growth curve · ${y}`)}</div>
          <div className="terminal-card rounded-2xl p-4 sm:p-5">
            <div className={tx("text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3")}>Net R by month</div>
            <BTBars items={monthBars} />
          </div>
        </div>
        </div><div className="min-w-0 space-y-5 xl:col-span-8">
        <div>
          <div className="mb-3"><BTSectionHead icon={<CalendarRange size={15} className={tx("text-cyan-400")} />} title="Quarters" sub={`Four quarters in ${y}`} /></div>
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
            {[0, 1, 2, 3].map((q) => {
              const qr = btQuarterRange(y, q);
              const rows = base.filter((t) => inQuarter(t, q));
              return (
                <BTPeriodCard
                  key={q} title={`Q${q + 1}`} sub={`${BT_MSHORT[q * 3]} – ${BT_MSHORT[q * 3 + 2]}`}
                  status={btPeriodStatus(qr.start, qr.end)} list={rows} onClick={() => goQuarter(q)} dim={rows.length === 0}
                />
              );
            })}
          </div>
        </div>
        <BTHighlights list={filtered} seshById={seshById} />
        <div>
          <div className="mb-3"><BTSectionHead icon={<BarChart3 size={15} className={tx("text-cyan-400")} />} title="Trades" sub={`${filtered.length} execution${filtered.length === 1 ? "" : "s"} in ${y} · newest first`} /></div>
          <BTTradesTable list={filtered} onOpen={(tr) => setTradeModal(tr)} onZoom={(src) => { setLightbox(src); setZoomScale(1); }} onLog={logTrade} emptyTitle={`No trades in ${y}`} emptySub="Trades logged for this year will show up here automatically." />
        </div>
        </div></div>
      </div>
    );
  };

  const renderQuarter = () => {
    const { year: y, quarter: q } = drill;
    const qr = btQuarterRange(y, q);
    const stepQuarter = (n) => {
      const t = y * 4 + q + n;
      setRoomTab("browse");
      go({ year: Math.floor(t / 4), quarter: ((t % 4) + 4) % 4, month: null, week: null, day: null, sessionId: null });
    };
    return (
      <div className="space-y-5">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-1">
            <button type="button" onClick={() => stepQuarter(-1)} className={tx("p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 cursor-pointer transition-colors")} title="Previous quarter"><ChevronLeft size={18} /></button>
            <h2 className={tx("text-2xl sm:text-3xl font-extrabold text-white font-display tracking-tight px-1")}>Q{q + 1} <span className="text-slate-500">{y}</span></h2>
            <BTFavStar active={isFav(periodFavKey)} onToggle={togglePeriodFav} label={`Q${q + 1} ${y}`} />
            <button type="button" onClick={() => stepQuarter(1)} className={tx("p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 cursor-pointer transition-colors")} title="Next quarter"><ChevronRight size={18} /></button>
          </div>
          <BTPeriodPill status={btPeriodStatus(qr.start, qr.end)} />
        </div>
        <div className="grid grid-cols-1 xl:grid-cols-12 gap-5"><div role="region" aria-label="Dashboard" className="min-w-0 space-y-5 xl:col-span-4">
        <BTKpiRow s={stats} cols="grid-cols-2" />
        <BTKpiRow2 s={stats} cols="grid-cols-2" />
        {renderEquityCard(filtered, `Growth curve · Q${q + 1} ${y}`)}
        </div><div className="min-w-0 space-y-5 xl:col-span-8">
        <div>
          <div className="mb-3"><BTSectionHead icon={<CalendarRange size={15} className={tx("text-cyan-400")} />} title="Months" sub={`Three months in Q${q + 1}`} /></div>

  const renderDay = () => {

            </div>
          )}
          {sesh && sesh.rules && (
            <div className={tx("mt-4 p-3.5 rounded-xl bg-slate-900/70 border border-slate-800 text-[13px] text-slate-300 leading-relaxed")}>
              <div className={tx("text-[10px] uppercase text-cyan-300/80 font-bold mb-1 tracking-wider")}>Rules</div>
              <p className="whitespace-pre-wrap">{sesh.rules}</p>
            </div>
          )}
          {sesh && sesh.notes && (
            <div className={tx("mt-3 p-3.5 rounded-xl bg-slate-900/70 border border-slate-800 text-[13px] text-slate-300 leading-relaxed")}>
              <div className={tx("text-[10px] uppercase text-cyan-300/80 font-bold mb-1 tracking-wider")}>Notes</div>
              <p className="whitespace-pre-wrap">{sesh.notes}</p>
            </div>
          )}
          {sesh && (sesh.images || []).length > 0 && (
            <div className="mt-3">
              <div className="text-[10px] uppercase text-slate-500 font-bold mb-1.5 tracking-wider">Screenshots</div>
              <div className="flex gap-2.5 overflow-x-auto pb-1">
                {(sesh.images || []).map((src, i) => (
                  <img key={i} src={src} alt="session chart" onClick={() => { setLightbox(src); setZoomScale(1); }} className={tx("h-24 rounded-xl border border-slate-700 object-cover cursor-zoom-in hover:border-cyan-400 transition-all shrink-0")} />
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="grid grid-cols-1 xl:grid-cols-12 gap-5"><div role="region" aria-label="Dashboard" className="min-w-0 space-y-5 xl:col-span-4">
        <div className="grid grid-cols-2 gap-3">
          <BTKpi label="Trades" value={s.total} sub={`${s.wins}W · ${s.losses}L · ${s.bes}BE`} />
          <BTKpi label="Win rate" value={`${s.winRate}%`} sub={`Exp ${btFmtR2(s.expectancy)}`} tone={s.total && s.winRate >= 50 ? "up" : s.total ? "down" : null} />
          <BTKpi label="Net R" value={btFmtR(s.netR)} sub={btFmtMoney(s.netDollar)} tone={toneOf(s.netR)} />
          <BTKpi label="Profit factor" value={s.profitFactor == null ? "—" : Number(s.profitFactor).toFixed(2)} sub={`Avg ${btFmtR(s.avgR)}`} tone="accent" />
          <BTKpi label="Max drawdown" value={s.maxDD ? `-${Number(s.maxDD).toFixed(1)}R` : "—"} sub={`Streak ${s.maxConsecWins}W / ${s.maxConsecLosses}L`} />
        </div>
        <div className="grid grid-cols-2 gap-3">
          <BTKpi label="Avg win" value={s.wins ? btFmtR(s.avgWin) : "—"} sub={s.wins ? `${s.wins} wins` : "—"} />
          <BTKpi label="Avg loss" value={s.losses ? btFmtR(s.avgLoss) : "—"} sub={s.losses ? `${s.losses} losses` : "—"} />
          <BTKpi label="Largest win" value={s.total ? btFmtR(s.maxWin) : "—"} sub="Single trade" />
          <BTKpi label="Largest loss" value={s.total ? btFmtR(s.maxLoss) : "—"} sub="Single trade" />
        </div>

        {renderEquityCard(allSeshTrades, `Growth curve · ${sesh ? sesh.name : "Ungrouped"}`)}

        </div><div className="min-w-0 space-y-5 xl:col-span-8">
        <div>
          <div className="mb-3 flex items-center justify-between gap-3 flex-wrap">
            <BTSectionHead icon={<BarChart3 size={15} className={tx("text-cyan-400")} />} title="Trades" sub={showToggle && !seshShowAll ? `Showing ${contextLabel} — tap a trade to review it` : "Every trade in this session — tap one to review it"} />
            {showToggle && (
              <button type="button" onClick={() => setSeshShowAll((v) => !v)} className={tx("px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 text-[11px] font-bold text-slate-300 hover:border-cyan-400/40 hover:text-cyan-200 cursor-pointer transition-colors")}>
                {seshShowAll ? `Show ${contextLabel} only` : "Show all session trades"}
              </button>
            )}
          </div>
          <BTTradesTable list={visibleTrades} onOpen={(tr) => setTradeModal(tr)} onZoom={(src) => { setLightbox(src); setZoomScale(1); }} onLog={logTrade} emptyTitle="No trades here yet" emptySub="Trades linked to this session will appear here automatically." />
        </div>
        </div></div>
      </div>
    );
  };

  // ── Research Lab: pattern breakdowns over the current view ──
  const labGroup = (rows, keyFn) => {
    const m = {};
    rows.forEach((t) => {
      const ks = keyFn(t);
      (Array.isArray(ks) ? ks : [ks]).forEach((k) => {
        const g = (m[k.key] = m[k.key] || { key: k.key, label: k.label, n: 0, w: 0, r: 0 });
        g.n++;
        if (String(t.outcome || "").toLowerCase() === "win") g.w++;
        g.r += Number(t.rMultiple) || 0;
      });
    });
    return Object.values(m);
  };
  const labSortPerf = (a, b) => (b.r / b.n - a.r / a.n) || (b.n - a.n) || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0);
  const labSortCount = (a, b) => (b.n - a.n) || (b.r / b.n - a.r / a.n) || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0);
  const labSessionLabel = (id) => {
    const f = (SESSIONS || []).find((x) => x.id === id);
    return f ? f.label : (id || "No session");
  };
  const renderResearchTab = () => {
    const setups = labGroup(filtered, (t) => {
      const v = String(t.setup || "").trim();
      return { key: v, label: v || "No setup logged" };
    }).sort(labSortPerf);
    const mistakes = labGroup(filtered, (t) => (t.mistakes || []).map((x) => ({ key: x, label: x }))).sort(labSortCount);
    const markets = labGroup(filtered, (t) => ({ key: t.symbol || "", label: t.symbol || "—" })).sort(labSortPerf);
    const sessions = labGroup(filtered, (t) => ({ key: t.session || "", label: labSessionLabel(t.session || "") })).sort(labSortPerf);
    const matches = !researchSel ? [] : filtered.filter((t) => {
      const v = researchSel.value;
      if (researchSel.type === "setup") return String(t.setup || "").trim() === v;
      if (researchSel.type === "mistake") return (t.mistakes || []).includes(v);
      if (researchSel.type === "market") return (t.symbol || "") === v;
      return (t.session || "") === v;
    });
    return (
      <div className="space-y-5">
        <BTSectionHead icon={<FlaskConical size={15} className={tx("text-cyan-400")} />} title="Research Lab" sub={`Patterns in the current view · ${contextLabel}`} />
        {filtered.length === 0 ? (
          <BTEmpty title="No trades in this view" sub="Widen the date range or clear filters to research more trades." />
        ) : (
          <div className="space-y-5">
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
              <BTLabTable title="Best setups" icon={<Target size={15} className={tx("text-cyan-400")} />} sub="Tap a row to filter" nameCol="Setup" countLabel="Trades" rows={setups} selType="setup" sel={researchSel} onPick={setResearchSel} ranked />
              <BTLabTable title="Mistake analysis" icon={<Flame size={15} className={tx("text-cyan-400")} />} sub="Tap a row to filter" nameCol="Mistake" countLabel="Times" rows={mistakes} selType="mistake" sel={researchSel} onPick={setResearchSel} />
              <BTLabTable title="Sessions" icon={<Globe size={15} className={tx("text-cyan-400")} />} sub="Best vs weakest" nameCol="Session" countLabel="Trades" rows={sessions} selType="session" sel={researchSel} onPick={setResearchSel} ranked />
              <BTLabTable title="Markets" icon={<BarChart3 size={15} className={tx("text-cyan-400")} />} sub="Best vs weakest" nameCol="Market" countLabel="Trades" rows={markets} selType="market" sel={researchSel} onPick={setResearchSel} ranked />
            </div>
            {researchSel && (
              <div>
                <div className="mb-3 flex items-center justify-between gap-3 flex-wrap">
                  <BTSectionHead icon={<Filter size={15} className={tx("text-cyan-400")} />} title="Matching trades" sub={`${matches.length} trade${matches.length === 1 ? "" : "s"} · ${researchSel.label}`} />
                  <button type="button" onClick={() => setResearchSel(null)} className={tx("px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-800 text-[11px] font-bold text-slate-300 hover:border-cyan-400/40 hover:text-cyan-200 cursor-pointer transition-colors")}>Clear selection</button>
                </div>
                <div>
                  <BTTradesTable list={matches} onOpen={(tr) => setTradeModal(tr)} onZoom={(src) => { setLightbox(src); setZoomScale(1); }} onLog={logTrade} emptyTitle="No trades match" emptySub="Try another row." ariaLabel="Research results" />
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  // ── room tabs ──
  const renderSessionsTab = () => {
    const cards = (backtestSessions || []).map((s) => {
      const rows = base.filter((t) => t.sessionId === s.id);
      return { sesh: s, rows, s: btStats(rows) };
    });
    const ungrouped = base.filter((t) => !(t.sessionId && seshById[t.sessionId]));
    return (
      <div className="space-y-5">
        <BTSectionHead
          icon={<Layers size={15} className={tx("text-cyan-400")} />} title="Backtest sessions" sub="Each session is one testing project — tap to open its full breakdown"
          right={<button type="button" onClick={() => setSeshModal({})} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors cursor-pointer shadow-lg shadow-cyan-500/20"><Plus size={14} /> New session</button>}
        />
        {(backtestSessions || []).length === 0 && ungrouped.length === 0 && (
          <BTEmpty title="No sessions yet" sub="Create a session like “XAUUSD — MMXM — New York”, then link trades to it when you log them." action={<button type="button" onClick={() => setSeshModal({})} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors cursor-pointer">Create your first session</button>} />
        )}
        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
          {cards.map(({ sesh, rows, s }) => (
            <div key={sesh.id} onClick={() => openSession(sesh.id)} className="terminal-card rounded-2xl p-4 cursor-pointer group hover:border-cyan-400/40 transition-all">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className={tx("text-[15px] font-extrabold text-white truncate")}>{sesh.name}</div>
                  <div className="text-[11px] text-slate-500 mt-0.5 truncate">{[sesh.market, sesh.strategy, sesh.timeframe].filter(Boolean).join(" · ") || "No details yet"}</div>
                </div>
                <BTSessionPill status={sesh.status} />
              </div>
              <div className={tx("grid grid-cols-3 gap-2 mt-3.5 pt-3.5 border-t border-slate-800/70")}>
                <div>
                  <div className="text-[9px] uppercase tracking-wider text-slate-500 font-bold">Trades</div>
                  <div className={tx("text-sm font-extrabold text-white tnum mt-0.5")}>{s.total}</div>
                </div>
                <div>
                  <div className="text-[9px] uppercase tracking-wider text-slate-500 font-bold">Win %</div>
                  <div className={tx(`text-sm font-extrabold tnum mt-0.5 ${s.winRate >= 50 ? "text-emerald-400" : "text-rose-400"}`)}>{s.total ? `${s.winRate}%` : "—"}</div>
                </div>
                <div>
                  <div className="text-[9px] uppercase tracking-wider text-slate-500 font-bold">Net R</div>
                  <div className={tx(`text-sm font-extrabold tnum mt-0.5 ${s.netR >= 0 ? "text-emerald-400" : "text-rose-400"}`)}>{btFmtR(s.netR)}</div>
                </div>
              </div>
            </div>
          ))}
          {ungrouped.length > 0 && (
            <div onClick={() => openSession(BT_UNGROUPED)} className="terminal-card rounded-2xl p-4 cursor-pointer group hover:border-cyan-400/40 transition-all border-dashed">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className={tx("text-[15px] font-extrabold text-white")}>Ungrouped trades</div>
                  <div className="text-[11px] text-slate-500 mt-0.5">Not linked to a session</div>
                </div>
                <BTPill tone="slate">{ungrouped.length}</BTPill>
              </div>
              <div className={tx("text-[11px] text-slate-500 mt-3.5 pt-3.5 border-t border-slate-800/70")}>Edit a trade to link it to a session.</div>
            </div>
          )}
        </div>
      </div>
    );
  };

  const renderStrategiesTab = () => {
    const real = btGroup(filtered, (t) => (t.strategy || "").trim() || "No strategy").filter((g) => g.key !== "No strategy");
    return (
      <div className="space-y-5">
        <BTSectionHead icon={<Target size={15} className={tx("text-cyan-400")} />} title="Strategy performance" sub="Which models actually perform — tap a row to filter the whole room" />
        {real.length === 0 ? (
          <BTEmpty title="No strategies tagged yet" sub="Add a strategy like MMXM or CRT when you log a trade, and it will be ranked here automatically." action={<button type="button" onClick={logTrade} className="px-4 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors cursor-pointer">Log a trade</button>} />
        ) : (
          <div className="terminal-card rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm min-w-[760px]">
                <thead>
                  <tr className={tx("text-left text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-800/70")}>
                    <th className="px-4 py-3 font-bold">Strategy</th>
                    <th className="px-3 py-3 font-bold text-right">Trades</th>
                    <th className="px-3 py-3 font-bold text-right">Win %</th>
                    <th className="px-3 py-3 font-bold text-right">Net R</th>
                    <th className="px-3 py-3 font-bold text-right">Expectancy</th>
                    <th className="px-3 py-3 font-bold text-right">Profit factor</th>
                    <th className="px-3 py-3 font-bold text-right">Avg R</th>
                    <th className="px-4 py-3 font-bold text-right">Max DD</th>
                  </tr>
                </thead>
                <tbody>
                  {real.map((g, i) => (
                    <tr key={g.key} onClick={() => { setF("strategy", g.key); setRoomTab("browse"); }} className={tx("border-t border-slate-800/50 cursor-pointer hover:bg-slate-900/60 transition-colors")}>
                      <td className={tx("px-4 py-3 font-bold text-white text-[13px]")}>
                        <span className="flex items-center gap-2">
                          {i === 0 && <span className="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0" title="Top performer" />}
                          {g.key}
                        </span>
                      </td>
                      <td className={tx("px-3 py-3 text-right text-slate-400 tnum text-[13px]")}>{g.stats.total}</td>
                      <td className={tx(`px-3 py-3 text-right tnum text-[13px] font-bold ${g.stats.winRate >= 50 ? "text-emerald-300" : "text-rose-300"}`)}>{g.stats.winRate}%</td>
                      <td className={tx(`px-3 py-3 text-right tnum text-[13px] font-extrabold ${g.stats.netR >= 0 ? "text-emerald-400" : "text-rose-400"}`)}>{btFmtR(g.stats.netR)}</td>
                      <td className={tx("px-3 py-3 text-right text-slate-300 tnum text-[13px]")}>{btFmtR2(g.stats.expectancy)}</td>
                      <td className={tx("px-3 py-3 text-right text-cyan-300 tnum text-[13px] font-bold")}>{g.stats.profitFactor == null ? "—" : Number(g.stats.profitFactor).toFixed(2)}</td>
                      <td className={tx("px-3 py-3 text-right text-slate-300 tnum text-[13px]")}>{btFmtR(g.stats.avgR)}</td>
                      <td className={tx("px-4 py-3 text-right text-slate-400 tnum text-[13px]")}>{g.stats.maxDD ? `-${Number(g.stats.maxDD).toFixed(1)}R` : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    );
  };

  const renderAnalyticsTab = () => {
    const byMarket = btGroup(filtered, (t) => t.symbol || "—");
    const bySession = btGroup(filtered, (t) => (SESSIONS.find((s) => s.id === t.session) || {}).label || "—");
    const byTimeframe = btGroup(filtered, (t) => t.timeframe || "Not set");
    const bySetup = btGroup(filtered, (t) => (t.setup || "").trim() || "Not set");
    const byDir = btGroup(filtered, (t) => t.direction === "buy" ? "Buy" : t.direction === "sell" ? "Sell" : "—");
    const byTag = btGroup(filtered, (t) => (t.tags && t.tags.length ? t.tags : ["Untagged"]));
    const byMistake = btGroup(filtered, (t) => (t.mistakes && t.mistakes.length ? t.mistakes : ["No mistake logged"]));
    return (
      <div className="space-y-5">
        <BTSectionHead icon={<BarChart2 size={15} className={tx("text-cyan-400")} />} title="Analytics" sub={`Full breakdown of the current view · ${contextLabel}`} />
        <BTKpiRow2 s={stats} />
        {renderEquityCard(filtered, "Growth curve")}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
          <BTBreakdown title="By market" groups={byMarket} onPick={(k) => { if (k !== "—") { setF("market", k); setRoomTab("browse"); } }} />
          <BTBreakdown title="By trading session" groups={bySession} />
          <BTBreakdown title="By timeframe" groups={byTimeframe} onPick={(k) => { if (k !== "Not set") { setF("timeframe", k); setRoomTab("browse"); } }} />
          <BTBreakdown title="By direction" groups={byDir} />
          <BTBreakdown title="By setup" groups={bySetup} />
          <BTBreakdown title="By tag" groups={byTag.filter((g) => g.key !== "Untagged")} emptyText="Tag trades (FVG, SMT, Liquidity Sweep…) to see what really works." />
        </div>
        <BTBreakdown title="Mistake impact — which mistakes cost the most" groups={byMistake.filter((g) => g.key !== "No mistake logged")} emptyText="Log mistakes on your trades to see their impact here." />
      </div>
    );
  };

  // ── header / filters / breadcrumb ──
  const selectCls = "w-full bg-[#050914] border border-slate-700/80 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 cursor-pointer font-semibold";

  return (
    <div className="space-y-5">
      {/* Header */}
      <div className="terminal-card rounded-2xl p-4 sm:p-5">
        <div className="flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3">
            <div className={tx("w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-300 shrink-0")}>
              <BarChart3 size={19} />
            </div>
            <div>
              <h1 className={tx("text-lg sm:text-xl font-extrabold text-white font-display tracking-tight leading-none")}>Backtest</h1>
              <div className="text-[11px] text-slate-500 mt-1 font-semibold">{contextLabel}{activeFilterCount > 0 ? ` · ${activeFilterCount} filter${activeFilterCount === 1 ? "" : "s"}` : ""}</div>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <div className="relative">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
              <input
                value={query} onChange={(e) => setQuery(e.target.value)}
                placeholder="Search market, strategy, date, notes…"
                className={tx("bg-[#050914] border border-slate-800 rounded-xl pl-9 pr-8 py-2.5 text-xs text-white focus:border-cyan-400 focus:outline-none transition-all placeholder:text-slate-600 w-[200px] sm:w-[240px]")}
              />
              {query && <button type="button" onClick={() => setQuery("")} className={tx("absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded text-slate-500 hover:text-slate-200")}><X size={12} /></button>}
            </div>
            <button
              type="button" onClick={() => setShowFilters((v) => !v)}
              className={tx(`flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold border transition-colors cursor-pointer ${showFilters || activeFilterCount > 0 ? "bg-cyan-500/15 border-cyan-500/40 text-cyan-200" : "border-slate-700 text-slate-300 hover:border-slate-500"}`)}
            >
              <SlidersHorizontal size={13} /> Filters{activeFilterCount > 0 ? ` (${activeFilterCount})` : ""}
            </button>
            <button type="button" onClick={() => setSeshModal({})} className={tx("hidden sm:flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold border border-slate-700 text-slate-200 hover:border-cyan-400/50 hover:text-cyan-200 transition-colors cursor-pointer")}><Plus size={13} /> Session</button>
            <button type="button" onClick={logTrade} className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 transition-colors cursor-pointer shadow-lg shadow-cyan-500/20"><Plus size={13} /> Log trade</button>
          </div>
        </div>

        {/* Room tabs */}
        <div className="flex items-center gap-1.5 mt-4 overflow-x-auto no-scrollbar">
          {[["browse", "Browse", CalendarRange], ["sessions", `Sessions (${(backtestSessions || []).length})`, Layers], ["strategies", "Strategies", Target], ["analytics", "Analytics", BarChart2], ["research", "Research", FlaskConical]].map(([id, label, Icon]) => (
            <button
              key={id} type="button"
              onClick={() => setRoomTab(id)}
              className={tx(`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer whitespace-nowrap ${roomTab === id ? "bg-cyan-500/15 text-cyan-200 border border-cyan-500/35" : "text-slate-400 hover:text-slate-200 border border-transparent hover:bg-slate-900/60"}`)}
            >
              <Icon size={13} /> {label}
            </button>
          ))}
          <div className="flex-1" />
          {(depth > 0 || activeFilterCount > 0) && (
            <button type="button" onClick={resetRoom} className={tx("flex items-center gap-1.5 px-3 py-2 rounded-xl text-[11px] font-bold text-slate-400 hover:text-rose-300 transition-colors cursor-pointer whitespace-nowrap")}><RefreshCw size={12} /> Reset view</button>
          )}
        </div>

        {favs.length > 0 && (
          <div className={tx("mt-4 pt-4 border-t border-slate-800/70")}>
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar" role="group" aria-label="Pinned favorites">
              <span className="text-[10px] uppercase tracking-wider text-slate-500 font-mono font-bold mr-0.5 shrink-0">Pinned:</span>
              {favs.map((f) => {
                const flabel = f.kind === "trade" ? btFavTradeLabel(f.tradeId, backtestTrades) : btRecentLabel(btNormDrill(f.drill), seshById);
                if (!flabel) return null;
                return (
                  <button key={f.key} type="button" onClick={() => openFav(f)} title={`Open ${flabel}`} className={tx("flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-mono font-bold border border-amber-400/30 bg-amber-400/10 text-amber-200 hover:bg-amber-400/20 transition-all cursor-pointer whitespace-nowrap shrink-0")}>
                    <Star size={11} className="fill-amber-300 text-amber-300" />{flabel}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* Year selector */}
        {roomTab === "browse" && (
          <div className={tx("mt-4 pt-4 border-t border-slate-800/70")}>
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar" role="group" aria-label="Backtest years">
              <span className="text-[10px] uppercase tracking-wider text-slate-500 font-mono font-bold mr-0.5 shrink-0">Year:</span>
              {yearChips.map((y) => {
                const n = yearCounts[y] || 0;
                const active = drill.year === y && !drill.sessionId;
                return (
                  <button key={y} type="button" onClick={() => goYear(y)} title={n ? `${n} trade${n === 1 ? "" : "s"} in ${y}` : `Open ${y}`} className={tx(`px-3 py-1.5 rounded-full text-[11px] font-mono font-bold border transition-all cursor-pointer whitespace-nowrap shrink-0 ${active ? "bg-cyan-500/20 text-cyan-200 border-cyan-500/40" : "bg-[#050914] text-slate-400 border-slate-800 hover:text-white hover:border-slate-600"}`)}>
                    {y}{n > 0 && <span className={tx(`ml-1.5 text-[9px] ${active ? "text-cyan-300" : "text-slate-500"}`)}>·{n}</span>}
                  </button>
                );
              })}
              {showYearAdd ? (
                <span className="flex items-center gap-1 shrink-0 relative">
                  <input value={customYear} onChange={(e) => { setCustomYear(e.target.value.split("").filter((c) => "0123456789".includes(c)).join("").slice(0, 4)); setYearErr(""); }} onKeyDown={(e) => { if (e.key === "Enter") { const v = parseInt(customYear, 10); if (v >= 2000 && v <= 2050) { setShowYearAdd(false); setCustomYear(""); setYearErr(""); goYear(v); } else { setYearErr("Enter a year between 2000 and 2050"); } } }} placeholder="YYYY" inputMode="numeric" aria-label="Custom year" aria-invalid={!!yearErr} className={tx(`w-16 bg-[#050914] border rounded-full px-3 py-1.5 text-[11px] text-white font-mono focus:outline-none text-center ${yearErr ? "border-rose-500/70" : "border-cyan-500/50"}`)} />
                  <button type="button" onClick={() => { setShowYearAdd(false); setCustomYear(""); setYearErr(""); }} title="Cancel" className={tx("p-1.5 rounded-full text-slate-500 hover:text-white")}><X size={13} /></button>
                  {yearErr && <span role="alert" className="whitespace-nowrap text-[10px] font-mono font-bold text-rose-400 ml-1 shrink-0">{yearErr}</span>}
                </span>
              ) : (
                <button type="button" onClick={() => setShowYearAdd(true)} title="Add a custom year" className={tx("px-3 py-1.5 rounded-full text-[11px] font-mono font-bold border border-dashed border-slate-700 text-slate-500 hover:text-cyan-300 hover:border-cyan-500/50 transition-all cursor-pointer whitespace-nowrap shrink-0")}>+ Year</button>
              )}
            </div>
          </div>
        )}

        {/* Filters */}
        {showFilters && (
          <div className={tx("mt-4 pt-4 border-t border-slate-800/70")}>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-2.5">
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Market</label>
                <select value={filters.market} onChange={(e) => setF("market", e.target.value)} className={tx(selectCls)}>
                  <option value="">All</option>
                  {markets.map((m) => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Strategy</label>
                <select value={filters.strategy} onChange={(e) => setF("strategy", e.target.value)} className={tx(selectCls)}>
                  <option value="">All</option>
                  {strategies.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Session</label>
                <select value={filters.session} onChange={(e) => setF("session", e.target.value)} className={tx(selectCls)}>
                  <option value="all">All</option>
                  {SESSIONS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Timeframe</label>
                <select value={filters.timeframe} onChange={(e) => setF("timeframe", e.target.value)} className={tx(selectCls)}>
                  <option value="all">All</option>
                  {timeframes.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Result</label>
                <select value={filters.result} onChange={(e) => setF("result", e.target.value)} className={tx(selectCls)}>
                  <option value="all">All</option>
                  <option value="win">Wins</option>
                  <option value="loss">Losses</option>
                  <option value="be">Breakeven</option>
                </select>
              </div>
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Tag</label>
                <input value={filters.tag} onChange={(e) => setF("tag", e.target.value)} placeholder="e.g. FVG" className={tx("w-full bg-[#050914] border border-slate-700/80 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 font-semibold")} />
              </div>
              <div>
                <label className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Status</label>
                <select value={filters.status} onChange={(e) => setF("status", e.target.value)} className={tx(selectCls)}>
                  <option value="all">All</option>
                  {BT_SESSION_STATUS.map((s) => <option key={s} value={s}>{s}</option>)}
                  <option value="No session">No session</option>
                </select>
              </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-2.5">
              <div>
                <label htmlFor="range-start" className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">Start date</label>
                <input id="range-start" type="date" value={filters.startDate} onChange={(e) => setF("startDate", e.target.value)} className={tx("w-full bg-[#050914] border border-slate-700/80 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 font-semibold")} />
              </div>
              <div>
                <label htmlFor="range-end" className="text-[9px] uppercase text-slate-500 block mb-1 font-bold tracking-wider">End date</label>
                <input id="range-end" type="date" value={filters.endDate} onChange={(e) => setF("endDate", e.target.value)} className={tx("w-full bg-[#050914] border border-slate-700/80 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 font-semibold")} />
              </div>
            </div>
            {activeFilterCount > 0 && (
              <button type="button" onClick={clearFilters} className={tx("mt-3 text-[11px] font-bold text-rose-300/90 hover:text-rose-200 cursor-pointer")}>Clear all filters</button>
            )}
          </div>
        )}
      </div>

      {/* Breadcrumb — always visible while browsing backtest time */}
      {roomTab === "browse" && (
        <div className="flex items-center gap-1 flex-wrap" aria-label="Backtest location">
          {crumbs.map((c, i) => {
            const isLast = i === crumbs.length - 1;
            const showOnMobile = i === 0 || i >= crumbs.length - 2;
            const needEllipsis = i === crumbs.length - 2 && crumbs.length > 3;
            return (
              <span key={c.key} className={`${showOnMobile ? "flex" : "hidden sm:flex"} items-center gap-1`}>
                {i > 0 && <ChevronRight size={13} className="text-slate-700" />}
                {needEllipsis && (<><span className="sm:hidden text-slate-600 font-bold text-xs">…</span><ChevronRight size={13} className="text-slate-700 sm:hidden" /></>)}
                <button
                  type="button" onClick={() => jumpTo(c.depth)}
                  className={tx(`text-xs px-2.5 py-1.5 rounded-lg transition-colors cursor-pointer font-semibold ${isLast ? "text-white bg-cyan-500/10 border border-cyan-500/30 font-bold" : "text-slate-400 hover:text-cyan-200 hover:bg-slate-900/70"}`)}
                >{c.label}</button>
              </span>
            );
          })}
        </div>
      )}

      {/* Body */}
      <div key={`${roomTab}-${JSON.stringify(drill)}-${curveMode}`}>
        {roomTab === "sessions" && renderSessionsTab()}
        {roomTab === "strategies" && renderStrategiesTab()}
        {roomTab === "analytics" && renderAnalyticsTab()}
        {roomTab === "research" && renderResearchTab()}
        {roomTab === "browse" && !drill.sessionId && depth === 0 && renderOverview()}
        {roomTab === "browse" && !drill.sessionId && depth === 1 && renderYear()}
        {roomTab === "browse" && !drill.sessionId && depth === 2 && renderQuarter()}
        {roomTab === "browse" && !drill.sessionId && depth === 3 && renderMonth()}
        {roomTab === "browse" && !drill.sessionId && depth === 4 && renderWeek()}
        {roomTab === "browse" && !drill.sessionId && depth === 5 && renderDay()}
        {roomTab === "browse" && drill.sessionId && renderSessionView()}
      </div>

      {/* Modals */}
      {seshModal && (
        <BTSessionModal
          key={seshModal.id || "new"}
          initial={seshModal.id ? seshById[seshModal.id] : null}
          onClose={() => setSeshModal(null)}
          onSave={saveBacktestSession}
          onDelete={deleteBacktestSession}
        />
      )}
      {tradeModal && (
        <BTTradeModal tr={tradeModal} num={tradeNums[tradeModal.id]} onClose={() => setTradeModal(null)} onOpenSession={openSessionFromModal} isFav={tradeModal ? isFav("t:" + tradeModal.id) : false} onToggleFav={() => tradeModal && toggleFavTrade(tradeModal)} />
      )}
    </div>
  );
}

                        const netR = cell.data?.netR || 0;

                          <div

    /* ══════════════════════════════════════════════════════════════════════
const LOGIN_AVATAR_FALLBACK = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2300C8FF'/><stop offset='1' stop-color='%2310B981'/></linearGradient></defs><rect width='256' height='256' fill='%23080F1D'/><circle cx='128' cy='128' r='118' fill='none' stroke='url(%23g)' stroke-width='10'/><text x='128' y='170' font-family='Arial,sans-serif' font-size='120' font-weight='800' fill='%23F5F7FA' text-anchor='middle'>A</text></svg>";

       6k. COMPONENT — LoginPage (split-screen sign-in)
       ══════════════════════════════════════════════════════════════════════ */

function LoginPage() {
  const { lang, setLang, t, theme, setTheme } = useApp();

  // Email & Password auth state (UI-only; global auth state lives in context)
  const [authMode, setAuthMode] = useState("signin"); // "signin" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [authError, setAuthError] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [guestBusy, setGuestBusy] = useState(false);

  // Map Firebase error codes to clean, localized messages
  const translateAuthError = (code, fallback) => {
    const key =
      code === "auth/invalid-email" ? "authEmailInvalid"
      : code === "auth/user-not-found" ? "authUserNotFound"
      : code === "auth/wrong-password" ? "authWrongPassword"
      : code === "auth/invalid-credential" ? "authWrongPassword"
      : code === "auth/invalid-login-credentials" ? "authWrongPassword"
      : code === "auth/email-already-in-use" ? "authEmailInUse"
      : code === "auth/weak-password" ? "authWeakPassword"
      : code === "auth/missing-password" ? "authPasswordRequired"
      : code === "auth/too-many-requests" ? "authTooManyRequests"
      : code === "auth/network-request-failed" ? "authNetwork"
      : null;
    if (key && t[key]) return t[key];
    return t.authGeneric || fallback || "Authentication failed. Please try again.";
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (submitting) return;
    setAuthError("");

    const em = email.trim();
    const pw = password;

    if (!em) { setAuthError(t.authEmailRequired); return; }
    if (!pw) { setAuthError(t.authPasswordRequired); return; }
    if (authMode === "signup" && !name.trim()) { setAuthError(t.authNameRequired); return; }

    setSubmitting(true);
    try {
      if (authMode === "signup") {
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        await updateProfile(cred.user, { displayName: name.trim() });
        // onAuthStateChanged fires at account creation (before the profile is
        // written), so reload once so the app renders the fresh display name.
        window.location.reload();
      } else {
        await signInWithEmailAndPassword(auth, em, pw);
      }
    } catch (err) {
      setAuthError(translateAuthError(err?.code, err?.message));
    } finally {
      setSubmitting(false);
    }
  };

  const handleGuest = async () => {
    if (guestBusy || submitting) return;
    setAuthError("");
    setGuestBusy(true);
    try {
      await signInAnonymously(auth);
    } catch (err) {
      const code = err?.code || "";
      if (code === "auth/operation-not-allowed" || code === "auth/admin-restricted-operation") {
        setAuthError(t.guestDisabled);
      } else if (code === "auth/network-request-failed") {
        setAuthError(t.authNetwork || "Network error. Please check your connection.");
      } else {
        setAuthError(t.authGeneric || "Guest sign-in failed. Please try again.");
      }
    } finally {
      setGuestBusy(false);
    }
  };
  return (

                          else {
                            setShowForm(true);
                            if (tab === "backtest") setForm((current) => ({ ...current, tradeType: "backtest" }));
                          }
                        }}
                        className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold bg-sky-500 hover:bg-sky-400 text-slate-950 transition-all duration-150 cursor-pointer shadow-md shadow-sky-500/25 active:scale-95 font-mono"
                      >
                        {showForm ? <X size={14} className="stroke-[2.5]" /> : <Plus size={14} className="stroke-[2.5]" />}
                        <span className="small-caps tracking-wider">{showForm ? t.cancel : t.newTrade}</span>
                      </button>
                    </div>
                  </div>
                </header>

                {/* FULL-WIDTH RESPONSIVE MAIN CONTAINER */}
                <main className="w-full max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 py-5 pb-32 relative z-10">

                  {/* TOP TABS NAVIGATION BAR */}
                  <div className={tx("flex items-center gap-2 bg-[#080E1E] p-1.5 rounded-2xl border border-slate-800/90 mb-6 overflow-x-auto no-scrollbar w-full shadow-lg")}>
                    {[
                      { id: "journal", label: t.journal, icon: ListChecks, visible: true },
                      { id: "dashboard", label: t.dashboard, icon: LayoutGrid, visible: true },
                      { id: "accounts", label: t.accounts, icon: Wallet, visible: true },
                      { id: "backtest", label: "Backtest", icon: BarChart2, visible: true },
                      { id: "admin", label: t.admin, icon: ShieldCheck, visible: isAdmin, isAdminTab: true },
                      { id: "updates", label: t.updates, icon: Sparkles, visible: true, isGold: true },
                      { id: "notes", label: t.notes, icon: BookOpen, visible: true },
                      { id: "mentor", label: "AI Mentor", icon: Bot, visible: true, isMentor: true },
                      { id: "community", label: t.community, icon: MessageSquare, visible: true }
                    ].filter(tabItem => tabItem.visible).map((item) => (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => {
                          setTab(item.id);
                          if (item.id === "journal") setTradeTypeFilter("all");
                          if (item.id === "backtest") { setTradeTypeFilter("backtest"); setBacktestListOpen(false); }
                        }}
                        className={tx(`flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 cursor-pointer whitespace-nowrap flex-shrink-0 font-mono small-caps active:scale-95 ${
                          tab === item.id 
                            ? item.isAdminTab
                              ? "bg-rose-500/20 text-rose-300 border border-rose-500/40 shadow-sm"
                              : item.isGold
                              ? "bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow-sm"
                              : item.isTrash
                              ? "bg-rose-500/20 text-rose-300 border border-rose-500/40 shadow-sm"
                              : item.isMentor
                              ? "bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm"
                              : "bg-sky-500/20 text-sky-300 border border-sky-500/40 shadow-sm" 
                            : "text-slate-400 hover:text-slate-200 hover:bg-slate-900/40"
                        }`)}
                      >
                        <item.icon size={14} className={tx(item.isAdminTab || item.isTrash ? "text-rose-400" : item.isGold ? "text-amber-400" : item.isMentor ? "text-cyan-400" : (tab === item.id ? "text-sky-400" : "text-slate-500"))} />
                        <span>{item.label}</span>
                      </button>
                    ))}
                  </div>

              {showForm && <TradeForm />}
              {(tab === "journal" || tab === "backtest") && <Journal />}
              {tab === "dashboard" && <Dashboard />}
              {tab === "accounts" && <Accounts />}
              {tab === "admin" && isAdmin && <Admin />}
              {tab === "updates" && <Updates />}
              {tab === "mentor" && <Mentor />}
              {tab === "trash" && <Trash />}
              {tab === "notes" && <Notes />}
              {tab === "community" && <Community />}
            </main>
          </div>


          {/* COMPACT FLOATING (+) BUTTON FOR MOBILE */}
          <button
            type="button"
            onClick={() => {
              setShowForm(!showForm);
              if (showForm) { setEditingId(null); setForm(EMPTY_FORM); }
              else { window.scrollTo({ top: 0, behavior: 'smooth' }); }
            }}
            className="fixed bottom-6 right-5 sm:hidden z-40 w-12 h-12 rounded-full bg-sky-500 text-slate-950 flex items-center justify-center shadow-xl shadow-sky-500/40 border border-sky-400 active:scale-90 transition-all cursor-pointer"
            title="Toggle Trade Form"
          >
            {showForm ? <X size={20} className="stroke-[2.5]" /> : <Plus size={22} className="stroke-[2.5]" />}
          </button>

          {/* FOOTER */}
          <footer className={tx("py-6 border-t border-slate-800/80 text-center text-xs text-slate-500 font-mono")}>
            Amiir Journal · {t.devBy} <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className={tx("text-sky-400 hover:text-sky-300 font-semibold underline underline-offset-2")}>@amiir_pr</a>
          </footer>

          {/* LIGHTBOX MODAL WITH ZOOM */}
          {lightbox && (
            <div
              onClick={() => { setLightbox(null); setZoomScale(1); }}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 zoom-container select-none"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className={tx("absolute top-4 right-4 flex items-center gap-2 bg-[#080E1E] border border-slate-700 px-3 py-1.5 rounded-2xl z-50 text-white font-mono text-xs shadow-2xl")}
              >
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.max(0.5, z - 0.25))}
                  className={tx("p-1 hover:text-sky-400 cursor-pointer")}
                  title="Zoom Out"
                >
                  <ZoomOut size={16} />
                </button>
                <span className="text-[11px] min-w-[36px] text-center font-bold">{Math.round(zoomScale * 100)}%</span>
                <button
                  type="button"
                  onClick={() => setZoomScale((z) => Math.min(3.5, z + 0.25))}
                  className={tx("p-1 hover:text-sky-400 cursor-pointer")}
                  title="Zoom In"
                >
                  <ZoomIn size={16} />
                </button>
                <button
                  type="button"
                  onClick={() => setZoomScale(1)}
                  className={tx("p-1 hover:text-sky-400 ml-1 cursor-pointer")}
                  title="Reset Zoom"
                >
                  <RotateCcw size={14} />
                </button>
                <button
                  type="button"
                  onClick={() => { setLightbox(null); setZoomScale(1); }}
                  className={tx("p-1 hover:text-rose-400 ml-1 cursor-pointer")}
                  title="Close"
                >
                  <X size={16} />
                </button>
              </div>

              <div 
                onClick={(e) => { e.stopPropagation(); setZoomScale((z) => z === 1 ? 2 : 1); }} 
                className="overflow-auto max-w-full max-h-[85vh] flex items-center justify-center cursor-zoom-in"
              >
                <img 
                  src={lightbox} 
                  alt="Full Chart" 
                  style={{ transform: `scale(${zoomScale})`, transition: 'transform 0.15s ease-out' }}
                  className={tx("max-w-full max-h-[85vh] rounded-2xl shadow-2xl border border-slate-800 object-contain origin-center")} 
                />
              </div>
            </div>
          )}
        </div>
  );
}

    /* ══════════════════════════════════════════════════════════════════════
       7. APP ROOT — auth gate (loading → login → shell)
       ══════════════════════════════════════════════════════════════════════ */

function App() {
  const { authLoading, user } = useApp();

  if (authLoading) {
    return (
      <div className={tx("min-h-screen flex flex-col items-center justify-center bg-[#030712] relative overflow-hidden")}>
        <div className="absolute inset-0 bg-radial-at-c from-sky-500/10 via-transparent to-transparent"></div>
        <div className="relative flex flex-col items-center gap-3">
          <div className="w-10 h-10 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
          <span className={tx("font-mono text-xs text-sky-400 font-semibold tracking-widest uppercase")}>Preparing your journal...</span>
        </div>
      </div>
    );
  }

  if (!user) {
    return <LoginPage />;
  }

  return <AppShell />;
}

    /* ══════════════════════════════════════════════════════════════════════
       8. MOUNT — ReactDOM render
       ══════════════════════════════════════════════════════════════════════ */

ReactDOM.createRoot(document.getElementById("root")).render(
  <AppProvider>
    <App />
  </AppProvider>
);
