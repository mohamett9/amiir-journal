    const ACCOUNT_TYPES = [
      { id: "Funded", label: "Funded MT5", desc: "Prop Firm Live", color: "border-sky-500/40 text-sky-400 bg-sky-500/10" },
      { id: "Challenge", label: "Challenge MT5", desc: "Evaluation Phase", color: "border-amber-500/40 text-amber-400 bg-amber-500/10" },
      { id: "Real", label: "Personal Real", desc: "Live Personal", color: "border-emerald-500/40 text-emerald-400 bg-emerald-500/10" },

    ];

    const EMPTY_FORM = {
      symbol: "",
      date: new Date().toISOString().slice(0, 10),
      accountType: "Funded",
      accountName: "FTMO 100K",
      session: "london",
      purgeTime: "2am",
      direction: "buy",
      outcome: "win",
      risk: "1",
      rrRatio: "2",
      notes: "",
      images: [],
    };

    const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December",
    ];

    function resizeImage(dataUrl, maxWidth = 800) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [trades, setTrades] = useState([]);
      const [loading, setLoading] = useState(true);
      
      const [tab, setTab] = useState("journal");
      const [lang, setLang] = useState("EN");
      const t = DICT[lang];

      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(EMPTY_FORM);
      const [expanded, setExpanded] = useState(null);
      const [error, setError] = useState("");
      const [lightbox, setLightbox] = useState(null);

      // Community Chat
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput, setChatInput] = useState("");
      const [chatSending, setChatSending] = useState(false);
      const chatEndRef = useRef(null);

      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [viewYear, setViewYear] = useState(new Date().getFullYear());

      // Auth Listener
      useEffect(() => {
        const unsub = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthLoading(false);
        });
        return () => unsub();
      }, []);

      // Realtime Trades
      useEffect(() => {
        if (!user) {
          setTrades([]);
          setLoading(false);
          return;
        }
        setLoading(true);
        const colRef = collection(db, "users", user.uid, "trades");
        const unsub = onSnapshot(colRef, (snap) => {
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          setTrades(list);
          setLoading(false);
        }, (err) => {
          setError(err.message);
          setLoading(false);
        });
        return () => unsub();
      }, [user]);

      // Realtime Community Posts/Chat
      useEffect(() => {
        if (!user) return;
        const chatRef = collection(db, "community_chat");
        const unsub = onSnapshot(chatRef, (snap) => {
          const msgs = [];
          snap.forEach((d) => msgs.push({ id: d.id, ...d.data() }));
          msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          setChatMessages(msgs);
        });
        return () => unsub();
      }, [user]);

      const sendChatMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim() || chatSending) return;
        setChatSending(true);
        try {
          await addDoc(collection(db, "community_chat"), {
            text: chatInput.trim(),
            userId: user.uid,
            userName: user.displayName || "Trader",
            userPhoto: user.photoURL || null,
            createdAt: Date.now()
          });
          setChatInput("");
          setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
        } catch (err) {
          alert("Chat error: " + err.message);
        } finally {
          setChatSending(false);
        }
      };

      // Multiple Images Upload
      const handleMultipleImages = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        try {
          const promises = files.map((file) => {
            return new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = async () => {
                const resized = await resizeImage(reader.result);
                resolve(resized);
              };
              reader.readAsDataURL(file);
            });
          });
          const newImgs = await Promise.all(promises);
          setForm((prev) => ({
            ...prev,
            images: [...prev.images, ...newImgs]
          }));
        } catch (err) {
          setError("Sawirrada lama wada shubi karin.");
        }
      };

      // Add Trade
      const addTrade = async () => {
        if (!form.symbol || !form.date) {
          setError(lang === "EN" ? "Please enter Symbol and Date." : "Geli Symbol-ka iyo Taariikhda.");
          return;
        }
        const risk = parseFloat(form.risk) || 0;
        const rr = parseFloat(form.rrRatio) || 0;
        const reward = +(risk * rr).toFixed(2);
        const rMultiple = form.outcome === "win" ? reward : form.outcome === "loss" ? -risk : 0;
        const id = Date.now().toString();

        const tradeData = {
          id,
          symbol: form.symbol.toUpperCase(),
          date: form.date,
          accountType: form.accountType || "Funded",
          accountName: form.accountName || "FTMO 100K",
          session: form.session,
          purgeTime: form.purgeTime,
          direction: form.direction,
          outcome: form.outcome,
          risk,
          rrRatio: rr,
          reward,
          rMultiple,
          notes: form.notes || "",
          images: form.images || [],
          createdAt: Date.now()
        };

        try {
          await setDoc(doc(db, "users", user.uid, "trades", id), tradeData);
          setForm(EMPTY_FORM);
          setShowForm(false);
          setError("");
        } catch (err) {
          setError(err.message);
        }
      };

      const removeTrade = async (id, e) => {
        e.stopPropagation();
        if (!confirm(lang === "EN" ? "Delete this trade?" : "Tirtir trade-kan?")) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "trades", id));
          if (expanded === id) setExpanded(null);
        } catch (err) {
          setError(err.message);
        }
      };

      // Toggle Trade details on tap
      const toggleTrade = (id) => {
        setExpanded((prev) => (prev === id ? null : id));
      };

      // Calculations
      const stats = useMemo(() => {
        const total = trades.length;
        const wins = trades.filter((t) => t.outcome === "win").length;
        const losses = trades.filter((t) => t.outcome === "loss").length;
        const netR = trades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;
        return { total, wins, losses, netR, winRate };
      }, [trades]);

      const weeklyConsistency = useMemo(() => {
        const now = new Date();
        const startOfWeek = new Date(now);
        const day = startOfWeek.getDay();
        const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
        startOfWeek.setDate(diff);
        const mondayStr = startOfWeek.toISOString().slice(0, 10);

        const thisWeekTrades = trades.filter((t) => t.date >= mondayStr);
        const count = thisWeekTrades.length;
        const wins = thisWeekTrades.filter((t) => t.outcome === "win").length;
        const netR = thisWeekTrades.reduce((acc, t) => acc + (t.rMultiple || 0), 0);
        const winRate = count ? Math.round((wins / count) * 100) : 0;
        return { count, wins, netR, winRate };
      }, [trades]);

      const dayMap = useMemo(() => {
        const map = {};
        trades.forEach((t) => {
          if (!map[t.date]) map[t.date] = { net: 0, count: 0 };
          map[t.date].net += t.rMultiple || 0;
          map[t.date].count += 1;
        });
        return map;
      }, [trades]);

      const calendarCells = useMemo(() => {
        const first = new Date(viewYear, viewMonth, 1);
        const offset = (first.getDay() + 6) % 7;
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < offset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          cells.push({ day: d, key, data: dayMap[key] });
        }
        return cells;
      }, [viewYear, viewMonth, dayMap]);

      const fmtR = (n) => (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%";

      if (authLoading) {
        return (

            <div className="w-8 h-8 border-2 border-sky-400 border-t-transparent rounded-full animate-spin"></div>

                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>

      return (

                <div className="flex items-center gap-2.5">

                    <Globe size={13} className="text-sky-400" />

                  </button>

                  {/* Profile & Logout */}

                    {user.photoURL ? (
                      <img src={user.photoURL} alt="user" className="w-5 h-5 rounded-full object-cover" />
                    ) : (
                      <div className="w-5 h-5 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-[10px]">
                        {user.displayName ? user.displayName[0] : "M"}
                      </div>
                    )}
                    <button 
                      onClick={() => signOut(auth)} 
                      title="Logout" 
                      className="text-slate-400 hover:text-rose-400 p-0.5 cursor-pointer"
                    >
                      <LogOut size={13} />
                    </button>
                  </div>

                  {/* + New Trade Button */}
                  <button
                    onClick={() => { setShowForm((s) => !s); if(!showForm) setTab("journal"); }}
                    className="flex items-center gap-1 px-3.5 py-1.5 rounded-lg text-xs font-bold bg-[#0ea5e9] hover:bg-sky-400 text-slate-950 transition-all cursor-pointer shadow-md shadow-sky-500/20 active:scale-95"
                  >
                    {showForm ? <X size={14} /> : <Plus size={14} />}
                    <span>{showForm ? t.close : t.newTrade}</span>
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-4xl mx-auto px-4 py-4">
              
              {/* Navigation Tabs */}
              <div className="flex items-center gap-1.5 mb-5 bg-[#0b1324] p-1 rounded-xl border border-[#162238] overflow-x-auto">
                {[
                  { id: "journal", label: t.journal, icon: ListChecks },
                  { id: "dashboard", label: t.dashboard, icon: LayoutGrid },
                  { id: "accounts", label: t.accounts, icon: Wallet },
                  { id: "chat", label: t.chat, icon: MessageSquare }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer whitespace-nowrap ${
                      tab === item.id 
                        ? "bg-[#112344] text-sky-400 border border-sky-500/30" 
                        : "text-slate-400 hover:text-slate-200"
                    }`}
                  >
                    <item.icon size={14} />
                    {item.label}
                  </button>
                ))}
              </div>

              {/* Stats & Swipeable Accounts (Visible except in Chat) */}
              {tab !== "chat" && (
                <div className="space-y-3 mb-6">
                  {/* 2x2 Metric Grid */}
                  <div className="grid grid-cols-2 gap-3">
                    <div className="custom-card p-4 rounded-xl">
                      <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">{t.trades}</div>
                      <div className="text-xl font-bold font-mono text-white">{stats.total}</div>
                    </div>

                    <div className="custom-card p-4 rounded-xl">
                      <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">{t.winRate}</div>
                      <div className="text-xl font-bold font-mono text-[#0ea5e9]">{stats.winRate}%</div>
                    </div>

                    <div className="custom-card p-4 rounded-xl">
                      <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">{t.winLoss}</div>
                      <div className="text-xl font-bold font-mono">
                        <span className="text-emerald-400">{stats.wins}</span>
                        <span className="text-slate-600 mx-1">/</span>
                        <span className="text-rose-400">{stats.losses}</span>
                      </div>
                    </div>

                    <div className="custom-card p-4 rounded-xl">
                      <div className="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-1">{t.netReturn}</div>
                      <div className="text-xl font-bold font-mono text-emerald-400">
                        {fmtR(stats.netR)}
                      </div>
                    </div>
                  </div>

                  {/* This Week consistency banner */}
                  <div className="custom-card p-3.5 rounded-xl flex items-center justify-between border border-sky-500/20 bg-gradient-to-r from-[#0d1527] to-[#10203d]">
                    <div className="flex items-center gap-2">
                      <Award size={15} className="text-sky-400" />
                      <span className="text-xs font-mono font-bold uppercase tracking-wider text-slate-300">
                        {t.thisWeek}
                      </span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-sm font-bold font-mono text-white">{fmtR(weeklyConsistency.netR)}</span>
                      <span className="text-xs px-2 py-0.5 rounded bg-[#102347] text-sky-300 font-mono border border-sky-500/20">
                        {weeklyConsistency.winRate}%
                      </span>
                    </div>
                  </div>

                  {/* SWIPEABLE ACCOUNTS CAROUSEL */}
                  <div className="pt-2">
                    <div className="flex items-center justify-between text-[11px] font-mono text-slate-400 mb-2 px-1">
                      <span className="flex items-center gap-1.5 text-sky-400 font-semibold">
                        <Wallet size={13} /> {t.accounts} (MT5 & Prop Firms)
                      </span>
                      <span className="text-[10px] text-slate-500">{t.swipeAccounts}</span>
                    </div>

                    <div className="flex gap-3 overflow-x-auto no-scrollbar pb-2 snap-x snap-mandatory">
                      {ACCOUNT_TYPES.map((acc) => {

                            }`}>
                              {!isMe && <div className="text-[10px] font-bold text-sky-400 mb-0.5">{msg.userName}</div>}
                              <p className="whitespace-pre-wrap">{msg.text}</p>
                              <div className="text-[8px] opacity-60 text-right mt-1 font-mono">
                                {new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Chat Input Form */}
                  <form onSubmit={sendChatMessage} className="p-2.5 border-t border-slate-800 bg-slate-950/60 flex gap-2">
                    <input
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder={t.chatPlaceholder}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-sky-400"
                    />
                    <button 
                      type="submit" 
                      disabled={chatSending}
                      className="p-2 bg-sky-500 hover:bg-sky-400 text-slate-950 rounded-xl cursor-pointer transition-all active:scale-95"
                    >
                      <Send size={13} />
                    </button>
                  </form>
                </div>
              )}

            </main>
          </div>

          {/* Minimal Footer with TikTok Link */}
          <footer className="mt-8 py-4 border-t border-slate-800/60 text-center text-[11px] text-slate-500 font-mono">
            Amiir Journal · {t.devBy} <a href="https://tiktok.com/@amiir_pr" target="_blank" rel="noreferrer" className="text-sky-400 hover:underline">@amiir_pr</a>
          </footer>

          {/* LIGHTBOX FOR FULL VIEW SCREENSHOTS */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 cursor-zoom-out"
            >
              <img src={lightbox} alt="Full Chart" className="max-w-full max-h-[90vh] rounded-xl shadow-2xl border border-slate-800" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
