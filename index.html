<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Amiir Journal - Ledger</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0B0F14;
      color: #E7E2D6;
      font-family: 'Inter', sans-serif;
    }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
    .touch-target {
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from "react";
    import ReactDOM from "react-dom/client";
    import {
      Plus, TrendingUp, TrendingDown, Trash2, X, ChevronDown, ChevronUp,
      ChevronLeft, ChevronRight, Image as ImageIcon, LayoutGrid, ListChecks,
      LogOut, User, MessageSquare, Send, Link as LinkIcon, FileText, Video,
      ExternalLink, CheckCircle2, AlertCircle
    } from "lucide-react";

    // Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, addDoc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCZyu_d3ru9-x61AywpQv_pl706UBE_OTQ",
      authDomain: "amiir-journal.firebaseapp.com",
      projectId: "amiir-journal",
      storageBucket: "amiir-journal.firebasestorage.app",
      messagingSenderId: "533778928448",
      appId: "1:533778928448:web:138073019799354cb020a5",
      measurementId: "G-QYJ75J88K5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const C = {
      bg: "#0B0F14",
      surface: "#0E141A",
      surface2: "#131A22",
      border: "#22292F",
      borderHover: "#3D434B",
      text: "#E7E2D6",
      textDim: "#8A8F98",
      textFaint: "#565C64",
      gold: "#E8B44C",
      goldHover: "#F0C366",
      green: "#4FAE83",
      greenBg: "#1E5A41",
      red: "#D65F5F",
      redBg: "#5C2323",
      notesText: "#B8BCC4",
    };

    const EMPTY_FORM = {
      symbol: "",
      date: new Date().toISOString().slice(0, 10),
      session: "london",
      purgeTime: "2am",
      direction: "buy",
      outcome: "win",
      risk: "1",
      rrRatio: "2",
      notes: "",
      image: null,
    };

    const SESSIONS = [
      { id: "asian", label: "Asian", flag: "🇯🇵", time: "8PM–9PM" },
      { id: "london", label: "London", flag: "🇬🇧", time: "2AM–3AM" },
      { id: "newyork", label: "New York", flag: "🇺🇸", time: "8AM–9AM" },
    ];

    const PURGE_TIMES = {
      asian: ["8pm", "9pm"],
      london: ["2am", "3am"],
      newyork: ["8am", "9am"],
    };

    const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December",
    ];

    function resizeImage(dataUrl, maxWidth = 600) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.7));
          } catch (err) {
            reject(err);
          }
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function Toggle({ active, onClick, children, activeBg, activeColor }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className="flex-1 text-xs uppercase py-2.5 rounded border transition-colors touch-target font-mono"
          style={{
            backgroundColor: active ? activeBg : "transparent",
            color: active ? activeColor : C.textDim,
            borderColor: active ? activeBg : C.border,
          }}
        >
          {children}
        </button>
      );
    }

    function TradeJournal() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [trades, setTrades] = useState([]);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState("journal"); // 'journal' | 'dashboard' | 'community'
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(EMPTY_FORM);
      const [expanded, setExpanded] = useState(null);
      const [error, setError] = useState("");
      const [lightbox, setLightbox] = useState(null);

      // Community State
      const [posts, setPosts] = useState([]);
      const [communityLoading, setCommunityLoading] = useState(false);
      const [newPostText, setNewPostText] = useState("");
      const [newPostMediaUrl, setNewPostMediaUrl] = useState("");
      const [newPostMediaType, setNewPostMediaType] = useState("link"); // 'image' | 'video' | 'pdf' | 'link'
      const [newPostImage, setNewPostImage] = useState(null);
      const [sendingPost, setSendingPost] = useState(false);

      const [viewMonth, setViewMonth] = useState(new Date().getMonth());
      const [viewYear, setViewYear] = useState(new Date().getFullYear());

      // Auth Listener
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // Realtime Database for Trades
      useEffect(() => {
        if (!user) {
          setTrades([]);
          setLoading(false);
          return;
        }

        setLoading(true);
        const userTradesRef = collection(db, "users", user.uid, "trades");

        const unsubscribe = onSnapshot(userTradesRef, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => list.push(doc.data()));
          list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          setTrades(list);
          setLoading(false);
        }, (err) => {
          setError("Khalad: " + err.message);
          setLoading(false);
        });

        return () => unsubscribe();
      }, [user]);

      // Realtime Community Posts
      useEffect(() => {
        if (!user) return;
        setCommunityLoading(true);
        const postsRef = collection(db, "community_posts");

        const unsubPosts = onSnapshot(postsRef, (snapshot) => {
          const pList = [];
          snapshot.forEach((d) => pList.push({ id: d.id, ...d.data() }));
          // Sort by timestamp desc
          pList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setPosts(pList);
          setCommunityLoading(false);
        }, (err) => {
          console.error("Community error:", err);
          setCommunityLoading(false);
        });

        return () => unsubPosts();
      }, [user]);

      const handleGoogleLogin = async () => {
        setError("");
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          setError("Login-ku ma guulaysan: " + err.message);
        }
      };

      const handleLogout = async () => {
        try {
          await signOut(auth);
        } catch (err) {
          console.error(err);
        }
      };

      // Toggle card on mobile / desktop
      const handleToggleExpand = (id, e) => {
        e.stopPropagation();
        setExpanded((prev) => (prev === id ? null : id));
      };

      const handleImage = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const resized = await resizeImage(reader.result);
            setForm((f) => ({ ...f, image: resized }));
          } catch (err) {
            setForm((f) => ({ ...f, image: reader.result }));
          }
        };
        reader.readAsDataURL(file);
      };

      const handleCommunityImageUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          const resized = await resizeImage(reader.result, 700);
          setNewPostImage(resized);
        };
        reader.readAsDataURL(file);
      };

      const addTrade = async () => {
        if (!form.symbol || !form.date) {
          setError("Buuxi symbol-ka iyo taariikhda.");
          return;
        }
        if (!user) return;

        const risk = parseFloat(form.risk) || 0;
        const rrRatio = parseFloat(form.rrRatio) || 0;
        const reward = +(risk * rrRatio).toFixed(2);
        const rMultiple = form.outcome === "win" ? reward : form.outcome === "loss" ? -risk : 0;
        const tradeId = Date.now().toString();

        const trade = {
          id: tradeId,
          symbol: form.symbol.toUpperCase(),
          date: form.date,
          session: form.session,
          purgeTime: form.purgeTime,
          direction: form.direction,
          outcome: form.outcome,
          risk,
          rrRatio,
          reward,
          rMultiple,
          notes: form.notes || "",
          image: form.image || null,
          createdAt: Date.now()
        };

        try {
          await setDoc(doc(db, "users", user.uid, "trades", tradeId), trade);
          setForm(EMPTY_FORM);
          setShowForm(false);
          setError("");
        } catch (err) {
          setError("Xogta lama kaydin karin: " + err.message);
        }
      };

      const removeTrade = async (id, e) => {
        e.stopPropagation();
        if (!confirm("Ma hubtaa inaad tirtirto ganacsigan?")) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "trades", id));
          if (expanded === id) setExpanded(null);
        } catch (err) {
          setError("Lama tirtiri karin: " + err.message);
        }
      };

      // Send Community Post
      const handleSendPost = async (e) => {
        e.preventDefault();
        if (!newPostText.trim() && !newPostImage && !newPostMediaUrl.trim()) return;
        setSendingPost(true);

        try {
          await addDoc(collection(db, "community_posts"), {
            text: newPostText.trim(),
            mediaUrl: newPostMediaUrl.trim() || null,
            mediaType: newPostMediaType,
            image: newPostImage || null,
            userId: user.uid,
            userName: user.displayName || "Trader",
            userPhoto: user.photoURL || null,
            createdAt: Date.now(),
          });

          setNewPostText("");
          setNewPostMediaUrl("");
          setNewPostImage(null);
        } catch (err) {
          alert("Khalad dirista: " + err.message);
        } finally {
          setSendingPost(false);
        }
      };

      const handleDeletePost = async (postId) => {
        if (!confirm("Ma rabtaa inaad tirtirto qoraalkan?")) return;
        try {
          await deleteDoc(doc(db, "community_posts", postId));
        } catch (err) {
          alert("Lama tirtiri karin: " + err.message);
        }
      };

      const stats = useMemo(() => {
        const total = trades.length;
        const wins = trades.filter((t) => t.outcome === "win").length;
        const losses = trades.filter((t) => t.outcome === "loss").length;
        const netR = trades.reduce((s, t) => s + (t.rMultiple || 0), 0);
        const winRate = total ? Math.round((wins / total) * 100) : 0;
        return { total, wins, losses, netR, winRate };
      }, [trades]);

      const fmtR = (n) => (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%";

      const dayMap = useMemo(() => {
        const map = {};
        trades.forEach((t) => {
          if (!map[t.date]) map[t.date] = { net: 0, count: 0 };
          map[t.date].net += t.rMultiple || 0;
          map[t.date].count += 1;
        });
        return map;
      }, [trades]);

      const calendarCells = useMemo(() => {
        const firstOfMonth = new Date(viewYear, viewMonth, 1);
        const startOffset = (firstOfMonth.getDay() + 6) % 7;
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startOffset; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const key = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          cells.push({ day: d, key, data: dayMap[key] });
        }
        return cells;
      }, [viewYear, viewMonth, dayMap]);

      const monthNet = useMemo(() => {
        return Object.entries(dayMap)
          .filter(([k]) => k.startsWith(`${viewYear}-${String(viewMonth + 1).padStart(2, "0")}`))
          .reduce((s, [, v]) => s + v.net, 0);
      }, [dayMap, viewYear, viewMonth]);

      const changeMonth = (delta) => {
        let m = viewMonth + delta;
        let y = viewYear;
        if (m < 0) { m = 11; y -= 1; }
        if (m > 11) { m = 0; y += 1; }
        setViewMonth(m);
        setViewYear(y);
      };

      const monoStyle = { fontFamily: "'IBM Plex Mono', monospace" };
      const displayStyle = { fontFamily: "'Space Grotesk', sans-serif" };
      const inputStyle = {
        fontFamily: "'IBM Plex Mono', monospace",
        backgroundColor: C.surface2,
        border: `1px solid ${C.border}`,
        color: C.text,
      };
      const labelStyle = { fontSize: "10px", textTransform: "uppercase", letterSpacing: "0.05em", color: C.textFaint, display: "block", marginBottom: "4px" };

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#0B0F14]">
            <span style={{ ...monoStyle, color: C.gold }} className="text-sm">Loading Amiir Journal...</span>
          </div>
        );
      }

      // ==========================================
      // LOGIN PAGE
      // ==========================================
      if (!user) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center px-4" style={{ backgroundColor: C.bg, color: C.text }}>
            <div className="max-w-sm w-full rounded-2xl p-8 text-center" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
              
              <div className="flex justify-center mb-4">
                <img 
                  src="./profile.jpg" 
                  alt="Amiir" 
                  onError={(e) => { e.target.src = "./profile.png"; }}
                  className="w-24 h-24 rounded-full object-cover shadow-lg"
                  style={{ border: `2px solid ${C.gold}` }}
                />
              </div>

              <h1 className="text-2xl font-bold mb-1 tracking-tight" style={{ ...displayStyle, color: C.gold }}>
                Amiir Journal
              </h1>
              <p className="text-xs mb-6" style={{ color: C.textDim }}>
                Joornaalkaaga gaarka ah ee ganacsiga.
              </p>
              
              {error && <div className="text-xs mb-4 p-2 rounded bg-red-950/40 text-red-400 border border-red-900/60" style={monoStyle}>{error}</div>}

              <button
                onClick={handleGoogleLogin}
                className="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl font-semibold text-sm transition-all hover:opacity-90 cursor-pointer shadow-lg active:scale-98"
                style={{ backgroundColor: "#FFFFFF", color: "#1f2937" }}
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Ku gal Gmail (Google)
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // MAIN APP
      // ==========================================
      return (
        <div className="min-h-screen w-full pb-16" style={{ backgroundColor: C.bg, color: C.text }}>
          <div className="max-w-3xl mx-auto px-4 py-6">
            
            {/* Header */}
            <div className="flex items-center justify-between mb-5">
              <div className="flex items-center gap-3">
                <img 
                  src="./profile.jpg" 
                  alt="Amiir" 
                  onError={(e) => { e.target.src = "./profile.png"; }}
                  className="w-10 h-10 rounded-full object-cover border"
                  style={{ borderColor: C.gold }}
                />
                <div>
                  <h1 className="text-xl font-bold tracking-tight" style={{ ...displayStyle, color: C.gold }}>
                    Ledger
                  </h1>
                  <div className="flex items-center gap-2 mt-0.5">
                    <span className="text-xs truncate max-w-[140px] sm:max-w-none" style={{ color: C.textDim }}>
                      {user.displayName || user.email}
                    </span>
                    <button 
                      onClick={handleLogout} 
                      className="flex items-center gap-1 text-[11px] text-red-400 hover:text-red-300 ml-1 cursor-pointer"
                    >
                      <LogOut size={12} /> Ka bax
                    </button>
                  </div>
                </div>
              </div>

              <button
                onClick={() => { setShowForm((s) => !s); if(!showForm) setTab("journal"); }}
                className="flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer shadow-md active:scale-95"
                style={{ ...monoStyle, backgroundColor: C.gold, color: C.bg }}
              >
                {showForm ? <X size={14} /> : <Plus size={14} />}
                {showForm ? "Jooji" : "Ganacsi cusub"}
              </button>
            </div>

            {/* Navigation Tabs (Journal, Dashboard, Community) */}
            <div className="flex gap-1 mb-5 rounded-xl p-1 w-full sm:w-fit overflow-x-auto" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
              <button
                onClick={() => setTab("journal")}
                className="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer"
                style={{ backgroundColor: tab === "journal" ? C.gold : "transparent", color: tab === "journal" ? C.bg : C.textDim }}
              >
                <ListChecks size={14} /> Diiwaanka
              </button>
              <button
                onClick={() => setTab("dashboard")}
                className="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer"
                style={{ backgroundColor: tab === "dashboard" ? C.gold : "transparent", color: tab === "dashboard" ? C.bg : C.textDim }}
              >
                <LayoutGrid size={14} /> Dashboard
              </button>
              <button
                onClick={() => setTab("community")}
                className="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-colors cursor-pointer"
                style={{ backgroundColor: tab === "community" ? C.gold : "transparent", color: tab === "community" ? C.bg : C.textDim }}
              >
                <MessageSquare size={14} /> Community
              </button>
            </div>

            {/* Stats row (Visible on Journal & Dashboard) */}
            {tab !== "community" && (
              <div className="grid grid-cols-4 gap-px rounded-xl mb-6 overflow-hidden shadow-sm" style={{ backgroundColor: C.border, border: `1px solid ${C.border}` }}>
                <div className="px-2.5 py-2.5 text-center sm:text-left" style={{ backgroundColor: C.surface }}>
                  <div style={labelStyle}>Trades</div>
                  <div className="text-base sm:text-lg font-bold" style={monoStyle}>{stats.total}</div>
                </div>
                <div className="px-2.5 py-2.5 text-center sm:text-left" style={{ backgroundColor: C.surface }}>
                  <div style={labelStyle}>Win %</div>
                  <div className="text-base sm:text-lg font-bold" style={monoStyle}>{stats.winRate}%</div>
                </div>
                <div className="px-2.5 py-2.5 text-center sm:text-left" style={{ backgroundColor: C.surface }}>
                  <div style={labelStyle}>W / L</div>
                  <div className="text-base sm:text-lg font-bold" style={monoStyle}>
                    <span style={{ color: C.green }}>{stats.wins}</span>
                    <span style={{ color: C.textFaint }}>/</span>
                    <span style={{ color: C.red }}>{stats.losses}</span>
                  </div>
                </div>
                <div className="px-2.5 py-2.5 text-center sm:text-left" style={{ backgroundColor: C.surface }}>
                  <div style={labelStyle}>Net R</div>
                  <div className="text-base sm:text-lg font-bold" style={{ ...monoStyle, color: stats.netR >= 0 ? C.green : C.red }}>
                    {fmtR(stats.netR)}
                  </div>
                </div>
              </div>
            )}

            {/* Trade Form */}
            {showForm && (
              <div className="rounded-xl p-4 sm:p-5 mb-6 shadow-xl" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-sm font-bold" style={{ color: C.gold }}>Diiwaangeli Trade Cusub</span>
                  <button onClick={() => setShowForm(false)} className="text-slate-400 p-1"><X size={16} /></button>
                </div>

                {error && <div className="text-xs mb-3 p-2 rounded bg-red-950/40 text-red-400" style={monoStyle}>{error}</div>}

                <div className="grid grid-cols-2 gap-3 mb-3">
                  <div>
                    <label style={labelStyle}>Symbol</label>
                    <input
                      value={form.symbol}
                      onChange={(e) => setForm({ ...form, symbol: e.target.value })}
                      placeholder="e.g. NQ, EURUSD"
                      className="w-full rounded px-3 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>Taariikhda</label>
                    <input
                      type="date"
                      value={form.date}
                      onChange={(e) => setForm({ ...form, date: e.target.value })}
                      className="w-full rounded px-3 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>

                  <div className="col-span-2">
                    <label style={labelStyle}>Session</label>
                    <div className="flex gap-1.5">
                      {SESSIONS.map((s) => (
                        <button
                          key={s.id}
                          type="button"
                          onClick={() => setForm({ ...form, session: s.id, purgeTime: PURGE_TIMES[s.id][0] })}
                          className="flex-1 text-xs py-2 rounded border transition-colors flex flex-col items-center justify-center gap-0.5 touch-target"
                          style={{
                            ...monoStyle,
                            backgroundColor: form.session === s.id ? C.gold : "transparent",
                            color: form.session === s.id ? C.bg : C.textDim,
                            borderColor: form.session === s.id ? C.gold : C.border,
                          }}
                        >
                          <span className="flex items-center gap-1">{s.flag} {s.label}</span>
                          <span style={{ fontSize: "9px", opacity: 0.8 }}>{s.time}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="col-span-2">
                    <label style={labelStyle}>Purging Time</label>
                    <div className="flex gap-1.5">
                      {PURGE_TIMES[form.session].map((pt) => (
                        <Toggle
                          key={pt}
                          active={form.purgeTime === pt}
                          onClick={() => setForm({ ...form, purgeTime: pt })}
                          activeBg={C.gold}
                          activeColor={C.bg}
                        >
                          {pt}
                        </Toggle>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label style={labelStyle}>Direction</label>
                    <div className="flex gap-1.5">
                      {["buy", "sell"].map((d) => (
                        <Toggle
                          key={d}
                          active={form.direction === d}
                          onClick={() => setForm({ ...form, direction: d })}
                          activeBg={C.gold}
                          activeColor={C.bg}
                        >
                          {d}
                        </Toggle>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={labelStyle}>Outcome</label>
                    <div className="flex gap-1.5">
                      {["win", "loss", "be"].map((o) => (
                        <Toggle
                          key={o}
                          active={form.outcome === o}
                          onClick={() => setForm({ ...form, outcome: o })}
                          activeBg={o === "win" ? C.green : o === "loss" ? C.red : C.textFaint}
                          activeColor={C.bg}
                        >
                          {o}
                        </Toggle>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label style={labelStyle}>Risk %</label>
                    <input
                      type="number"
                      step="0.1"
                      value={form.risk}
                      onChange={(e) => setForm({ ...form, risk: e.target.value })}
                      className="w-full rounded px-2.5 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>R:R Ratio (1 : x)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={form.rrRatio}
                      onChange={(e) => setForm({ ...form, rrRatio: e.target.value })}
                      className="w-full rounded px-2.5 py-2 text-sm focus:outline-none"
                      style={inputStyle}
                    />
                  </div>
                </div>

                <div className="mb-3">
                  <label style={labelStyle}>Sawir (Chart Screenshot)</label>
                  <input 
                    type="file" 
                    accept="image/*" 
                    onChange={handleImage} 
                    className="block w-full text-xs file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold"
                    style={{ color: C.textDim }} 
                  />
                  {form.image && (
                    <img src={form.image} alt="preview" className="mt-2 rounded max-h-36 border border-slate-700" />
                  )}
                </div>

                <div className="mb-4">
                  <label style={labelStyle}>Fiiro gaar ah (Notes / Checklist)</label>
                  <textarea
                    value={form.notes}
                    onChange={(e) => setForm({ ...form, notes: e.target.value })}
                    placeholder="Waa maxay sababta entry-ga? Checklist, rules, dareenka..."
                    rows={2}
                    className="w-full rounded px-2.5 py-2 text-sm focus:outline-none resize-none"
                    style={{ backgroundColor: C.surface2, border: `1px solid ${C.border}`, color: C.text }}
                  />
                </div>

                <button
                  type="button"
                  onClick={addTrade}
                  className="w-full py-2.5 rounded-lg text-sm font-semibold transition-all shadow-md active:scale-98"
                  style={{ ...monoStyle, backgroundColor: C.gold, color: C.bg }}
                >
                  Kaydi Ganacsiga
                </button>
              </div>
            )}

            {/* ========================================== */}
            {/* TAB 1: DIIWAANKA (JOURNAL) - FIXED MOBILE TOGGLE */}
            {/* ========================================== */}
            {tab === "journal" && (
              <div>
                {loading ? (
                  <div className="text-sm text-center py-12" style={{ color: C.textFaint }}>Soo raraya ganacsiyada...</div>
                ) : trades.length === 0 ? (
                  <div className="rounded-xl py-12 text-center" style={{ border: `1px dashed ${C.border}` }}>
                    <p className="text-sm" style={{ color: C.textFaint }}>Weli wax trade ah lama diiwaan gelin.</p>
                    <p className="text-xs mt-1" style={{ color: C.textDim }}>Guji "Ganacsi cusub" si aad u bilowdo.</p>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    <div className="text-[11px] px-1" style={{ color: C.textFaint }}>
                      💡 Guji (taabo) trade kasta si aad u furto/xirto faahfaahinta, sawirrada, iyo checklist-ka.
                    </div>

                    {trades.map((t) => {
                      const isOpen = expanded === t.id;
                      const sessionInfo = SESSIONS.find((s) => s.id === t.session);

                      return (
                        <div 
                          key={t.id} 
                          className="rounded-xl overflow-hidden transition-all duration-200"
                          style={{ 
                            backgroundColor: C.surface, 
                            border: isOpen ? `1px solid ${C.gold}` : `1px solid ${C.border}` 
                          }}
                        >
                          {/* CARD HEADER: CLICKABLE ON BOTH MOBILE & DESKTOP */}
                          <div
                            onClick={(e) => handleToggleExpand(t.id, e)}
                            className="w-full px-4 py-3 flex items-center justify-between cursor-pointer select-none active:bg-slate-800/40"
                          >
                            <div className="flex items-center gap-2.5 flex-wrap">
                              {t.outcome === "win" ? (
                                <TrendingUp size={16} style={{ color: C.green }} />
                              ) : t.outcome === "loss" ? (
                                <TrendingDown size={16} style={{ color: C.red }} />
                              ) : (
                                <span className="w-3.5 h-0.5 inline-block bg-slate-500" />
                              )}

                              <span className="text-sm font-bold" style={monoStyle}>{t.symbol}</span>

                              <span 
                                className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded"
                                style={{
                                  backgroundColor: t.outcome === "win" ? "rgba(79, 174, 131, 0.15)" : t.outcome === "loss" ? "rgba(214, 95, 95, 0.15)" : "rgba(255,255,255,0.05)",
                                  color: t.outcome === "win" ? C.green : t.outcome === "loss" ? C.red : C.textDim,
                                  border: `1px solid ${t.outcome === "win" ? C.green : t.outcome === "loss" ? C.red : C.border}`
                                }}
                              >
                                {t.direction} · {t.outcome}
                              </span>

                              {sessionInfo && (
                                <span className="text-[10px] hidden sm:inline-block px-1.5 py-0.5 rounded border border-slate-800 text-slate-400 font-mono">
                                  {sessionInfo.flag} {sessionInfo.label}
                                </span>
                              )}

                              <span className="text-[11px] text-slate-500 font-mono">{t.date}</span>
                            </div>

                            <div className="flex items-center gap-2.5">
                              <span className="text-sm font-bold" style={{ ...monoStyle, color: t.rMultiple >= 0 ? C.green : C.red }}>
                                {fmtR(t.rMultiple || 0)}
                              </span>
                              
                              <div className="p-1 text-slate-400">
                                {isOpen ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                              </div>
                            </div>
                          </div>

                          {/* EXPANDED FULL DETAILS (CHECKLIST, NOTES, PHOTOS) */}
                          {isOpen && (
                            <div className="px-4 pb-4 pt-2 border-t border-slate-800/80" style={{ backgroundColor: C.surface2 }}>
                              
                              {/* Checklist / Execution Stats */}
                              <div className="grid grid-cols-4 gap-2 mb-3 text-center">
                                <div className="p-2 rounded bg-slate-900/60 border border-slate-800">
                                  <div className="text-[9px] uppercase text-slate-500">Session</div>
                                  <div className="text-xs font-mono font-medium mt-0.5">{sessionInfo?.label || t.session}</div>
                                </div>
                                <div className="p-2 rounded bg-slate-900/60 border border-slate-800">
                                  <div className="text-[9px] uppercase text-slate-500">Purge Time</div>
                                  <div className="text-xs font-mono font-medium mt-0.5">{t.purgeTime || "-"}</div>
                                </div>
                                <div className="p-2 rounded bg-slate-900/60 border border-slate-800">
                                  <div className="text-[9px] uppercase text-slate-500">Risk : RR</div>
                                  <div className="text-xs font-mono font-medium mt-0.5">{t.risk}% / 1:{t.rrRatio}</div>
                                </div>
                                <div className="p-2 rounded bg-slate-900/60 border border-slate-800">
                                  <div className="text-[9px] uppercase text-slate-500">Gain (R)</div>
                                  <div className="text-xs font-mono font-bold mt-0.5" style={{ color: t.rMultiple >= 0 ? C.green : C.red }}>
                                    {fmtR(t.rMultiple || 0)}
                                  </div>
                                </div>
                              </div>

                              {/* Chart Screenshot */}
                              {t.image && (
                                <div className="mb-3">
                                  <div className="text-[10px] uppercase text-slate-500 mb-1 flex items-center gap-1">
                                    <ImageIcon size={12} /> Chart Screenshot (Guji si aad u ballaariso):
                                  </div>
                                  <img
                                    src={t.image}
                                    alt={t.symbol}
                                    onClick={() => setLightbox(t.image)}
                                    className="rounded-lg w-full max-h-72 object-cover border border-slate-700 cursor-zoom-in"
                                  />
                                </div>
                              )}

                              {/* Notes & Checklist details */}
                              {t.notes && (
                                <div className="mb-3 p-3 rounded-lg text-xs leading-relaxed bg-slate-900/60 border border-slate-800" style={{ color: C.notesText }}>
                                  <div className="text-[10px] uppercase text-slate-500 mb-1 font-bold">Falanqaynta & Notes:</div>
                                  {t.notes}
                                </div>
                              )}

                              {/* Action Bar */}
                              <div className="flex items-center justify-between pt-1">
                                <button
                                  type="button"
                                  onClick={(e) => handleToggleExpand(t.id, e)}
                                  className="text-xs text-slate-400 hover:text-white flex items-center gap-1 cursor-pointer"
                                >
                                  <ChevronUp size={13} /> Yaree / Xir
                                </button>
                                
                                <button
                                  type="button"
                                  onClick={(e) => removeTrade(t.id, e)}
                                  className="flex items-center gap-1 text-xs text-red-400 hover:text-red-300 transition-colors cursor-pointer p-1"
                                >
                                  <Trash2 size={13} /> Tirtir
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* ========================================== */}
            {/* TAB 2: DASHBOARD (CALENDAR & ANALYTICS) */}
            {/* ========================================== */}
            {tab === "dashboard" && (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <button type="button" onClick={() => changeMonth(-1)} className="p-2 rounded hover:bg-slate-800 cursor-pointer">
                    <ChevronLeft size={18} />
                  </button>
                  <div className="text-center">
                    <div className="text-sm font-bold" style={displayStyle}>{MONTH_NAMES[viewMonth]} {viewYear}</div>
                    <div className="text-xs mt-0.5" style={{ ...monoStyle, color: monthNet >= 0 ? C.green : C.red }}>
                      {fmtR(monthNet)}
                    </div>
                  </div>
                  <button type="button" onClick={() => changeMonth(1)} className="p-2 rounded hover:bg-slate-800 cursor-pointer">
                    <ChevronRight size={18} />
                  </button>
                </div>

                <div className="grid grid-cols-7 gap-1 mb-1">
                  {WEEKDAYS.map((d) => (
                    <div key={d} className="text-[10px] uppercase font-mono text-center py-1 text-slate-500">
                      {d}
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-7 gap-1">
                  {calendarCells.map((cell, i) => {
                    if (!cell) return <div key={i} className="aspect-square" />;
                    const data = cell.data;
                    const cellStyle = !data
                      ? { backgroundColor: C.surface, border: `1px solid ${C.border}` }
                      : data.net > 0
                      ? { backgroundColor: C.greenBg, border: `1px solid ${C.green}` }
                      : data.net < 0
                      ? { backgroundColor: C.redBg, border: `1px solid ${C.red}` }
                      : { backgroundColor: "#1E2229", border: `1px solid ${C.border}` };

                    return (
                      <div key={i} className="aspect-square rounded-lg p-1 flex flex-col justify-between" style={cellStyle}>
                        <span className="text-[10px]" style={monoStyle}>{cell.day}</span>
                        {data && (
                          <div className="text-right">
                            <div className="text-[9px] font-bold font-mono leading-tight">
                              {fmtR(data.net)}
                            </div>
                            <div className="text-[8px] opacity-70 hidden sm:block">{data.count}t</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ========================================== */}
            {/* TAB 3: COMMUNITY (FILES, VIDEOS, PDFS, CHAT) */}
            {/* ========================================== */}
            {tab === "community" && (
              <div className="space-y-4">
                
                {/* Create Community Post Form */}
                <form onSubmit={handleSendPost} className="rounded-xl p-4 shadow-lg" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
                  <div className="text-xs font-bold mb-2 flex items-center gap-1.5" style={{ color: C.gold }}>
                    <MessageSquare size={14} /> La wadaag Bulshada (Post / Idea / Files / Videos)
                  </div>

                  <textarea
                    rows={2}
                    value={newPostText}
                    onChange={(e) => setNewPostText(e.target.value)}
                    placeholder="Qor fikraddaada, falanqayntaada, ama su'aashaada..."
                    className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none mb-3 resize-none"
                    style={inputStyle}
                  />

                  {/* Attachment Controls */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                    <div>
                      <div className="flex gap-1 mb-1">
                        {[
                          { id: "link", label: "Link", icon: LinkIcon },
                          { id: "video", label: "Video (YT/Loom)", icon: Video },
                          { id: "pdf", label: "PDF / Doc", icon: FileText }
                        ].map((m) => (
                          <button
                            key={m.id}
                            type="button"
                            onClick={() => setNewPostMediaType(m.id)}
                            className={`flex-1 flex items-center justify-center gap-1 py-1 rounded text-[10px] font-mono border transition-all ${
                              newPostMediaType === m.id ? "border-amber-400 text-amber-400 bg-amber-400/10" : "border-slate-800 text-slate-400"
                            }`}
                          >
                            <m.icon size={11} /> {m.label}
                          </button>
                        ))}
                      </div>
                      <input
                        type="url"
                        value={newPostMediaUrl}
                        onChange={(e) => setNewPostMediaUrl(e.target.value)}
                        placeholder="Ku dhaji link-ga (URL)..."
                        className="w-full rounded px-2.5 py-1.5 text-xs focus:outline-none"
                        style={inputStyle}
                      />
                    </div>

                    <div>
                      <label className="text-[10px] uppercase text-slate-500 block mb-1">Sawir (Screenshot / Chart)</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleCommunityImageUpload}
                        className="block w-full text-xs file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-[11px] file:bg-slate-800 file:text-slate-300"
                      />
                      {newPostImage && (
                        <div className="flex items-center gap-2 mt-1">
                          <span className="text-[10px] text-emerald-400">Sawir la doortay ✓</span>
                          <button type="button" onClick={() => setNewPostImage(null)} className="text-[10px] text-rose-400 hover:underline">Tirtir</button>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="flex justify-end">
                    <button
                      type="submit"
                      disabled={sendingPost}
                      className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer shadow-md active:scale-95 transition-all"
                      style={{ ...monoStyle, backgroundColor: C.gold, color: C.bg }}
                    >
                      <Send size={13} /> {sendingPost ? "Diraya..." : "Diri Qoraalka"}
                    </button>
                  </div>
                </form>

                {/* Posts Feed */}
                {communityLoading ? (
                  <div className="text-center py-10 text-xs text-slate-500 font-mono">Soo raraya doodaha bulshada...</div>
                ) : posts.length === 0 ? (
                  <div className="text-center py-10 rounded-xl border border-dashed border-slate-800 text-slate-500 text-xs">
                    Weli ma jiraan qoraallo bulshadu soo dirtay. Noqo qofka ugu horreeya!
                  </div>
                ) : (
                  <div className="space-y-3">
                    {posts.map((p) => {
                      const isOwner = p.userId === user.uid;
                      const dateStr = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : "";

                      return (
                        <div key={p.id} className="rounded-xl p-4" style={{ backgroundColor: C.surface, border: `1px solid ${C.border}` }}>
                          <div className="flex items-start justify-between mb-2">
                            <div className="flex items-center gap-2">
                              {p.userPhoto ? (
                                <img src={p.userPhoto} alt={p.userName} className="w-7 h-7 rounded-full object-cover border border-slate-700" />
                              ) : (
                                <div className="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold">
                                  {p.userName ? p.userName[0] : "U"}
                                </div>
                              )}
                              <div>
                                <div className="text-xs font-bold text-white leading-tight">{p.userName}</div>
                                <div className="text-[10px] text-slate-500 font-mono">{dateStr}</div>
                              </div>
                            </div>

                            {isOwner && (
                              <button
                                onClick={() => handleDeletePost(p.id)}
                                className="text-slate-500 hover:text-red-400 p-1 cursor-pointer"
                                title="Tirtir qoraalkaaga"
                              >
                                <Trash2 size={13} />
                              </button>
                            )}
                          </div>

                          {/* Post Text */}
                          {p.text && (
                            <p className="text-xs sm:text-sm leading-relaxed mb-3 text-slate-200 whitespace-pre-wrap">
                              {p.text}
                            </p>
                          )}

                          {/* Post Image */}
                          {p.image && (
                            <img
                              src={p.image}
                              alt="attachment"
                              onClick={() => setLightbox(p.image)}
                              className="rounded-lg w-full max-h-80 object-cover mb-3 border border-slate-800 cursor-zoom-in"
                            />
                          )}

                          {/* Post Links / Video / PDF badge */}
                          {p.mediaUrl && (
                            <div className="mt-2">
                              {p.mediaType === "video" && (p.mediaUrl.includes("youtube.com") || p.mediaUrl.includes("youtu.be")) ? (
                                <div className="aspect-video w-full rounded-lg overflow-hidden border border-slate-800 mb-2">
                                  <iframe
                                    src={p.mediaUrl.replace("watch?v=", "embed/").replace("youtu.be/", "youtube.com/embed/")}
                                    title="Video"
                                    className="w-full h-full"
                                    allowFullScreen
                                  />
                                </div>
                              ) : (
                                <a
                                  href={p.mediaUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-mono transition-colors"
                                  style={{ backgroundColor: C.surface2, border: `1px solid ${C.border}`, color: C.gold }}
                                >
                                  {p.mediaType === "pdf" ? <FileText size={13} /> : p.mediaType === "video" ? <Video size={13} /> : <ExternalLink size={13} />}
                                  <span className="truncate max-w-xs">{p.mediaUrl}</span>
                                </a>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

          </div>

          {/* LIGHTBOX FOR FULLSCREEN IMAGES */}
          {lightbox && (
            <div
              onClick={() => setLightbox(null)}
              className="fixed inset-0 flex items-center justify-center p-4 z-50 cursor-zoom-out"
              style={{ backgroundColor: "rgba(0,0,0,0.88)" }}
            >
              <img src={lightbox} alt="Full view" className="max-w-full max-h-full rounded-lg shadow-2xl" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<TradeJournal />);
  </script>
</body>
</html>
